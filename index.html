<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 04 Sep 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Boasting: The Big I and the Little You", "url": "https://thomisticinstitute.substack.com/p/boasting-the-big-i-and-the-little", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Woodville, &#8220;Politics in an Oyster House,&#8221; 1848, via Wikimedia Commons. What is boasting, according to St. Thomas Aquinas? In a job interview, you must sell yourself. While it would be counterproductive to overstate your abilities in an incredible way, you must promote yourself vigorously. In social situations, by contrast, such self-promotion could be disastrous. And yet, it can be sensible to recommend ourselves to others in a subtle manner. Discerning how to behave in such situations requires prudence. So, how much can we boast? Isn&#8217;t boasting a sin? If so, how grave a sin is it? In this article, we will turn to St. Thomas for guidance on these questions. In the question on boasting in the Summa Theologiae , St. Thomas offers this definition of boasting: Jactantia (boasting) seems properly to denote the uplifting of self by words: since if a man wishes to throw (jactare) a thing far away, he lifts it up high. And to uplift oneself, properly speaking, is to talk of oneself above oneself. This happens in two ways. For sometimes a man speaks of himself, not above what he is in himself, but above that which he is esteemed by men to be; and this the Apostle declines to do when he says (2 Corinthians 12:6): &#8216;I forbear lest any man should think of me above that which he sees in me, or anything he hears of me&#8217; ( ST II-II, q. 112, a. 1 ). Thus, Paul spoke well of himself on occasion, yet he spoke honestly. But &#8220;in another way a man uplifts himself in words, by speaking of himself above that which he is in reality.&#8221; Here then, there is a certain dishonesty in exaggerating one&#8217;s merits.", "category": "teologia"}, {"title": "The Emotions of Fortitude", "url": "https://thomisticinstitute.substack.com/p/the-emotions-of-fortitude", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Giordano, &#8220;Allegory of Prudence, 1682, via Wikimedia Commons. What is Fortitude? Fortitude, or courage, is a virtue that enables us to face significant threats and overcome significant obstacles to our good. A common supposed image of fortitude today might involve a fearless superhero in the face of a foe or a fearful but determined soldier in the face of the enemy. But we cannot tell simply from what a person does whether he or she acts with fortitude. In fact, the superhero may not have fortitude at all while the soldier may. The reason is that fortitude requires fear. This may surprise you given it is common today for fearlessness to be held up as the ideal in facing danger. But St. Thomas knows better. Fortitude, in its primary sense, involves facing threats that may result in our death or serious injury. Fear is a natural response when facing the greatest threats to our life or what we love most. Fortitude controls and harnesses fear, and other emotions as well, to face the threats. These other emotions are hope and daring . For Aquinas, fear and daring are contrary emotions. This means that we cannot have them at the same time regarding the same object. This raises a puzzle. How can a single virtue require two contrary emotions? Isn&#8217;t that impossible? Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts in your inbox every Monday. Fortitude and the Stages of a Prudent Human Act To answer this question, and to show the place of the emotion of hope as well, we&#8217;ve got to think about human action. In his discussion of prudence , St. Thomas writes, Prudence is right reason applied to action , as stated above (A. 2).", "category": "teologia"}, {"title": "Anger: A Good or an Evil?", "url": "https://thomisticinstitute.substack.com/p/anger-a-good-or-an-evil", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Bernardino Mei, &#8220;Christ Cleansing the Temple,&#8221; 1655, via WikiMedia Commons. What is anger? Scripture seems to suggest that anger is an evil. For instance, we read, &#8220;Whoever is angry with his brother shall be liable to judgment&#8221; (Mt 5:22), and &#8220;Now put them all away: anger, wrath, malice, slander, and foul talk from your mouth&#8221; (Col 3:8). But St. Thomas Aquinas clarifies that &#8220;to be angry is not always an evil. &#8221; To explain, Thomas borrows the words of St. John Chrysostom: A man who is angry without cause is guilty, but not he that is angry with cause, for without anger sound doctrine would not be advanced or good judgment maintained or crime put down. &#8220;Anger&#8221; names a passion and a vice. The passion of anger is good in itself, but it can be excessive or deficient. When it is had with the right intensity for the right length of time, it is virtuous. Otherwise, it is disordered. The vice of anger is a stable disposition to have the passion of anger in excess. All vices are defects of moral character from which sinful actions flow. The passions work together with the will, which works together with the intellect. You can think of the intellect like a lame man, the will like a blind man who is carrying the lame man, and the passions like dogs leashed to the blind man&#8217;s belt. The intellect sees but cannot move; it relies on the will to move. The will moves, but it cannot see; it relies on intellect to see. And the passions make movement easier or harder. When the passions are well-trained, they are like well-trained dogs that can make walking up a steep hill effortless. Conversely, when they are disobedient, they can pull you to the ground.", "category": "teologia"}, {"title": "A Major Trial Put Keto Against the Mediterranean Diet. Keto Won.", "url": "https://staycuriousmetabolism.substack.com/p/a-major-trial-put-keto-against-the", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "What&#8217;s healthier for your heart and liver: bacon and eggs, or oatmeal and quinoa? It seems like a bizarre question, and it certainly offends conventional wisdom about what makes up a &#8220;healthy diet.&#8221; But a major six-month randomized controlled trial just published in a top science journal put versions of these diets head-to-head. Researchers compared: A low-carb, high-fat ketogenic diet (4% Calories from Carbs) A Mediterranean diet (50% Calories from Carbs) A low-fat plant-based diet (70% Calories from Carbs) This was unusually rigorous for a nutrition trial. Researchers recruited participants with obesity, provided them with all their meals, designed each diet to cause the same amount of weight loss, and followed them for six months. They performed a battery of metabolic assessments, including MRI and DEXA scans and advanced metabolic challenges you can&#8217;t just get at your average doctor&#8217;s clinic. And The Winner Is&#8230; And I&#8217;ll reveal the punchline to you: Across several important cardiometabolic outcomes, the low-carb, high-fat ketogenic diet won. All three diets caused similar amounts of weight loss (~10% weight loss). But the ketogenic diet produced greater reductions in: Liver fat Blood sugar Triglycerides (fat in the blood) Inflammation markers Insulin resistance scores The authors themselves concluded: &#8220;These results demonstrate that a very-low-carbohydrate diet has greater cardiometabolic benefits [as compared to a Mediterranean or very-low-fat diet] in people with metabolically unhealthy obesity.&#8221; Less Liver Synthesis of New Sugar and Fat You can also take a look at liver function.", "category": "fitness"}, {"title": "GLP-1s May Change Cardiology Forever", "url": "https://staycuriousmetabolism.substack.com/p/will-glp-1s-end-the-era-of-cholesterol", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "A physician friend recently told me he had just taken a patient off a statin. Not because the patient&#8217;s cholesterol had plummeted. Not because they were experiencing side effects. Not because the patient refused treatment. Quite the opposite. The patient had become metabolically healthier. Healthy enough, in fact, that their physician concluded the statin was no longer providing a meaningful net benefit. If you&#8217;ve been told for years that elevated cholesterol automatically means lifelong statin therapy, that decision may sound strange, even reckless. It certainly goes against cardiology dogma to take a patient off a statin. But it follows directly from a reality that is often lost in public discussions of cardiovascular disease: The risk associated with LDL cholesterol (and ApoB) is context-dependent. For people with obesity, insulin resistance, high blood pressure, elevated triglycerides, low HDL, and other markers of metabolic dysfunction, statins can provide net benefit. This is for reasons beyond LDL and ApoB lowering, including improvements in endothelial function and reductions in vascular inflammation. That is&#8230; when a patient is metabolically unhealthy. But as metabolic health improves, the risk-benefit equation changes. Statins are not without costs. They can cause insulin resistance , impair mitochondrial function , and carry other side effects that become increasingly relevant as their expected benefits diminish. Even in the landmark trials that established statins as standard of care, when you examine participants with even modestly good metabolic health, the cardiovascular benefits become progressively smaller&#8230; and then become non-significant. The risks, meanwhile, remain.", "category": "fitness"}, {"title": "The Science of Better Focus and Calmer Minds (Semax & Selank)", "url": "https://staycuriousmetabolism.substack.com/p/the-fast-acting-peptides-for-anxiety", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "When I first heard about the peptides &#8220; semax &#8221; and &#8220; selank ,&#8221; it was from a family friend who simply said: &#8220; Since I started snorting these peptides, my mood has been the best it&#8217;s been in decades! &#8221; Naturally, I was a little concerned. Hearing those words for the first time, they sounded like party drugs. And when a family friend discloses that they&#8217;ve been snorting [insert unknown compound here] and feeling on top of the world, that&#8217;s bound to raise a yellow flag. However, my concern turned to curiosity when I learned what these compounds actually were, and once I tried them myself. When I did &#8212; in the middle of an absolutely maddening homeowner nightmare &#8212; I noticed an abrupt shift toward calm and equanimity. I'll tell you that story shortly. But first, let's review the science. These peptides were first studied in Russia and are now used for certain medical indications, including stroke , as well as now recreationally to reduce anxiety and to improve focus and mental clarity. So today, we&#8217;re going to move beyond the sketchy names that sound either like party drugs ( or&#8212;in the case of semax&#8212;some strange manosphere supplement aimed at maximizing sperm quality ), and explore a scientific story grounded in some fascinating biology. What is Semax? Semax is, at its core, a fragment of the hormone adrenocorticotropic hormone (ACTH). This is a hormone normally released by the pituitary gland that signals the adrenal glands to release hormones like cortisol.", "category": "fitness"}, {"title": "What Is Brain Span? The Midlife Window That Decides Alzheimer’s Risk in Women", "url": "https://neuroathletics.substack.com/p/what-is-brain-span-the-midlife-window", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, Lifespan is how long you live. Healthspan is how long you stay well. Brain span is how long your mind still works: memory, judgment, language, the ability to stay yourself. That is the number I care about as a clinical neurophysiologist. And it is not a 70-year-old number. Alzheimer&#8217;s pathology can start between 45 and 65, years to decades before anyone forgets a name. Average age at diagnosis is 72. By then the window where you could have changed the trajectory has been open, and mostly ignored, for twenty years. For women, that window has a name. It is midlife. It is the menopause transition. Lisa Mosconi&#8217;s March 2026 review in the Journal of Clinical Investigation calls it what it is: the front line of Alzheimer prevention . Nearly two-thirds of people with Alzheimer&#8217;s are women. A 45-year-old woman&#8217;s lifetime risk is about 1 in 5, twice that of a man the same age. Longevity does not fully explain that gap!! Alzheimer&#8217;s is a midlife disease that shows up late We keep treating Alzheimer&#8217;s as a disease of old age because that is when we diagnose it. The plaques, the tangles, the drop in the brain&#8217;s glucose metabolism: those are already moving in the years around menopause. Mosconi&#8217;s imaging synthesis is blunt. Postmenopausal women, and to a lesser extent perimenopausal women, carry a heavier Alzheimer&#8217;s biomarker load than premenopausal women and than men of the same age: more amyloid, more tau, lower brain glucose use, less gray matter in the regions Alzheimer&#8217;s hits first. Those differences survived age adjustment. Mosconi still flags that postmenopausal women are typically older, so residual aging cannot be ruled out. Endocrine change is the leading explanation, not a closed case.", "category": "fitness"}, {"title": "Jim Kwik: Your Brain Has a Savings Account. You're Probably Draining It.", "url": "https://neuroathletics.substack.com/p/jim-kwik-your-brain-has-a-savings", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, Jim Kwik was called &#8220;the boy with the broken brain&#8221; by a teacher, out loud, when he was nine. A brain injury at five left him years behind. He&#8217;s now the brain coach Hollywood actors and CEOs hire to think faster. So when he talks about what a brain can rebuild, I listen. We met to talk about AI. But the thing I keep coming back to is simpler, and it&#8217;s the most useful way to think about your brain I&#8217;ve heard in a long time. He calls cognitive reserve a savings account. It&#8217;s real neuroscience, and it&#8217;s why two people can have the same Alzheimer&#8217;s pathology in their brains while one loses their memory and the other stays sharp at 90. The reserve is the buffer. You spend a lifetime building the balance, and it&#8217;s what protects you when things start to go wrong underneath. Every day, you either make a deposit or take a withdrawal. The withdrawals are the ones you already suspect: bad sleep, chronic stress, sitting all day, processed food. But Jim named a new one. Every time you let a machine do your thinking, that&#8217;s a withdrawal. He pointed to an MIT study where people wrote essays with ChatGPT, with Google, or with just their heads. The AI group had the least brain engagement and barely remembered what they&#8217;d written. His line: you don&#8217;t go to the gym and have someone lift the weights for you. But that&#8217;s what we&#8217;re doing with our minds all day. The deposits are small, free, and completely in your hands. This is the part your evening is made of: Read the actual book, not the AI summary. Do the tip math in your head. Kill the calculator for small stuff. Sit in a boring moment instead of grabbing your phone.", "category": "fitness"}, {"title": "This Billionaire is Obsessed with his Health", "url": "https://neuroathletics.substack.com/p/this-billionaire-is-obsessed-with", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I just spent an hour with Keith Rabois , and I have not stopped thinking about how he lives. If you don&#8217;t know the name, he&#8217;s one of the most successful investors of the last twenty years, an early force behind PayPal, Square, and DoorDash. He has more money than he could spend in a lifetime. And he treats his own body with the seriousness of a professional athlete in season. He has not missed more than a handful of workouts in seven years, and the ones he did miss still visibly bother him. He tracks every session. He treats training like brushing his teeth, non-negotiable, not up for debate on any given morning, because he&#8217;s figured out that the moment it becomes optional once, it becomes optional forever. Here&#8217;s the thing I&#8217;ve noticed, and Keith is just the latest example. The most successful people I meet, the investors, the founders, the ones operating at the very top of brutally competitive fields, almost all treat their bodies like elite athletes treat theirs. It&#8217;s one of the most consistent patterns I&#8217;ve seen in this work, and I don&#8217;t think it&#8217;s a coincidence. I want to talk about why, because it changes how you might think about your own health. They stopped separating the body from the mind For most of us, health lives in one box and work lives in another. You go to the gym to look better or to feel less guilty, and then you go do your actual job, which happens in your head. The people at the top don&#8217;t think that way. They&#8217;ve collapsed the two. They train their bodies because it&#8217;s how they protect their minds, their focus, their decision-making, their stamina over a very long career.", "category": "fitness"}, {"title": "Natural Alternatives to Benzodiazepines", "url": "https://chrismasterjohnphd.substack.com/p/natural-alternatives-to-benzodiazepines", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Benzodiazepines are marketed (informally) as &#8220;psych meds&#8221; as if they primarily act on anxiety and stimulation circuits in the brain, but there is no such thing as a &#8220;psych med&#8221; because there are no targets that are only found in the brain and because there are no drugs that when taken orally primarily go to the brain. They have the highest relative uptake into the adrenal gland and they have the highest absolute uptake into muscle and fat. They probably act on GABA receptors found widely outside of the nervous system. While they are not active on the unique GABA receptors in the liver, they are probably active at GABA receptors on the lungs, kidneys, immune cells, reproductive organs, and pancreas. GABA itself regulates mitochondrial metabolism indirectly, but benzodiazepines have two independent mitochondrial targets that lie directly in the mitochondrial membrane and are unrelated to their actions on GABA receptors. There is no evidence that benzos are more powerful regulators of GABA metabolism than of mitochondrial metabolism. In fact, their solubility in fat and cell membranes might make them much more efficient at accessing their mitochondrial targets than at accessing GABA receptors. Like SSRIs , benzos are whole-body mitochondrial drugs. As with SSRIs, benzos are playing with mitochondrial fire. These claims are supported by the evidence and arguments found in the first installment of this series: People who use benzos have 60% greater mortality per unit time than people who don&#8217;t, but people who quit them have 60% greater mortality per unit time than people who stay on them. We cannot say whether these trends represent causation.", "category": "fitness"}, {"title": "Massie is a Real-Food Hero", "url": "https://chrismasterjohnphd.substack.com/p/massie-is-a-real-food-hero", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Some $15 million are being spent to oust Thomas Massie today , and no one in congress is more close to those of us in the real food movement than this man. Thomas Massie and me on October 26, 2024 at Wise Traditions, the annual conference of the Weston A. Price Foundation, where he gave the keynote. Massie himself is a grass-fed off-the-grid farmer. My friend John Moody profiled his farm here. The farm is powered by solar panels and Tesla batteries with a house the Massie family built themselves out of logs they cut from their own woods and with stone they quarried from their own land. The home is heated from the same wood, and water comes from a well that Massie dug by hand with his neighbor. They grow peaches and apple trees, raise pastured chickens with an automatic tractor, and raise grass-fed cattle. Massie once admitted to Moody he used Google Maps to spy on Joel Salatin to get new ideas for his farm. No one paid me to write this. Massie has never given me any money but I have donated to his campaign. Massie originated and championed the Processing Revival and Intrastate Meat Exemption &#8220;PRIME&#8221; Act. Crafted by the Farm-to-Consumer Legal Defense Fund, in turn founded by Sally Fallon Morell of the Weston A. Price Foundation and others, this act is meant to remove the USDA as an impediment to small farmers. Small, locally run custom slaughterhouses are all over the place in the United States. USDA slaughterhouses are vanishingly rare and often at great distances away from farmers. The custom slaughterhouses are used by homesteaders and hunters who eat their own meat.", "category": "fitness"}, {"title": "What's Wrong With Jordan Peterson's Health?", "url": "https://chrismasterjohnphd.substack.com/p/whats-wrong-with-jordan-petersons", "date": "2026-09-04T05:01:13.897463+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Jordan Peterson&#8217;s health has been suffering tremendously. Mikhaila, his daughter, saw that what was ailing him was affecting so many systems of his body that it had to all be connected and began to wonder if it was a form of mitochondrial dysfunction. In trying to research whether mitochondrial dysfunction could be driven by the turning points in his health problems like SSRI withdrawal, benzodiazepine withdrawal, and toxic mold, she found my work and reached out to me. This is the conversation that we had: My hypothesis is as follows. Mikhaila shares half of Jordan&#8217;s genes and has been more detailed about her own health journey going back to childhood, so we start with her. She had juvenile arthritis symptoms starting at 2 and a diagnosis at 7. She went on Enbrel, a &#8220;biologic&#8221; (a pseudoscientific regulatory term) that opposes the action of the inflammatory mediator tumor necrosis alpha (TNF-alpha); and on methotrexate, which inhibits folate and adenosine metabolism. Methotrexate raises adenosine, which inhibits T cell proliferation. Its inhibition of folate metabolism is thought to be more relevant to cancer but its adenosine-mediated inhibition of T cell proliferation is thought to be more relevant to autoimmune arthritis. The next year, at age 8, she was diagnosed with depression and put on SSRIs. My hypothesis is that she has an underlying block in mitochondrial metabolism leading to CoA sequestration, which occurs when CoA-requiring pathways fail to complete properly. This leads to secretion of TNF-alpha as part of a cellular stress response. TNF-alpha serves to increase carnitine transport into the cell.", "category": "fitness"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
