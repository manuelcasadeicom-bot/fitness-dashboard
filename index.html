<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 08 Nov 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Outsourcing Your Intellect", "url": "https://thomisticinstitute.substack.com/p/outsourcing-your-intellect", "date": "2026-11-02T13:42:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Alexander Rothaug , “The Three Fates,” 1910, via Wikimedia Commons. All the world’s a stage, And all the men and women merely players; They have their exits and their entrances; And one man in his time plays many parts.” (William Shakespeare, As You Like It) Duc, o parens celsique dominator poli, Quocumque placuit ; nulla parendi mora est. Adsum inpiger. Fac nolle, comitabor gemens Malusque patiar, facere quod licuit bono. Ducunt volentem fata, nolentem trahunt (Seneca, Moral Epistle 107 , n.11 Verses attributed to Cleanthes) The Problem of the Whispering Earring (or Bob’s Smart Glasses) Scott Alexander’s Whispering Earring imagines a magical earring that tells its wearer exactly what to do in every situation. He insists: the earring is always right . By “always right,” he does not mean that it makes the best possible decisions in every situation, but that it always makes a better decision than its wearer would have done, even after careful thought. I would like to introduce a modified version of the whispering earring for us to consider, but let’s change the earring into smart glasses to make it more true to the moment. Now let’s say the smart glasses interface with a perfect AGI model, so that their wearer, we shall call him Bob, can ask the model to supply him with answers to all questions relevant to daily life. Let’s say that one day Bob does not want to deliberate or think about his actions and decides that he will rely on his smart glasses for all of his decisions and tasks.", "category": "teologia"}, {"title": "Introducing the Porphyrian Tree of Virtue", "url": "https://thomisticinstitute.substack.com/p/introducing-the-porphyrian-tree-of", "date": "2026-10-26T13:31:10+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "A New Way to Study the Virtue Theory of St. Thomas Benozzo Gozzoli, “The Triumph of St. Thomas over Averroes,” 1468-1484, via Wikimedia Commons. We are very happy to announce something that’s been years in the making: an enormous project. The Thomistic Institute, along with the Four Pillars Project at the University of St. Thomas (MN), has funded a Scientia Salon on the Theory and Practice of Virtue. This group of experts took up the task of creating a Porphyrian tree of virtue, presenting the theory of St. Thomas Aquinas in all its hierarchical glory. “What, though, is a Porphyrian Tree?” your friend wonders aloud. It’s named after the 3rd-century philosopher Porphyry, a follower of Aristotle who had a penchant for pictorial representations. To make one, you start with a concept, say, substance, then provide exhaustive distinctions between types. Maybe substance is divided between material and immaterial. Then you move to that step, further subdividing the varieties. Material divides into living and non-living; living between the sensible and insensible; sensible between the rational and irrational. If you work out all the types in all the branches, you’ve got yourself a whole tree of distinctions, which is enough to make any philosopher’s heart pitter-patter. That’s what we did with Aquinas’s views of virtue. It is really something to behold. You should go behold it . But before you zip away, let me say a bit about what’s over there. View Virtue Tree The Scholars of the Scientia Salon Thomas’s thought is so broad in scope, yet also so detailed in its sophistication, that it can sometimes be hard to navigate.", "category": "teologia"}, {"title": "Why is Public Discourse so Hard?", "url": "https://thomisticinstitute.substack.com/p/why-is-public-discourse-so-hard", "date": "2026-10-19T13:30:43+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Close to a decade ago, a dear friend of mine talked me into joining an important committee at the school our kids then attended. She said she foresaw difficult discussions coming our way, and she wanted more people on the committee who were able to keep their heads in heated discussions and share careful, calm reasoning. Let’s call her Huldah , after the Old Testament prophetess who saw what was to come. I’m a Philosophy professor who studies virtue in the Christian intellectual tradition. That means that my job, as philosopher, has me disagreeing cordially all day long, and the content of my research has me thinking through how to do that well. So, she didn’t misfire when she asked me to join the committee. And yet, I was hardly prepared for the crowded, acrid meetings that came to pass. Nicolas Andrre Monsiaux, “The Debate of Socrates and Aspasia,” via Wikimedia Commons , 1801. While there were reasonable, understanding people on both sides of the debate, they were the minority. One woman used her thumb and pointer finger to mimic shooting herself in the head when she disliked points being made. Others emphatically rolled their eyes, sneered, chortled, or groaned. Folks would use their allotted time to snootily express platitudes, as if a tautology would prove a substantive policy point, or to aggressively shout assertions, as if disdain or force were the main methods of discussion. And, of course, the worst actors on either side agitated the more moderate members of the other. When it came to respectful and charitable discussion, to flip the phrase, the whole was worse than its parts. The whole process was ugly, and it tore apart a community that otherwise had been healthy and vibrant. The culture of the place changed drastically.", "category": "teologia"}, {"title": "What Exercise Really Does to Heart Plaque", "url": "https://staycuriousmetabolism.substack.com/p/is-your-exercise-routine-helping", "date": "2026-11-07T12:01:41+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "You can have plaque in your arteries and a healthy heart at the same time. I know that sounds weird, but research suggests that high volumes of exercise can increase coronary artery calcium (CAC), which is hardened plaque in the vessels of your heart. And ordinarily, more calcified plaque and a higher CAC score on cardiac imaging are associated with a greater risk of heart disease . So why would athletes have more calcified plaque? Sounds like a paradox. But it gets weirder! Because even as coronary calcium increases, cardiovascular risk may not… it might even go down. That’s completely the opposite of what we’re taught and seems to defy logic, like a flying hippo. How can more exercise sometimes lead to more plaque in your heart, but not more heart attacks or cardiovascular deaths? Understanding the answer is literally life and death. In fact, it may be the reason I still have a dad. The biology we’re going to discuss may have literally saved his life. I know that sounds like an exaggeration. But it’s not. You’ll see. But let’s get into our first mystery! Paradox #1: When More Exercise Means More Plaque This is one of the most curious paradoxes in exercise physiology. People who perform large volumes of endurance exercise tend to have more CAC than moderately active individuals. To define our terms, when doctors want to know how much plaque is building up in your heart’s arteries, they run a scan that gives you a “coronary artery calcium” score. Think of it like rust in a pipe. More calcium, more buildup. And in the general population, a higher score tracks with a higher risk of heart attacks and death. A CAC of 0, by comparison, is thought of as a warranty against having a heart attack. This has come to be known as the “ Power of Zero.", "category": "fitness"}, {"title": "The Cure for Ulcers Is… Cabbages?", "url": "https://staycuriousmetabolism.substack.com/p/the-cure-for-ulcers-is-cabbages", "date": "2026-11-05T12:02:10+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "In 1949, a Stanford doctor published a study reporting on a strange experiment. The doctor, Dr. Garnett Cheney, took patients with ulcers and attempted to treat them with cabbages. Fresh cabbage juice, to be specific. And before you laugh at this ridiculous idea: it worked! Patients with stomach ulcers who drank fresh cabbage juice appeared to heal in just 7 days. For comparison, the typical healing time reported in earlier studies was 42 days. That’s 6 times faster. And we’re not talking about a minor condition. Back then, a stomach ulcer wasn’t just painful. It could cause catastrophic bleeding, perforate your stomach or intestine, and even kill you. So how on earth could something as ordinary as cabbage juice make such a difference? And why is it relevant to you and me 77 years later? Credit to Niba Nirmal B.S. for inspiring this article. Here, we build on that inspiration with a deeper dive into the biology, potential implications for human health, and practical takeaways. Let’s complete our opening story and reveal the early logic of this unusual treatment. Cheney had previously experimented with guinea pigs and found that cabbage leaves appeared to protect against experimentally induced ulcers. So, he decided to try something similar in humans. He recruited 13 patients with peptic ulcers and had them drink approximately 1 liter of fresh cabbage juice every day . The seven patients with duodenal ulcers , meaning ulcers in the first part of the small intestine, healed in an average of 10.4 days. In earlier studies, the average was about 37 days. The six patients with gastric ulcers , meaning ulcers in the stomach itself, healed in an average of just 7.3 days, which as we noted above, was about 6 times faster than the historical comparison of 42 days.", "category": "fitness"}, {"title": "How to Reduce Liver Fat by 68% in 6 Months (Proven in RCTs)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-eat-to-reverse-fatty-liver", "date": "2026-11-03T12:03:17+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Fatty liver affects roughly 1 in 3 adults. And it’s a serious, insidious health problem because your liver is the gatekeeper of your metabolism. When your liver accumulates excess fat, it can become insulin resistant, setting the stage for cardiovascular disease, diabetes, and dementia. And the issue is that most people are getting terrible nutrition advice for fatty liver. The result? Many people’s fatty liver progresses when it can, and should, regress. Yes, fatty liver can absolutely be reversed. And fast! In fact, one recent randomized controlled trial showed that a specific diet could reduce liver fat by 68% in just six months. We will get into it. But first, we need to understand why the liver gets fatty in the first place. (Hint: it’s not because you ate fat.) Why Does a Liver Get Fatty? A liver becomes fatty when the fat being produced outpaces the fat being burned. I do emphasize “being produced” because the primary culprit in fatty liver is not the butter you fried your eggs in that migrated into your liver and popped a squat. Rather, fatty liver arises when your liver makes its own new fat particularly from sugar and refined carbohydrate in the diet (a process called de novo lipogenesis ). As for the other side of the equation, fat is burned largely on demand. So, the high-level formula to reverse fatty liver is: Press the brake on de novo lipogenesis through reducing the driving dietary force. Pressing the gas on liver fat burning by creating the right metabolic conditions. Or, if you want to think about your liver like a bathtub. The fat stored in your liver is the water level. Eating more sugar and refined carbohydrates is like turning on the faucet, increasing the flow of fat into the liver.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! Go watch this one. I mean it. I sat down with Dr. Michael Breus, the Sleep Doctor, and I left rethinking things I was sure I already understood. He has spent his whole career as a clinical psychologist doing one thing, fixing the way people sleep, and he is blunt in a way I loved. First thing that floored me: the Sleep Doctor himself stops breathing 26 times an hour in his sleep, and had no idea for years. How he found out: His workouts were falling apart and his mile time kept climbing He ran bloodwork, even tried testosterone, chasing every other explanation first Nothing moved Finally someone asked when he’d last done a sleep study It came back 26. He was so sure it was broken that he retook it. Same number. The Sleep Doctor had sleep apnea and didn’t know. Here’s why that should scare the rest of us: It can happen anywhere from 5 to hundreds of times an hour, and most people never know it’s happening Every time you stop breathing, your heart rate drops then spikes to restart you, loading your heart all night long. Over time that can tip into atrial fibrillation. You’re also starving your brain of oxygen, and you never sink into the deep sleep where the brain runs its own cleanup His tell for spotting it across a room: a neck over 17.5 inches carries an 83 percent chance of apnea (his number) And one story I won’t forget: a detective, benched because he kept falling asleep on stakeouts, finally got on a CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team!!!!! A brand new creatine study has arrived!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That almost never gets studied, and this team pulled it off. You know creatine is one of the very few supplements I actually stand behind. So when a trial like this lands, I read every single line. And what they found got me fired up. Why this matters to you If you are in your forties and your brain feels like it is running too many tabs at once, this study is about you. The word that vanishes mid-sentence. The 3 a.m. wake-up. The afternoon fog that will not lift. You have been told this is just perimenopause and to wait it out. These researchers went looking for something better. What they did Fifty-one women in perimenopause, average age 46. Three groups. Most of them trained hard, twice a week, for six weeks. A smaller group did nothing, as the comparison. Half of the training women got creatine, half got placebo. And to see inside the brain, the team placed a sensor on each woman’s forehead and measured how much oxygen-rich blood her prefrontal cortex pulled in while she worked through a tough mental test. A note on sunlight, UVB, and why I’ve been using Solius This is my latest hack for circadian rhythm disruption! The obvious answer is to get outside more—and I still think that should come first. But the reality is that consistent UVB exposure is not always easy. Season, latitude, weather, work schedules, and how much time we spend indoors all change what we actually get. That’s one reason I’ve been using Solius .", "category": "fitness"}, {"title": "Belly Fat Is Shrinking Your Brain", "url": "https://neuroathletics.substack.com/p/belly-fat-is-shrinking-your-brain", "date": "2026-10-22T12:22:33+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, The fat around your waist is talking to your brain. Not as a metaphor. Chemically, constantly, every single day. A major new review just sat me down and walked me through the entire conversation, from one bloated fat cell all the way up to the circuits that hold your memories. I read it twice, and on the second pass I was scribbling in the margins like a lunatic, because the story it tells about the midlife brain is one of the most important things I have read all year. Here is the scale of what we are talking about. Almost 900 million people now live with obesity, and rates of dementia are projected to nearly triple by 2050. Those two lines are converging. This review is about the exact place they meet, which is your brain. It came out in Nature Reviews Neurology. Instead of a single study, it pulls the whole field into one place, from studies of millions of people down to the precise damage happening inside individual brain cells. Let me walk you through it the way it walked me through it. Fair warning: it gets stranger as it goes. First, a paradox that broke this field for a decade For years, the data made no sense. Study after study found that being obese in old age was associated with a lower risk of dementia. Thinner older adults got dementia more often. People started calling it the “obesity paradox,” and it got used, loudly, to argue that the worry about weight and the brain was overblown. Here is the grim problem. People often start losing weight in the years before dementia is ever diagnosed. The disease is already quietly eating through the brain, appetite and behavior shift, and the number on the scale falls. So late-life thinness was never protecting anyone. It was an early symptom being mistaken for a shield.", "category": "fitness"}, {"title": "Wisdom from the Western Isles Ep.1 – David Torkington (Audiobook)", "url": "https://www.lifesitenews.com/episodes/wisdom-from-the-western-isles-ep-1-david-torkington-audiobook/", "date": "2026-11-07T13:00:21+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. Chapter One of David Torkington’s spiritual classic, “Wisdom from the Western Isles.” Under the guidance of a hermit, a young man in danger of taking his own life is taught how to develop and deepen his prayer life to the point of mystical union with God. … Vatican's Assisi scandal, James Martin's 'queer saints' and European invasion Is this why Fr. Ripperger was silenced? - New Vatican document downplays morals Priest killed by crucifix at Mass was preaching on death moments before", "category": "teologia"}, {"title": "Pray for the dead: Bishop Strickland on Purgatory and the holy souls", "url": "https://www.lifesitenews.com/episodes/pray-for-the-dead-bishop-strickland-on-purgatory-and-the-holy-souls/", "date": "2026-11-07T01:00:41+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. During the month of November, after All Saints’ Day and All Souls’ Day, Bishop Joseph Strickland urges Catholics to pray for the faithful departed. Drawing on Church teaching, he explains that purgatory is the final purification of those who die in God’s grace and friendship but still need to be made completely holy before entering the full communion of heaven. These “holy souls” are assured of salvation. Their suffering is real, but it is temporary and redemptive. … Sodom & the Synod: Why the Church must speak clearly about sin | Bishop Strickland Are we becoming a Church without God? Bishop Strickland's URGENT warning Bishop Strickland: St. Pius X's warning that the Church has forgotten", "category": "teologia"}, {"title": "Leo’s Vatican forbids bishops from insisting on ad orientem Mass", "url": "https://www.lifesitenews.com/episodes/leos-vatican-forbids-bishops-from-insisting-on-ad-orientem-mass/", "date": "2026-11-06T20:12:05+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. The Vatican intervened in the Syro-Malabar Catholic Church in India, with the Apostolic Signatura reportedly siding with priests who wanted to celebrate Mass facing the congregation rather than ad orientem despite their bishops’ direction. John-Henry Westen argues the decision raises questions about the Vatican’s treatment of traditional liturgical practices beyond the Latin Mass. The same Vatican that promotes a “carbon fast” during Lent now overrules bishops who want their priests facing East. … Vatican's Assisi scandal, James Martin's 'queer saints' and European invasion Is this why Fr. Ripperger was silenced? - New Vatican document downplays morals Priest killed by crucifix at Mass was preaching on death moments before", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
