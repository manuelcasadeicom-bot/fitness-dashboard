<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 06 Oct 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-06T05:01:18.047766+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "What is humility? Now humility makes a man a good subject to ordinance of all kinds and in all matters; while every other virtue has this effect in some special matter. Therefore after the theological virtues, after the intellectual virtues which regard the reason itself, and after justice, especially legal justice, humility stands before all others. ( ST.II-II.Q161.A5.C (emphasis added). To appreciate the greatness of humility, consider that humility stands before the cardinal virtues of temperance and fortitude . Does not their status as cardinal virtues make them greater than humility? Humility stands before magnanimity and magnificence . How can it be that lowly humility surpasses these virtues of greatness, one of which is even called the crown of the virtues? To answer why humility is so significant , we will first answer: what is humility? Humility is about aspiration for great things, and it has three main elements: a control element, knowledge element, and motivation element. Humility is the virtue by which we control our aspirations for anything we think makes us greater. Aquinas refers to these aspirations with the term hope. Sometimes we need to strengthen these aspirations, but we typically need to restrain them. This act of control is called moderation. We control aspirations in light of self-knowledge, in regards to especially our deficiencies and limitations. We control our aspirations out of divine reverence. We are motivated by divine reverence to act humbly, and this motivation guides us to seek our proper place in God&#8217;s providence. Let&#8217;s unpack humility&#8217;s greatness and these three elements and see why humility is so significant.", "category": "teologia"}, {"title": "The Soul of Goodness", "url": "https://thomisticinstitute.substack.com/p/the-soul-of-goodness", "date": "2026-10-06T05:01:18.047766+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Peter Vilhelm Ilsted, &#8220;A Mother and Child in an interior,&#8221; 1898, via Wikimedia Commons. The Difficulty of Virtue In his Nicomachean Ethics , in a sentence filled with insight, both anthropological and psychological, Aristotle observes, &#8220;Anyone can get angry, that is easy&#8230; but to be so with the right person, to the right extent, at the right time, with the right motive, and in the right way, that is not for everyone, nor is it easy; wherefore goodness is both rare and laudable and noble.&#8221; 1 In effect, Aristotle is saying that human nature is wild and passionate, and that this natural wildness is essentially good inasmuch as it is an innate principle of actions that are themselves good, at least to the extent they can achieve goodness. However, he is also saying that our wild and passionate nature requires further formation if it is to become altogether good&#8212;&#8220;laudable and noble&#8221;&#8212;but that such formation in goodness, however dearly needed, is nevertheless terribly rare. It is so rare precisely because of the difficulty of bringing this formation to completion. This is in fact the principal positive difficulty of human life&#8212;the entirely natural challenge with which we are tasked as we proceed toward the future. It is the difficulty of receiving the gift of the goodness of our nature while simultaneously taking responsibility for the proper maturation of this nature&#8212;all so that our nature might attain its proper completion in our individual lives. This difficulty has a name; its name is virtue&#8212;for virtue is the immediate goal of this tough process of formation. Yet, while difficult, this task is most certainly worth the effort.", "category": "teologia"}, {"title": "The Art of Being Good", "url": "https://thomisticinstitute.substack.com/p/the-art-of-being-good", "date": "2026-10-06T05:01:18.047766+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Winslow Homer, &#8220;Snap the Whip,&#8221; 1872, via Wikimedia Commons . The Need for Cultivation I spent the morning watching our seven-month-old as he attempted to conquer the world&#8212;his bright eyes surveying with rapt attention, wonder exuding from every pore, muscles taut in exploration and discovery&#8212;everything in him reaching for understanding and achievement, striving toward truth and goodness. Watching our little boy, I was again reminded that our greatest drive&#8212;one might even say our primal instinct&#8212;is this inner impulsion toward truth and goodness. This powerful drive is evidently a most important feature of human life, perhaps the most important, and everything in our little boy strains forward as a result of its powerful thrust. But this drive is also wild . Wild, not in the sense of chaotic and messy, and therefore problematic, but in the entirely natural sense of not-yet-gardened. It is the wild of nature before the activity of a gardener, bold and intense, fierce and powerful&#8212;yet also good, with a goodness that is in need only of our intervention to bring it home. In the same way as the wilds of nature need a gardener to flourish, so too this interior drive requires our cultivation if it is to take its proper shape. The reason for this is found in the fact that God does not create the human (or indeed, anything) &#8220;fully made,&#8221; but rather furnishes us with an aptitude to develop over the course of time&#8212;and thereby gradually attain our natural perfection. From this we see that from the outset of our lives we are established in the privileged position of being collaborators with God in our own creation, for, as St. Thomas notes, &#8220;the dignity of causality is imparted even to creatures&#8221; by God.", "category": "teologia"}, {"title": "How to Reverse 2.5 Years of Aging in 15 Days (Proven in RCTs)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-reverse-25-years-of-aging", "date": "2026-10-06T05:01:18.047766+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "There&#8217;s a diet that made people 2.5 years biologically younger in 15 days. Not younger- looking . Younger by a blood test. And when the researchers dug into the numbers, the drop in biological age had little to do with the usual suspects, like how much weight anyone lost. The diet is called the &#8220;fasting mimicking diet.&#8221; And right now it&#8217;s having a moment. Friends corner me about it at holidays. Subscribers bring it up in comment sections across social media. So, today, I&#8217;m indulging with you in the science. The human controlled trial data. The nuances that look strange until you understand the biology. And, of course, the &#8220;how to.&#8221; Specifically, what I ate for five days, what it cost me &#8212; about $49 (&lt;$10 per day), versus the $225 they&#8217;ll charge you for the branded box. To be clear, I&#8217;m not selling you a product, I&#8217;ll just show you what&#8217;s in my grocery cart. I&#8217;ll even tell you about another time I ran a biological-age test on myself and it came back saying I&#8217;d gotten older &#8212; and what that result reveals about who this actually works for. But let&#8217;s start with what a fasting mimicking diet actually is. What is a Fasting Mimicking Diet? First, what is a fasting mimicking diet? The premise is simple. Fasting triggers a remarkable cascade of metabolic changes. But to get many of those effects, you generally need more than daily time-restricted eating. It can take 3 full days of water-only fasting before those deeper metabolic changes begin. That&#8217;s the problem because most people aren&#8217;t interested in, or able to, fast for three to five straight days.", "category": "fitness"}, {"title": "The Mushroom I'm Eating for Brain Health", "url": "https://staycuriousmetabolism.substack.com/p/the-mushroom-im-eating-for-brain", "date": "2026-10-06T05:01:18.047766+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Every now and then, I read a paper that changes what ends up on my dinner plate. This was one of those papers, recently published in Nature Aging . And the food in question is a mushroom, a very particular one. Now, I could spoil its secret identity right now... but what fun would that be? I think you need to earn that information. So let me walk you through the data. The high-level objective was simple: to determine which metabolites in the blood were linked to: Better cognition Greater brain volume Lower risk of Alzheimer&#8217;s disease. So, the researchers began by looking for associations between 991 blood metabolites and measures of cognition and brain volume, assessed by magnetic resonance imaging (MRI) , in 1,082 middle-aged adults. After identifying a subset of metabolites linked to cognition or brain volume, they validated those findings in independent cohorts and then tested whether those same metabolites were also associated with the future development of Alzheimer&#8217;s disease. Effectively, they were looking for a coherent story: Which metabolites consistently tracked with better cognition, greater brain volume, and a lower risk of Alzheimer&#8217;s disease across multiple populations? But that was only Step 1&#8230; Step 2 was to determine which of those metabolites could actually be influenced by modifiable factors such as lifestyle, medications, and diet. That&#8217;s how they began to piece the puzzle together. And one molecule rose to the top: Ergothioneine. What is Ergothioneine? Ergothioneine is a sulfur-containing amino acid with antioxidant and anti-inflammatory properties. Interestingly, its levels also decline with age , paralleling the gradual loss of antioxidant defenses that occurs as we get older.", "category": "fitness"}, {"title": "Your GLP-1 Might Be Turning “ON” Hunger Neurons", "url": "https://staycuriousmetabolism.substack.com/p/glp-1-drugs-turn-on-hunger-neurons", "date": "2026-10-06T05:01:18.047766+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "This might be one of the strangest findings on GLP-1 weight-loss drugs I&#8217;ve come across this year. Researchers were studying neurons in the brain that are known to drive hunger. So, you&#8217;d expect drugs like semaglutide (Ozempic) to decrease the activity of these cells. Instead, they found the opposite. GLP-1 receptor agonists activated these hunger neurons. You read that right: a drug famous for reducing appetite appeared to switch on the very neurons that drive hunger. Bizarre. Completely paradoxical. What are we missing? And what does this mean if you&#8217;re taking a GLP-1? Let&#8217;s dive into the science. The Hunger Neurons with a Funny Name First, some quick background. Deep in your brain, nestled in a region called the hypothalamus, sits a cluster of neurons known as AgRP neurons . These cells are your brain&#8217;s hunger alarm system. When your energy stores drop or when you skip a meal (if you&#8217;re not used to fasting), AgRP neurons fire up. They drive you to seek food. So, the conventional logic goes: If GLP-1 receptor agonists suppress appetite and cause weight loss, they should suppress AgRP neurons. These are hunger cells. The drug kills hunger. So, no duh. Except... that&#8217;s not what happened. A new study published in PNAS out of Yale tested this assumption directly. And the results flipped the script. AgRP neurons weren&#8217;t suppressed by semaglutide. They were activated by it. What&#8217;s more, these neurons were required for the drug&#8217;s full weight-lowering effect. But let&#8217;s walk through some of the data. What Happens When You Disable the &#8220;Hunger Neurons?&#8221; The researchers used a clever genetic model. They bred mice in which AgRP neurons were functionally impaired.", "category": "fitness"}, {"title": "Are you happier if you get more sunlight?", "url": "https://neuroathletics.substack.com/p/are-you-happier-if-you-get-more-sunlight", "date": "2026-10-06T05:01:18.047766+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A morning-light study caught my attention because of what improved&#8212;and what didn&#8217;t. Thirty-three university students felt less sleepy after a week of morning bright-light exposure. But their performance on attention and memory tests didn&#8217;t improve. That is an interesting result if, like me, you spend your working life asking what actually helps the brain. First, what did the study actually show? In the July 2026 preprint, participants completed one week using a 10,000-lux light device for 30 minutes each morning and another week under their usual lighting conditions. The order was randomized. During the bright-light week, they reported less daytime sleepiness, with the largest difference at midday. The researchers also reported improved Fitbit-estimated sleep efficiency and more consistent sleep duration. But the cognitive tests did not show improvement. This was a small, short study with no washout period between conditions, and it has not been certified by peer review. It cannot settle whether morning light improves cognition more broadly. It also tested a device, not a few minutes outdoors. My interpretation: encouraging findings for sleepiness and sleep patterns, without a demonstrated memory benefit in this experiment. I would happily take a less sleepy afternoon. I would just like us to describe it accurately. Why would light affect your brain in the first place? Your retina does more than help you see. It contains intrinsically photosensitive retinal ganglion cells , or ipRGCs. These cells detect light through a pigment called melanopsin , while also receiving input originating from rods and cones. Some send signals directly to the suprachiasmatic nucleus , or SCN, in the hypothalamus: your central circadian clock.", "category": "fitness"}, {"title": "You have health insurance. Why are you still fighting for care?", "url": "https://neuroathletics.substack.com/p/you-have-health-insurance-why-are", "date": "2026-10-06T05:01:18.047766+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A woman with breast cancer is under anesthesia. Her mastectomy has already begun. In another operating room, her reconstructive surgeon, Dr. Elisabeth Potter, is finishing a case when a nurse comes in with an unusual message: UnitedHealthcare is on the phone, and they need to speak to her right now . The call is about the woman currently undergoing surgery. The insurance company wants Potter to explain the patient&#8217;s diagnosis and justify why she needs to remain in the hospital overnight. The patient has breast cancer. She is already unconscious. Her surgery was authorized. Her physicians have determined the care she needs. And yet, in the middle of the operation, her surgeon is being asked to step away and defend it. Potter told me that in that moment she felt like she was having to &#8220;protect my patient from her insurance company.&#8221; The overnight stay was ultimately denied anyway, and the patient received a bill for $100,000 . After Potter spoke publicly about what happened and the story exploded online, she says the bill was erased. But that immediately raises a much more disturbing question: what happens to the patient whose doctor doesn&#8217;t have a viral video? Your nervous system needs inputs, too Taking an active role in your health also means paying attention to the stress you carry every day&#8212;and making room for recovery before you&#8217;re completely depleted. Between work, training, travel and caring for the people around you, &#8220;just relax&#8221; can feel like one more thing on an already unreasonable to-do list. That&#8217;s one of the reasons I&#8217;ve been using Nuropod .", "category": "fitness"}, {"title": "A study of 854 women found one hormone linked to lower levels of Alzheimer’s-related tau", "url": "https://neuroathletics.substack.com/p/a-study-of-854-women-found-one-hormone", "date": "2026-10-06T05:01:18.047766+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, For decades, we have spoken about menopause as though it happens below the neck: hot flashes, poor sleep and weaker bones. But estrogen loss reaches the brain&#8212;and ignoring that may be one of the greatest blind spots in women&#8217;s health. A new peer-reviewed study published in Alzheimer&#8217;s &amp; Dementia adds to the evidence that estrogen biology may be connected to one of the central processes underlying Alzheimer&#8217;s disease: the accumulation of tau. Researchers studied 854 female participants aged 50 and older from the European Prevention of Alzheimer&#8217;s Dementia Longitudinal Cohort. Their average age was approximately 65, and the group included cognitively healthy participants as well as people with mild cognitive impairment. Using a highly sensitive method called liquid chromatography-tandem mass spectrometry, the researchers measured two estrogens circulating in the blood: estradiol and estrone. They then compared those concentrations with three Alzheimer&#8217;s-related biomarkers measured in cerebrospinal fluid: Amyloid-beta 42, Phosphorylated tau 181 and Total tau. The clearest finding was this: higher circulating estradiol was associated with lower phosphorylated tau at baseline. The relationship was stronger in women who carried APOE4, the most important common genetic risk factor for late-onset Alzheimer&#8217;s disease. This matters because abnormal phosphorylation changes how tau behaves inside the brain. Tau can detach from the internal structure of neurons and eventually accumulate into the tangles associated with Alzheimer&#8217;s disease and neurodegeneration.", "category": "fitness"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
