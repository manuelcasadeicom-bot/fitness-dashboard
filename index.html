at allows one to quantify the relationship between different worldlines. For example, … About the Author: Jonathan Lunine is the Chief Scientist at NASA’s Jet Propulsion Laboratory and Professor of Planetary Science at Caltech in Pasadena, California. Beforehand, he was the David C. Duncan Professor in the Physical Sciences and Chair of the Department of Astronomy at Cornell University. Lunine is interested in how planets form and evolve, what processes maintain and establish habitability, and what kinds of exotic environments (methane lakes, etc.) might host a kind of chemistry so The opinions expressed are those of the author alone and do not represent those of his employer. 23 1 6 Share A guest post by Jonathan I Lunine Inaugural VP of the Society of Catholic Scientists; co-founder of COLLIS and TI Faculty advisor at Cornell.", "category": "teologia"}, {"title": "Outsourcing Your Intellect", "url": "https://thomisticinstitute.substack.com/p/outsourcing-your-intellect", "date": "2026-11-02T13:42:23.623000+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Investigations by the Thomistic Institute Outsourcing Your Intellect Artificial Intelligence and The Whispering Earring Fr. Ambrose Little, O.P. Nov 02, 2026 42 5 10 Share Alexander Rothaug , “The Three Fates,” 1910, via Wikimedia Commons. All the world’s a stage, (Seneca, Moral Epistle 107 , n.11 Verses attributed to Cleanthes) … About the Author: Fr. Ambrose Little is the Director of the Thomistic Institute. He is originally from Connecticut and was ordained a priest in 2013. Before entering the Dominican Order in 2007, he graduated from The Catholic University of America with a BA in philosophy. After ordination, he completed a Licentiate in Philosophy at The Catholic University of America and then taught for two years at Providence College. In the academic year of 2013-2014, he was a visiting scholar at Boston College 42 5 10 Share Discussion about this post Comments Res  make a career out of what you love: sharing your research and keen knowledge with those of us who desperately need it! 6 1 2 replies by Nick Norwitz MD PhD and others Liked by Nick Norwitz MD PhD Cheryl 2d My daughter gave me a weighted vest two weeks ago. Your letter gave me the push to get it out of the closet and wear it when I walk the dog this morning. Thank you. (And your concluding sentence caused me to laugh out loud.) Have a great day, Nick!", "category": "fitness"}, {"title": "My Plan to Never Get Alzheimer's Disease", "url": "https://staycuriousmetabolism.substack.com/p/how-to-build-a-brain-that-lasts-100", "date": "2026-11-17T12:01:49.995000+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Upgrade Upgrade to founding My Plan to Never Get Alzheimer's Disease We'll explore groundbreaking science and explain why the idea of building a near-immortal brain is quickly moving from science fiction toward science fact. Nick Norwitz MD PhD Nov 17, 2026 ∙ Paid 100 81 8 Share Article voiceover 0:00 -27:49 Audio playback is not supported on your browser. Please upgrade. When I was just 23 years old, I was handed a terrible verdict. I learned that I carried not just one copy but two copies of a genetic variant ( ApoE4/4 ) that dramatically increased my chances of developing Alzheimer’s disease, raising my risk by 12- to 15-fold. … *Medical Disclaimer: This content is provided for educational and informational purposes only and does not constitute medical advice. It is not intended to diagnose, treat, cure, or prevent any disease, nor is it a substitute for individualized medical advice from a qualified healthcare professional. Always consult your healthcare provider before making changes to medications, supplements, diet, or other aspects of your healthcare. 100 81 8 Share Previous Next Discussion about this post Comments Restacks Liked by Nick Norwitz MD PhD Sarah McNary 4d Wow! Great article and so helpful to have all yo ng, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That almost never gets studied, and this team pulled it off. … And if you are new here, subscribe so the next one finds you. Every week I take a study like this apart and tell you what it actually says, not what someone is trying to sell you with it. 38 4 4 Share Previous Next Discussion about this post Comments Restacks Lizzie Nov 6 What’s more important? NAD or creatine? I have BIND from benzo damage. I was seeing a clinic that does NAD IV infusion for benzo WD. I was too sensitive to the IV and considering switching to oral. Any thoughts? Jenni Majumdar, PhD, CRNA Oct 28 Faster Stroop times after just six weeks of lifting twice a week is so encouraging, Louisa!!", "category": "fitness"}, {"title": "Bishop Strickland | Only 29% Believe in the Real Presence", "url": "https://www.lifesitenews.com/episodes/bishop-strickland-only-29-believe-in-the-real-presence/", "date": "2026-11-21T01:00:18+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. Only approximately 29% of surveyed American Catholics believe that the bread and wine truly become the Body and Blood of Christ, a figure that rises to just 60% among weekly Mass attendees. And yet the crisis of belief in the Real Presence is not receiving greater attention at the U.S. bishops’ November assembly in Baltimore. Administrative priorities, financial matters, committee presentations, and national initiatives risk overshadowing the bishops’ primary responsibility: safeguarding the fai … Bishop Strickland: Recovering Scripture, rejecting the 'spirit of Vatican II' Christ is in the boat: Recovering supernatural faith | Bishop Strickland Sodom & the Synod: Why the Church must speak clearly about sin | Bishop Strickland", "category": "teologia"}, {"title": "Stolen 120-year-old bell recovered after vandalism at another church in Canada", "url": "https://www.lifesitenews.com/news/stolen-120-year-old-bell-recovered-after-vandalism-at-another-church-in-canada/", "date": "2026-11-20T23:21:10+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — Police have recovered a historic, century-old bell that was stolen from a Catholic church in rural Canada, but the vandals destroyed the bell tower. On November 14 near Fraserwood, Manitoba, police were notified that a 120-year-old bell at Sacred Heart of Jesus Church was stolen. Royal Canadian Mounted Police (RCMP) from Gimli came to investigate the November 14 theft and found that the church bell tower, which is about 1.5 stories tall, was heavily vandalized and the bell, which weighed around 300 pounds, was missing. The ornately decorated brass bell came from Switzerland in 1906. … Arsons against religious institutions have skyrocketed in the last few years. Federal data show that there were 592 reported arsons from 2010 to 2022. However, approximately 423 of these acts of violence were from 2015 onward. Conservative MPs have urged Liberal MPs for some time to back a bill that, if passed, would make church arsonists pay for the damages they cause as “vandalizing places of worship is unacceptable.” The Liberals thus far have refused to back the bill and recently blocked a motion that called for a study on church arsons in Canada.", "category": "teologia"}, {"title": "Christian girl still missing in Pakistan after abduction, forced conversion", "url": "https://www.lifesitenews.com/news/christian-girl-still-missing-in-pakistan-after-abduction-forced-conversion/", "date": "2026-11-20T21:36:29+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — A 16-year-old girl remains missing in Pakistan weeks after she was allegedly abducted, converted to Islam, and forcibly married using falsified age documents. Samina, the daughter of Allah Ditta and Zarina Bibi, was reportedly taken by a local Muslim man named Muni and his associates while running an errand to buy milk on October 2 in Phoolnagar, an industrial and agricultural town in Punjab’s Kasur District where the struggling family lives. … According to data compiled by the Centre for Social Justice (CSJ), 515 cases of abduction and forced religious conversion of minority girls and women were documented across Pakistan between 2021 and 2025. The trend continued unabated in 2026, with CSJ recording at least 84 verified cases in the first 10 months of the year alone, 49 involving Christian victims and 35 involving Hindu victims. More than half of the documented victims in 2026 were confirmed minors under 18, including 37 ages 14 to 17 and six under age 14, underscoring how perpetrators routinely rely on fraudulent age declarations and marriage certificates while impoverished families face economic coercion and threats of violence when Until police enforce Punjab’s child marriage laws and hold perpetrators and complicit officials accountable, Samina’s family and countless other minority households remain trapped in fear without justice or protection.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5
