<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 04 Nov 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Introducing the Porphyrian Tree of Virtue", "url": "https://thomisticinstitute.substack.com/p/introducing-the-porphyrian-tree-of", "date": "2026-10-26T13:31:10+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "A New Way to Study the Virtue Theory of St. Thomas Benozzo Gozzoli, “The Triumph of St. Thomas over Averroes,” 1468-1484, via Wikimedia Commons. We are very happy to announce something that’s been years in the making: an enormous project. The Thomistic Institute, along with the Four Pillars Project at the University of St. Thomas (MN), has funded a Scientia Salon on the Theory and Practice of Virtue. This group of experts took up the task of creating a Porphyrian tree of virtue, presenting the theory of St. Thomas Aquinas in all its hierarchical glory. “What, though, is a Porphyrian Tree?” your friend wonders aloud. It’s named after the 3rd-century philosopher Porphyry, a follower of Aristotle who had a penchant for pictorial representations. To make one, you start with a concept, say, substance, then provide exhaustive distinctions between types. Maybe substance is divided between material and immaterial. Then you move to that step, further subdividing the varieties. Material divides into living and non-living; living between the sensible and insensible; sensible between the rational and irrational. If you work out all the types in all the branches, you’ve got yourself a whole tree of distinctions, which is enough to make any philosopher’s heart pitter-patter. That’s what we did with Aquinas’s views of virtue. It is really something to behold. You should go behold it . But before you zip away, let me say a bit about what’s over there. View Virtue Tree The Scholars of the Scientia Salon Thomas’s thought is so broad in scope, yet also so detailed in its sophistication, that it can sometimes be hard to navigate.", "category": "teologia"}, {"title": "Why is Public Discourse so Hard?", "url": "https://thomisticinstitute.substack.com/p/why-is-public-discourse-so-hard", "date": "2026-10-19T13:30:43+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Close to a decade ago, a dear friend of mine talked me into joining an important committee at the school our kids then attended. She said she foresaw difficult discussions coming our way, and she wanted more people on the committee who were able to keep their heads in heated discussions and share careful, calm reasoning. Let’s call her Huldah , after the Old Testament prophetess who saw what was to come. I’m a Philosophy professor who studies virtue in the Christian intellectual tradition. That means that my job, as philosopher, has me disagreeing cordially all day long, and the content of my research has me thinking through how to do that well. So, she didn’t misfire when she asked me to join the committee. And yet, I was hardly prepared for the crowded, acrid meetings that came to pass. Nicolas Andrre Monsiaux, “The Debate of Socrates and Aspasia,” via Wikimedia Commons , 1801. While there were reasonable, understanding people on both sides of the debate, they were the minority. One woman used her thumb and pointer finger to mimic shooting herself in the head when she disliked points being made. Others emphatically rolled their eyes, sneered, chortled, or groaned. Folks would use their allotted time to snootily express platitudes, as if a tautology would prove a substantive policy point, or to aggressively shout assertions, as if disdain or force were the main methods of discussion. And, of course, the worst actors on either side agitated the more moderate members of the other. When it came to respectful and charitable discussion, to flip the phrase, the whole was worse than its parts. The whole process was ugly, and it tore apart a community that otherwise had been healthy and vibrant. The culture of the place changed drastically.", "category": "teologia"}, {"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Caravaggio, “The Calling of Saints Peter and Andrew,” 1603, via Wikimedia Commons. The Question of Justification The question, “what must I do to be saved,” was posed by the rich young man in Matthew 19:16 (and Mark 10:17), as well as by the suicidal jailer in Acts 16:30. In reply, Jesus and Paul, respectively, do not say, “nothing, God will do it all.” Jesus says, “keep the commandments” and “go, sell what you possess . . . and come, follow me” (19:17, 21). And Paul says, “believe in the Lord Jesus.” But does that mean that I save myself, or that I at least meet God halfway? No. Earning eternal life is infinitely above the natural powers of man. But then, have I no part in my own salvation? At the Final Judgment, will God be judging himself since my actions are completely irrelevant to salvation? Even if I actually do evil things, if I have no free will to choose good versus evil, I will be like an irrational animal just following my instincts. And although we might be enraged at a fox that kills our chickens, we don’t blame the fox as if he were committing a sin. So, how should we understand our being rescued from sin and justified by God? Fortunately, St. Thomas Aquinas addresses this issue in question 113 of the first part of the second part of the Summa Theologiae. Aquinas divides the Summa Theologiae into three parts: (1) on God as he is in himself, (2) on rational creatures’ movement toward God, and (3) on Christ, man’s way back to God. The second part is itself divided into two parts: (1) on anthropology (man’s nature and end, and virtue in general) and (2) on specific virtues. At the end of the first section of the second part, Aquinas treats of grace, which was only implicit in the previous articles.", "category": "teologia"}, {"title": "How to Reduce Liver Fat by 68% in 6 Months (Proven in RCTs)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-eat-to-reverse-fatty-liver", "date": "2026-11-03T12:03:17+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Fatty liver affects roughly 1 in 3 adults. And it’s a serious, insidious health problem because your liver is the gatekeeper of your metabolism. When your liver accumulates excess fat, it can become insulin resistant, setting the stage for cardiovascular disease, diabetes, and dementia. And the issue is that most people are getting terrible nutrition advice for fatty liver. The result? Many people’s fatty liver progresses when it can, and should, regress. Yes, fatty liver can absolutely be reversed. And fast! In fact, one recent randomized controlled trial showed that a specific diet could reduce liver fat by 68% in just six months. We will get into it. But first, we need to understand why the liver gets fatty in the first place. (Hint: it’s not because you ate fat.) Why Does a Liver Get Fatty? A liver becomes fatty when the fat being produced outpaces the fat being burned. I do emphasize “being produced” because the primary culprit in fatty liver is not the butter you fried your eggs in that migrated into your liver and popped a squat. Rather, fatty liver arises when your liver makes its own new fat particularly from sugar and refined carbohydrate in the diet (a process called de novo lipogenesis ). As for the other side of the equation, fat is burned largely on demand. So, the high-level formula to reverse fatty liver is: Press the brake on de novo lipogenesis through reducing the driving dietary force. Pressing the gas on liver fat burning by creating the right metabolic conditions. Or, if you want to think about your liver like a bathtub. The fat stored in your liver is the water level. Eating more sugar and refined carbohydrates is like turning on the faucet, increasing the flow of fat into the liver.", "category": "fitness"}, {"title": "I Ate a Special Chocolate that Changed My Appetite", "url": "https://staycuriousmetabolism.substack.com/p/dont-eat-chocolate-again-until-you", "date": "2026-10-31T11:03:28+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "For three separate weeks, I started every lunch with a bar of chocolate. Same ritual, every single day. The bars looked identical. They tasted identical. I couldn’t tell them apart. But during one stretch of that experiment, I ended up eating about 500 extra Calories at lunch, day after day, without ever feeling like I was overeating. Same chocolate. Same taste. 500 more Calories. So, what was going on? Today I’m going to explain science that might change how you eat sweets forever. A Sweet Molecule Is Not Just a Sweet Molecule Now, I should reveal that these weren’t just chocolate bars I picked off the shelf. I made them from scratch, and the difference between them was the sweetener I used. Because the fact of the matter is that different sweet molecules have different chemical structures. And even if there isn’t much difference on your tongue, your nervous system beyond your mouth can detect the difference. Different structures. Different receptors. Different downstream effects. But all beneath your conscious awareness. As a result, one sweet molecule may lead you to subconsciously eat more than another sweet molecule. At least that’s the theory. But now I should back up and explain the impetus for the experiment. It came from a paper published in Cell Metabolism that asked a simple question: How is sugar sensed by the nervous system in the gut? The advantage of using animals in this type of experiment is that you can do something a little sinister. Not only can you control calories by giving sugar alone, fat alone, or a calorie-matched combination of sugar and fat, but you can also bypass taste entirely by implanting small tubes that infuse those nutrients directly into the stomach or intestines. Then you can monitor how much the animals eat.", "category": "fitness"}, {"title": "Does High HDL Cancel Out High ApoB?", "url": "https://staycuriousmetabolism.substack.com/p/are-you-immune-to-high-apob", "date": "2026-10-29T11:01:00+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Could good metabolic health make you immune to the dangers of high LDL and ApoB? Well, a new study published in the European Journal of Preventive Cardiology just threw a wrench into the story that high LDL and ApoB are always bad. Don’t believe me? Here’s a quote: “When HDL-C is high, the effect of changing ApoB vanishes.” Not diminishes. “Vanishes.” And this study of nearly 300,000 people aligns with my own N=1. I have zero plaque (0 mm 3 ) in any of my arteries, soft or calcified, on advanced cardiac imaging, despite spending the better part of a decade with an LDL near 600 mg/dL and ApoB well over 300. Those are levels that would give your average cardiologist nightmares. So, what gives? Do I have “immunity” to the dangers of high ApoB, a word the authors themselves use? And, perhaps more importantly… what about you? Now, this might seem like a simple “woohoo” moment and victory lap for those with high HDL. But, like any good scientific story, there are a lot of nuances to unpack. But first, I want to introduce our characters and tell you what the researchers behind this study did. The Villain and the Hero: ApoB and HDL Our two big characters today are ApoB and HDL cholesterol (HDL-C). ApoB refers to a protein that sits on certain particles floating around in the bloodstream, collectively called the “ApoB-containing lipoproteins.” The most famous are the LDL particles. LDL particles are the key villain in the conventional cardiology story. And if you get a standard lipid panel and see an LDL cholesterol (LDL-C) value, that is the total cholesterol mass carried within your LDL particles. ApoB is considered a better risk marker than LDL cholesterol, since the amount of cholesterol in each particle can vary.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! Go watch this one. I mean it. I sat down with Dr. Michael Breus, the Sleep Doctor, and I left rethinking things I was sure I already understood. He has spent his whole career as a clinical psychologist doing one thing, fixing the way people sleep, and he is blunt in a way I loved. First thing that floored me: the Sleep Doctor himself stops breathing 26 times an hour in his sleep, and had no idea for years. How he found out: His workouts were falling apart and his mile time kept climbing He ran bloodwork, even tried testosterone, chasing every other explanation first Nothing moved Finally someone asked when he’d last done a sleep study It came back 26. He was so sure it was broken that he retook it. Same number. The Sleep Doctor had sleep apnea and didn’t know. Here’s why that should scare the rest of us: It can happen anywhere from 5 to hundreds of times an hour, and most people never know it’s happening Every time you stop breathing, your heart rate drops then spikes to restart you, loading your heart all night long. Over time that can tip into atrial fibrillation. You’re also starving your brain of oxygen, and you never sink into the deep sleep where the brain runs its own cleanup His tell for spotting it across a room: a neck over 17.5 inches carries an 83 percent chance of apnea (his number) And one story I won’t forget: a detective, benched because he kept falling asleep on stakeouts, finally got on a CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team!!!!! A brand new creatine study has arrived!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That almost never gets studied, and this team pulled it off. You know creatine is one of the very few supplements I actually stand behind. So when a trial like this lands, I read every single line. And what they found got me fired up. Why this matters to you If you are in your forties and your brain feels like it is running too many tabs at once, this study is about you. The word that vanishes mid-sentence. The 3 a.m. wake-up. The afternoon fog that will not lift. You have been told this is just perimenopause and to wait it out. These researchers went looking for something better. What they did Fifty-one women in perimenopause, average age 46. Three groups. Most of them trained hard, twice a week, for six weeks. A smaller group did nothing, as the comparison. Half of the training women got creatine, half got placebo. And to see inside the brain, the team placed a sensor on each woman’s forehead and measured how much oxygen-rich blood her prefrontal cortex pulled in while she worked through a tough mental test. A note on sunlight, UVB, and why I’ve been using Solius This is my latest hack for circadian rhythm disruption! The obvious answer is to get outside more—and I still think that should come first. But the reality is that consistent UVB exposure is not always easy. Season, latitude, weather, work schedules, and how much time we spend indoors all change what we actually get. That’s one reason I’ve been using Solius .", "category": "fitness"}, {"title": "Belly Fat Is Shrinking Your Brain", "url": "https://neuroathletics.substack.com/p/belly-fat-is-shrinking-your-brain", "date": "2026-10-22T12:22:33+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, The fat around your waist is talking to your brain. Not as a metaphor. Chemically, constantly, every single day. A major new review just sat me down and walked me through the entire conversation, from one bloated fat cell all the way up to the circuits that hold your memories. I read it twice, and on the second pass I was scribbling in the margins like a lunatic, because the story it tells about the midlife brain is one of the most important things I have read all year. Here is the scale of what we are talking about. Almost 900 million people now live with obesity, and rates of dementia are projected to nearly triple by 2050. Those two lines are converging. This review is about the exact place they meet, which is your brain. It came out in Nature Reviews Neurology. Instead of a single study, it pulls the whole field into one place, from studies of millions of people down to the precise damage happening inside individual brain cells. Let me walk you through it the way it walked me through it. Fair warning: it gets stranger as it goes. First, a paradox that broke this field for a decade For years, the data made no sense. Study after study found that being obese in old age was associated with a lower risk of dementia. Thinner older adults got dementia more often. People started calling it the “obesity paradox,” and it got used, loudly, to argue that the worry about weight and the brain was overblown. Here is the grim problem. People often start losing weight in the years before dementia is ever diagnosed. The disease is already quietly eating through the brain, appetite and behavior shift, and the number on the scale falls. So late-life thinness was never protecting anyone. It was an early symptom being mistaken for a shield.", "category": "fitness"}, {"title": "Indian cardinal opposes ban on Latin Mass if Vatican II is not rejected", "url": "https://www.lifesitenews.com/news/indian-cardinal-opposes-ban-on-latin-mass-if-vatican-ii-is-not-rejected/", "date": "2026-11-04T01:11:56+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. ( LifeSiteNews ) – Cardinal Oswald Gracias, the archbishop emeritus of Bombay, said during an interview that he is opposed to restrictions on the celebration of the Traditional Latin Mass (TLM) as long as its celebration does not indicate a “rejection” of the Second Vatican Council among the faithful. … The Vatican Secretariat of State had also denied permission for Bishop Schneider to celebrate the pilgrimage’s Pontifical Mass in the Basilica despite seeking Pope Leo’s explicit permission months in advance. CONFIRMED: TLM pilgrimage sought permission from Leo XIV months in advance “The Secretariat of State sent the organizers a letter explaining that, at least for this year, permission for the Pontifical Mass in St. Peter’s Basilica will not be granted,” a source very close to the traditional pilgrimage’s organizers previously told LifeSite. “The real reasons are unknown. It seems very strange that today the so-called LGBT Catholics can obtain a special Mass in St. Peter’s more easily than Catholics attached to the Church’s Tradition.”", "category": "teologia"}, {"title": "Opposing Communion in the hand ‘extremist’? Church history disagrees", "url": "https://www.lifesitenews.com/episodes/opposing-communion-in-the-hand-extremist-church-history-disagrees/", "date": "2026-11-04T01:00:31+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "The Vatican’s Dicastery for Divine Worship warned against “liturgical extremism,” targeting Catholics who raise questions about kneeling for Communion, receiving on the tongue, and women’s chapel veils. Church historian Dr. Ed Mazza joins John-Henry Westen to contrast the Vatican’s position with statements from Cardinal Robert Sarah, Bishop Athanasius Schneider, and accounts attributed to Mother Teresa. Receiving Communion kneeling and on the tongue, Mazza argues, better expresses reverence for The expansion of Communion in the hand during the late 1960s and 1970s includes allegations concerning Cardinal Joseph Bernardin’s role in securing its approval by the American bishops in 1977. Westen and Mazza examine Protestant Reformation-era objections to Eucharistic adoration and discuss Marian apparitions at La Salette, Akita, Garabandal, and Fatima, interpreting their messages as warnings about irreverence toward the Blessed Sacrament. … This Catholic mother of 8 had 2 priests and 1 nun- here’s how she did it Priest: Leo won’t do Pachamama in Peru. He’ll let others do it Here is What the Triumph of the Immaculate Heart will Look Like", "category": "teologia"}, {"title": "Pastor sentenced to probation after retrial over drag queen event protest", "url": "https://www.lifesitenews.com/news/pastor-sentenced-to-probation-after-retrial-over-drag-queen-event-protest/", "date": "2026-11-03T23:44:33+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "CALGARY, Alberta ( LifeSiteNews ) — Canadian pastor Derek Reimer was sentenced to 12 months of probation after a retrial stemming from an appeal after being found guilty of mischief and causing a disturbance for protesting a “drag queen story hour” event marketed to children at a public library, after a retrial 0that came from an appeal. Reimer learned of the sentencing by a Calgary judge on November 2, meaning he will now be under strict limitations on moving about freely. He is also banned from using social media, but it is up to his probation officer to enforce the ban. … However, the Crown appealed the ruling with a surprise visit to his house later in the year, claiming that Judge Allan Fradsham’s 2024 acquittal was incorrect. Court of King’s Bench Justice Nancy Carruthers allowed the appeal to move forward, stating that legal errors were made in the acquittal that led to the recent verdict. In 2025, Reimer was released from jail after earlier in the month being arrested for refusing to comply with a court order mandating he write a formal apology to the Calgary Public Library manager after criticizing him for promoting the “drag queen story hour” for children. Reimer has been in trouble many times for speaking out against the LGBT agenda targeting kids in public spaces.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
