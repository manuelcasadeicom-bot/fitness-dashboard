<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 23 Aug 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "How to Reverse Atherosclerosis in 1 Year (Proven in RCT)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-reverse-atherosclerosis-in", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "When I was 23 years old, I developed extraordinarily high cholesterol. I was told repeatedly that my cholesterol was so high that I would be developing cardiovascular plaque within years and probably have my first heart attack by age 30. I never did. My arteries are perfectly clean, even on the most sensitive imaging. The reason why has been a source of debate. Special genetics? I don&#8217;t think so. A fluke of fate? That&#8217;s not scientific. Just not enough time? Maybe, but it actually skirts around the question. I think the answer, at least in part, lies in something far more obvious on the surface, but far more interesting underneath. And it comes down to two things I do every single day, both of which reduce inflammation in my arteries, and one of which has been shown to cause plaque regression in a human randomized controlled trial published this year. And the best part is that both of them are free. They are sleep and exercise. Now, before you click off because you think I&#8217;ve revealed the secret, I haven&#8217;t. What appear to be banal, obvious, healthy lifestyle interventions act on your arteries in ways you couldn&#8217;t even imagine. In fact, when I read the first paper we&#8217;re going to discuss, it introduced me to an idea I&#8217;d never thought about when it comes to heart health. So come with me on this journey, because I&#8217;m about to open your eyes before you close them later tonight. The Clones in Your Bones Let&#8217;s begin somewhere unexpected. A new study in Nature reveals that sleep and exercise can tame mutant blood cells that drive heart disease. Now, if you haven&#8217;t heard of this study, one of the reasons it probably didn&#8217;t make headlines is that it&#8217;s too bogged down in abbreviations and jargon for most science journalists to make sense of it. Trp53 LOF, Dnmt3A R882H , JAK2 V617F . I could go on. But I&#8217;m going to spare you the alphabet soup and introduce one word you need to know: &#8220;clonal hemato", "category": "fitness"}, {"title": "The Hidden Link Between Insulin Resistance and IBS", "url": "https://staycuriousmetabolism.substack.com/p/the-missing-ingredient-linking-insulin", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "In a new study published in Cell Host &amp; Microbe , researchers went looking in the guts of people with irritable bowel syndrome (IBS) and people with insulin resistance. They found that both groups were missing the same ingredient. Not a vitamin. Not a mineral. A gut-derived molecule that can be produced from a common dietary fat. I promise we&#8217;re going to get into the specifics, and the solutions. But before we do, I need to provide a little more framework. IBS and Insulin Resistance are Linked IBS&#8212;and in this case, specifically IBS with diarrhea (IBS-D)&#8212;is a gastrointestinal disorder affecting millions of people worldwide. Furthermore, IBS, and the more severe inflammatory bowel diseases (IBD), are tightly associated with a Westernized diet. *Author&#8217;s aside: On a personal note, whether my childhood diet of Subway, Twizzlers, and industrial quantities of breakfast cereal caused my eventual diagnosis of inflammatory bowel disease&#8230; well, I suppose, a bit like the center of a Tootsie Pop&#8230; the world may never know. Anyway, nostalgia aside, I know it also won&#8217;t surprise you that another pathology linked to Westernized diets is insulin resistance. But are these simply two conditions (IBS and insulin resistance) that happen to be associated with the same dietary pattern? Or is there a deeper connection? I think you&#8217;re smart enough to know where this is going. According to these new data, there is a link. And it starts in the microbiome. Maybe this isn&#8217;t a surprise. The microbiome is one of the primary gatekeepers between the outside world and our internal biology. What we eat, how we live, and the environments we inhabit can profoundly reshape the microbiome, influencing everything from gut health and symptoms like bloating, diarrhea, constipation, and abdominal pain, to metabolic health and insulin sensitivity. But this study takes the scientific story a step further. Let&#8217;s start with where the researchers the", "category": "fitness"}, {"title": "The Strange Blue Vial That Got Me Running Again", "url": "https://staycuriousmetabolism.substack.com/p/i-injected-this-strange-blue-peptide", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "A couple of months ago, I started injecting myself with a strange little blue peptide formulation called the KLOW Stack. Technically, it&#8217;s not one peptide but four, each targeting different aspects of healing and recovery. Together, they&#8217;re designed to work synergistically and, at least in theory, accelerate the body&#8217;s ability to repair itself. I&#8217;ve already noticed some encouraging changes. In particular, one involves an injury I&#8217;ve been dealing with for more than a decade: damage to my right knee sustained after a series of fractures and surgeries. Ever since, running has been difficult. Even short jogs often leave the knee swollen and the surrounding scar tissue inflamed. But recently, for the first time in years , I&#8217;ve been able to run without the usual aftermath. Now, that&#8217;s an anecdote. But absence of definitive proof is not the same thing as absence of promise. So today, I want to walk through: What the KLOW Stack is Why people are excited about it What we know about each of its components What the future of healing and recovery might look like I&#8217;ll also spend some time discussing broader questions: Why am I willing to experiment with compounds that lack FDA approval? And how do we balance the risks of adopting a treatment too early against the risks of ignoring something potentially valuable for decades while waiting for perfect evidence? Because ultimately, the conversation isn&#8217;t just about peptides. It&#8217;s about how we navigate uncertainty in medicine itself. Premium subscribers get full access to my deep dives into cutting-edge metabolic research for less than $1/letter, 3 per week. You&#8217;ll always walk away with at least one new insight about metabolic health. In the rest of this letter for StayCurious Metabolism premium members, we&#8217;re going to unpack all of the topics and questions raised above. Think of it as a one-stop shop for understanding recovery peptides , and as well as how to th", "category": "fitness"}, {"title": "Jim Kwik: Your Brain Has a Savings Account. You're Probably Draining It.", "url": "https://neuroathletics.substack.com/p/jim-kwik-your-brain-has-a-savings", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, Jim Kwik was called &#8220;the boy with the broken brain&#8221; by a teacher, out loud, when he was nine. A brain injury at five left him years behind. He&#8217;s now the brain coach Hollywood actors and CEOs hire to think faster. So when he talks about what a brain can rebuild, I listen. We met to talk about AI. But the thing I keep coming back to is simpler, and it&#8217;s the most useful way to think about your brain I&#8217;ve heard in a long time. He calls cognitive reserve a savings account. It&#8217;s real neuroscience, and it&#8217;s why two people can have the same Alzheimer&#8217;s pathology in their brains while one loses their memory and the other stays sharp at 90. The reserve is the buffer. You spend a lifetime building the balance, and it&#8217;s what protects you when things start to go wrong underneath. Every day, you either make a deposit or take a withdrawal. The withdrawals are the ones you already suspect: bad sleep, chronic stress, sitting all day, processed food. But Jim named a new one. Every time you let a machine do your thinking, that&#8217;s a withdrawal. He pointed to an MIT study where people wrote essays with ChatGPT, with Google, or with just their heads. The AI group had the least brain engagement and barely remembered what they&#8217;d written. His line: you don&#8217;t go to the gym and have someone lift the weights for you. But that&#8217;s what we&#8217;re doing with our minds all day. The deposits are small, free, and completely in your hands. This is the part your evening is made of: Read the actual book, not the AI summary. Do the tip math in your head. Kill the calculator for small stuff. Sit in a boring moment instead of grabbing your phone. Jim&#8217;s point: boredom is where your best thinking happens, and we&#8217;ve deleted it. Learn something slightly too hard. If it&#8217;s easy, you&#8217;re not getting stronger, in the gym or the mind. Have the real conversation. Social connection is one of the biggest deposits", "category": "fitness"}, {"title": "This Billionaire is Obsessed with his Health", "url": "https://neuroathletics.substack.com/p/this-billionaire-is-obsessed-with", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I just spent an hour with Keith Rabois , and I have not stopped thinking about how he lives. If you don&#8217;t know the name, he&#8217;s one of the most successful investors of the last twenty years, an early force behind PayPal, Square, and DoorDash. He has more money than he could spend in a lifetime. And he treats his own body with the seriousness of a professional athlete in season. He has not missed more than a handful of workouts in seven years, and the ones he did miss still visibly bother him. He tracks every session. He treats training like brushing his teeth, non-negotiable, not up for debate on any given morning, because he&#8217;s figured out that the moment it becomes optional once, it becomes optional forever. Here&#8217;s the thing I&#8217;ve noticed, and Keith is just the latest example. The most successful people I meet, the investors, the founders, the ones operating at the very top of brutally competitive fields, almost all treat their bodies like elite athletes treat theirs. It&#8217;s one of the most consistent patterns I&#8217;ve seen in this work, and I don&#8217;t think it&#8217;s a coincidence. I want to talk about why, because it changes how you might think about your own health. They stopped separating the body from the mind For most of us, health lives in one box and work lives in another. You go to the gym to look better or to feel less guilty, and then you go do your actual job, which happens in your head. The people at the top don&#8217;t think that way. They&#8217;ve collapsed the two. They train their bodies because it&#8217;s how they protect their minds, their focus, their decision-making, their stamina over a very long career. Keith said something that stuck with me: staying relevant as a VC as the decades pass is genuinely hard, and one of the ways he does it is by keeping his body and brain young, sharp, and curious. The fitness isn&#8217;t separate from the career. It&#8217;s infrastructure for it. And there&#8217;s real", "category": "fitness"}, {"title": "The 100-Year-Olds Whose Brains Were Full of Alzheimer's. And Who Kept Their Minds Anyway.", "url": "https://neuroathletics.substack.com/p/the-100-year-olds-whose-brains-were", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I want to tell you about a group of people who, by the rules we thought we understood, should not exist. They lived past 100. When they died and their brains were examined, they were full of amyloid plaques and tau tangles, the physical hallmarks of Alzheimer&#8217;s disease. The same wreckage found in the brains of people who lost everything to this disease at 70. And yet these centenarians died sharp. They knew their families. They finished their sentences. They carried the disease in their tissue and never once carried it in their minds. I read brain scans for a living. I am a neurophysiologist, and my entire career has been spent on this one disease, on why it takes so many women, and on the question of who escapes it. So for years I have been telling you, on the podcast and in these letters, probably more often than you want to hear it: having the pathology is not the same as having the disease. Plaques in your brain do not sentence you to dementia. I believed that because the data kept pointing there. But I could never tell you why it was true. There is a difference between a pattern you can see and a mechanism you can explain, and until this summer, this was only a pattern. Then a team in Belgium explained it Subscribe now They stopped looking at the plaques For forty years, the entire field has been transfixed by the plaques. Count them, clear them, attack them. The most expensive Alzheimer&#8217;s drugs on the market right now exist to scrub amyloid out of the brain, at great cost and real risk, for modest benefit. Researchers at VIB-KU Leuven, with the UK Dementia Research Institute and Muna Therapeutics, did something different. They studied donated human brain tissue from three groups: people who developed dementia, people who did not, and those extraordinary centenarians who stayed sharp. And instead of counting the plaques, they watched how the brain&#8217;s own immune cells reacted to them (Lu et al., Nature Medicine , 2026). Microglia (green an", "category": "fitness"}, {"title": "Natural Alternatives to Benzodiazepines", "url": "https://chrismasterjohnphd.substack.com/p/natural-alternatives-to-benzodiazepines", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Benzodiazepines are marketed (informally) as &#8220;psych meds&#8221; as if they primarily act on anxiety and stimulation circuits in the brain, but there is no such thing as a &#8220;psych med&#8221; because there are no targets that are only found in the brain and because there are no drugs that when taken orally primarily go to the brain. They have the highest relative uptake into the adrenal gland and they have the highest absolute uptake into muscle and fat. They probably act on GABA receptors found widely outside of the nervous system. While they are not active on the unique GABA receptors in the liver, they are probably active at GABA receptors on the lungs, kidneys, immune cells, reproductive organs, and pancreas. GABA itself regulates mitochondrial metabolism indirectly, but benzodiazepines have two independent mitochondrial targets that lie directly in the mitochondrial membrane and are unrelated to their actions on GABA receptors. There is no evidence that benzos are more powerful regulators of GABA metabolism than of mitochondrial metabolism. In fact, their solubility in fat and cell membranes might make them much more efficient at accessing their mitochondrial targets than at accessing GABA receptors. Like SSRIs , benzos are whole-body mitochondrial drugs. As with SSRIs, benzos are playing with mitochondrial fire. These claims are supported by the evidence and arguments found in the first installment of this series: People who use benzos have 60% greater mortality per unit time than people who don&#8217;t, but people who quit them have 60% greater mortality per unit time than people who stay on them. We cannot say whether these trends represent causation. However, they raise the possibility that benzo use puts one between a rock and a hard place and emphasize that the safest position is gained by never using them in the first place if their use can be safely avoided. This article covers alternatives to benzos following the hierarchy derived from The Fiv", "category": "fitness"}, {"title": "Massie is a Real-Food Hero", "url": "https://chrismasterjohnphd.substack.com/p/massie-is-a-real-food-hero", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Some $15 million are being spent to oust Thomas Massie today , and no one in congress is more close to those of us in the real food movement than this man. Thomas Massie and me on October 26, 2024 at Wise Traditions, the annual conference of the Weston A. Price Foundation, where he gave the keynote. Massie himself is a grass-fed off-the-grid farmer. My friend John Moody profiled his farm here. The farm is powered by solar panels and Tesla batteries with a house the Massie family built themselves out of logs they cut from their own woods and with stone they quarried from their own land. The home is heated from the same wood, and water comes from a well that Massie dug by hand with his neighbor. They grow peaches and apple trees, raise pastured chickens with an automatic tractor, and raise grass-fed cattle. Massie once admitted to Moody he used Google Maps to spy on Joel Salatin to get new ideas for his farm. No one paid me to write this. Massie has never given me any money but I have donated to his campaign. Massie originated and championed the Processing Revival and Intrastate Meat Exemption &#8220;PRIME&#8221; Act. Crafted by the Farm-to-Consumer Legal Defense Fund, in turn founded by Sally Fallon Morell of the Weston A. Price Foundation and others, this act is meant to remove the USDA as an impediment to small farmers. Small, locally run custom slaughterhouses are all over the place in the United States. USDA slaughterhouses are vanishingly rare and often at great distances away from farmers. The custom slaughterhouses are used by homesteaders and hunters who eat their own meat. The PRIME Act would allow them to be used by small farmers who sell their meat to the public, provided that they comply with local health regulations and don&#8217;t sell their meat across state lines. The regulatory burden to get a slaughterhouse inspected by the USDA is huge, and the number of USDA-inspected slaughterhouses is dwindling. Farmers often live 15 minutes from a custom slaugh", "category": "fitness"}, {"title": "What's Wrong With Jordan Peterson's Health?", "url": "https://chrismasterjohnphd.substack.com/p/whats-wrong-with-jordan-petersons", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Jordan Peterson&#8217;s health has been suffering tremendously. Mikhaila, his daughter, saw that what was ailing him was affecting so many systems of his body that it had to all be connected and began to wonder if it was a form of mitochondrial dysfunction. In trying to research whether mitochondrial dysfunction could be driven by the turning points in his health problems like SSRI withdrawal, benzodiazepine withdrawal, and toxic mold, she found my work and reached out to me. This is the conversation that we had: My hypothesis is as follows. Mikhaila shares half of Jordan&#8217;s genes and has been more detailed about her own health journey going back to childhood, so we start with her. She had juvenile arthritis symptoms starting at 2 and a diagnosis at 7. She went on Enbrel, a &#8220;biologic&#8221; (a pseudoscientific regulatory term) that opposes the action of the inflammatory mediator tumor necrosis alpha (TNF-alpha); and on methotrexate, which inhibits folate and adenosine metabolism. Methotrexate raises adenosine, which inhibits T cell proliferation. Its inhibition of folate metabolism is thought to be more relevant to cancer but its adenosine-mediated inhibition of T cell proliferation is thought to be more relevant to autoimmune arthritis. The next year, at age 8, she was diagnosed with depression and put on SSRIs. My hypothesis is that she has an underlying block in mitochondrial metabolism leading to CoA sequestration, which occurs when CoA-requiring pathways fail to complete properly. This leads to secretion of TNF-alpha as part of a cellular stress response. TNF-alpha serves to increase carnitine transport into the cell. The carnitine then trades places with CoA, detoxifying the metabolic intermediates and carrying them out into the urine, allowing CoA metabolism to continue. Blocking the TNF-alpha is a double-edged sword. On the one hand, the elevated TNF-alpha will interact with genetic predispositions to certain types of immune dysfunction and with s", "category": "fitness"}, {"title": "Anger: A Good or an Evil?", "url": "https://thomisticinstitute.substack.com/p/anger-a-good-or-an-evil", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Bernardino Mei, &#8220;Christ Cleansing the Temple,&#8221; 1655, via WikiMedia Commons. What is anger? Scripture seems to suggest that anger is an evil. For instance, we read, &#8220;Whoever is angry with his brother shall be liable to judgment&#8221; (Mt 5:22), and &#8220;Now put them all away: anger, wrath, malice, slander, and foul talk from your mouth&#8221; (Col 3:8). But St. Thomas Aquinas clarifies that &#8220;to be angry is not always an evil. &#8221; To explain, Thomas borrows the words of St. John Chrysostom: A man who is angry without cause is guilty, but not he that is angry with cause, for without anger sound doctrine would not be advanced or good judgment maintained or crime put down. &#8220;Anger&#8221; names a passion and a vice. The passion of anger is good in itself, but it can be excessive or deficient. When it is had with the right intensity for the right length of time, it is virtuous. Otherwise, it is disordered. The vice of anger is a stable disposition to have the passion of anger in excess. All vices are defects of moral character from which sinful actions flow. The passions work together with the will, which works together with the intellect. You can think of the intellect like a lame man, the will like a blind man who is carrying the lame man, and the passions like dogs leashed to the blind man&#8217;s belt. The intellect sees but cannot move; it relies on the will to move. The will moves, but it cannot see; it relies on intellect to see. And the passions make movement easier or harder. When the passions are well-trained, they are like well-trained dogs that can make walking up a steep hill effortless. Conversely, when they are disobedient, they can pull you to the ground. Following Aristotle, Aquinas teaches that the reason has political, not despotic, rule over the passions. This explains why you can know what the right action is (with your intellect) and want to perform the right ac", "category": "teologia"}, {"title": "Thomas Aquinas on Meekness", "url": "https://thomisticinstitute.substack.com/p/thomas-aquinas-on-meekness", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Thomas Aquinas on Meekness Nowadays, the concept of meekness gets a bad rap. As I&#8217;ve argued elsewhere , though, meekness, far from being a weakness, is a character strength . In this post, I say a bit about why that is, and how St. Thomas Aquinas understood the undersung virtue of meekness. Let me start with a few illustrations, priming your pump. You no doubt know people whose anger is a liability. Maybe you&#8217;ve coached a player who, when enticed, would commit a technical or unsportsmanlike penalty. Maybe you remember how you could turn the tide of any argument with a sibling by baiting her into rash overreactions. You could have a hotheaded friend that you are apprehensive of going out with, for fear that he&#8217;ll challenge the whole bar to a fight. Or maybe you&#8217;ve watched a student enrage a flustered teacher to the point where she screams, much to the delight of a filming co-conspirator. In each of these four cases, there&#8217;s a shared liability: anger gets the best of the player, sibling, friend, and teacher. An engrained disposition to be overtaken by anger is an unbecoming feature. The other team, if they know his predilections, will try to exploit those liabilities. Even if he is the best at his position, his coach might still bench him, for fear that his wrath will cost them the game. And while you can&#8217;t quite bench a friend, you might forget to invite him out if you want a peaceful night. Nobody wants a wildcard. It is no doubt because of the moral liabilities that come with unchecked anger that scripture says, &#8220;He who is slow to anger is better than the mighty, and he who rules his spirit than he who takes a city&#8221; (Proverbs 16:32). A penchant to excessive anger is a danger, not something we want in ourselves or those we love. Remember that Cain, before slaying his brother, was described as &#8220;very angry&#8221; (Genesis 4:5). Peter Paul Rubens, &#8220;Cain slaying Abel,&#8220; 1608-1609. via Wikimedia Commons At ", "category": "teologia"}, {"title": "Is Being an Expert a Virtue?", "url": "https://thomisticinstitute.substack.com/p/is-being-an-expert-a-virtue", "date": "2026-08-23T05:01:08.053541+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Maes, &#8220;The Lacemaker',&#8221; 1656 via Wikimedia Commons . Gregory House, the protagonist of the medical drama series House, is an exceptionally competent physician. This competence comes from his unparalleled expertise in anatomy, physiology, pathology, and psychology. And yet, across multiple seasons, Dr. House also displays deep flaws: abusing drugs, manipulating patients and colleagues, and otherwise routinely making questionable choices. Our culture often celebrates such controversial figures and lionizes &#8216;experts,&#8217; but is this how we should value such characters, real or fictional? Is this excellence the same as what has classically been called practical wisdom? For many virtue scholars, practical wisdom, sometimes called prudence or phronesis, is central and essential. Aristotle and Aquinas argue that practical wisdom is right reason (and capacity) with regard to means . Put simply, those with practical wisdom have the know-how to get things done, as Dr. House does in practicing medicine. More broadly, however, true prudence, or phronesis, facilitates living a good human life. What is expertise? Many psychologists&#8212;myself included&#8212;think about such right reason and capacity in terms of &#8220;expertise.&#8221; In fact, prudence and expertise are so closely intertwined that some philosophers, especially Matt Stichter , take expertise as a model for understanding virtue. Experts are able to apply their particular skills to various tasks, demonstrating a sort of prudence in handling challenges within their domain. Expertise, as psychologists understand it, has a number of facets. One key distinction is between routine expertise (easily completing repetitive tasks) and adaptive expertise (innovatively responding to various situations). Philosophers would generally not call routine expertise virtuous in any strong sense. This is because it is largely automatic and not deliberate. Being capable of completing a repetitive task quickly and", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:13px;color:#374151;margin-top:8px;line-height:1.75;border-left:3px solid #e5e7eb;padding-left:10px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div class="flex items-start justify-between gap-2"><div class="flex-1 min-w-0"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><h3 class="font-semibold text-gray-900 text-sm leading-snug mt-2">${item.title}</h3><p class="text-xs text-gray-400 mt-1">${new Date(item.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div><a href="${item.url}" target="_blank" rel="noopener" class="shrink-0 text-xs bg-gray-900 text-white px-3 py-1.5 rounded-lg font-medium hover:bg-gray-700 mt-0.5 ml-2">Read →</a></div></div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
