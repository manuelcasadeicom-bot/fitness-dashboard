<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 27 Aug 2026 — 16:53 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "The Emotions of Fortitude", "url": "https://thomisticinstitute.substack.com/p/the-emotions-of-fortitude", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Giordano, &#8220;Allegory of Prudence, 1682, via Wikimedia Commons. What is Fortitude? Fortitude, or courage, is a virtue that enables us to face significant threats and overcome significant obstacles to our good. A common supposed image of fortitude today might involve a fearless superhero in the face of a foe or a fearful but determined soldier in the face of the enemy. But we cannot tell simply from what a person does whether he or she acts with fortitude. In fact, the superhero may not have fortitude at all while the soldier may. The reason is that fortitude requires fear. This may surprise you given it is common today for fearlessness to be held up as the ideal in facing danger. But St. Thomas knows better. Fortitude, in its primary sense, involves facing threats that may result in our death or serious injury. Fear is a natural response when facing the greatest threats to our life or what we love most. Fortitude controls and harnesses fear, and other emotions as well, to face the threats. These other emotions are hope and daring . For Aquinas, fear and daring are contrary emotions. This means that we cannot have them at the same time regarding the same object. This raises a puzzle. How can a single virtue require two contrary emotions? Isn&#8217;t that impossible? Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts in your inbox every Monday. Fortitude and the Stages of a Prudent Human Act To answer this question, and to show the place of the emotion of hope as well, we&#8217;ve got to think about human action. In his discussion of prudence , St. Thomas writes, Prudence is right reason applied to action , as stated above (A. 2).", "category": "teologia"}, {"title": "Anger: A Good or an Evil?", "url": "https://thomisticinstitute.substack.com/p/anger-a-good-or-an-evil", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Bernardino Mei, &#8220;Christ Cleansing the Temple,&#8221; 1655, via WikiMedia Commons. What is anger? Scripture seems to suggest that anger is an evil. For instance, we read, &#8220;Whoever is angry with his brother shall be liable to judgment&#8221; (Mt 5:22), and &#8220;Now put them all away: anger, wrath, malice, slander, and foul talk from your mouth&#8221; (Col 3:8). But St. Thomas Aquinas clarifies that &#8220;to be angry is not always an evil. &#8221; To explain, Thomas borrows the words of St. John Chrysostom: A man who is angry without cause is guilty, but not he that is angry with cause, for without anger sound doctrine would not be advanced or good judgment maintained or crime put down. &#8220;Anger&#8221; names a passion and a vice. The passion of anger is good in itself, but it can be excessive or deficient. When it is had with the right intensity for the right length of time, it is virtuous. Otherwise, it is disordered. The vice of anger is a stable disposition to have the passion of anger in excess. All vices are defects of moral character from which sinful actions flow. The passions work together with the will, which works together with the intellect. You can think of the intellect like a lame man, the will like a blind man who is carrying the lame man, and the passions like dogs leashed to the blind man&#8217;s belt. The intellect sees but cannot move; it relies on the will to move. The will moves, but it cannot see; it relies on intellect to see. And the passions make movement easier or harder. When the passions are well-trained, they are like well-trained dogs that can make walking up a steep hill effortless. Conversely, when they are disobedient, they can pull you to the ground.", "category": "teologia"}, {"title": "Thomas Aquinas on Meekness", "url": "https://thomisticinstitute.substack.com/p/thomas-aquinas-on-meekness", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Thomas Aquinas on Meekness Nowadays, the concept of meekness gets a bad rap. As I&#8217;ve argued elsewhere , though, meekness, far from being a weakness, is a character strength . In this post, I say a bit about why that is, and how St. Thomas Aquinas understood the undersung virtue of meekness. Let me start with a few illustrations, priming your pump. You no doubt know people whose anger is a liability. Maybe you&#8217;ve coached a player who, when enticed, would commit a technical or unsportsmanlike penalty. Maybe you remember how you could turn the tide of any argument with a sibling by baiting her into rash overreactions. You could have a hotheaded friend that you are apprehensive of going out with, for fear that he&#8217;ll challenge the whole bar to a fight. Or maybe you&#8217;ve watched a student enrage a flustered teacher to the point where she screams, much to the delight of a filming co-conspirator. In each of these four cases, there&#8217;s a shared liability: anger gets the best of the player, sibling, friend, and teacher. An engrained disposition to be overtaken by anger is an unbecoming feature. The other team, if they know his predilections, will try to exploit those liabilities. Even if he is the best at his position, his coach might still bench him, for fear that his wrath will cost them the game. And while you can&#8217;t quite bench a friend, you might forget to invite him out if you want a peaceful night. Nobody wants a wildcard. It is no doubt because of the moral liabilities that come with unchecked anger that scripture says, &#8220;He who is slow to anger is better than the mighty, and he who rules his spirit than he who takes a city&#8221; (Proverbs 16:32).", "category": "teologia"}, {"title": "How To Pick Your Protein (MD PhD Explains)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-pick-your-protein-md-phd-explains", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "If you spend a decent amount of time in the corners of nutrition social media, you&#8217;ll hear a multitude of opinions about how to pick your protein. What&#8217;s the real difference between grass-fed and grass-and-grain-fed beef? Wild salmon versus farmed salmon? What about pollutants? Pasture-raised eggs versus free-range eggs versus organic eggs? And are sardines really loaded with heavy metals? Today, my goal is simple: to tell you what I look for, what I care about, and how I make my choices in the grocery store. Think of this letter as a practical reference guide. Like some good biltong, it&#8217;s going to be a little drier than our usual StayCurious Metabolism fare, but I hope it serves as a useful resource for those of you who want to make informed decisions when it comes to picking your protein. And I apologize in advance, but there will be no discussion of tofu. Premium subscribers get full access to my deep dives into cutting-edge metabolic research for less than $1/letter, 3 per week. You&#8217;ll always walk away with at least one new insight about metabolic health. Today&#8217;s letter is a special for StayCurious Metabolism premium members. We&#8217;ll dive specifically into: Beef : what actually matters&#8230; and what doesn&#8217;t. Eggs and their many confusing labels , along with some important nuances that most people never discuss. Poultry , including the nuances of methionine and glycine ratios. Seafood , from heavy metals and contaminants to my new favorite canned item (not sardines). Dairy , including fermented dairy products and the casein debate. Along the way, I&#8217;ll share some fun facts, personal favorites, and practical takeaways.", "category": "fitness"}, {"title": "I Compared Every Popular Caffeine Source – Here's What I Learned", "url": "https://staycuriousmetabolism.substack.com/p/i-compared-every-popular-caffeine", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "If I gave you 100 mg of caffeine&#8230; and then I gave you another 100 mg of caffeine, and then another... you&#8217;d think they&#8217;d feel the same, right? But they don&#8217;t. Coffee can make some people laser-focused and productive. Green tea can feel calm and almost meditative. Yerba mate has developed a cult following among entrepreneurs who swear it gives them energy without the crash. And somehow, dark chocolate contains caffeine too&#8212;yet nobody eats a square of chocolate and feels like they just drank an espresso. So, what&#8217;s going on? It turns out that the source of your caffeine matters at much, or more, than amount of caffeine itself. So the question is: Why do different caffeinated drinks feel so different if they&#8217;re all delivering the same drug? The Caffeine Entourage Let&#8217;s start with the concept that ties it all together. In pharmacology, there&#8217;s a concept sometimes called the &#8220;entourage effect&#8221; &#8212; the idea that a bioactive compound doesn&#8217;t act in isolation. Its effects are shaped by the other molecules traveling alongside it. Think of caffeine as a lead singer. Talented, yes. But the final product depends entirely on the band behind them. The &#8220;band members&#8221; are molecules like L-theanine, theobromine, theophylline, chlorogenic acids, catechins, and tannins. Each caffeine source packages a unique combination of these compounds &#8212; the &#8220; entourage &#8221; &#8212; and that combination determines the whole experience. So, if I give you 100 mg of caffeine from different sources, you won&#8217;t have the same experience. And, once you understand the underlying biology, you can start matching your caffeine source to your goal.", "category": "fitness"}, {"title": "My Journey from Harvard Medical School to Social Media", "url": "https://staycuriousmetabolism.substack.com/p/my-journey-from-harvard-medical-school", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Just as my life was beginning to show promise on paper, I hit my lowest point. I was 22 years old, living in a new country for the first time, and sicker than I&#8217;d ever been. I spent days in the hospital, in intensive care and even palliative care, while my peers at Oxford were in the lab or at social gatherings. What put me in that hospital bed was a case of inflammatory bowel disease that a laundry list of medications had been unable to keep at bay. As a result, the promise my life seemed to hold on paper, including my scholarship to Oxford for my PhD and a position at Harvard Medical School thereafter, felt like empty promises. They were opportunities I wanted to pursue, but my health was standing in the way. It&#8217;s ironic, that tension. Maybe you see it. I was on a path to devote my life to the exact sort of academic medicine that&#8217;s supposed to generate solutions for patients like me. Solutions that were insufficient to solve my own problems. But now, looking back more than 8 years later, I see that chapter of my life as a tremendous gift. It&#8217;s the reason that after I eventually completed my PhD and then medical school, I pivoted off the standard path and went from Harvard straight to social media&#8230; Now, when you put it like that, it sounds like a cop-out, like I&#8217;m quitting or somehow selling out. But I frame it that way intentionally because, even as I was doing it, I was keenly aware that&#8217;s exactly how many people in my social circles, even my family, would see it. I&#8217;d invested my entire life in an education that was fiercely focused on a goal: becoming a respected physician-scientist, a practicing clinician, someone who secured major grants, ran a lab, and taught at top academic medical centers.", "category": "fitness"}, {"title": "Jim Kwik: Your Brain Has a Savings Account. You're Probably Draining It.", "url": "https://neuroathletics.substack.com/p/jim-kwik-your-brain-has-a-savings", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, Jim Kwik was called &#8220;the boy with the broken brain&#8221; by a teacher, out loud, when he was nine. A brain injury at five left him years behind. He&#8217;s now the brain coach Hollywood actors and CEOs hire to think faster. So when he talks about what a brain can rebuild, I listen. We met to talk about AI. But the thing I keep coming back to is simpler, and it&#8217;s the most useful way to think about your brain I&#8217;ve heard in a long time. He calls cognitive reserve a savings account. It&#8217;s real neuroscience, and it&#8217;s why two people can have the same Alzheimer&#8217;s pathology in their brains while one loses their memory and the other stays sharp at 90. The reserve is the buffer. You spend a lifetime building the balance, and it&#8217;s what protects you when things start to go wrong underneath. Every day, you either make a deposit or take a withdrawal. The withdrawals are the ones you already suspect: bad sleep, chronic stress, sitting all day, processed food. But Jim named a new one. Every time you let a machine do your thinking, that&#8217;s a withdrawal. He pointed to an MIT study where people wrote essays with ChatGPT, with Google, or with just their heads. The AI group had the least brain engagement and barely remembered what they&#8217;d written. His line: you don&#8217;t go to the gym and have someone lift the weights for you. But that&#8217;s what we&#8217;re doing with our minds all day. The deposits are small, free, and completely in your hands. This is the part your evening is made of: Read the actual book, not the AI summary. Do the tip math in your head. Kill the calculator for small stuff. Sit in a boring moment instead of grabbing your phone.", "category": "fitness"}, {"title": "This Billionaire is Obsessed with his Health", "url": "https://neuroathletics.substack.com/p/this-billionaire-is-obsessed-with", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I just spent an hour with Keith Rabois , and I have not stopped thinking about how he lives. If you don&#8217;t know the name, he&#8217;s one of the most successful investors of the last twenty years, an early force behind PayPal, Square, and DoorDash. He has more money than he could spend in a lifetime. And he treats his own body with the seriousness of a professional athlete in season. He has not missed more than a handful of workouts in seven years, and the ones he did miss still visibly bother him. He tracks every session. He treats training like brushing his teeth, non-negotiable, not up for debate on any given morning, because he&#8217;s figured out that the moment it becomes optional once, it becomes optional forever. Here&#8217;s the thing I&#8217;ve noticed, and Keith is just the latest example. The most successful people I meet, the investors, the founders, the ones operating at the very top of brutally competitive fields, almost all treat their bodies like elite athletes treat theirs. It&#8217;s one of the most consistent patterns I&#8217;ve seen in this work, and I don&#8217;t think it&#8217;s a coincidence. I want to talk about why, because it changes how you might think about your own health. They stopped separating the body from the mind For most of us, health lives in one box and work lives in another. You go to the gym to look better or to feel less guilty, and then you go do your actual job, which happens in your head. The people at the top don&#8217;t think that way. They&#8217;ve collapsed the two. They train their bodies because it&#8217;s how they protect their minds, their focus, their decision-making, their stamina over a very long career.", "category": "fitness"}, {"title": "The 100-Year-Olds Whose Brains Were Full of Alzheimer's. And Who Kept Their Minds Anyway.", "url": "https://neuroathletics.substack.com/p/the-100-year-olds-whose-brains-were", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I want to tell you about a group of people who, by the rules we thought we understood, should not exist. They lived past 100. When they died and their brains were examined, they were full of amyloid plaques and tau tangles, the physical hallmarks of Alzheimer&#8217;s disease. The same wreckage found in the brains of people who lost everything to this disease at 70. And yet these centenarians died sharp. They knew their families. They finished their sentences. They carried the disease in their tissue and never once carried it in their minds. I read brain scans for a living. I am a neurophysiologist, and my entire career has been spent on this one disease, on why it takes so many women, and on the question of who escapes it. So for years I have been telling you, on the podcast and in these letters, probably more often than you want to hear it: having the pathology is not the same as having the disease. Plaques in your brain do not sentence you to dementia. I believed that because the data kept pointing there. But I could never tell you why it was true. There is a difference between a pattern you can see and a mechanism you can explain, and until this summer, this was only a pattern. Then a team in Belgium explained it Subscribe now They stopped looking at the plaques For forty years, the entire field has been transfixed by the plaques. Count them, clear them, attack them. The most expensive Alzheimer&#8217;s drugs on the market right now exist to scrub amyloid out of the brain, at great cost and real risk, for modest benefit. Researchers at VIB-KU Leuven, with the UK Dementia Research Institute and Muna Therapeutics, did something different.", "category": "fitness"}, {"title": "Natural Alternatives to Benzodiazepines", "url": "https://chrismasterjohnphd.substack.com/p/natural-alternatives-to-benzodiazepines", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Benzodiazepines are marketed (informally) as &#8220;psych meds&#8221; as if they primarily act on anxiety and stimulation circuits in the brain, but there is no such thing as a &#8220;psych med&#8221; because there are no targets that are only found in the brain and because there are no drugs that when taken orally primarily go to the brain. They have the highest relative uptake into the adrenal gland and they have the highest absolute uptake into muscle and fat. They probably act on GABA receptors found widely outside of the nervous system. While they are not active on the unique GABA receptors in the liver, they are probably active at GABA receptors on the lungs, kidneys, immune cells, reproductive organs, and pancreas. GABA itself regulates mitochondrial metabolism indirectly, but benzodiazepines have two independent mitochondrial targets that lie directly in the mitochondrial membrane and are unrelated to their actions on GABA receptors. There is no evidence that benzos are more powerful regulators of GABA metabolism than of mitochondrial metabolism. In fact, their solubility in fat and cell membranes might make them much more efficient at accessing their mitochondrial targets than at accessing GABA receptors. Like SSRIs , benzos are whole-body mitochondrial drugs. As with SSRIs, benzos are playing with mitochondrial fire. These claims are supported by the evidence and arguments found in the first installment of this series: People who use benzos have 60% greater mortality per unit time than people who don&#8217;t, but people who quit them have 60% greater mortality per unit time than people who stay on them. We cannot say whether these trends represent causation.", "category": "fitness"}, {"title": "Massie is a Real-Food Hero", "url": "https://chrismasterjohnphd.substack.com/p/massie-is-a-real-food-hero", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Some $15 million are being spent to oust Thomas Massie today , and no one in congress is more close to those of us in the real food movement than this man. Thomas Massie and me on October 26, 2024 at Wise Traditions, the annual conference of the Weston A. Price Foundation, where he gave the keynote. Massie himself is a grass-fed off-the-grid farmer. My friend John Moody profiled his farm here. The farm is powered by solar panels and Tesla batteries with a house the Massie family built themselves out of logs they cut from their own woods and with stone they quarried from their own land. The home is heated from the same wood, and water comes from a well that Massie dug by hand with his neighbor. They grow peaches and apple trees, raise pastured chickens with an automatic tractor, and raise grass-fed cattle. Massie once admitted to Moody he used Google Maps to spy on Joel Salatin to get new ideas for his farm. No one paid me to write this. Massie has never given me any money but I have donated to his campaign. Massie originated and championed the Processing Revival and Intrastate Meat Exemption &#8220;PRIME&#8221; Act. Crafted by the Farm-to-Consumer Legal Defense Fund, in turn founded by Sally Fallon Morell of the Weston A. Price Foundation and others, this act is meant to remove the USDA as an impediment to small farmers. Small, locally run custom slaughterhouses are all over the place in the United States. USDA slaughterhouses are vanishingly rare and often at great distances away from farmers. The custom slaughterhouses are used by homesteaders and hunters who eat their own meat.", "category": "fitness"}, {"title": "What's Wrong With Jordan Peterson's Health?", "url": "https://chrismasterjohnphd.substack.com/p/whats-wrong-with-jordan-petersons", "date": "2026-08-27T16:53:27.284334+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Jordan Peterson&#8217;s health has been suffering tremendously. Mikhaila, his daughter, saw that what was ailing him was affecting so many systems of his body that it had to all be connected and began to wonder if it was a form of mitochondrial dysfunction. In trying to research whether mitochondrial dysfunction could be driven by the turning points in his health problems like SSRI withdrawal, benzodiazepine withdrawal, and toxic mold, she found my work and reached out to me. This is the conversation that we had: My hypothesis is as follows. Mikhaila shares half of Jordan&#8217;s genes and has been more detailed about her own health journey going back to childhood, so we start with her. She had juvenile arthritis symptoms starting at 2 and a diagnosis at 7. She went on Enbrel, a &#8220;biologic&#8221; (a pseudoscientific regulatory term) that opposes the action of the inflammatory mediator tumor necrosis alpha (TNF-alpha); and on methotrexate, which inhibits folate and adenosine metabolism. Methotrexate raises adenosine, which inhibits T cell proliferation. Its inhibition of folate metabolism is thought to be more relevant to cancer but its adenosine-mediated inhibition of T cell proliferation is thought to be more relevant to autoimmune arthritis. The next year, at age 8, she was diagnosed with depression and put on SSRIs. My hypothesis is that she has an underlying block in mitochondrial metabolism leading to CoA sequestration, which occurs when CoA-requiring pathways fail to complete properly. This leads to secretion of TNF-alpha as part of a cellular stress response. TNF-alpha serves to increase carnitine transport into the cell.", "category": "fitness"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
