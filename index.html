<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 01 Oct 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "The Soul of Goodness", "url": "https://thomisticinstitute.substack.com/p/the-soul-of-goodness", "date": "2026-10-01T05:01:20.344294+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Peter Vilhelm Ilsted, &#8220;A Mother and Child in an interior,&#8221; 1898, via Wikimedia Commons. The Difficulty of Virtue In his Nicomachean Ethics , in a sentence filled with insight, both anthropological and psychological, Aristotle observes, &#8220;Anyone can get angry, that is easy&#8230; but to be so with the right person, to the right extent, at the right time, with the right motive, and in the right way, that is not for everyone, nor is it easy; wherefore goodness is both rare and laudable and noble.&#8221; 1 In effect, Aristotle is saying that human nature is wild and passionate, and that this natural wildness is essentially good inasmuch as it is an innate principle of actions that are themselves good, at least to the extent they can achieve goodness. However, he is also saying that our wild and passionate nature requires further formation if it is to become altogether good&#8212;&#8220;laudable and noble&#8221;&#8212;but that such formation in goodness, however dearly needed, is nevertheless terribly rare. It is so rare precisely because of the difficulty of bringing this formation to completion. This is in fact the principal positive difficulty of human life&#8212;the entirely natural challenge with which we are tasked as we proceed toward the future. It is the difficulty of receiving the gift of the goodness of our nature while simultaneously taking responsibility for the proper maturation of this nature&#8212;all so that our nature might attain its proper completion in our individual lives. This difficulty has a name; its name is virtue&#8212;for virtue is the immediate goal of this tough process of formation. Yet, while difficult, this task is most certainly worth the effort.", "category": "teologia"}, {"title": "The Art of Being Good", "url": "https://thomisticinstitute.substack.com/p/the-art-of-being-good", "date": "2026-10-01T05:01:20.344294+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Winslow Homer, &#8220;Snap the Whip,&#8221; 1872, via Wikimedia Commons . The Need for Cultivation I spent the morning watching our seven-month-old as he attempted to conquer the world&#8212;his bright eyes surveying with rapt attention, wonder exuding from every pore, muscles taut in exploration and discovery&#8212;everything in him reaching for understanding and achievement, striving toward truth and goodness. Watching our little boy, I was again reminded that our greatest drive&#8212;one might even say our primal instinct&#8212;is this inner impulsion toward truth and goodness. This powerful drive is evidently a most important feature of human life, perhaps the most important, and everything in our little boy strains forward as a result of its powerful thrust. But this drive is also wild . Wild, not in the sense of chaotic and messy, and therefore problematic, but in the entirely natural sense of not-yet-gardened. It is the wild of nature before the activity of a gardener, bold and intense, fierce and powerful&#8212;yet also good, with a goodness that is in need only of our intervention to bring it home. In the same way as the wilds of nature need a gardener to flourish, so too this interior drive requires our cultivation if it is to take its proper shape. The reason for this is found in the fact that God does not create the human (or indeed, anything) &#8220;fully made,&#8221; but rather furnishes us with an aptitude to develop over the course of time&#8212;and thereby gradually attain our natural perfection. From this we see that from the outset of our lives we are established in the privileged position of being collaborators with God in our own creation, for, as St. Thomas notes, &#8220;the dignity of causality is imparted even to creatures&#8221; by God.", "category": "teologia"}, {"title": "Sobriety and Conceptual Shifts", "url": "https://thomisticinstitute.substack.com/p/sobriety-and-conceptual-shifts", "date": "2026-10-01T05:01:20.344294+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Caravaggio, &#8220;Bacchus,&#8221; 1596, via Wikimedia Commons. What Does it Mean to be &#8220;Sober&#8221;? Language shifts. Sometimes the change leaves a gaping void in our ability to understand the world and our place in it. Consider, for instance, the virtue term &#8216;sober.&#8217; When you hear that word, what do you envision? You might say someone is sober when you mean that he isn&#8217;t currently drunk. Or maybe you thought that someone is sober in the sense of having &#8216;sobered up,&#8217; having formed a stable disposition not to partake at all in the relevant intoxicant. Sometimes such people live in a &#8220;sober house.&#8221; Or, third, you might think of someone as sober when he is solemn, mature, not prone to frivolity. Gimli the dwarf of the Lord of the Rings books&#8212;but not the movies, where he is played for comic effect&#8212;is sober. The first usage&#8212; &#8216;sober&#8217; as not currently drunk&#8212;names a present state, not a stable trait. Habitual drunkards can be sober in that first sense. Of the latter two, it is only the middle that deals with intoxicants, and so only the middle that stands a chance to be the virtue of sobriety. But importantly, that second use of the term&#8212;having a stable disposition not to partake in the relevant intoxicant at all &#8212;does not express the traditional virtue of sobriety. Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts every Monday. Sobriety in the Traditional Sense To be sober , in the traditional sense, is to be a person stably disposed to partake of intoxicants in the right measure, for the right reasons, in the right occasions.", "category": "teologia"}, {"title": "Your GLP-1 Might Be Turning “ON” Hunger Neurons", "url": "https://staycuriousmetabolism.substack.com/p/glp-1-drugs-turn-on-hunger-neurons", "date": "2026-10-01T05:01:20.344294+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "This might be one of the strangest findings on GLP-1 weight-loss drugs I&#8217;ve come across this year. Researchers were studying neurons in the brain that are known to drive hunger. So, you&#8217;d expect drugs like semaglutide (Ozempic) to decrease the activity of these cells. Instead, they found the opposite. GLP-1 receptor agonists activated these hunger neurons. You read that right: a drug famous for reducing appetite appeared to switch on the very neurons that drive hunger. Bizarre. Completely paradoxical. What are we missing? And what does this mean if you&#8217;re taking a GLP-1? Let&#8217;s dive into the science. The Hunger Neurons with a Funny Name First, some quick background. Deep in your brain, nestled in a region called the hypothalamus, sits a cluster of neurons known as AgRP neurons . These cells are your brain&#8217;s hunger alarm system. When your energy stores drop or when you skip a meal (if you&#8217;re not used to fasting), AgRP neurons fire up. They drive you to seek food. So, the conventional logic goes: If GLP-1 receptor agonists suppress appetite and cause weight loss, they should suppress AgRP neurons. These are hunger cells. The drug kills hunger. So, no duh. Except... that&#8217;s not what happened. A new study published in PNAS out of Yale tested this assumption directly. And the results flipped the script. AgRP neurons weren&#8217;t suppressed by semaglutide. They were activated by it. What&#8217;s more, these neurons were required for the drug&#8217;s full weight-lowering effect. But let&#8217;s walk through some of the data. What Happens When You Disable the &#8220;Hunger Neurons?&#8221; The researchers used a clever genetic model. They bred mice in which AgRP neurons were functionally impaired.", "category": "fitness"}, {"title": "Why You Can't Focus", "url": "https://staycuriousmetabolism.substack.com/p/why-you-cant-focus", "date": "2026-10-01T05:01:20.344294+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Have you ever had one of those days when you just can&#8217;t seem to focus? Maybe you didn&#8217;t sleep particularly well the night before. You sit down to write, read, build a presentation, or tackle an important project, and your mind immediately starts wandering. You check your phone. Scroll Instagram. Open YouTube. Click from one video to the next. You realize you can&#8217;t even stay focused on a single video for more than a few minutes before feeling the urge to switch to something else. You&#8217;re frustrated at yourself for it, but you indulge anyway as the minutes and hours pass by. I know I&#8217;ve had days like that. And, like many of us, for me they seem to appear out of nowhere, like a jack-in-the-box, and they absolutely destroy productivity. Problems with focus in the modern world aren&#8217;t rare. In fact, they&#8217;re so common that many of us jokingly say something like &#8220; my ADHD is acting up &#8221; whenever we find ourselves unable to concentrate. But here&#8217;s the surprising thing: we may be stumbling onto something real. A fascinating study published in Cell suggests that at least some cases framed as attention problems and ADHD may actually reflect an underlying sleep problem in disguise. Now, to be clear, this doesn&#8217;t mean ADHD isn&#8217;t real. But the findings raise a provocative possibility: What if, in some people, the root cause of &#8220;attention problems&#8221; isn&#8217;t primarily attention at all? Today, I want to walk you through the data and the newly discovered brain biology behind this idea.", "category": "fitness"}, {"title": "Do You Ever Feel Like Your Doctor Hates You?", "url": "https://staycuriousmetabolism.substack.com/p/do-you-ever-feel-like-your-doctor", "date": "2026-10-01T05:01:20.344294+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "There&#8217;s one phrase we learned in medical school that I absolutely hate: &#8220;If you hear hoofbeats, think horses, not zebras.&#8221; The idea is simple: the most common explanation is usually the correct diagnosis. That works great if you&#8217;re a horse. But if you&#8217;re a zebra, it sucks. Because when you don&#8217;t fit the usual pattern, you can get dismissed or misdiagnosed. And if you&#8217;re misdiagnosed, you can get mistreated. Unfortunately, I have a knack for being a zebra. But this thing is: I know some of you reading this are zebras, too. Maybe you&#8217;ve experienced symptoms your doctor couldn&#8217;t explain. Maybe you&#8217;ve received conflicting medical advice. Or maybe you&#8217;ve walked out of an appointment feeling confused, dismissed, or wondering whether there&#8217;s something important about your health that everyone is missing. I&#8217;ve been there. More than once. And through my own experiences navigating unusual medical conditions, I&#8217;ve learned something that I wish every patient understood: You have an enormous amount of power in solving your own health problems. And, there&#8217;s a way to do this without becoming your doctor&#8217;s worst nightmare. But first, let me tell you why I have a particular affinity for zebras. My First Zebra Experience When I was 18, for example, I developed osteoporosis . It wasn&#8217;t diagnosed until I was 20, and even then, I was given an explanation that didn&#8217;t make sense to me: relative energy deficiency in sport (RED-S). Effectively, I was told I wasn&#8217;t eating enough energy to support my activity. Even to my incompletely formed brain, that seemed like an unlikely explanation.", "category": "fitness"}, {"title": "Are you happier if you get more sunlight?", "url": "https://neuroathletics.substack.com/p/are-you-happier-if-you-get-more-sunlight", "date": "2026-10-01T05:01:20.344294+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A morning-light study caught my attention because of what improved&#8212;and what didn&#8217;t. Thirty-three university students felt less sleepy after a week of morning bright-light exposure. But their performance on attention and memory tests didn&#8217;t improve. That is an interesting result if, like me, you spend your working life asking what actually helps the brain. First, what did the study actually show? In the July 2026 preprint, participants completed one week using a 10,000-lux light device for 30 minutes each morning and another week under their usual lighting conditions. The order was randomized. During the bright-light week, they reported less daytime sleepiness, with the largest difference at midday. The researchers also reported improved Fitbit-estimated sleep efficiency and more consistent sleep duration. But the cognitive tests did not show improvement. This was a small, short study with no washout period between conditions, and it has not been certified by peer review. It cannot settle whether morning light improves cognition more broadly. It also tested a device, not a few minutes outdoors. My interpretation: encouraging findings for sleepiness and sleep patterns, without a demonstrated memory benefit in this experiment. I would happily take a less sleepy afternoon. I would just like us to describe it accurately. Why would light affect your brain in the first place? Your retina does more than help you see. It contains intrinsically photosensitive retinal ganglion cells , or ipRGCs. These cells detect light through a pigment called melanopsin , while also receiving input originating from rods and cones. Some send signals directly to the suprachiasmatic nucleus , or SCN, in the hypothalamus: your central circadian clock.", "category": "fitness"}, {"title": "You have health insurance. Why are you still fighting for care?", "url": "https://neuroathletics.substack.com/p/you-have-health-insurance-why-are", "date": "2026-10-01T05:01:20.344294+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A woman with breast cancer is under anesthesia. Her mastectomy has already begun. In another operating room, her reconstructive surgeon, Dr. Elisabeth Potter, is finishing a case when a nurse comes in with an unusual message: UnitedHealthcare is on the phone, and they need to speak to her right now . The call is about the woman currently undergoing surgery. The insurance company wants Potter to explain the patient&#8217;s diagnosis and justify why she needs to remain in the hospital overnight. The patient has breast cancer. She is already unconscious. Her surgery was authorized. Her physicians have determined the care she needs. And yet, in the middle of the operation, her surgeon is being asked to step away and defend it. Potter told me that in that moment she felt like she was having to &#8220;protect my patient from her insurance company.&#8221; The overnight stay was ultimately denied anyway, and the patient received a bill for $100,000 . After Potter spoke publicly about what happened and the story exploded online, she says the bill was erased. But that immediately raises a much more disturbing question: what happens to the patient whose doctor doesn&#8217;t have a viral video? Your nervous system needs inputs, too Taking an active role in your health also means paying attention to the stress you carry every day&#8212;and making room for recovery before you&#8217;re completely depleted. Between work, training, travel and caring for the people around you, &#8220;just relax&#8221; can feel like one more thing on an already unreasonable to-do list. That&#8217;s one of the reasons I&#8217;ve been using Nuropod .", "category": "fitness"}, {"title": "A study of 854 women found one hormone linked to lower levels of Alzheimer’s-related tau", "url": "https://neuroathletics.substack.com/p/a-study-of-854-women-found-one-hormone", "date": "2026-10-01T05:01:20.344294+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, For decades, we have spoken about menopause as though it happens below the neck: hot flashes, poor sleep and weaker bones. But estrogen loss reaches the brain&#8212;and ignoring that may be one of the greatest blind spots in women&#8217;s health. A new peer-reviewed study published in Alzheimer&#8217;s &amp; Dementia adds to the evidence that estrogen biology may be connected to one of the central processes underlying Alzheimer&#8217;s disease: the accumulation of tau. Researchers studied 854 female participants aged 50 and older from the European Prevention of Alzheimer&#8217;s Dementia Longitudinal Cohort. Their average age was approximately 65, and the group included cognitively healthy participants as well as people with mild cognitive impairment. Using a highly sensitive method called liquid chromatography-tandem mass spectrometry, the researchers measured two estrogens circulating in the blood: estradiol and estrone. They then compared those concentrations with three Alzheimer&#8217;s-related biomarkers measured in cerebrospinal fluid: Amyloid-beta 42, Phosphorylated tau 181 and Total tau. The clearest finding was this: higher circulating estradiol was associated with lower phosphorylated tau at baseline. The relationship was stronger in women who carried APOE4, the most important common genetic risk factor for late-onset Alzheimer&#8217;s disease. This matters because abnormal phosphorylation changes how tau behaves inside the brain. Tau can detach from the internal structure of neurons and eventually accumulate into the tangles associated with Alzheimer&#8217;s disease and neurodegeneration.", "category": "fitness"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
