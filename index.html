<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 14 Oct 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Di p. Basil Cole, O.P., e p. John Baptist Ku, O.P. Caravaggio, “La vocazione dei santi Pietro e Andrea”, 1603, tramite Wikimedia Commons. La questione della giustificazione La domanda: \"che cosa devo fare per essere salvato?\" è stata posta dal giovane ricco in Matteo 19:16 (e Marco 10:17), così come dal carceriere suicida in Atti 16:30. In risposta, Gesù e Paolo rispettivamente non dicono “niente, Dio farà tutto”. Gesù dice: “Osserva i comandamenti” e “vai, vendi ciò che possiedi... e vieni e seguimi” (19:17, 21). E Paolo dice: “credi nel Signore Gesù”. Ma questo significa che mi salvo, o che almeno incontro Dio a metà strada? No. Guadagnare la vita eterna è infinitamente al di sopra dei poteri naturali dell’uomo. Ma allora non ho alcuna parte nella mia salvezza? Al Giudizio Finale, Dio giudicherà se stesso poiché le mie azioni sono completamente irrilevanti per la salvezza? Anche se in realtà faccio cose malvagie, se non ho il libero arbitrio per scegliere il bene contro il male, sarò come un animale irrazionale che segue semplicemente il mio istinto. E anche se potremmo essere arrabbiati con una volpe che uccide le nostre galline, non incolpiamo la volpe come se stesse commettendo un peccato. Quindi, come dovremmo comprendere il fatto che siamo salvati dal peccato e giustificati da Dio? Fortunatamente san Tommaso d'Aquino affronta questo tema nella domanda 113 della prima parte della seconda parte della Summa Theologiae. Tommaso d'Aquino divide la Summa Theologiae in tre parti: (1) su Dio così come è in se stesso, (2) sul movimento delle creature razionali verso Dio e (3) su Cristo, la via dell'uomo per tornare a Dio. La seconda parte è a sua volta divisa in due parti: (1) sull’antropologia (natura e fine dell’uomo e virtù in generale) e (2) sulle virtù specifiche. Alla fine della prima sezione della seconda parte, l'Aquinate tratta della grazia, che negli articoli precedenti era solo implicita.", "category": "teologia"}, {"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-05T15:43:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Cos'è l'umiltà? Ora, l'umiltà rende l'uomo un buon soggetto ad ogni specie e in ogni materia; mentre ogni altra virtù ha questo effetto in qualche materia speciale. Dunque dopo le virtù teologali, dopo le virtù intellettuali che riguardano la stessa ragione, e dopo la giustizia, soprattutto quella legale, viene prima di tutte le altre l'umiltà. (ST.II-II.Q161.A5.C (grassetto aggiunto). Per apprezzare la grandezza dell'umiltà, si consideri che l'umiltà sta prima delle virtù cardinali della temperanza e della fortezza. Il loro status di virtù cardinali non le rende forse più grandi dell'umiltà? L'umiltà sta prima della magnanimità e della magnificenza. Come può essere che l'umile umiltà superi queste virtù di grandezza, una delle quali è addirittura chiamata la corona delle virtù? Per rispondere perché L'umiltà è così significativa, risponderemo prima: cos'è l'umiltà? L'umiltà riguarda l'aspirazione a grandi cose e ha tre elementi principali: un elemento di controllo, un elemento di conoscenza e un elemento di motivazione. L'umiltà è la virtù con cui controlliamo le nostre aspirazioni per tutto ciò che pensiamo ci rende più grandi conoscenza di sé, soprattutto per quanto riguarda le nostre carenze e limitazioni. Controlliamo le nostre aspirazioni per riverenza divina. Siamo motivati dalla riverenza divina ad agire umilmente, e questa motivazione ci guida a cercare il nostro giusto posto nella provvidenza di Dio. Analizziamo la grandezza dell'umiltà e questi tre elementi e vediamo perché l'umiltà è così significativa.", "category": "teologia"}, {"title": "The Soul of Goodness", "url": "https://thomisticinstitute.substack.com/p/the-soul-of-goodness", "date": "2026-09-28T14:50:46+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Peter Vilhelm Ilsted, “Una madre e un bambino in un interno”, 1898, tramite Wikimedia Commons. La difficoltà della virtù Nell'Etica Nicomachea, in una frase ricca di intuizioni sia antropologiche che psicologiche, Aristotele osserva: \"Chiunque può adirarsi, questo è facile... ma esserlo con la persona giusta, nella giusta misura, al momento giusto, con il motivo giusto e nel modo giusto, questo non è da tutti, né è facile; perciò la bontà è rara, lodevole e nobile\". 1 In effetti, Aristotele sta dicendo che la natura umana è selvaggia e passionale, e che questa natura selvaggia è essenzialmente buona in quanto è un principio innato di azioni che sono di per sé buone, almeno nella misura in cui possono raggiungere il bene. Tuttavia, sta anche dicendo che la nostra natura selvaggia e appassionata richiede un’ulteriore formazione se vuole diventare del tutto buona – “lodevole e nobile” – ma che tale formazione nella bontà, per quanto estremamente necessaria, è tuttavia terribilmente rara. È così raro proprio per la difficoltà di portare a compimento questa formazione. Questa è infatti la principale difficoltà positiva della vita umana, la sfida del tutto naturale che ci viene affidata mentre procediamo verso il futuro. È la difficoltà di ricevere il dono della bontà della nostra natura e allo stesso tempo assumersi la responsabilità della corretta maturazione di questa natura, tutto affinché la nostra natura possa raggiungere il suo adeguato completamento nelle nostre vite individuali. Questa difficoltà ha un nome; il suo nome è virtù, perché la virtù è la meta immediata di questo duro processo di formazione. Tuttavia, anche se difficile, questo compito vale sicuramente lo sforzo.", "category": "teologia"}, {"title": "Could You Live to 200? (Lessons From a Whale)", "url": "https://staycuriousmetabolism.substack.com/p/the-biology-of-living-forever", "date": "2026-10-13T11:04:24+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "E se uno dei più grandi segreti che prolungano la vita umana si nascondesse negli animali più grandi della Terra? È la balena della Groenlandia. Queste creature possono vivere 250 anni, il che significa che oggi esistono teste d'arco nate prima dell'invenzione della lampadina. Possono pesare più di 200.000 libbre e avere bocche abbastanza grandi da contenere un intero SUV. Ma non vi parlo di questa creatura straordinaria semplicemente per le sue immense dimensioni o per la sua incredibile longevità. Ve ne parlo a causa di un paradosso biologico che potrebbe aiutare a spiegare come mai viva così a lungo. Qualcosa a cui probabilmente non hai mai pensato. Qualcosa che potremmo usare. Queste balene dovrebbero essere piene di tumori. Ma non lo sono. Pensaci. Ogni volta che una cellula si divide, deve copiare il suo DNA. E ogni volta che il DNA viene copiato, c’è la possibilità di commettere un errore che alla fine potrebbe portare al cancro. Consideriamo ora che questa balena ha circa 1000 volte più cellule di un essere umano, e alcune di queste cellule si dividono per secoli. Più celle. Più divisioni cellulari. Maggiori opportunità per mutazioni che causano il cancro. Queste balene dovrebbero nuotare come tumori! Eppure sembrano straordinariamente resistenti al cancro. Allora qual è il loro segreto? E, cosa ancora più importante, potremmo sfruttare questo segreto per proteggerci dal cancro e persino estendere la durata della vita umana ben oltre ciò che attualmente immaginiamo possibile? Gli scienziati stanno cominciando a pensare che potremmo farlo.", "category": "fitness"}, {"title": "How To Destroy Visceral Fat (Proven in 4 RCTs)", "url": "https://staycuriousmetabolism.substack.com/p/the-definitive-guide-to-destroy-visceral", "date": "2026-10-11T11:02:03+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Puoi demolire drasticamente il tuo grasso viscerale nel giro di poche settimane. E puoi farlo senza tagliare le calorie. Te lo dimostrerò, attingendo da più studi randomizzati controllati su esseri umani e condividendo strumenti che puoi iniziare a utilizzare immediatamente. Ma prima di arrivare al “come fare”, dobbiamo determinare il “perché”. Perché vorresti eviscerare il grasso viscerale? Perché non tutto il grasso è uguale. Il grasso sottocutaneo (il tipo che si trova sotto la pelle) ha importanti funzioni fisiologiche. Fornisce isolamento e il mantenimento di una quantità modesta aiuta a sostenere la salute ormonale. Ma il grasso viscerale è diverso... Grasso viscerale e salute del cuore Il grasso viscerale circonda gli organi interni, rilascia molecole infiammatorie e aumenta il rischio di malattie cardiovascolari. Ad esempio, nello studio INTERHEART, che ha coinvolto circa 27.000 partecipanti in 52 paesi, gli individui nel quintile più alto del rapporto vita-fianchi (un proxy per il grasso viscerale) avevano 2,5 volte la probabilità di avere un attacco cardiaco rispetto a quelli nel quintile più basso. È importante sottolineare che questa associazione era sostanzialmente più forte di quella osservata con il BMI, evidenziando che il luogo in cui si immagazzina il grasso è più importante per il rischio cardiovascolare rispetto a quanto si pesa. Grasso viscerale e salute del cervello Un elevato grasso viscerale è anche fortemente legato al declino cognitivo e alla demenza. Una recente ricerca di Harvard suggerisce che maggiore è l’esposizione cumulativa al grasso viscerale, più velocemente il cervello si restringe con l’età. Quindi, il grasso viscerale non si limita ad espandere il girovita. Ridimensiona anche il tuo cervello. Parliamo di un pessimo accordo commerciale. Tra un attimo ci immergeremo nell'affascinante scienza che sta dietro a questo. Ma prima, ecco un'anteprima video di 41 secondi di ciò che stiamo per esplorare.", "category": "fitness"}, {"title": "What Should You Do When the Evidence Runs Out? (Short Read)", "url": "https://staycuriousmetabolism.substack.com/p/what-evidence-based-medicine-misses", "date": "2026-10-09T11:00:54+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Quando avevo 22 anni, la mia vita stava decollando e crollando allo stesso tempo. Stava “decollando” perché avevo raggiunto tutto ciò che volevo ottenere a livello accademico a quell’età. Mi ero appena laureato al college, mi ero trasferito a Oxford per completare il dottorato e mi ero assicurato un posto alla Harvard Medical School per completare successivamente il mio dottorato. Sono cresciuto in medicina. Entrambi i miei genitori erano medici-scienziati e questo percorso è sempre stato ciò che desideravo. Ma la mia vita si stava sgretolando anche perché, allo stesso tempo, lottavo con un caso debilitante di malattia infiammatoria intestinale. Invece di trascorrere le mie giornate in laboratorio, ero spesso in un letto d’ospedale. Le riacutizzazioni diventavano così gravi che richiedevo regolarmente un trattamento intensivo, e la malnutrizione era così profonda che a volte il mio cuore batteva forte anche intorno ai 20 anni. La promessa che avevo sulla carta era una promessa vuota perché la mia salute stava peggiorando. È un’ironia davvero oscura. Una famiglia di medici, un medico in formazione, tutte le risorse che si potevano avere, eppure la migliore medicina basata sull’evidenza non mi aiutava. Dopo alcuni anni, quando i farmaci hanno smesso di avere controllo sulla malattia e abbiamo iniziato a discutere su come sarebbe stata la vita senza colon, ho iniziato disperatamente a cercare soluzioni alternative. Volevo sapere se forse il cibo che mi passa ogni giorno nell'intestino avrebbe avuto qualche effetto sulla malattia del mio intestino. La risposta è arrivata in cinque parole concrete: “Non ci sono prove valide”. Non ci sono prove concrete che il cambiamento della dieta possa portare la mia malattia in remissione. Quando le prove finiscono Così, ho iniziato a raccogliere le mie prove, la forma più umile di prova: l'esperimento N=1. Ho iniziato a provare le cose da solo. Cose che, secondo gli standard convenzionali, sarebbero considerate marginali.", "category": "fitness"}, {"title": "At 50, Your Brain Starts Replacing its Own Immune Cells", "url": "https://neuroathletics.substack.com/p/when-does-brain-aging-start", "date": "2026-10-13T12:17:43+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, questo mese è uscito su Science uno studio che avrei inserito tra le cose più importanti pubblicate quest'anno sull'invecchiamento cerebrale, e non ho visto quasi nessuno parlarne. Hanno raccolto 40 cervelli umani di persone morte tra i vent'anni e i novant'anni. Il gruppo è stato costruito apposta: uomini e donne, distribuiti equamente in quattro fasce di età dai 20 ai 100 anni, quindi nessun segmento della vita era sovrarappresentato. Poi sono entrati nell'ippocampo, il centro della memoria e la prima regione che l'Alzheimer distrugge, e hanno letto le cellule una alla volta. La maggior parte degli studi sul cervello non possono farlo. Macinano i tessuti e misurano la media su milioni di cellule contemporaneamente, il che confonde i giovani con gli anziani e i sani con i malati. Questa squadra ha letto singole celle, circa 295.000. E in ognuno di essi non hanno solo registrato quali geni erano attivati. Hanno usato due tecniche sullo stesso cervello. Il primo leggeva, cellula per cellula, quali geni erano attivi e quali tratti di DNA erano fisicamente aperti e quali erano bloccati. Il secondo leggeva i segni chimici presenti sul DNA e il modo in cui il DNA era piegato in tre dimensioni all'interno del nucleo. Quattro livelli di informazioni di cui la maggior parte degli studi ne ottiene uno, suddivisi in 18 diversi tipi di cellule, monitorati durante l'intera durata della vita umana. Per questa parte del cervello, ciò non era mai stato fatto prima. Come calmi il tuo sistema nervoso? Questa newsletter riguarda i due sistemi che invecchiano il tuo ippocampo: infiammazione ed energia. Le leve quotidiane che ho nominato per queste erano il sonno, i muscoli, la glicemia e il carico di stress. Quest'ultimo è dove si adatta.", "category": "fitness"}, {"title": "Men AND Women Need Estrogen.", "url": "https://neuroathletics.substack.com/p/estrogen-has-4-main-roles-in-the", "date": "2026-10-07T12:48:12+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, un mio amico, quarantasei anni, affilato come una lama, il mese scorso si è seduto nello studio di un medico e ha posto una semplice domanda. Dovrebbe iniziare la terapia ormonale, per il suo cervello. Ha alzato le spalle. Qualche vaga rassicurazione. Una riga su come le prove sono mescolate. Se n'è andata senza niente, che è ciò con cui se ne va la maggior parte delle donne, e mi ha chiamato frustrata, perché non lo chiede per vanità. Sua madre ha l'Alzheimer. Sta guardando l'orologio. Ecco quello che nessuno le ha messo davanti, ed è la cosa che voglio mettere davanti a te. Il motivo per cui non è riuscita a ottenere una risposta chiara non è che la scienza sia debole. È che la vera scienza è scomoda. Non sta in un ricettario o in un titolo, e quindi viene appiattito in “le prove sono contrastanti”, il che è vero e anche inutile. Conosci già le guerre della terapia ormonale. Conosci il WHI, il contraccolpo, la lenta riabilitazione. Non ho intenzione di rievocare il 2002 con te. Sei più intelligente di quella conversazione. Voglio portarti sotto, nella parte che decide effettivamente la risposta. Inizio da qui, perché questa è la frase che ha riorganizzato il modo in cui penso al cervello femminile. In uno studio fondamentale, Roberta Brinton e i suoi colleghi sostengono che la perimenopausa non è affatto un evento riproduttivo. È neurologico. E gli estrogeni, scrivono, non sono un ormone sessuale che capita di visitare il cervello. È un regolatore principale del modo in cui il cervello produce e spende energia (Brinton et al., Nature Reviews Endocrinology, 2015). Siediti con quella parola. Regolatore principale. Di energia. Nell'organo più assetato di energia che possiedi. È solo il momento di festeggiare il mio incontro con la dottoressa Rhonda Patrick. Abbiamo parlato entrambi la settimana scorsa a Vancouver. L'organo che si surriscalda. Il tuo cervello è una fornace.", "category": "fitness"}, {"title": "Vox Media Should Be Ashamed of This Headline", "url": "https://neuroathletics.substack.com/p/vox-media-should-be-ashamed-of-this", "date": "2026-10-06T16:16:30+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Questa settimana ho visto un titolo che mi ha fatto davvero arrabbiare, e non lo dico alla leggera. Era uno di quei titoli grandi, pieni di speranza, di un angolo che è stato girato sull'Alzheimer. Del tipo che una donna la cui madre sta scappando legge sul suo telefono a mezzanotte e sente il suo petto aprirsi per un secondo. Del tipo che fa riflettere una famiglia, forse. Forse c'è qualcosa adesso. Così ho pagato i due dollari e ho letto tutto. Ed ecco la parte strana. L'articolo in sé è più attento del titolo. Il giornalista cita i rischi. Nota anche che l'hype ha già superato la scienza in passato. Ma quasi nessuno legge l’intero articolo. Leggono il titolo, ne sentono la luminosità e se ne vanno credendo che siamo più vicini a una cura di quanto lo siamo noi. Questo divario, tra ciò che implica un titolo scremato e ciò che dice effettivamente la scienza, è la cosa che ferisce le persone reali. Quindi lascia che ti spieghi cosa dice realmente la scienza. La storia parla in realtà di due farmaci. Lecanemab e donanemab. Potresti aver visto i nomi dei marchi, Leqembi e Kisunla. Sono, ad essere onesti, un vero progresso, e non glielo toglierò. Sono i primi farmaci che hanno chiaramente e definitivamente rallentato il declino cognitivo dell’Alzheimer in ampi studi. Per una malattia che ha umiliato ogni trattamento che le è stato somministrato per decenni, questo è importante. Ma ecco cosa non ti dice il titolo e cosa ogni famiglia merita di sapere prima che la loro speranza venga dirottata. Questi farmaci non migliorano nessuno. Vorrei essere preciso, perché qui il punto è la precisione. Negli studi, lecanemab ha rallentato il declino di circa il 27% e donanemab di circa il 35% in diciotto mesi (van Dyck et al., New England Journal of Medicine, 2023; Sims et al., JAMA, 2023). Leggi attentamente quei numeri.", "category": "fitness"}, {"title": "This Catholic mother of 8 had 2 priests and 1 nun- here’s how she did it", "url": "https://www.lifesitenews.com/episodes/this-catholic-mother-of-8-had-2-priests-and-1-nun-heres-how-she-did-it/", "date": "2026-10-14T00:00:19+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Portandovi le notizie da una prospettiva cattolica tradizionale. Il sacerdote della FSSPX p. Novak si unisce a John-Henry Westen per condividere la vita e la recente morte di sua madre di 93 anni, una donna la cui determinazione nel preservare la tradizionale fede cattolica ha plasmato una famiglia di otto figli che ha prodotto due preti e una religiosa. Fr. Novak era al fianco di sua madre quando lei morì dopo aver ricevuto l'estrema unzione e la benedizione apostolica. Attribuisce alla sua fede e alla sua perseveranza il merito di aver influenzato profondamente le vocazioni e le famiglie emerse dai suoi figli. … Miliardi di anni o 6.000? Il grande dibattito su creazione vs Genesis L'attrice cattolica perde tutto dopo un incidente – torna a Hollywood come guerriera di Cristo Il mistero dell'iniquità: la religione segreta a cui Donald Trump è accusato di appartenere", "category": "teologia"}, {"title": "Nationwide COVID vaccine ‘town halls’ planned for injured to share horror stories", "url": "https://www.lifesitenews.com/news/nationwide-covid-vaccine-town-halls-planned-for-injured-to-share-horror-stories/", "date": "2026-10-13T23:33:15+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "OTTAWA (LifeSiteNews) – Dopo il successo di un’inchiesta durata quattro giorni che ha raccolto testimonianze di canadesi su come le iniezioni di COVID li abbiano spesso danneggiati in modo irreversibile, un parlamentare canadese afferma che i municipi a livello nazionale dovrebbero essere riuniti in modo che la reale portata dei danni delle iniezioni possa essere conosciuta. Secondo il deputato conservatore Dean Allison, sta lavorando all’organizzazione dei “municipi”, come li ha chiamati, in modo che tutti i canadesi danneggiati dalle vaccinazioni COVID contaminate dall’aborto possano far sentire la loro voce. … Le iniezioni del COVID sono state collegate anche a una moltitudine di effetti collaterali negativi e spesso gravi nei bambini, e tutti hanno collegamenti con linee cellulari derivate da bambini abortiti. La realtà è che la Public Health Agency of Canada (PHAC) ha dichiarato che ci sono stati almeno 58.000 eventi avversi noti da parte di individui che hanno ricevuto il vaccino COVID. Tuttavia, questi dati non vengono aggiornati dal 2024. Il PHAC ha recentemente rilevato il programma nazionale di risarcimento degli infortuni da vaccino, cambiando il nome da Vaccine Injury Support Program (VISP) a Vaccine Impact Assistance Program (VIAP). L’agenzia aveva ammesso che i colpi di COVID hanno causato danni a non meno di 10.000 persone.", "category": "teologia"}, {"title": "WATCH: Fr. Murr exposes Freemason infiltration of key Vatican offices, Mass", "url": "https://www.lifesitenews.com/news/watch-fr-murr-exposes-freemason-infiltration-of-key-vatican-offices-mass/", "date": "2026-10-13T22:51:30+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) – Padre Charles Murr ha recentemente discusso dell’infiltrazione della Massoneria ai più alti livelli del Vaticano, comprese le figure chiave responsabili della nomina di nuovi vescovi e della creazione del Novus Ordo Missae. In un'intervista virale sul canale YouTube di WORLDCA$T (visualizzabile di seguito) presentata in anteprima l'8 ottobre, p. Murr, discutendo il suo libro Murder in the 33rd Degree: The Gagnon Investigation into Vatican Freemasonry, ha evidenziato la profonda infiltrazione nella gerarchia della Chiesa dopo il Concilio Vaticano II. Il sacerdote ha sottolineato la nomina da parte di Papa Paolo VI del cardinale massone Sebastiano Baggio a prefetto della Congregazione per i vescovi, consentendo di fatto a un massone di selezionare il vescovo del mondo… La sua filosofia, la sua motivazione dietro tutti i cambiamenti, era la libertà, l’uguaglianza, la fraternità invece di Gesù Cristo e il Vangelo… e secondo la mia opinione personale, il motivo per cui molte – la maggior parte delle nostre – chiese sono vuote è perché abbiamo perso il sacro. Bugnini, che fu segretario del Consilium per la Riforma Liturgica e figura chiave nella sua esecuzione, è da tempo sospettato o accusato di essere massone. Come ha osservato il dottor Peter Kwasniewski per LifeSiteNews nel 2020, \"La questione è rimasta dubbia a tal punto che l'eminente storico francese Yves Chiron, nella sua giudiziosa biografia di Bugnini, ha ritenuto che la voce non fosse adeguatamente supportata dai fatti. La situazione ha cominciato a cambiare (nel 2019) quando Kevin Symonds ha presentato dettagli credibili, per gentile concessione di padre Brian Harrison, nominando il cardinale Dino Staffa come colui che ha portato Paolo VI alla informazioni “pistola fumante” sulla Massoneria di Bugnini”, rinvenuta in una valigetta h", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#
