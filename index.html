<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 17 Nov 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "What is it to Seek and Speak the Truth in Love?", "url": "https://thomisticinstitute.substack.com/p/what-is-it-to-seek-and-speak-the", "date": "2026-11-16T13:51:22+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Welcome to part two of my five-part series on Intellectual Charity. The first part is here , though it isn’t necessary that you read it before you read this entry. In all areas of life, the Christian is called to the moral heights: turn the other cheek; go the extra mile. We are called to emulate Christ, who laid down his life for us while we were still at enmity with him. We hear parables that encourage us to go above and beyond the call of duty. Indeed, the technical term for such an act—an act that goes above and beyond the call of duty, like when a stranger saves a dying man found on the side of the road, taking him to an inn and paying for it with his own money—is supererogation , a word that comes to us from St. Jerome’s Vulgate translation of our Lord’s parable of the Good Samaritan. As the Samaritan says to the innkeeper, whatever more you spend ( supererogaveris ), I will repay you. So, it should be no surprise to us, then, that in seeking and speaking the truth, we Christians are called to a high standard. But what exactly is the standard? Just how high is it? Remember when Peter asked how many times he had to forgive his brother? You can hear him thinking he’s got a pretty high bar already when he says “seven.” And honestly, that is pretty high, isn’t it? Seven times for the same type of sin?! But recall our Lord’s answer of seventy -seven, or even seventy times seven. Is the bar for seeking and speaking the truth equally audaciously high? Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts every Monday.", "category": "teologia"}, {"title": "Time in Science and Philosophy", "url": "https://thomisticinstitute.substack.com/p/time-in-science-and-philosophy", "date": "2026-11-09T16:10:34+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Johannes Vermeer, “The Astronomer,: 1668, via Wikimedia Commons. Physicists who work in general relativity carry two very different definitions of time in their research. One is “proper” time, which is a measure of the amount of physical change that a system experiences. Proper time is what a clock measures. Carry a clock from event A to event B, and the number it displays is a direct observable that you can write down. A series of events for a given object is called its worldline. I might awake, drive into work, sit for four hours, drive to an airport, take a plane to the East Coast, and check into a hotel. My worldline has involved a series of events in which I am alternately stationary, moving at constant speed, accelerating, and rising a certain distance away from the center of the Earth. But the clock I take with me will display an elapsed time which anyone who reads it—even though they moved on a different worldline-- will agree upon. “Coordinate” time, on the other hand, is one of four coordinates assigned to events in the four-dimensional continuum called spacetime. Spacetime consists of three space-like dimensions and one time-like dimension in our universe. The path of any material entity through spacetime can be visualized as a series of events, which are linked together to form its world line. Coordinate time is a labeling of events that allows one to quantify the relationship between different worldlines. For example, if I play a three-minute song on my iPhone while on a plane, and an observer on the ground wants to know how long the song lasted by her reckoning, she must first assign times to the start and end events in her stationary reference frame, correcting for the travel time of the wireless signal from my airplane.", "category": "teologia"}, {"title": "Outsourcing Your Intellect", "url": "https://thomisticinstitute.substack.com/p/outsourcing-your-intellect", "date": "2026-11-02T13:42:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Alexander Rothaug , “The Three Fates,” 1910, via Wikimedia Commons. All the world’s a stage, And all the men and women merely players; They have their exits and their entrances; And one man in his time plays many parts.” (William Shakespeare, As You Like It) Duc, o parens celsique dominator poli, Quocumque placuit ; nulla parendi mora est. Adsum inpiger. Fac nolle, comitabor gemens Malusque patiar, facere quod licuit bono. Ducunt volentem fata, nolentem trahunt (Seneca, Moral Epistle 107 , n.11 Verses attributed to Cleanthes) The Problem of the Whispering Earring (or Bob’s Smart Glasses) Scott Alexander’s Whispering Earring imagines a magical earring that tells its wearer exactly what to do in every situation. He insists: the earring is always right . By “always right,” he does not mean that it makes the best possible decisions in every situation, but that it always makes a better decision than its wearer would have done, even after careful thought. I would like to introduce a modified version of the whispering earring for us to consider, but let’s change the earring into smart glasses to make it more true to the moment. Now let’s say the smart glasses interface with a perfect AGI model, so that their wearer, we shall call him Bob, can ask the model to supply him with answers to all questions relevant to daily life. Let’s say that one day Bob does not want to deliberate or think about his actions and decides that he will rely on his smart glasses for all of his decisions and tasks.", "category": "teologia"}, {"title": "I've Been Using Olive Oil Wrong for Years", "url": "https://staycuriousmetabolism.substack.com/p/ive-been-using-olive-oil-wrong-for", "date": "2026-11-14T12:03:19+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "I just learned I’ve been eating olives wrong for years. And my olive oil game needed a tune-up too. But let’s start with the whole olive. Here’s the deal: I’ve been an olive oil obsessive for the better part of a decade. I’ve also learned how to pick my olive oils. But I didn’t know olives themselves had a problem. Most olives in the United States are cured in a chemical called lye. Lye is sodium hydroxide, a very harsh chemical. Producers use it to de-bitter olives more quickly. But this strips the olives of many of their critical nutrients, such that they no longer retain the same health benefits as fresh or properly fermented olives. The natural curing process, which creates an organic olive, takes far longer. Rather than a few days, it can take 6 to 12 months. There are olives you can buy using this process, but it’s not necessarily obvious which are which. I’ll tell you precisely which olives I use later. And they’re not only healthier because of their wider range of nutrients and their probiotic properties, but they also taste phenomenally better. But first, let’s rewind. Because are olives and olive oil even worth the hype? In a word: Yes. But not because they’re healthy fats. Think of olive oil like a delicious soup. Technically, most of the soup might be water, but calling it healthy water would completely miss the point. The same is true of olive oil.", "category": "fitness"}, {"title": "How to Recharge Your Body’s Antioxidants", "url": "https://staycuriousmetabolism.substack.com/p/the-bodys-master-antioxidantshould", "date": "2026-11-12T12:00:46+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Every cell in your body carries a rechargeable battery for fighting oxidative stress. It’s called glutathione. Every time it neutralizes a free radical, the glutathione battery drains. And how well your cells recharge it may matter as much as how much of it you have. Now, emerging literature on glutathione shows promise for use cases ranging from reducing wrinkles (yes, mom, don’t worry, I got you) to Parkinson’s disease to liver health. Today, we’ll look at what happens when you top it up from the outside, and at a surprising way to keep the charger running from the inside. What Is Glutathione? Glutathione is a molecule your body naturally produces in virtually every cell. Structurally, it’s made from three amino acids (glutamate, cysteine, and glycine). And functionally, I call it the cell’s “rechargeable battery” for handling oxidative and chemical stress. What do I mean by that? Glutathione can donate electrons to neutralize reactive oxygen species . These are free radicals that can damage proteins, fats, and DNA. I n the process, two glutathione molecules link together to form an oxidized version called GSSG. Then, another enzyme uses energy from a different molecule, NADPH , to convert GSSG back into the active form of glutathione, effectively “recharging” the glutathione battery to be used again. We’ll come back to that recycling system later. I promise. But that’s only one of glutathione’s jobs. Second , glutathione helps recharge other antioxidants, including vitamin C and E. So rather than acting alone, glutathione sits at the hub of an antioxidant network. And third , glutathione plays a central role in detoxification, particularly in the liver.", "category": "fitness"}, {"title": "This Brownie Lowered My Blood Sugar (By Accident)", "url": "https://staycuriousmetabolism.substack.com/p/this-brownie-lowered-my-blood-sugar", "date": "2026-11-10T12:34:36+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "I created a brownie that lowered my blood sugar by accident. I say “by accident” because the original purpose of this invention was to do something else: engineer a brownie that would increase my nitric oxide (NO) levels and improve blood flow. And while it appeared successful in that endeavor, I also measured my blood sugar at baseline, 30 minutes, and 60 minutes. It went from 85 → 75 → 73 mg/dL. Then, I tried it again. And my blood sugar dropped from the 80s to the 60s. No spike and drop. Just a clean, smooth decline. After a bit more digging and discovered that one of the ingredients has a double function in the body. It increases levels of a signaling molecule (nitric oxide) that not only supports cardiovascular health, but also improves sugar metabolism and improves insulin sensitivity. So, in this special letter, I’m going to give you not only a biology lesson, but also an epic recipe that will stimulate your neurons and your taste buds. Premium subscribers get 3 new deep dives each week for less than the cost of a cup of coffee (67 cents per letter), plus access to an archive of >350 letters. In today’s special letter for premium members, you’ll discover: The complete metabolic brownie recipe Why this works to improve blood sugar and insulin sensitivity How this brownie can kick off a virtuous metabolic cycle inside your cells. There’s a reason StayCurious Metabolism is the fastest-growing premium science newsletter on Substack: we explore ideas that sound crazy… until you dig into the data and underlying biology. So whether you love chocolate or simply love understanding how your body works, give me a chance to show you how delicious learning can be. Read more", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! Go watch this one. I mean it. I sat down with Dr. Michael Breus, the Sleep Doctor, and I left rethinking things I was sure I already understood. He has spent his whole career as a clinical psychologist doing one thing, fixing the way people sleep, and he is blunt in a way I loved. First thing that floored me: the Sleep Doctor himself stops breathing 26 times an hour in his sleep, and had no idea for years. How he found out: His workouts were falling apart and his mile time kept climbing He ran bloodwork, even tried testosterone, chasing every other explanation first Nothing moved Finally someone asked when he’d last done a sleep study It came back 26. He was so sure it was broken that he retook it. Same number. The Sleep Doctor had sleep apnea and didn’t know. Here’s why that should scare the rest of us: It can happen anywhere from 5 to hundreds of times an hour, and most people never know it’s happening Every time you stop breathing, your heart rate drops then spikes to restart you, loading your heart all night long. Over time that can tip into atrial fibrillation. You’re also starving your brain of oxygen, and you never sink into the deep sleep where the brain runs its own cleanup His tell for spotting it across a room: a neck over 17.5 inches carries an 83 percent chance of apnea (his number) And one story I won’t forget: a detective, benched because he kept falling asleep on stakeouts, finally got on a CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team!!!!! A brand new creatine study has arrived!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That almost never gets studied, and this team pulled it off. You know creatine is one of the very few supplements I actually stand behind. So when a trial like this lands, I read every single line. And what they found got me fired up. Why this matters to you If you are in your forties and your brain feels like it is running too many tabs at once, this study is about you. The word that vanishes mid-sentence. The 3 a.m. wake-up. The afternoon fog that will not lift. You have been told this is just perimenopause and to wait it out. These researchers went looking for something better. What they did Fifty-one women in perimenopause, average age 46. Three groups. Most of them trained hard, twice a week, for six weeks. A smaller group did nothing, as the comparison. Half of the training women got creatine, half got placebo. And to see inside the brain, the team placed a sensor on each woman’s forehead and measured how much oxygen-rich blood her prefrontal cortex pulled in while she worked through a tough mental test. A note on sunlight, UVB, and why I’ve been using Solius This is my latest hack for circadian rhythm disruption! The obvious answer is to get outside more—and I still think that should come first. But the reality is that consistent UVB exposure is not always easy. Season, latitude, weather, work schedules, and how much time we spend indoors all change what we actually get. That’s one reason I’ve been using Solius .", "category": "fitness"}, {"title": "Belly Fat Is Shrinking Your Brain", "url": "https://neuroathletics.substack.com/p/belly-fat-is-shrinking-your-brain", "date": "2026-10-22T12:22:33+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, The fat around your waist is talking to your brain. Not as a metaphor. Chemically, constantly, every single day. A major new review just sat me down and walked me through the entire conversation, from one bloated fat cell all the way up to the circuits that hold your memories. I read it twice, and on the second pass I was scribbling in the margins like a lunatic, because the story it tells about the midlife brain is one of the most important things I have read all year. Here is the scale of what we are talking about. Almost 900 million people now live with obesity, and rates of dementia are projected to nearly triple by 2050. Those two lines are converging. This review is about the exact place they meet, which is your brain. It came out in Nature Reviews Neurology. Instead of a single study, it pulls the whole field into one place, from studies of millions of people down to the precise damage happening inside individual brain cells. Let me walk you through it the way it walked me through it. Fair warning: it gets stranger as it goes. First, a paradox that broke this field for a decade For years, the data made no sense. Study after study found that being obese in old age was associated with a lower risk of dementia. Thinner older adults got dementia more often. People started calling it the “obesity paradox,” and it got used, loudly, to argue that the worry about weight and the brain was overblown. Here is the grim problem. People often start losing weight in the years before dementia is ever diagnosed. The disease is already quietly eating through the brain, appetite and behavior shift, and the number on the scale falls. So late-life thinness was never protecting anyone. It was an early symptom being mistaken for a shield.", "category": "fitness"}, {"title": "Leo XIV Stresses Synodal Church and Cardinal tells uncomfortable truth", "url": "https://www.lifesitenews.com/episodes/leo-xiv-stresses-synodal-church-and-cardinal-tells-uncomfortable-truth/", "date": "2026-11-16T20:00:04+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. Pope Leo XIV has reaffirmed the vision of Synodality promoted by Pope Francis, describing it as a process of “walking together, listening, discerning and participating as co-responsible members in the mission.” Addressing clergy, religious, and diocesan representatives in Peru, Leo stressed that defending human dignity, accompanying families, migrants, indigenous communities, and the poor, and working for justice and peace are not optional activities but essential requirements of the Church’s mi … BREAKING: Fulton Sheen officially declared a Blessed in historic ceremony WATCH: Priest has mystical experience during livestreamed Mass Leo XIV installs a new pro-gay McCarrick-ordained bishop in America", "category": "teologia"}, {"title": "Tourists destroy statue of Jesus stolen from Divine Mercy church", "url": "https://www.lifesitenews.com/news/tourists-destroy-statue-of-jesus-stolen-from-divine-mercy-church/", "date": "2026-11-16T17:51:29+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. ( LifeSiteNews ) — Lithuanian police are still searching for drunk tourists who shattered a golden statue of Jesus from Lithuania’s Shrine of Divine Mercy church, home to the 1934 Divine Mercy painting by Eugeniusz Kazimirowski. … “In the sanctuary of mercy, we repeat every day: ‘Jesus, I trust in You! Today I said these words with pain. I asked the Lord to help me not give in to hate. I prayed that those who have broken His image would understand what they did and know His forgiving love,” continued the priest. “Jesus, I trust in You – even when it hurts, when I don’t understand, when it’s hard to forgive. Jesus, Calm and Humble, with Your help I will surely forgive,” he prayed. Fr. Markauska has appealed for help in locating the perpetrators.", "category": "teologia"}, {"title": "Vatican Bank accused of mishandling Archbishop Viganò’s assets", "url": "https://www.lifesitenews.com/news/vatican-bank-accused-of-mishandling-archbishop-viganos-assets/", "date": "2026-11-16T17:37:07+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — LifeSiteNews spoke with Augusto Sinagra, the attorney representing Archbishop Carlo Maria Viganò in a civil case involving the Vatican Bank, to examine allegations that the institution facilitated the unauthorized transfer of the archbishop’s personal fortune and subsequently refused to help recover it. Sinagra is a prominent Italian jurist, professor of European Union law at Sapienza University in Rome, and an attorney admitted to practice before the highest courts. … Sinagra : I have no expertise in canon law, but I observe that, judging by how events have unfolded and continue to unfold, there will be no canonical or other penalties against Polvani or any of the other “ecclesiastical” figures involved in this discreditable affair. LSN : You speak openly of a “Bergoglian vendetta.” Do you believe that the freezing and appropriation of Viganò’s assets were knowingly used by Francis’s curia as a form of financial retaliation intended to suppress the archbishop’s doctrinal denunciations and other criticisms? Would you be able to prove this, or is it merely an assumption you have reached by “connecting the dots” in this affair? Sinagra : Personally, I believe that what Archbishop Viganò has suffered and continues to suffer fits squarely within the framework of a “Bergoglian vendetta,” also in light of Jorge Mario Bergoglio’s overall conduct. I have described Bergoglio as the “Argentine pampero ,” who – significantly – never once paid a visit to Argentina. Obviously, I have no evidence in the technical sense of the term, but one need only apply elementary principles of deductive logic.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
