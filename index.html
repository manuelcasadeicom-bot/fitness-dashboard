<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 15 Oct 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Caravaggio, “The Calling of Saints Peter and Andrew,” 1603, via Wikimedia Commons. The Question of Justification The question, “what must I do to be saved,” was posed by the rich young man in Matthew 19:16 (and Mark 10:17), as well as by the suicidal jailer in Acts 16:30. In reply, Jesus and Paul, respectively, do not say, “nothing, God will do it all.” Jesus says, “keep the commandments” and “go, sell what you possess . . . and come, follow me” (19:17, 21). And Paul says, “believe in the Lord Jesus.” But does that mean that I save myself, or that I at least meet God halfway? No. Earning eternal life is infinitely above the natural powers of man. But then, have I no part in my own salvation? At the Final Judgment, will God be judging himself since my actions are completely irrelevant to salvation? Even if I actually do evil things, if I have no free will to choose good versus evil, I will be like an irrational animal just following my instincts. And although we might be enraged at a fox that kills our chickens, we don’t blame the fox as if he were committing a sin. So, how should we understand our being rescued from sin and justified by God? Fortunately, St. Thomas Aquinas addresses this issue in question 113 of the first part of the second part of the Summa Theologiae. Aquinas divides the Summa Theologiae into three parts: (1) on God as he is in himself, (2) on rational creatures’ movement toward God, and (3) on Christ, man’s way back to God. The second part is itself divided into two parts: (1) on anthropology (man’s nature and end, and virtue in general) and (2) on specific virtues. At the end of the first section of the second part, Aquinas treats of grace, which was only implicit in the previous articles.", "category": "teologia"}, {"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-05T15:43:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "What is humility? Now humility makes a man a good subject to ordinance of all kinds and in all matters; while every other virtue has this effect in some special matter. Therefore after the theological virtues, after the intellectual virtues which regard the reason itself, and after justice, especially legal justice, humility stands before all others. ( ST.II-II.Q161.A5.C (emphasis added). To appreciate the greatness of humility, consider that humility stands before the cardinal virtues of temperance and fortitude . Does not their status as cardinal virtues make them greater than humility? Humility stands before magnanimity and magnificence . How can it be that lowly humility surpasses these virtues of greatness, one of which is even called the crown of the virtues? To answer why humility is so significant , we will first answer: what is humility? Humility is about aspiration for great things, and it has three main elements: a control element, knowledge element, and motivation element. Humility is the virtue by which we control our aspirations for anything we think makes us greater. Aquinas refers to these aspirations with the term hope. Sometimes we need to strengthen these aspirations, but we typically need to restrain them. This act of control is called moderation. We control aspirations in light of self-knowledge, in regards to especially our deficiencies and limitations. We control our aspirations out of divine reverence. We are motivated by divine reverence to act humbly, and this motivation guides us to seek our proper place in God’s providence. Let’s unpack humility’s greatness and these three elements and see why humility is so significant. Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive a new post every Monday.", "category": "teologia"}, {"title": "The Soul of Goodness", "url": "https://thomisticinstitute.substack.com/p/the-soul-of-goodness", "date": "2026-09-28T14:50:46+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Peter Vilhelm Ilsted, “A Mother and Child in an interior,” 1898, via Wikimedia Commons. The Difficulty of Virtue In his Nicomachean Ethics , in a sentence filled with insight, both anthropological and psychological, Aristotle observes, “Anyone can get angry, that is easy… but to be so with the right person, to the right extent, at the right time, with the right motive, and in the right way, that is not for everyone, nor is it easy; wherefore goodness is both rare and laudable and noble.” 1 In effect, Aristotle is saying that human nature is wild and passionate, and that this natural wildness is essentially good inasmuch as it is an innate principle of actions that are themselves good, at least to the extent they can achieve goodness. However, he is also saying that our wild and passionate nature requires further formation if it is to become altogether good—“laudable and noble”—but that such formation in goodness, however dearly needed, is nevertheless terribly rare. It is so rare precisely because of the difficulty of bringing this formation to completion. This is in fact the principal positive difficulty of human life—the entirely natural challenge with which we are tasked as we proceed toward the future. It is the difficulty of receiving the gift of the goodness of our nature while simultaneously taking responsibility for the proper maturation of this nature—all so that our nature might attain its proper completion in our individual lives. This difficulty has a name; its name is virtue—for virtue is the immediate goal of this tough process of formation. Yet, while difficult, this task is most certainly worth the effort.", "category": "teologia"}, {"title": "Could You Live to 200? (Lessons From a Whale)", "url": "https://staycuriousmetabolism.substack.com/p/the-biology-of-living-forever", "date": "2026-10-13T11:04:24+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "What if one of the greatest secrets extending human life has been hiding inside the largest animals on Earth? It’s the bowhead whale. These creatures can live 250 years, which means there are bowheads around today that were born before the light bulb was invented. They can weigh more than 200,000 pounds, and have mouths large enough to fit an entire SUV. But I’m not telling you about this extraordinary creature simply because of its immense size or incredible longevity. I’m telling you about it because of a biological paradox that may help explain how it lives so long. Something you’ve probably never thought about. Something we could use. These whales should be riddled with tumors. But they aren’t. Think about it. Every time a cell divides, it has to copy its DNA. And every time DNA is copied, there’s a chance of making a mistake that could ultimately lead to cancer. Now consider that this whale has roughly a 1000-times more cells than a human, and some those cells divide for centuries. More cells. More cell divisions. More opportunities for cancer-causing mutations. These whales should be swimming tumors! And yet, they appear remarkably resistant to cancer. So what’s their secret? And more importantly, could we harness that secret to protect ourselves from cancer, and even extend human lifespans far beyond what we currently imagine possible? Scientists are beginning to think we might.", "category": "fitness"}, {"title": "How To Destroy Visceral Fat (Proven in 4 RCTs)", "url": "https://staycuriousmetabolism.substack.com/p/the-definitive-guide-to-destroy-visceral", "date": "2026-10-11T11:02:03+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "You can demolish your visceral fat dramatically within a matter of weeks. And you can do it without cutting calories. I’m going to prove it to you, drawing from multiple human randomized controlled trials, and sharing tools you can start using immediately. But before we get to the “ how-to, ” we need to determine the “ why. ” Why would you want to eviscerate visceral fat? Because not all fat is created equal. Subcutaneous fat (the type that sits under your skin) has important physiological functions. It provides insulation, and maintaining a modest amount helps support hormonal health. But visceral fat is different… Visceral Fat and Heart Health V isceral fat surrounds your internal organs, releases inflammatory molecules, and increases your risk of cardiovascular disease. For example, in the landmark INTERHEART study , involving approximately 27,000 participants across 52 countries, individuals in the highest quintile of waist-to-hip ratio (a proxy for visceral fat) had 2.5 times the odds of having a heart attack compared with those in the lowest quintile. Importantly, this association was substantially stronger than that observed with BMI, highlighting that where you store fat matters more for cardiovascular risk than how much you weigh. Visceral Fat and Brain Health Elevated visceral fat is also strongly linked to cognitive decline and dementia. Recent research out of Harvard suggests that the greater your cumulative exposure to visceral fat, the faster your brain shrinks as you age. So, visceral fat doesn't just expand your waistline. It also downsizes your brain. Talk about a terrible trade deal. We’ll dive into that fascinating science behind this in a moment. But first, here’s a 41-second video preview of what we’re about to explore.", "category": "fitness"}, {"title": "What Should You Do When the Evidence Runs Out? (Short Read)", "url": "https://staycuriousmetabolism.substack.com/p/what-evidence-based-medicine-misses", "date": "2026-10-09T11:00:54+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "When I was 22, my life was just taking off and crumbling at the same time. It was “taking off” because I had achieved everything I had wanted to achieve academically by that age. I had just graduated valedictorian from my college, moved to Oxford to complete my PhD, and had a place secured at Harvard Medical School to complete my MD thereafter. I grew up in medicine. Both my parents were physician-scientists, and this path was always what I wanted. But my life was also crumbling because, at the same time, I was struggling with a debilitating case of inflammatory bowel disease. Instead of spending my days in the lab, I was often in a hospital bed. The flares became so severe that I regularly required intensive treatment, and the malnourishment was so profound that my heart would sometimes flutter in the 20s. The promise I had on paper was an empty promise because my health was slipping away. It’s a truly dark irony. A family of doctors, a doctor in training, all the resources one could have, and yet the best evidence-based medicine wasn’t helping me. After some years, when medication stopped having control over the disease and we began discussing what life without a colon would look like, I went searching for alternative solutions in desperation. I wanted to know whether maybe the food passing through my gut every day would have any effect on the disease of my gut. The answer came back in five concrete words: “There is no good evidence.” There is no good evidence that dietary change could put my disease into remission. When the Evidence Runs Out So, I started to collect my own evidence, the humblest form of evidence: the N=1 experiment. I started trying things myself. Things that, by conventional standards, would be considered fringe.", "category": "fitness"}, {"title": "At 50, Your Brain Starts Replacing its Own Immune Cells", "url": "https://neuroathletics.substack.com/p/when-does-brain-aging-start", "date": "2026-10-13T12:17:43+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A study came out in Science this month that I’d put among the most important things published on brain aging this year, and I’ve barely seen anyone talk about it. They collected 40 human brains from people who had died between their twenties and their nineties. The group was built on purpose: men and women, spread evenly across four age brackets from 20 to 100, so no stretch of life was over-represented. Then they went into the hippocampus, your memory center and the first region Alzheimer’s takes apart, and they read the cells one at a time. Most brain studies can’t do that. They grind up tissue and measure the average across millions of cells at once, which blurs young in with old and healthy in with failing. This team read individual cells, about 295,000 of them. And in each one they didn’t just record which genes were switched on. They used two techniques across the same brains. The first read, cell by cell, which genes were active and which stretches of DNA were physically open versus locked shut. The second read the chemical marks sitting on the DNA and the way the DNA was folded in three dimensions inside the nucleus. Four layers of information where most studies get one, sorted into 18 different cell types, tracked across a whole human lifespan. For this part of the brain, that had not really been done before. How do you calm down your nervous system? This newsletter is about the two systems that age your hippocampus: inflammation and energy. The daily levers I named for those were your sleep, your muscle, your blood sugar, and your stress load. That last one is where this fits.", "category": "fitness"}, {"title": "Men AND Women Need Estrogen.", "url": "https://neuroathletics.substack.com/p/estrogen-has-4-main-roles-in-the", "date": "2026-10-07T12:48:12+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A friend of mine, forty-six, sharp as a blade, sat in a doctor’s office last month and asked a simple question. Should she start hormone therapy, for her brain. She got a shrug. Some vague reassurance. A line about how the evidence is mixed. She left with nothing, which is what most women leave with, and she called me frustrated, because she’s not asking out of vanity. Her mother has Alzheimer’s. She’s watching the clock. Here’s what nobody put in front of her, and it’s the thing I want to put in front of you. The reason she couldn’t get a clean answer is not that the science is thin. It’s that the real science is inconvenient . It doesn’t fit on a prescription pad or in a headline, and so it gets flattened into “the evidence is mixed,” which is true and also useless. You already know the hormone-therapy wars. You know the WHI, the backlash, the slow rehabilitation. I’m not going to relitigate 2002 with you. You’re smarter than that conversation. I want to take you underneath it, to the part that actually decides the answer. Start here, because this is the sentence that reorganized how I think about the female brain. In a landmark review, Roberta Brinton and her colleagues argue that perimenopause is not a reproductive event at all. It’s a neurological one. And estrogen, they write, is not a sex hormone that happens to visit the brain. It is a master regulator of how the brain makes and spends energy (Brinton et al., Nature Reviews Endocrinology, 2015). Sit with that word. Master regulator. Of energy. In the most energy-hungry organ you own. Just moment to celebrate me finally meeting Dr Rhonda Patrick. We both spoke last week in Vancouver. The organ that runs hot Your brain is a furnace.", "category": "fitness"}, {"title": "Vox Media Should Be Ashamed of This Headline", "url": "https://neuroathletics.substack.com/p/vox-media-should-be-ashamed-of-this", "date": "2026-10-06T16:16:30+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "I saw a headline this week that made me genuinely angry, and I don’t say that lightly. It was one of those big, hopeful, a-corner-has-been-turned Alzheimer’s headlines. The kind that a woman whose mother is slipping away reads on her phone at midnight and feels her chest unclench for a second. The kind that makes a family think, maybe. Maybe there’s something now. So I paid the two dollars and I read the whole thing. And here’s the strange part. The article itself is more careful than the headline. The reporter quotes the risks. He even notes that hype has outpaced the science before. But almost nobody reads the whole article. They read the headline, they feel the glow of it, and they walk away believing we are closer to a cure than we are. That gap, between what a skimmed headline implies and what the science actually says, is the thing that hurts real people. So let me walk you through what the science actually says. The story is really about two drugs. Lecanemab and donanemab. You may have seen the brand names, Leqembi and Kisunla. They are, to be fair, real progress, and I won’t take that from them. They are the first drugs that have clearly, definitively slowed the cognitive decline of Alzheimer’s in large trials. For a disease that has humiliated every treatment thrown at it for decades, that matters. But here is what the headline does not tell you, and what every family deserves to know before their hope gets hijacked. These drugs do not make anyone better. Let me be precise, because precision is the whole point here. In the trials, lecanemab slowed decline by about 27% and donanemab by around 35% over eighteen months (van Dyck et al., New England Journal of Medicine, 2023; Sims et al., JAMA, 2023). Read those numbers carefully.", "category": "fitness"}, {"title": "Has Leo XIV outed himself as a liberation theologian?", "url": "https://www.lifesitenews.com/episodes/has-leo-xiv-outed-himself-as-a-liberation-theologian/", "date": "2026-10-15T00:00:43+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. Pope Leo XIV has expressed devotion to St. Oscar Romero, a figure the hosts of Faith & Reason associate with liberation theology and Marxist-influenced politics. The question follows naturally: Has the Pope outed himself as a liberation theologian? The concern is that the Church risks replacing a Christ-centered faith with a human-centered political agenda, where the Gospel becomes a platform and salvation becomes social justice. … Leo XIV forbids TLM in St. Peter’s; Burke and Schneider push back Francis cardinal praises LGBT while Leo bishop cancels Latin Mass SHOCKING: Bishop OK with nude pride, priest calls Latin Mass immature, Fauci’s baby scalp study", "category": "teologia"}, {"title": "Danielle Smith receives failing grade from pro-life group", "url": "https://www.lifesitenews.com/news/danielle-smith-receives-failing-grade-from-pro-life-group/", "date": "2026-10-14T23:13:23+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — Prolife Alberta gave provincial Conservative Premier Danielle Smith multiple “F” grades for her government’s pro-life initiatives and actions and called out her “failure” to protect “innocent human life.” Last week, the group released its “Report Card” rating on abortion. Smith has been Alberta’s premier since 2022. … Prolife Alberta has previously called on Alberta’s provincial health minister to keep her word to protect newborn babies who have survived botched abortions. The issue of botched abortions in Alberta and Canada has been brought to light recently after Prolife Alberta called attention to the fact that data from the Canadian Institute for Health Information (CIHI) “confirms that in Alberta, infants are still being born alive following labour-induced late-term abortions and left to die.” As previously reported by LifeSiteNews, many of Smith’s views, including those surrounding gay “marriage” and public funding for abortion, remain at odds with traditional conservative values, a fact that has made her a target of the province’s largest pro-life organization . However, she did say last year she is in favor of adoption over abortion .", "category": "teologia"}, {"title": "Virginia bishop ordered priests to warn about pro-abortion, pro-LGBT amendments", "url": "https://www.lifesitenews.com/news/virginia-bishop-ordered-priests-to-warn-about-pro-abortion-pro-lgbt-amendments/", "date": "2026-10-14T21:11:35+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) – Bishop Michael Burbidge of the Diocese of Arlington, Virginia, directed all priests in his jurisdiction to inform their congregants of their moral obligation to vote down a pair of “dangerous” proposed amendments that would embed abortion-on-demand and homosexual “marriage” in the commonwealth’s constitution. As previously covered by LifeSiteNews, Question 1 would establish in the Virginia Constitution a “right” to surgical abortions, abortion pills, contraception, and fertility “treatments,” such as embryo-destructive in vitro fertilization (IVF). Abortion is legal in Virginia, but subject to regulations such as parental involvement (which is currently endangered by a “right to contraception” that Democrat Gov. Abigail Spanberger signed in April) and limits on public funding. All such restrictions w … After 2020, pro-lifers either failed to enact pro-life amendments or stop pro-abortion ones in California, Kentucky, Michigan, Vermont , Kansas , and Ohio , prompting much conversation among pro-lifers about the need to develop new strategies to protect life at the ballot box as well as consternation within the Republican Party over the political ramifications of continuing to take a clear pro-life position. Ten states had such amendments on the ballot in November 2024. Pro-lifers defeated pro-abortion ballot initiatives in Florida, Nebraska, and South Dakota, breaking the abortion lobby’s two-year winning streak, but amendments to embed abortion “rights” in state constitutions prevailed in the remaining states. Four abortion-related ballot initiatives are confirmed for the 2026 midterm ballot.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
