<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 13 Oct 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Di p. Basil Cole, O.P., e p. John Baptist Ku, O.P. Caravaggio, “La vocazione dei santi Pietro e Andrea”, 1603, tramite Wikimedia Commons. La questione della giustificazione La domanda: \"che cosa devo fare per essere salvato?\" è stata posta dal giovane ricco in Matteo 19:16 (e Marco 10:17), così come dal carceriere suicida in Atti 16:30. In risposta, Gesù e Paolo rispettivamente non dicono “niente, Dio farà tutto”. Gesù dice: “Osserva i comandamenti” e “vai, vendi ciò che possiedi... e vieni e seguimi” (19:17, 21). E Paolo dice: “credi nel Signore Gesù”. Ma questo significa che mi salvo, o che almeno incontro Dio a metà strada? No. Guadagnare la vita eterna è infinitamente al di sopra dei poteri naturali dell’uomo. Ma allora non ho alcuna parte nella mia salvezza? Al Giudizio Finale, Dio giudicherà se stesso poiché le mie azioni sono completamente irrilevanti per la salvezza? Anche se in realtà faccio cose malvagie, se non ho il libero arbitrio per scegliere il bene contro il male, sarò come un animale irrazionale che segue semplicemente il mio istinto. E anche se potremmo essere arrabbiati con una volpe che uccide le nostre galline, non incolpiamo la volpe come se stesse commettendo un peccato. Quindi, come dovremmo comprendere il fatto che siamo salvati dal peccato e giustificati da Dio? Fortunatamente san Tommaso d'Aquino affronta questo tema nella domanda 113 della prima parte della seconda parte della Summa Theologiae. Tommaso d'Aquino divide la Summa Theologiae in tre parti: (1) su Dio così come è in se stesso, (2) sul movimento delle creature razionali verso Dio e (3) su Cristo, la via dell'uomo per tornare a Dio. La seconda parte è a sua volta divisa in due parti: (1) sull’antropologia (natura e fine dell’uomo e virtù in generale) e (2) sulle virtù specifiche. Alla fine della prima sezione della seconda parte, l'Aquinate tratta della grazia, che negli articoli precedenti era solo implicita.", "category": "teologia"}, {"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-05T15:43:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Cos'è l'umiltà? Ora, l'umiltà rende l'uomo un buon soggetto ad ogni specie e in ogni materia; mentre ogni altra virtù ha questo effetto in qualche materia speciale. Dunque dopo le virtù teologali, dopo le virtù intellettuali che riguardano la stessa ragione, e dopo la giustizia, soprattutto quella legale, viene prima di tutte le altre l'umiltà. (ST.II-II.Q161.A5.C (grassetto aggiunto). Per apprezzare la grandezza dell'umiltà, si consideri che l'umiltà sta prima delle virtù cardinali della temperanza e della fortezza. Il loro status di virtù cardinali non le rende forse più grandi dell'umiltà? L'umiltà sta prima della magnanimità e della magnificenza. Come può essere che l'umile umiltà superi queste virtù di grandezza, una delle quali è chiamata addirittura la corona delle virtù? Per rispondere perché L'umiltà è così significativa, risponderemo prima: cos'è l'umiltà? L'umiltà riguarda l'aspirazione a grandi cose e ha tre elementi principali: un elemento di controllo, un elemento di conoscenza e un elemento di motivazione. L'umiltà è la virtù con cui controlliamo le nostre aspirazioni per tutto ciò che pensiamo ci rende più grandi conoscenza di sé, soprattutto per quanto riguarda le nostre carenze e limitazioni. Controlliamo le nostre aspirazioni per riverenza divina. Siamo motivati dalla riverenza divina ad agire umilmente, e questa motivazione ci guida a cercare il nostro giusto posto nella provvidenza di Dio. Analizziamo la grandezza dell'umiltà e questi tre elementi e vediamo perché l'umiltà è così significativa.", "category": "teologia"}, {"title": "The Soul of Goodness", "url": "https://thomisticinstitute.substack.com/p/the-soul-of-goodness", "date": "2026-09-28T14:50:46+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Peter Vilhelm Ilsted, “Una madre e un bambino in un interno”, 1898, tramite Wikimedia Commons. La difficoltà della virtù Nell'Etica Nicomachea, in una frase ricca di intuizioni sia antropologiche che psicologiche, Aristotele osserva: \"Chiunque può adirarsi, questo è facile... ma esserlo con la persona giusta, nella giusta misura, al momento giusto, con il motivo giusto e nel modo giusto, questo non è da tutti, né è facile; perciò la bontà è rara, lodevole e nobile\". 1 In effetti, Aristotele sta dicendo che la natura umana è selvaggia e passionale, e che questa natura selvaggia è essenzialmente buona in quanto è un principio innato di azioni che sono di per sé buone, almeno nella misura in cui possono raggiungere il bene. Tuttavia, sta anche dicendo che la nostra natura selvaggia e appassionata richiede un’ulteriore formazione se vuole diventare del tutto buona – “lodevole e nobile” – ma che tale formazione nella bontà, per quanto estremamente necessaria, è tuttavia terribilmente rara. È così raro proprio per la difficoltà di portare a compimento questa formazione. Questa è infatti la principale difficoltà positiva della vita umana, la sfida del tutto naturale che ci viene affidata mentre procediamo verso il futuro. È la difficoltà di ricevere il dono della bontà della nostra natura e allo stesso tempo assumersi la responsabilità della corretta maturazione di questa natura, tutto affinché la nostra natura possa raggiungere il suo adeguato completamento nelle nostre vite individuali. Questa difficoltà ha un nome; il suo nome è virtù, perché la virtù è la meta immediata di questo duro processo di formazione. Tuttavia, anche se difficile, questo compito vale sicuramente lo sforzo.", "category": "teologia"}, {"title": "How To Destroy Visceral Fat (Proven in 4 RCTs)", "url": "https://staycuriousmetabolism.substack.com/p/the-definitive-guide-to-destroy-visceral", "date": "2026-10-11T11:02:03+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Puoi demolire drasticamente il tuo grasso viscerale nel giro di poche settimane. E puoi farlo senza tagliare le calorie. Te lo dimostrerò, attingendo da più studi randomizzati controllati su esseri umani e condividendo strumenti che puoi iniziare a utilizzare immediatamente. Ma prima di arrivare al “come fare”, dobbiamo determinare il “perché”. Perché vorresti eviscerare il grasso viscerale? Perché non tutto il grasso è uguale. Il grasso sottocutaneo (il tipo che si trova sotto la pelle) ha importanti funzioni fisiologiche. Fornisce isolamento e il mantenimento di una quantità modesta aiuta a sostenere la salute ormonale. Ma il grasso viscerale è diverso... Grasso viscerale e salute del cuore Il grasso viscerale circonda gli organi interni, rilascia molecole infiammatorie e aumenta il rischio di malattie cardiovascolari. Ad esempio, nello studio INTERHEART, che ha coinvolto circa 27.000 partecipanti in 52 paesi, gli individui nel quintile più alto del rapporto vita-fianchi (un proxy per il grasso viscerale) avevano 2,5 volte la probabilità di avere un attacco cardiaco rispetto a quelli nel quintile più basso. È importante sottolineare che questa associazione era sostanzialmente più forte di quella osservata con il BMI, evidenziando che il luogo in cui si immagazzina il grasso è più importante per il rischio cardiovascolare rispetto a quanto si pesa. Grasso viscerale e salute del cervello Un elevato grasso viscerale è anche fortemente legato al declino cognitivo e alla demenza. Una recente ricerca di Harvard suggerisce che maggiore è l’esposizione cumulativa al grasso viscerale, più velocemente il cervello si restringe con l’età. Quindi, il grasso viscerale non si limita ad espandere il girovita. Ridimensiona anche il tuo cervello. Parliamo di un pessimo accordo commerciale. Tra un attimo ci immergeremo nell'affascinante scienza che sta dietro a questo. Ma prima, ecco un'anteprima video di 41 secondi di ciò che stiamo per esplorare.", "category": "fitness"}, {"title": "What Should You Do When the Evidence Runs Out? (Short Read)", "url": "https://staycuriousmetabolism.substack.com/p/what-evidence-based-medicine-misses", "date": "2026-10-09T11:00:54+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Quando avevo 22 anni, la mia vita stava decollando e crollando allo stesso tempo. Stava “decollando” perché avevo raggiunto tutto ciò che volevo ottenere a livello accademico a quell’età. Mi ero appena laureato al college, mi ero trasferito a Oxford per completare il dottorato e mi ero assicurato un posto alla Harvard Medical School per completare successivamente il mio dottorato. Sono cresciuto in medicina. Entrambi i miei genitori erano medici-scienziati e questo percorso è sempre stato ciò che desideravo. Ma la mia vita si stava sgretolando anche perché, allo stesso tempo, lottavo con un caso debilitante di malattia infiammatoria intestinale. Invece di trascorrere le mie giornate in laboratorio, ero spesso in un letto d’ospedale. Le riacutizzazioni diventavano così gravi che richiedevo regolarmente un trattamento intensivo, e la malnutrizione era così profonda che a volte il mio cuore batteva forte anche intorno ai 20 anni. La promessa che avevo sulla carta era una promessa vuota perché la mia salute stava peggiorando. È un’ironia davvero oscura. Una famiglia di medici, un medico in formazione, tutte le risorse che si potevano avere, eppure la migliore medicina basata sull’evidenza non mi aiutava. Dopo alcuni anni, quando i farmaci hanno smesso di avere controllo sulla malattia e abbiamo iniziato a discutere su come sarebbe stata la vita senza colon, ho iniziato disperatamente a cercare soluzioni alternative. Volevo sapere se forse il cibo che mi passa ogni giorno nell'intestino avrebbe avuto qualche effetto sulla malattia del mio intestino. La risposta è arrivata in cinque parole concrete: “Non ci sono prove valide”. Non ci sono prove concrete che il cambiamento della dieta possa portare la mia malattia in remissione. Quando le prove finiscono Così, ho iniziato a raccogliere le mie prove, la forma più umile di prova: l'esperimento N=1. Ho iniziato a provare le cose da solo. Cose che, secondo gli standard convenzionali, sarebbero considerate marginali.", "category": "fitness"}, {"title": "Can This Peptide Restore Immune System Balance?", "url": "https://staycuriousmetabolism.substack.com/p/the-peptide-that-teaches-your-immune", "date": "2026-10-08T11:00:45+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Il mio sistema immunitario è un’arma a doppio taglio. Da un lato non ho quasi mai infezioni respiratorie. Infatti, nonostante abbia lavorato negli ospedali durante la pandemia, non ho ancora contratto il COVID. Almeno, non ho avuto il COVID sintomatico. Forse ce l'avevo e semplicemente non sentivo niente. In ogni caso... che fortuna per me! D’altra parte, quando avevo 20 anni, mi è stata diagnosticata una malattia infiammatoria intestinale, una condizione che è, almeno in parte, di natura autoimmune. Il mio sistema immunitario ha iniziato ad attaccare il mio stesso corpo, provocando una profonda infiammazione nel mio intestino che mi ha portato ripetutamente in ospedale. Apro con questa divulgazione personale perché evidenzia un delicato atto di equilibrio che esiste all'interno di tutti i nostri sistemi immunitari. The Immune System Balancing Act We want our immune systems to rev up aggressively when confronting foreign invaders—and cancer, for that matter. Ma non vogliamo nemmeno che il nostro sistema immunitario diventi iperattivo e inizi a danneggiare i nostri organi e tessuti. Raggiungere questo equilibrio richiede precisione e tempismo straordinari, qualcosa che la maggior parte di noi dà per scontato ogni giorno. Inoltre, con l’avanzare dell’età, questo equilibrio tende a deteriorarsi. The immune system often becomes less effective at fighting infections and keeping cancer in check, while simultaneously becoming more prone to inappropriate inflammatory responses. A well-known example is the “ cytokine storm ” that can follow SARS-CoV-2 infection, where the immune response itself may contribute substantially to the damage. Quindi, la sfida: come possiamo mantenere la precisione e l’equilibrio immunitario mentre invecchiamo? Entra il peptide immunitario: timosina alfa-1 Questo è un problema che la timosina alfa-1 è in grado di affrontare in modo univoco. Ora, lasciatemi essere molto chiaro in anticipo: questa non è una molecola esoterica di fratellanza.", "category": "fitness"}, {"title": "Men AND Women Need Estrogen.", "url": "https://neuroathletics.substack.com/p/estrogen-has-4-main-roles-in-the", "date": "2026-10-07T12:48:12+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, un mio amico, quarantasei anni, affilato come una lama, il mese scorso si è seduto nello studio di un medico e ha posto una semplice domanda. Dovrebbe iniziare la terapia ormonale, per il suo cervello. Ha alzato le spalle. Qualche vaga rassicurazione. Una riga su come le prove sono mescolate. Se n'è andata senza niente, che è ciò con cui se ne va la maggior parte delle donne, e mi ha chiamato frustrata, perché non lo chiede per vanità. Sua madre ha l'Alzheimer. Sta guardando l'orologio. Ecco quello che nessuno le ha messo davanti, ed è la cosa che voglio mettere davanti a te. Il motivo per cui non è riuscita a ottenere una risposta chiara non è che la scienza sia debole. È che la vera scienza è scomoda. Non sta in un ricettario o in un titolo, e quindi viene appiattito in “le prove sono contrastanti”, il che è vero e anche inutile. Conosci già le guerre della terapia ormonale. Conosci il WHI, il contraccolpo, la lenta riabilitazione. Non ho intenzione di rievocare il 2002 con te. Sei più intelligente di quella conversazione. Voglio portarti sotto, nella parte che decide effettivamente la risposta. Inizio da qui, perché questa è la frase che ha riorganizzato il modo in cui penso al cervello femminile. In uno studio fondamentale, Roberta Brinton e i suoi colleghi sostengono che la perimenopausa non è affatto un evento riproduttivo. È neurologico. E gli estrogeni, scrivono, non sono un ormone sessuale che capita di visitare il cervello. È un regolatore principale del modo in cui il cervello produce e spende energia (Brinton et al., Nature Reviews Endocrinology, 2015). Siediti con quella parola. Regolatore principale. Di energia. Nell'organo più assetato di energia che possiedi. È solo il momento di festeggiare il mio incontro con la dottoressa Rhonda Patrick. Abbiamo parlato entrambi la settimana scorsa a Vancouver. L'organo che si surriscalda. Il tuo cervello è una fornace.", "category": "fitness"}, {"title": "Vox Media Should Be Ashamed of This Headline", "url": "https://neuroathletics.substack.com/p/vox-media-should-be-ashamed-of-this", "date": "2026-10-06T16:16:30+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Questa settimana ho visto un titolo che mi ha fatto davvero arrabbiare, e non lo dico alla leggera. Era uno di quei titoli grandi, pieni di speranza, di un angolo che è stato girato sull'Alzheimer. Del tipo che una donna la cui madre sta scappando legge sul suo telefono a mezzanotte e sente il suo petto aprirsi per un secondo. Il tipo che fa riflettere una famiglia, forse. Forse c'è qualcosa adesso. Così ho pagato i due dollari e ho letto tutto. Ed ecco la parte strana. L'articolo in sé è più attento del titolo. Il giornalista cita i rischi. Nota anche che l'hype ha già superato la scienza in passato. Ma quasi nessuno legge l’intero articolo. Leggono il titolo, ne sentono la luminosità e se ne vanno credendo che siamo più vicini a una cura di quanto lo siamo noi. Questo divario, tra ciò che implica un titolo scremato e ciò che dice effettivamente la scienza, è la cosa che ferisce le persone reali. Quindi lascia che ti spieghi cosa dice realmente la scienza. La storia parla in realtà di due farmaci. Lecanemab e donanemab. Potresti aver visto i nomi dei marchi, Leqembi e Kisunla. Sono, ad essere onesti, un vero progresso, e non glielo toglierò. Sono i primi farmaci che hanno chiaramente e definitivamente rallentato il declino cognitivo dell’Alzheimer in ampi studi. Per una malattia che ha umiliato ogni trattamento che le è stato somministrato per decenni, questo è importante. Ma ecco cosa non ti dice il titolo e cosa ogni famiglia merita di sapere prima che la loro speranza venga dirottata. Questi farmaci non migliorano nessuno. Vorrei essere preciso, perché qui il punto è la precisione. Negli studi, lecanemab ha rallentato il declino di circa il 27% e donanemab di circa il 35% in diciotto mesi (van Dyck et al., New England Journal of Medicine, 2023; Sims et al., JAMA, 2023). Leggi attentamente quei numeri.", "category": "fitness"}, {"title": "Are you happier if you get more sunlight?", "url": "https://neuroathletics.substack.com/p/are-you-happier-if-you-get-more-sunlight", "date": "2026-09-28T20:09:28+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, uno studio alla luce del mattino ha attirato la mia attenzione per ciò che è migliorato e cosa no. Trentatré studenti universitari si sono sentiti meno assonnati dopo una settimana di esposizione mattutina alla luce intensa. Ma le loro prestazioni nei test di attenzione e memoria non sono migliorate. Questo è un risultato interessante se, come me, passi la tua vita lavorativa a chiederti cosa aiuta effettivamente il cervello. Innanzitutto, cosa ha effettivamente mostrato lo studio? Nella prestampa di luglio 2026, i partecipanti hanno completato una settimana utilizzando un dispositivo di illuminazione da 10.000 lux per 30 minuti ogni mattina e un’altra settimana nelle loro consuete condizioni di illuminazione. L'ordine è stato randomizzato. Durante la settimana in piena luce, hanno riferito meno sonnolenza diurna, con la differenza maggiore a mezzogiorno. I ricercatori hanno anche segnalato una migliore efficienza del sonno stimata da Fitbit e una durata del sonno più coerente. Ma i test cognitivi non hanno mostrato miglioramenti. Si trattava di uno studio piccolo e breve, senza periodi di washout tra le condizioni, e non è stato certificato da una revisione paritaria. Non è possibile stabilire se la luce del mattino migliori la cognizione in modo più ampio. Ha anche testato un dispositivo, non pochi minuti all'aperto. La mia interpretazione: risultati incoraggianti sulla sonnolenza e sui ritmi del sonno, senza un beneficio dimostrato sulla memoria in questo esperimento. Mi prenderei volentieri un pomeriggio meno assonnato. Vorrei solo che lo descrivessimo accuratamente. Innanzitutto, perché la luce dovrebbe influenzare il tuo cervello? La tua retina fa molto più che aiutarti a vedere. Contiene cellule gangliari retiniche intrinsecamente fotosensibili o ipRGC. Queste cellule rilevano la luce attraverso un pigmento chiamato melanopsina, ricevendo anche input provenienti da bastoncelli e coni. Alcuni inviano segnali direttamente al nucleo soprachiasmatico, o SCN, nell'ipotalamo: il tuo orologio circadiano centrale.", "category": "fitness"}, {"title": "ESPN GameDay’s ‘No religious signs’ rule draws backlash", "url": "https://www.lifesitenews.com/news/espn-gamedays-no-religious-signs-rule-draws-backlash/", "date": "2026-10-13T00:05:11+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) - Il programma di anteprima del College GameDay di ESPN, trasmesso il sabato mattina durante la stagione calcistica, ha ricevuto reazioni negative la scorsa settimana, quando è venuta alla luce la sua politica che vieta i segni religiosi nella folla che circondava il set. ESPN, di proprietà di The Walt Disney Company, ha affermato che la sua politica di vietare i cartelli con messaggi religiosi è in vigore da qualche tempo, ma è diventata un problema sabato scorso nel campus dell'Università dell'Alabama a Tuscaloosa quando GameDay si è spostato al Coleman Coliseum a causa della minaccia meteorologica inclemente causata dall'uragano Isaias. Sul tabellone video principale dell'arena sono state pubblicate le regole per l'interno della fossa, che ESPN designa come l'area più vicina al palco della trasmissione. Le restrizioni includevano: … Qualcuno tiene in mano un cartello “A ogni perdente non mollare, trova speranza in Gesù” alla LSU per il College Gameday 👏 Romani 15:13 https://t.co/7YNt0BA5Us I media sportivi sono noti per i loro pregiudizi anti-religiosi nonostante il fatto che molti atleti ringrazino Dio durante le interviste dopo le partite. Anche la Walt Disney Company è stata spesso accusata di discriminazione religiosa in passato. La controversia potrebbe rimanere un punto di discussione questa settimana quando il College GameDay si recherà a Provo, nello Utah, per un incontro tra due università religiose che sono imbattute in questa stagione, Brigham Young e Notre Dame, sabato 17 ottobre.", "category": "teologia"}, {"title": "Leo XIV doubles down on false teaching, calls death penalty ‘inadmissible’", "url": "https://www.lifesitenews.com/news/leo-xiv-doubles-down-on-false-teaching-calls-death-penalty-inadmissible/", "date": "2026-10-12T20:11:50+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Portandovi le notizie da una prospettiva cattolica tradizionale. (LifeSiteNews) – In un post sui social media in occasione della Giornata mondiale contro la pena di morte, Papa Leone XIV ha nuovamente descritto la pena di morte come “inammissibile”. Gli studiosi sostengono che questo termine ambiguo, introdotto nel Catechismo della Chiesa Cattolica sotto Papa Francesco, offusca la distinzione tra la legittimità morale della pena capitale in linea di principio e i meri giudizi prudenziali riguardanti il ​​suo utilizzo in circostanze particolari. … Etichettando ripetutamente la pena di morte come “inammissibile” come un attacco alla dignità, Leone XIV sta portando avanti una posizione che Feser e altri identificano come una rottura dottrinale piuttosto che uno sviluppo. Offrendo una soluzione pratica a questa confusione sabato, Feser ha twittato che se il papa e il Vaticano “riaffermassero chiaramente ed esplicitamente ‘La pena di morte non è intrinsecamente sbagliata…’ prima di continuare a criticarne l’uso nella pratica per quanto duramente vogliano, risolverebbe immediatamente questo problema… Non esiste alcuna base razionale per astenersi dal farlo”. Se il Papa o il DDF si limitassero a riaffermare in modo chiaro ed esplicito “La pena di morte non è intrinsecamente sbagliata…” prima di continuare a criticarne l’uso nella pratica per quanto duramente vogliano, risolverebbe immediatamente questo problema per la maggior parte delle persone preoccupate dalla questione. Non esiste alcuna base razionale per astenersi dal farlo.", "category": "teologia"}, {"title": "GOP bill would protect religious education from student loan ban", "url": "https://www.lifesitenews.com/news/gop-bill-would-protect-religious-education-from-student-loan-ban/", "date": "2026-10-12T19:37:28+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "WASHINGTON, D.C. (LifeSiteNews) – I senatori statunitensi James Lankford (R-OK) e Ted Cruz (R-TX) hanno introdotto una legislazione volta a correggere una norma del Dipartimento dell’Istruzione degli Stati Uniti (DOE) che potrebbe avere la conseguenza involontaria di danneggiare i prestiti studenteschi per gli studenti in cerca di istruzione religiosa. Come LifeSiteNews ha trattato a maggio, l’anno scorso all’interno del vasto One Big Beautiful Bill Act (BBB) ​​del presidente Donald Trump c’era un cosiddetto standard “non nuocere” per l’ammissibilità dei prestiti studenteschi federali, che richiederebbe che i corsi di laurea idonei producano guadagni più elevati per i laureati rispetto a quelli senza laurea. Lo scorso ottobre, l’American University ha stimato che solo circa l’1,8% del totale degli studenti frequentava programmi che probabilmente sarebbero stati influenzati negativamente dal cambiamento. … Il tentativo di reprimere i “laurea spazzatura” segue una lunga storia di malcontento nei confronti delle istituzioni americane di istruzione superiore, che sono state a lungo riconosciute come fortemente dominate da pregiudizi di sinistra e revisionismo storico, che condizionano gli studenti a rifiutare la religione, la moralità tradizionale e il libero mercato e a vedere l’America come una forza maligna unica nel mondo, una società sistematicamente truccata contro i poveri e i gruppi minoritari. Questo pregiudizio li ha anche resi terreno fertile per l’intolleranza verso le opinioni dissenzienti, la
