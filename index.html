<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 09 Oct 2026 — 14:56 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-05T15:43:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Cos'è l'umiltà? Ora, l'umiltà rende l'uomo un buon soggetto ad ogni specie e in ogni materia; mentre ogni altra virtù ha questo effetto in qualche materia speciale. Dunque dopo le virtù teologali, dopo le virtù intellettuali che riguardano la stessa ragione, e dopo la giustizia, soprattutto quella legale, viene prima di tutte le altre l'umiltà. (ST.II-II.Q161.A5.C (grassetto aggiunto). Per apprezzare la grandezza dell'umiltà, si consideri che l'umiltà sta prima delle virtù cardinali della temperanza e della fortezza. Il loro status di virtù cardinali non le rende forse più grandi dell'umiltà? L'umiltà sta prima della magnanimità e della magnificenza. Come può essere che l'umile umiltà superi queste virtù di grandezza, una delle quali è addirittura chiamata la corona delle virtù? Per rispondere perché L'umiltà è così significativa, risponderemo prima: cos'è l'umiltà? L'umiltà riguarda l'aspirazione a grandi cose e ha tre elementi principali: un elemento di controllo, un elemento di conoscenza e un elemento di motivazione. L'umiltà è la virtù con cui controlliamo le nostre aspirazioni per tutto ciò che pensiamo ci rende più grandi conoscenza di sé, soprattutto per quanto riguarda le nostre carenze e limitazioni. Controlliamo le nostre aspirazioni per riverenza divina. Siamo motivati dalla riverenza divina ad agire umilmente, e questa motivazione ci guida a cercare il nostro giusto posto nella provvidenza di Dio. Analizziamo la grandezza dell'umiltà e questi tre elementi e vediamo perché l'umiltà è così significativa.", "category": "teologia"}, {"title": "The Soul of Goodness", "url": "https://thomisticinstitute.substack.com/p/the-soul-of-goodness", "date": "2026-09-28T14:50:46+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Peter Vilhelm Ilsted, “Una madre e un bambino in un interno”, 1898, tramite Wikimedia Commons. La difficoltà della virtù Nell'Etica Nicomachea, in una frase ricca di intuizioni sia antropologiche che psicologiche, Aristotele osserva: \"Chiunque può adirarsi, questo è facile... ma esserlo con la persona giusta, nella giusta misura, al momento giusto, con il motivo giusto e nel modo giusto, questo non è da tutti, né è facile; perciò la bontà è rara, lodevole e nobile\". 1 In effetti, Aristotele sta dicendo che la natura umana è selvaggia e passionale, e che questa natura selvaggia è essenzialmente buona in quanto è un principio innato di azioni che sono di per sé buone, almeno nella misura in cui possono raggiungere il bene. Tuttavia, sta anche dicendo che la nostra natura selvaggia e appassionata richiede un’ulteriore formazione se vuole diventare del tutto buona – “lodevole e nobile” – ma che tale formazione nella bontà, per quanto estremamente necessaria, è tuttavia terribilmente rara. È così raro proprio per la difficoltà di portare a compimento questa formazione. Questa è infatti la principale difficoltà positiva della vita umana, la sfida del tutto naturale che ci viene affidata mentre procediamo verso il futuro. È la difficoltà di ricevere il dono della bontà della nostra natura e allo stesso tempo assumersi la responsabilità della corretta maturazione di questa natura, tutto affinché la nostra natura possa raggiungere il suo adeguato completamento nelle nostre vite individuali. Questa difficoltà ha un nome; il suo nome è virtù, poiché la virtù è la meta immediata di questo duro processo di formazione. Tuttavia, anche se difficile, questo compito vale sicuramente lo sforzo.", "category": "teologia"}, {"title": "The Art of Being Good", "url": "https://thomisticinstitute.substack.com/p/the-art-of-being-good", "date": "2026-09-21T15:35:14+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Winslow Homer, “Salta la frusta”, 1872, tramite Wikimedia Commons. Il bisogno di coltivazione Ho trascorso la mattinata osservando il nostro bambino di sette mesi mentre tentava di conquistare il mondo – i suoi occhi luminosi osservavano con rapita attenzione, la meraviglia che trasudava da ogni poro, i muscoli tesi nell’esplorazione e nella scoperta – tutto in lui teso alla comprensione e al conseguimento, lottando verso la verità e la bontà. Osservando il nostro bambino, mi sono ricordato ancora una volta che la nostra più grande spinta – si potrebbe anche dire il nostro istinto primordiale – è questo impulso interiore verso la verità e la bontà. Questa potente spinta è evidentemente la caratteristica più importante della vita umana, forse la più importante, e tutto nel nostro bambino si tende in avanti come risultato della sua potente spinta. Ma anche questa spinta è selvaggia. Selvaggio, non nel senso di caotico e disordinato, e quindi problematico, ma nel senso del tutto naturale di non ancora coltivato. È il selvaggio della natura prima dell'attività di un giardiniere, audace e intenso, feroce e potente, ma anche buono, con una bontà che ha bisogno solo del nostro intervento per riportarla a casa. Allo stesso modo in cui la natura selvaggia ha bisogno di un giardiniere per prosperare, così anche questa spinta interiore richiede la nostra coltivazione se vuole prendere la sua forma adeguata. La ragione di ciò si trova nel fatto che Dio non crea l’essere umano (o qualsiasi cosa) “completamente fatto”, ma piuttosto ci fornisce un’attitudine a svilupparsi nel corso del tempo – e quindi a raggiungere gradualmente la nostra perfezione naturale. Da ciò vediamo che fin dall'inizio della nostra vita siamo posti nella posizione privilegiata di essere collaboratori di Dio nella nostra stessa creazione, poiché, come nota san Tommaso, «anche alle creature è conferita da Dio la dignità della causalità».", "category": "teologia"}, {"title": "What Should You Do When the Evidence Runs Out? (Short Read)", "url": "https://staycuriousmetabolism.substack.com/p/what-evidence-based-medicine-misses", "date": "2026-10-09T11:00:54+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Quando avevo 22 anni, la mia vita stava decollando e crollando allo stesso tempo. Stava “decollando” perché avevo raggiunto tutto ciò che volevo ottenere a livello accademico a quell’età. Mi ero appena laureato al college, mi ero trasferito a Oxford per completare il dottorato e mi ero assicurato un posto alla Harvard Medical School per completare successivamente il mio dottorato. Sono cresciuto in medicina. Entrambi i miei genitori erano medici-scienziati e questo percorso è sempre stato ciò che desideravo. Ma la mia vita si stava sgretolando anche perché, allo stesso tempo, lottavo con un caso debilitante di malattia infiammatoria intestinale. Invece di trascorrere le mie giornate in laboratorio, ero spesso in un letto d’ospedale. Le riacutizzazioni diventavano così gravi che richiedevo regolarmente un trattamento intensivo, e la malnutrizione era così profonda che a volte il mio cuore batteva forte anche intorno ai 20 anni. La promessa che avevo sulla carta era una promessa vuota perché la mia salute stava peggiorando. È un’ironia davvero oscura. Una famiglia di medici, un medico in formazione, tutte le risorse che si potevano avere, eppure la migliore medicina basata sull’evidenza non mi aiutava. Dopo alcuni anni, quando i farmaci hanno smesso di avere controllo sulla malattia e abbiamo iniziato a discutere su come sarebbe stata la vita senza colon, ho iniziato disperatamente a cercare soluzioni alternative. Volevo sapere se forse il cibo che mi passa ogni giorno nell'intestino avrebbe avuto qualche effetto sulla malattia del mio intestino. La risposta è arrivata in cinque parole concrete: “Non ci sono prove valide”. Non ci sono prove concrete che il cambiamento della dieta possa portare la mia malattia in remissione. Quando le prove finiscono Così, ho iniziato a raccogliere le mie prove, la forma più umile di prova: l'esperimento N=1. Ho iniziato a provare le cose da solo. Cose che, secondo gli standard convenzionali, sarebbero considerate marginali.", "category": "fitness"}, {"title": "Can This Peptide Restore Immune System Balance?", "url": "https://staycuriousmetabolism.substack.com/p/the-peptide-that-teaches-your-immune", "date": "2026-10-08T11:00:45+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Il mio sistema immunitario è un’arma a doppio taglio. Da un lato non ho quasi mai infezioni respiratorie. Infatti, nonostante abbia lavorato negli ospedali durante la pandemia, non ho ancora contratto il COVID. Almeno, non ho avuto il COVID sintomatico. Forse ce l'avevo e semplicemente non sentivo niente. In ogni caso... che fortuna per me! D’altra parte, quando avevo 20 anni, mi è stata diagnosticata una malattia infiammatoria intestinale, una condizione che è, almeno in parte, di natura autoimmune. Il mio sistema immunitario ha iniziato ad attaccare il mio stesso corpo, provocando una profonda infiammazione nel mio intestino che mi ha portato ripetutamente in ospedale. Apro con questa divulgazione personale perché evidenzia un delicato atto di equilibrio che esiste all'interno di tutti i nostri sistemi immunitari. La legge sul bilanciamento del sistema immunitario Vogliamo che il nostro sistema immunitario si attivi in ​​modo aggressivo quando si confronta con gli invasori stranieri e, del resto, con il cancro. Ma non vogliamo nemmeno che il nostro sistema immunitario diventi iperattivo e inizi a danneggiare i nostri organi e tessuti. Raggiungere questo equilibrio richiede precisione e tempismo straordinari, qualcosa che la maggior parte di noi dà per scontato ogni giorno. Inoltre, con l’avanzare dell’età, questo equilibrio tende a deteriorarsi. Il sistema immunitario spesso diventa meno efficace nel combattere le infezioni e nel tenere sotto controllo il cancro, diventando allo stesso tempo più incline a risposte infiammatorie inappropriate. Un esempio ben noto è la “tempesta di citochine” che può seguire l’infezione da SARS-CoV-2, dove la stessa risposta immunitaria può contribuire in modo sostanziale al danno. Quindi, la sfida: come possiamo mantenere la precisione e l’equilibrio immunitario quando invecchiamo? Entra il peptide immunitario: timosina alfa-1 Questo è un problema che la timosina alfa-1 è in grado di affrontare in modo univoco. Ora, lasciatemi essere molto chiaro in anticipo: questa non è una molecola esoterica di fratellanza.", "category": "fitness"}, {"title": "How to Master Your Nervous System to Improve Your Heart Health", "url": "https://staycuriousmetabolism.substack.com/p/how-to-master-your-nervous-system", "date": "2026-10-06T11:01:11+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Voglio iniziare parlando di un momento di cui mi vergogno. Non voglio parlartene. Tuttavia, lo farò. Perché quello che ho fatto, e quello che è successo nel mio corpo, è un’analogia quasi perfetta per parte della fisiologia del cuore che esploreremo. Ok, il mio momento di vergogna: all'inizio di quest'anno stavo uscendo da un parcheggio. Ero in un brutto stato d'animo, alle prese con alcune intense questioni personali, quando un uomo ha iniziato a urlarmi contro apparentemente all'improvviso. Dal suo punto di vista, stava proteggendo la sua anziana madre, che stava camminando dietro la mia macchina. L'avevo vista. Era a circa 8 piedi di distanza. Sapevo che non l'avrei colpita, quindi la sua reazione mi è sembrata sproporzionata. E invece di fare la cosa sensata e scusarmi e rassicurarlo, sono entrato in lotta o fuga e ho urlato in risposta. Ci siamo scambiati alcune parole colorite che non riprodurrò qui. Poi abbiamo preso strade separate, senza aver ottenuto esattamente nulla se non aumentare i livelli di stress l’uno dell’altro. Non ne sono orgoglioso. Ero decisamente imbarazzato. La mia ragazza era sul sedile del passeggero e anche lei lo ha descritto come \"estremamente fuori dal personaggio\" e ha chiesto: \"stai bene?\" Inutile dire che non lo ero. Ma non è questo il punto. Ma quello che è successo dopo è la parte importante. Il mio corpo era pronto per combattere. Il mio cuore batteva forte. La mia mascella era così serrata che penso che avrei potuto addentare una noce di cocco. Avevo le nocche bianche attorno al volante. E, mentre mi mettevo in strada, ho sentito il bisogno di sbattere l'acceleratore sul pavimento. La mia mente era su di giri. E il mio corpo burattino seguiva la sua guida. Ma non ho dato gas. Avevo qualcuno che amo in macchina con me.", "category": "fitness"}, {"title": "Men AND Women Need Estrogen.", "url": "https://neuroathletics.substack.com/p/estrogen-has-4-main-roles-in-the", "date": "2026-10-07T12:48:12+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, un mio amico, quarantasei anni, affilato come una lama, il mese scorso si è seduto nello studio di un medico e ha posto una semplice domanda. Dovrebbe iniziare la terapia ormonale, per il suo cervello. Ha alzato le spalle. Qualche vaga rassicurazione. Una riga su come le prove sono mescolate. Se n'è andata senza niente, che è ciò con cui se ne va la maggior parte delle donne, e mi ha chiamato frustrata, perché non lo chiede per vanità. Sua madre ha l'Alzheimer. Sta guardando l'orologio. Ecco quello che nessuno le ha messo davanti, ed è la cosa che voglio mettere davanti a te. Il motivo per cui non è riuscita a ottenere una risposta chiara non è che la scienza sia debole. È che la vera scienza è scomoda. Non sta in un ricettario o in un titolo, e quindi viene appiattito in “le prove sono contrastanti”, il che è vero e anche inutile. Conosci già le guerre della terapia ormonale. Conosci il WHI, il contraccolpo, la lenta riabilitazione. Non ho intenzione di rievocare il 2002 con te. Sei più intelligente di quella conversazione. Voglio portarti sotto, nella parte che decide effettivamente la risposta. Inizio da qui, perché questa è la frase che ha riorganizzato il modo in cui penso al cervello femminile. In uno studio fondamentale, Roberta Brinton e i suoi colleghi sostengono che la perimenopausa non è affatto un evento riproduttivo. È neurologico. E gli estrogeni, scrivono, non sono un ormone sessuale che capita di visitare il cervello. È un regolatore principale del modo in cui il cervello produce e spende energia (Brinton et al., Nature Reviews Endocrinology, 2015). Siediti con quella parola. Regolatore principale. Di energia. Nell'organo più assetato di energia che possiedi. È solo il momento di festeggiare il mio incontro con la dottoressa Rhonda Patrick. Abbiamo parlato entrambi la settimana scorsa a Vancouver. L'organo che si surriscalda. Il tuo cervello è una fornace.", "category": "fitness"}, {"title": "Vox Media Should Be Ashamed of This Headline", "url": "https://neuroathletics.substack.com/p/vox-media-should-be-ashamed-of-this", "date": "2026-10-06T16:16:30+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Questa settimana ho visto un titolo che mi ha fatto davvero arrabbiare, e non lo dico alla leggera. Era uno di quei titoli grandi, pieni di speranza, di un angolo che è stato girato sull'Alzheimer. Del tipo che una donna la cui madre sta scappando legge sul suo telefono a mezzanotte e sente il suo petto aprirsi per un secondo. Il tipo che fa riflettere una famiglia, forse. Forse c'è qualcosa adesso. Così ho pagato i due dollari e ho letto tutto. Ed ecco la parte strana. L'articolo in sé è più attento del titolo. Il giornalista cita i rischi. Nota anche che l'hype ha già superato la scienza in passato. Ma quasi nessuno legge l’intero articolo. Leggono il titolo, ne sentono la luminosità e se ne vanno credendo che siamo più vicini a una cura di quanto lo siamo noi. Questo divario, tra ciò che implica un titolo scremato e ciò che dice effettivamente la scienza, è la cosa che ferisce le persone reali. Quindi lascia che ti spieghi cosa dice realmente la scienza. La storia parla in realtà di due farmaci. Lecanemab e donanemab. Potresti aver visto i nomi dei marchi, Leqembi e Kisunla. Sono, ad essere onesti, un vero progresso, e non glielo toglierò. Sono i primi farmaci che hanno chiaramente e definitivamente rallentato il declino cognitivo dell’Alzheimer in ampi studi. Per una malattia che ha umiliato ogni trattamento che le è stato somministrato per decenni, questo è importante. Ma ecco cosa non ti dice il titolo e cosa ogni famiglia merita di sapere prima che la loro speranza venga dirottata. Questi farmaci non migliorano nessuno. Vorrei essere preciso, perché qui il punto è la precisione. Negli studi, lecanemab ha rallentato il declino di circa il 27% e donanemab di circa il 35% in diciotto mesi (van Dyck et al., New England Journal of Medicine, 2023; Sims et al., JAMA, 2023). Leggi attentamente quei numeri.", "category": "fitness"}, {"title": "Are you happier if you get more sunlight?", "url": "https://neuroathletics.substack.com/p/are-you-happier-if-you-get-more-sunlight", "date": "2026-09-28T20:09:28+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, uno studio alla luce del mattino ha attirato la mia attenzione per ciò che è migliorato e cosa no. Trentatré studenti universitari si sono sentiti meno assonnati dopo una settimana di esposizione mattutina alla luce intensa. Ma le loro prestazioni nei test di attenzione e memoria non sono migliorate. Questo è un risultato interessante se, come me, passi la tua vita lavorativa a chiederti cosa aiuta effettivamente il cervello. Innanzitutto, cosa ha effettivamente mostrato lo studio? Nella prestampa di luglio 2026, i partecipanti hanno completato una settimana utilizzando un dispositivo luminoso da 10.000 lux per 30 minuti ogni mattina e un’altra settimana nelle loro consuete condizioni di illuminazione. L'ordine è stato randomizzato. Durante la settimana in piena luce, hanno riferito meno sonnolenza diurna, con la differenza maggiore a mezzogiorno. I ricercatori hanno anche segnalato una migliore efficienza del sonno stimata da Fitbit e una durata del sonno più coerente. Ma i test cognitivi non hanno mostrato miglioramenti. Si trattava di uno studio piccolo e breve, senza periodi di washout tra le condizioni, e non è stato certificato da una revisione paritaria. Non è possibile stabilire se la luce del mattino migliori la cognizione in modo più ampio. Ha anche testato un dispositivo, non pochi minuti all'aperto. La mia interpretazione: risultati incoraggianti sulla sonnolenza e sui ritmi del sonno, senza un beneficio dimostrato sulla memoria in questo esperimento. Mi prenderei volentieri un pomeriggio meno assonnato. Vorrei solo che lo descrivessimo accuratamente. Innanzitutto, perché la luce dovrebbe influenzare il tuo cervello? La tua retina fa molto più che aiutarti a vedere. Contiene cellule gangliari retiniche intrinsecamente fotosensibili o ipRGC. Queste cellule rilevano la luce attraverso un pigmento chiamato melanopsina, ricevendo anche input provenienti da bastoncelli e coni. Alcuni inviano segnali direttamente al nucleo soprachiasmatico, o SCN, nell'ipotalamo: il tuo orologio circadiano centrale.", "category": "fitness"}, {"title": "Fr. Ripperger: Here’s what you must know about generational wounds", "url": "https://www.lifesitenews.com/episodes/fr-ripperger-heres-what-you-must-know-about-generational-wounds/", "date": "2026-10-09T12:00:07+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Portandovi le notizie da una prospettiva cattolica tradizionale. Fr. Chad Ripperger spiega che le “ferite generazionali” possono essere trasmesse attraverso disfunzioni domestiche, cattivo esempio e comportamenti appresi. I bambini assorbono modelli di paura, risentimento, offesa, giudizio e reazione emotiva osservando coloro che li circondano, e tali modelli possono diventare profondamente radicati nella memoria e nell'immaginazione. Ripperger sottolinea il ruolo della “forza cogitativa” nella formazione delle associazioni: un'esperienza dolorosa può creare un'associazione distorta o un falso giudizio che co... p. Ripperger: Dobbiamo aggiustare la nostra vita di preghiera o affrontare le conseguenze p. Ripperger: Come promuovere una forte etica del lavoro nella tua famiglia P. Ripperger: come identificare i sofismi ed evitare di essere fuorviati", "category": "teologia"}, {"title": "Cardinal betrays natural family at Amoris Laetitia summit", "url": "https://www.lifesitenews.com/news/cardinal-betrays-natural-family-at-amoris-laetitia-summit/", "date": "2026-10-09T10:56:58+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Portandovi le notizie da una prospettiva cattolica tradizionale. CITTÀ DEL VATICANO (LifeSiteNews) – Un cardinale indiano ha esortato la Chiesa cattolica a ripensare il suo approccio alla vita familiare, sostenendo che deve accogliere “nuove forme di partenariato e convivenza”, unioni interreligiose e cambiare le idee sul genere piuttosto che insistere su un modello di “famiglia ideale”. … Il vertice di otto giorni del Vaticano per commemorare Amoris laetitia è stato strutturato per garantire il dominio dei progressisti dell’era Francesco e per promuovere un’agenda pastoralmente fluida. Il vertice si è aperto il 7 ottobre 2026, quando la suora domenicana Helen Alford, presidente della Pontificia Accademia delle Scienze Sociali, ha tenuto una meditazione introduttiva sostenendo che Nostro Signore stava inizialmente “flirtando” con la donna samaritana al pozzo nel Vangelo di San Giovanni. Neri Ferrão è un alleato di lunga data di Papa Francesco. Nel 2021, Neri Ferrão ha suscitato indignazione diffusa tra i cattolici quando ha incaricato il suo clero di visitare gli idoli di Ganesha, una divinità indù con la testa di elefante, durante una festa pagana. I fedeli cattolici hanno organizzato una petizione condannando l'arcivescovo per aver testimoniato un “relativismo religioso radicale che mette Gesù vivo alla pari con un Ganesh d'argilla”. Neri Ferrão ha respinto le critiche, sostenendo che la protesta pubblica contro l'idolatria ha ferito il sentimento di Nonostante questi scandali pubblici, Papa Francesco ha elevato Neri Ferrão al Collegio cardinalizio nell'agosto 2022 e successivamente lo ha nominato nel comitato di redazione del Sinodo sulla sinodalità del 2024. Nel 2023 è stato eletto anche nuovo presidente della Federazione delle Conferenze episcopali asiatiche.", "category": "teologia"}, {"title": "Open letter to J.K. Rowling: Why she must become Catholic", "url": "https://www.lifesitenews.com/blogs/open-letter-to-j-k-rowling-why-she-must-become-catholic/", "date": "2026-10-09T00:00:32+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Portandovi le notizie da una prospettiva cattolica tradizionale. (LifeSiteNews) — Harry Potter è tornat
