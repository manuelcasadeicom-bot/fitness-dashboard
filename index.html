<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 27 Nov 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Growing in Virtue: One Psychological Perspective", "url": "https://thomisticinstitute.substack.com/p/growing-in-virtue-one-psychological", "date": "2026-11-23T13:48:28+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Nicolas-Henri Jacob, da \"Traité complet de l'anatomie de l'homme\" di Bourgery, 1831–1854, tramite Wikimedia Commons. In questo articolo voglio concentrarmi su un quadro psicologico sviluppato dagli psicologi per pensare al processo più generale di crescita nella virtù. Questo quadro incoraggia l’attenzione su (1) motivazione, (2) mentalità e (3) mezzi. Cosa ci orienta a crescere nella virtù? Pensiamo che una crescita del genere sia possibile? E se sì, come possiamo effettivamente crescere? Lo presento come un quadro generale che può essere applicato in molti casi particolari. Motivare la crescita La motivazione qui è, in superficie, abbastanza semplice. Se vogliamo crescere in virtù o carattere, dobbiamo desiderare di crescere in quel modo. La motivazione potrebbe derivare dal riconoscimento che ci si concentra più sull’evitare il vizio che sul perseguire la virtù. Ad esempio, pensare a se stessi di fronte a una sfida – non voglio commettere errori – piuttosto che pensare a quale sia la cosa migliore che si potrebbe fare. Potremmo pensare alla motivazione per crescere nella virtù ponendoci due domande: (1) Qual è il bene che voglio far crescere nella mia capacità di realizzazione? e (2) quali sono le paure e i desideri contrastanti che inibiscono tale crescita? Se riusciamo ad affrontare adeguatamente le paure e i desideri inibitori, saremo più liberi di perseguire la crescita. Questo è ciò che spesso è la crescita nella temperanza e nella fortezza. Ancor di più, il bene in cui vogliamo crescere è idealmente un’espressione del nostro desiderio di giustizia: riconosciamo che dovremmo essere migliori per Dio e per gli altri. Grazie per aver letto Le indagini dell'Istituto Tomistico! Iscriviti gratuitamente per ricevere nuovi post ogni lunedì. Mentalità La mentalità riguarda le nostre convinzioni, in particolare riguardo alla nostra psicologia e al modo in cui funziona il mondo.", "category": "teologia"}, {"title": "What is it to Seek and Speak the Truth in Love?", "url": "https://thomisticinstitute.substack.com/p/what-is-it-to-seek-and-speak-the", "date": "2026-11-16T13:51:22+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Benvenuti alla seconda parte della mia serie in cinque parti sulla carità intellettuale. La prima parte è qui, anche se non è necessario leggerla prima di leggere questa voce. In tutti gli ambiti della vita, il cristiano è chiamato alle altezze morali: porgere l'altra guancia; fare il possibile. Siamo chiamati a emulare Cristo, che ha dato la sua vita per noi mentre eravamo ancora in ostilità con lui. Ascoltiamo parabole che ci incoraggiano ad andare oltre il dovere. In effetti, il termine tecnico per un simile atto – un atto che va oltre il dovere, come quando uno sconosciuto salva un uomo morente trovato sul ciglio della strada, portandolo in una locanda e pagando con i propri soldi – è supererogazione, una parola che ci viene dalla traduzione vulgata di San Girolamo della parabola del Buon Samaritano. Come dice il Samaritano all'oste, qualunque cosa spenderai in più (supererogaveris), te la ripagherò. Non dovrebbe quindi sorprenderci il fatto che, nel cercare e dire la verità, noi cristiani siamo chiamati a mantenere uno standard elevato. Ma qual è esattamente la norma? Quanto è alto? Ricordi quando Peter gli chiese quante volte avrebbe dovuto perdonare suo fratello? Puoi sentirlo pensare di avere già un livello piuttosto alto quando dice \"sette\". E onestamente, è piuttosto alto, non è vero? Sette volte per lo stesso tipo di peccato?! Ma ricordate la risposta di nostro Signore settantasette, o anche settanta volte sette. L’asticella per cercare e dire la verità è altrettanto audacemente alta? Grazie per aver letto Le indagini dell'Istituto Tomistico! Iscriviti gratuitamente per ricevere nuovi post ogni lunedì.", "category": "teologia"}, {"title": "Time in Science and Philosophy", "url": "https://thomisticinstitute.substack.com/p/time-in-science-and-philosophy", "date": "2026-11-09T16:10:34+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Johannes Vermeer, \"The Astronomer\",: 1668, tramite Wikimedia Commons. I fisici che lavorano sulla relatività generale portano due definizioni di tempo molto diverse nelle loro ricerche. Una è il tempo \"proprio\", che è una misura della quantità di cambiamento fisico che un sistema sperimenta. Il tempo corretto è ciò che misura un orologio. Porta un orologio dall'evento A all'evento B e il numero che mostra è un'osservabile diretta che puoi scrivere. Una serie di eventi per un dato oggetto è chiamata sua Potrei svegliarmi, andare al lavoro, sedermi per quattro ore, guidare fino a un aeroporto, prendere un aereo per la costa orientale e fare il check-in in un hotel. La mia linea d'universo ha coinvolto una serie di eventi in cui sono alternativamente fermo, mi muovo a velocità costante, accelero e mi alzo a una certa distanza dal centro della Terra. Ma l'orologio che porto con me mostrerà un tempo trascorso su cui chiunque lo legga, anche se si è spostato su una linea d'universo diversa, sarà d'accordo. d'altra parte, è una delle quattro coordinate assegnate agli eventi nel continuum quadridimensionale chiamato spaziotempo. Lo spaziotempo è costituito da tre dimensioni simili allo spazio e una dimensione simile al tempo nel nostro universo. Il percorso di qualsiasi entità materiale attraverso lo spaziotempo può essere visualizzato come una serie di eventi, che sono collegati insieme per formare la sua linea d'universo Un osservatore a terra vuole sapere quanto tempo è durato il canto secondo i suoi calcoli, deve prima assegnare i tempi agli eventi di inizio e fine nel suo sistema di riferimento stazionario, correggendo il tempo di viaggio del segnale wireless dal mio aereo.", "category": "teologia"}, {"title": "How to Get STRONGER on GLP-1s (New RCT)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-get-stronger-on-a-glp-1-new", "date": "2026-11-26T12:00:57+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Most people think that when you go on a GLP-1 for weight loss, you’ll inevitably lose strength. They’re wrong. And I’m going to prove it. But first, let me address the turkey in the room. Is it a sick joke that I’m releasing a letter about fitness and GLP-1s, of all topics, on Thanksgiving, the most gluttonous holiday of the year? Well, yes. And I, for one, love Thanksgiving! But I also love learning. And hopefully, if you’ve been around the StayCurious block enough, you’ve come to realize that learning can be pure pleasure in and of itself. So that’s what I challenge you to do with this 5,000+ word Stregnthsgiving Special! Even if you don’t implement the fitness tips until after you’re done digesting your mashed potatoes and gravy, you can still enjoy learning something new today. But let’s get into the data. *Before and after photos curtesy of my friend Matt. More from him later. There was a recent, randomized controlled trial published in Nature Medicine in which 120 adults taking the dual GLP-1/GIP receptor agonist tirzepatide (Mounjaro or Zepbound) for weight loss were randomized to resistance training 3 times per week (1 hour per session) or usual activity for 40 weeks. As an aside, the tirzepatide + resistance training group was abbreviated “T-REx,” which amused me. (I’ll pay off that joke later.) The medication was dosed up to 15 mg, which is a monster dose. Introducing: Clinical Insights If you’ll indulge me in a quick sidebar: Given the clinical nature of this study, and the fact that while I’m an MD-PhD, I’m not an experienced clinician, I thought I’d seek insight from someone who is. So, throughout this letter, I’m going to punctuate the discussion with “Clinical Insights” from a friend and colleague, Dr.", "category": "fitness"}, {"title": "Your Personal Fitness-Longevity Report Card", "url": "https://staycuriousmetabolism.substack.com/p/your-personal-fitness-longevity-report", "date": "2026-11-24T12:02:02+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "How much of human longevity is set in stone? Well, estimates of the genetic contribution to lifespan vary from around 10% to 50%. But even if we take the upper bound, that still leaves an enormous amount of room for environmental and lifestyle factors to influence how long we live and, perhaps more importantly, how well we live. The question then becomes: What truly moves the needle? Perhaps surprisingly, one of the most powerful predictors of longevity is your fitness. In fact, people with elite-level cardiorespiratory fitness have approximately an 80% lower risk of all-cause mortality (death from any cause) compared with those with low cardiorespiratory fitness. That’s a five-fold difference in mortality risk. These are data we’ve covered before in a previous letter . But today’s letter is going to pick up where that one left off. Because in that letter, we talked all about aerobic fitness as it relates to heart health and longevity. But fitness isn’t just one thing. So, in today’s letter, we’re going to expand our discussion of fitness beyond just aerobic capacity. And I’m going to hand you your very own Fitness & Longevity Report Card. We’ll break down four key dimensions of fitness and walk through four tests you can perform yourself this week, without needing a lab or a personal trainer. I’ll show you how to grade yourself along each dimension so you can identify your weak points, figure out where to invest your time and effort, and start leveling up your fitness for better healthspan and longevity.", "category": "fitness"}, {"title": "Vitamin K2 MK7 Slows Artery Calcification (Phase 3 Trial)", "url": "https://staycuriousmetabolism.substack.com/p/vitamin-k2-mk7-slows-artery-calcification", "date": "2026-11-21T12:00:45+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "When evaluating your of cardiovascular disease, the first question you should ask is not what your cholesterol is, but how much plaque is in your arteries. An actual measurement of plaque will beat a cholesterol level every time. And the most widely available and readily used measure is called the coronary artery calcium (CAC) scan. Data suggest that if you have a CAC score of zero, then irrespective of your LDL “bad” cholesterol, your risk of a cardiovascular event is low. This has come to be known as the “power of zero.” To that end, there’s a lot of interest in finding interventions that slow the progression of an artery calcification, since that’s thought to reduce cardiovascular risk. And one of the most popular and controversial supplements to potentially do so is vitamin K2 MK-7. Now, a major randomized, controlled phase 3 clinical trial just dropped a bombshell: Vitamin K2 MK-7 supplementation does indeed slow the progression of artery calcification. The finding sent ripples through the nutrition community, with vitamin K2 supplements flying off shelves at an alarming rate. But while these data are impressive and promising, there are critical nuances you need to know. What Is Vitamin K2 MK7? And How Does It work? First, let me describe what vitamin K2 MK-7 actually is. It’s a form of vitamin K2 that directs calcium into the places you want it, like your bones and your teeth, and away from the places that you don’t, such as your arteries. What makes the MK-7 form unique and thought to be superior is its long half-life, meaning it remains in your body for days rather than minutes or hours. And it’s thought to provide more sustained activation of vitamin K-dependent proteins than the vitamin K1 form, which you might get from something like a leafy green vegetable.", "category": "fitness"}, {"title": "The Part of Stacy Sims You Don't See", "url": "https://neuroathletics.substack.com/p/the-part-of-stacy-sims-you-dont-see", "date": "2026-11-18T14:47:13+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I want to tell you something about Dr. Stacy Sims that has nothing to do with fasting, or protein, or any of the science that made her name. You know her as the woman who proved that women are not small men. The TED talk. The books. The movement. The scientist who spent twenty years forcing women back into research that had erased them. What you do not see is what it cost her to become that person. In our conversation, Stacy told me something she said she has never shared on a podcast before. There was a time she tried to take her own life, and was hospitalized afterward. She has carried that quietly for years, underneath the global brand and the stage lights and the certainty you see on camera. It took real courage to say it out loud, and she said it to help any woman listening who is sitting in the same dark place she once was. And even now, she is still a target. For the simple act of saying that women deserve their own science, she gets attacked online every single day, by people who have never met her, never had one conversation with her, running off a clickbait clip. She told me it left her with PTSD. The worst of it came when her own daughter picked up a phone, saw a stranger’s cruelty aimed at her mother, and asked whether it was safe to go outside. Sit with that for a second. A woman who has given her entire career to helping other women get stronger and live longer, watching her child become frightened because of what people type. And she keeps going. She keeps publishing, keeps standing on stages, keeps saying the thing the data says even when going quiet would be so much easier. Not because she enjoys the fight, but because she decided a long time ago that someone had to carry this, and it would be her. That is the woman behind the science.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! Go watch this one. I mean it. I sat down with Dr. Michael Breus, the Sleep Doctor, and I left rethinking things I was sure I already understood. He has spent his whole career as a clinical psychologist doing one thing, fixing the way people sleep, and he is blunt in a way I loved. First thing that floored me: the Sleep Doctor himself stops breathing 26 times an hour in his sleep, and had no idea for years. How he found out: His workouts were falling apart and his mile time kept climbing He ran bloodwork, even tried testosterone, chasing every other explanation first Nothing moved Finally someone asked when he’d last done a sleep study It came back 26. He was so sure it was broken that he retook it. Same number. The Sleep Doctor had sleep apnea and didn’t know. Here’s why that should scare the rest of us: It can happen anywhere from 5 to hundreds of times an hour, and most people never know it’s happening Every time you stop breathing, your heart rate drops then spikes to restart you, loading your heart all night long. Over time that can tip into atrial fibrillation. You’re also starving your brain of oxygen, and you never sink into the deep sleep where the brain runs its own cleanup His tell for spotting it across a room: a neck over 17.5 inches carries an 83 percent chance of apnea (his number) And one story I won’t forget: a detective, benched because he kept falling asleep on stakeouts, finally got on a CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team!!!!! A brand new creatine study has arrived!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That … Read more", "category": "fitness"}, {"title": "Son of Visionary of Garabandal Speaks for the First Time", "url": "https://www.lifesitenews.com/episodes/son-of-visionary-of-garabandal-speaks-for-the-first-time/", "date": "2026-11-27T01:00:02+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. John-Henry Westen travels to Garabandal, Spain, to interview Frank Lafleur, son of the late visionary Mari Loli, about the reported Marian apparitions of 1961–1965. They discuss the prophesied worldwide Warning, a coming Miracle, the terrifying Night of the Screams, divine Chastisement, and warnings concerning communism and reverence for the Eucharist. … Opposing Communion in the hand 'extremist'? Church history disagrees 'He is a liar': Archbishop who CANCELED Fr. Ripperger called out Meet the priest who left the diocese to join the SSPX despite the excommunication", "category": "teologia"}, {"title": "47-foot statue of St. Joseph erected in France after court blocks neighboring nativity scene", "url": "https://www.lifesitenews.com/news/47-foot-statue-of-st-joseph-erected-in-france-after-court-blocks-neighboring-nativity-scene/", "date": "2026-11-26T18:50:32+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) —In France, installing nativity scenes in public remains a hot topic in the weeks leading up to Christmas. Nevertheless, on November 25, France’s largest nativity scene was set up in the center of Perpignan, a city of over 120,000 inhabitants. It will be officially inaugurated on December 4 and will remain in place until January 10. 👋 #Crèche GÉANTE Mercki @louis_aliot maire @RNational_off de Perpignan pour ce cadeau 👇 https://t.co/Rgkdgnns1g … For Father Benoît de Roeck, rector of Perpignan’s Saint John the Baptist Cathedral and Saint Joseph’s Shrine, the nativity scene in Perpignan is about more than simply preserving a tradition. “A nativity scene reminds us of the significance of this time of year and announces the birth of Christ,” said Father Benoît, noting also that Perpignan’s parishes put up beautiful nativity scenes in their churches. “The initiatives of the city council and the Church coexist and complement one another.” READ: Rioters in France desecrate statues of St. Joan of Arc during violent weekend", "category": "teologia"}, {"title": "What Leo XIV gets wrong on the role of husbands and wives", "url": "https://www.lifesitenews.com/analysis/what-leo-xiv-gets-wrong-on-the-role-of-husbands-and-wives/", "date": "2026-11-26T18:34:19+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — In an address in Peru, Leo XIV called for an equal “sharing of domestic responsibilities” in family life and rejected “the subordination of one spouse to the other” – contradicting the clear teaching of the Church on marriage. The address also offered a markedly unequal treatment of the sexes, presenting men as generally responsible for the various burdens women bear, and reserving its praise and sympathy for women alone. … Ibid., n. 10. ↑ 50 Cf. ibid., n. 8 for a discussion on such factors. ↑ 51 The theologian Fr. E. Sylvester Berry wrote the following: [I]t should be noted for whom, rather than to whom the Pope speaks. [It may be] evident from the nature of the matter treated , from the manner of treatment, or from any other circumstance, that he speaks for all […] E. Sylvester Berry, The Church of Christ , Wipf and Stock Publishers, Oregon, dated 1955, p. 271. ↑ 52 In 2019, the American Psychological Association published a document which stated “traditional masculinity… is, on the whole, harmful.” Cf. Doug Mainwaring, ‘ American Psychological Association demonizes masculinity, endangers boys with new “guidelines,” LifeSiteNews, Jan 11, 2019 Topics Catholic Church Faith Family Marriage Pope Leo XIV Tagged as Catholic Catholic Social Doctrine Church Doctri", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
