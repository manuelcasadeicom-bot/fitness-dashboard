<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 08 Oct 2026 — 09:36 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-05T15:43:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Cos'è l'umiltà? Ora, l'umiltà rende l'uomo un buon soggetto ad ogni specie e in ogni materia; mentre ogni altra virtù ha questo effetto in qualche materia speciale. Dunque dopo le virtù teologali, dopo le virtù intellettuali che riguardano la stessa ragione, e dopo la giustizia, soprattutto quella legale, viene prima di tutte le altre l'umiltà. (ST.II-II.Q161.A5.C (grassetto aggiunto). Per apprezzare la grandezza dell'umiltà, si consideri che l'umiltà sta prima delle virtù cardinali della temperanza e della fortezza. Il loro status di virtù cardinali non le rende forse più grandi dell'umiltà? L'umiltà sta prima della magnanimità e della magnificenza. Come può essere che l'umile umiltà superi queste virtù di grandezza, una delle quali è addirittura chiamata la corona delle virtù? Per rispondere perché L'umiltà è così significativa, risponderemo prima: cos'è l'umiltà? L'umiltà riguarda l'aspirazione a grandi cose e ha tre elementi principali: un elemento di controllo, un elemento di conoscenza e un elemento di motivazione. L'umiltà è la virtù con cui controlliamo le nostre aspirazioni per tutto ciò che pensiamo ci rende più grandi conoscenza di sé, soprattutto per quanto riguarda le nostre carenze e limitazioni. Controlliamo le nostre aspirazioni per riverenza divina. Siamo motivati dalla riverenza divina ad agire umilmente, e questa motivazione ci guida a cercare il nostro giusto posto nella provvidenza di Dio. Analizziamo la grandezza dell'umiltà e questi tre elementi e vediamo perché l'umiltà è così significativa.", "category": "teologia"}, {"title": "The Soul of Goodness", "url": "https://thomisticinstitute.substack.com/p/the-soul-of-goodness", "date": "2026-09-28T14:50:46+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Peter Vilhelm Ilsted, “Una madre e un bambino in un interno”, 1898, tramite Wikimedia Commons. La difficoltà della virtù Nell'Etica Nicomachea, in una frase ricca di intuizioni sia antropologiche che psicologiche, Aristotele osserva: \"Chiunque può adirarsi, questo è facile... ma esserlo con la persona giusta, nella giusta misura, al momento giusto, con il motivo giusto e nel modo giusto, questo non è da tutti, né è facile; perciò la bontà è rara, lodevole e nobile\". 1 In effetti, Aristotele sta dicendo che la natura umana è selvaggia e passionale, e che questa natura selvaggia è essenzialmente buona in quanto è un principio innato di azioni che sono di per sé buone, almeno nella misura in cui possono raggiungere il bene. Tuttavia, sta anche dicendo che la nostra natura selvaggia e appassionata richiede un’ulteriore formazione se vuole diventare del tutto buona – “lodevole e nobile” – ma che tale formazione nella bontà, per quanto estremamente necessaria, è tuttavia terribilmente rara. È così raro proprio per la difficoltà di portare a compimento questa formazione. Questa è infatti la principale difficoltà positiva della vita umana, la sfida del tutto naturale che ci viene affidata mentre procediamo verso il futuro. È la difficoltà di ricevere il dono della bontà della nostra natura e allo stesso tempo assumersi la responsabilità della corretta maturazione di questa natura, tutto affinché la nostra natura possa raggiungere il suo adeguato completamento nelle nostre vite individuali. Questa difficoltà ha un nome; il suo nome è virtù, poiché la virtù è la meta immediata di questo duro processo di formazione. Tuttavia, anche se difficile, questo compito vale sicuramente lo sforzo.", "category": "teologia"}, {"title": "The Art of Being Good", "url": "https://thomisticinstitute.substack.com/p/the-art-of-being-good", "date": "2026-09-21T15:35:14+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Winslow Homer, “Salta la frusta”, 1872, tramite Wikimedia Commons. Il bisogno di coltivazione Ho trascorso la mattinata osservando il nostro bambino di sette mesi mentre tentava di conquistare il mondo – i suoi occhi luminosi osservavano con rapita attenzione, la meraviglia che trasudava da ogni poro, i muscoli tesi nell’esplorazione e nella scoperta – tutto in lui teso alla comprensione e al conseguimento, lottando verso la verità e la bontà. Osservando il nostro bambino, mi sono ricordato ancora una volta che la nostra più grande spinta – si potrebbe anche dire il nostro istinto primordiale – è questo impulso interiore verso la verità e la bontà. Questa potente spinta è evidentemente la caratteristica più importante della vita umana, forse la più importante, e tutto nel nostro bambino si tende in avanti come risultato della sua potente spinta. Ma anche questa spinta è selvaggia. Selvaggio, non nel senso di caotico e disordinato, e quindi problematico, ma nel senso del tutto naturale di non ancora coltivato. È il selvaggio della natura prima dell'attività di un giardiniere, audace e intenso, feroce e potente, ma anche buono, con una bontà che ha bisogno solo del nostro intervento per riportarla a casa. Allo stesso modo in cui la natura selvaggia ha bisogno di un giardiniere per prosperare, così anche questa spinta interiore richiede la nostra coltivazione se vuole prendere la sua forma adeguata. La ragione di ciò si trova nel fatto che Dio non crea l’essere umano (o qualsiasi cosa) “completamente fatto”, ma piuttosto ci fornisce un’attitudine a svilupparsi nel corso del tempo – e quindi a raggiungere gradualmente la nostra perfezione naturale. Da ciò vediamo che fin dall'inizio della nostra vita siamo posti nella posizione privilegiata di essere collaboratori di Dio nella nostra stessa creazione, poiché, come nota san Tommaso, «anche alle creature è conferita da Dio la dignità della causalità».", "category": "teologia"}, {"title": "How to Master Your Nervous System to Improve Your Heart Health", "url": "https://staycuriousmetabolism.substack.com/p/how-to-master-your-nervous-system", "date": "2026-10-06T11:01:11+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Voglio iniziare parlando di un momento di cui mi vergogno. Non voglio parlartene. Tuttavia, lo farò. Perché quello che ho fatto, e quello che è successo nel mio corpo, è un’analogia quasi perfetta per parte della fisiologia del cuore che esploreremo. Ok, il mio momento di vergogna: all'inizio di quest'anno stavo uscendo da un parcheggio. Ero in un brutto stato d'animo, alle prese con alcune intense questioni personali, quando un uomo ha iniziato a urlarmi contro apparentemente all'improvviso. Dal suo punto di vista, stava proteggendo la sua anziana madre, che stava camminando dietro la mia macchina. L'avevo vista. Era a circa 8 piedi di distanza. Sapevo che non l'avrei colpita, quindi la sua reazione mi è sembrata sproporzionata. E invece di fare la cosa sensata e scusarmi e rassicurarlo, sono entrato in lotta o fuga e ho urlato in risposta. Ci siamo scambiati alcune parole colorite che non riprodurrò qui. Poi abbiamo preso strade separate, senza aver ottenuto esattamente nulla se non aumentare i livelli di stress l’uno dell’altro. Non ne sono orgoglioso. Ero decisamente imbarazzato. La mia ragazza era sul sedile del passeggero e anche lei lo ha descritto come \"estremamente fuori dal personaggio\" e ha chiesto: \"stai bene?\" Inutile dire che non lo ero. Ma non è questo il punto. Ma quello che è successo dopo è la parte importante. Il mio corpo era pronto per combattere. Il mio cuore batteva forte. La mia mascella era così serrata che penso che avrei potuto addentare una noce di cocco. Avevo le nocche bianche attorno al volante. E, mentre mi mettevo in strada, ho sentito il bisogno di sbattere l'acceleratore sul pavimento. La mia mente era su di giri. E il mio corpo burattino seguiva la sua guida. Ma non ho dato gas. Avevo qualcuno che amo in macchina con me.", "category": "fitness"}, {"title": "How to Reverse 2.5 Years of Aging in 15 Days (Proven in RCTs)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-reverse-25-years-of-aging", "date": "2026-10-03T11:02:11+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Esiste una dieta che rende le persone biologicamente più giovani di 2,5 anni in 15 giorni. Non sembra più giovane. Più giovane da un esame del sangue. E quando i ricercatori hanno analizzato i numeri, il calo dell’età biologica aveva poco a che fare con i soliti sospetti, come quanto peso si perdeva. La dieta è chiamata “dieta mima digiuno”. E proprio adesso sta vivendo un momento. Gli amici mi mettono all'angolo durante le vacanze. Gli abbonati ne parlano nelle sezioni dei commenti sui social media. Quindi, oggi, mi concedo con voi la scienza. I dati degli studi controllati sull’uomo. Le sfumature che sembrano strane finché non ne capisci la biologia. E, naturalmente, il “come fare”. Nello specifico, cosa ho mangiato per cinque giorni, quanto mi è costato: circa $ 49 (<$ 10 al giorno), contro i $ 225 che ti faranno pagare per la confezione con marchio. Per essere chiari, non ti sto vendendo un prodotto, ti mostrerò solo cosa c'è nel mio carrello della spesa. Ti racconterò anche di un'altra volta in cui ho eseguito su me stesso un test sull'età biologica e mi è tornato dicendo che ero invecchiato - e cosa rivela quel risultato su chi funziona effettivamente. Ma cominciamo con cosa è realmente una dieta mima digiuno. Cos’è la dieta mima digiuno? Innanzitutto, cos’è una dieta mima digiuno? La premessa è semplice. Il digiuno innesca una notevole cascata di cambiamenti metabolici. Ma per ottenere molti di questi effetti, in genere è necessario qualcosa di più del semplice mangiare quotidiano limitato nel tempo. Possono essere necessari 3 giorni interi di digiuno di sola acqua prima che inizino quei cambiamenti metabolici più profondi. Questo è il problema perché la maggior parte delle persone non è interessata o non è in grado di digiunare per tre o cinque giorni consecutivi.", "category": "fitness"}, {"title": "The Mushroom I'm Eating for Brain Health", "url": "https://staycuriousmetabolism.substack.com/p/the-mushroom-im-eating-for-brain", "date": "2026-10-01T11:02:05+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Di tanto in tanto leggo un articolo che cambia ciò che finisce nel mio piatto. Questo era uno di quegli articoli, recentemente pubblicato su Nature Aging. E il cibo in questione è un fungo, molto particolare. Ora, potrei svelare la sua identità segreta proprio adesso... ma che divertimento sarebbe? Penso che tu debba guadagnare queste informazioni. Quindi lascia che ti guidi attraverso i dati. L’obiettivo di alto livello era semplice: determinare quali metaboliti nel sangue fossero collegati a: Migliore cognizione Maggiore volume del cervello Minore rischio di malattia di Alzheimer. Quindi, i ricercatori hanno iniziato cercando associazioni tra 991 metaboliti del sangue e misure di cognizione e volume cerebrale, valutate mediante risonanza magnetica (MRI), in 1.082 adulti di mezza età. Dopo aver identificato un sottoinsieme di metaboliti legati alla cognizione o al volume del cervello, hanno convalidato tali risultati in coorti indipendenti e poi hanno testato se quegli stessi metaboliti fossero associati anche al futuro sviluppo della malattia di Alzheimer. In effetti, stavano cercando una storia coerente: quali metaboliti venivano costantemente monitorati con una migliore cognizione, un maggiore volume del cervello e un minor rischio di malattia di Alzheimer in più popolazioni? Ma quello era solo il passaggio 1… Il passaggio 2 consisteva nel determinare quale di questi metaboliti potesse effettivamente essere influenzato da fattori modificabili come lo stile di vita, i farmaci e la dieta. È così che hanno iniziato a mettere insieme i pezzi del puzzle. E una molecola salì in cima: l'ergotioneina. Cos'è l'ergotioneina? L'ergotioneina è un aminoacido contenente zolfo con proprietà antiossidanti e antinfiammatorie. È interessante notare che i suoi livelli diminuiscono anche con l’età, parallelamente alla graduale perdita delle difese antiossidanti che si verifica con l’avanzare dell’età.", "category": "fitness"}, {"title": "Men AND Women Need Estrogen.", "url": "https://neuroathletics.substack.com/p/estrogen-has-4-main-roles-in-the", "date": "2026-10-07T12:48:12+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, un mio amico, quarantasei anni, affilato come una lama, il mese scorso si è seduto nello studio di un medico e ha posto una semplice domanda. Dovrebbe iniziare la terapia ormonale, per il suo cervello. Ha alzato le spalle. Qualche vaga rassicurazione. Una riga su come le prove sono mescolate. Se n'è andata senza niente, che è ciò con cui se ne va la maggior parte delle donne, e mi ha chiamato frustrata, perché non lo chiede per vanità. Sua madre ha l'Alzheimer. Sta guardando l'orologio. Ecco quello che nessuno le ha messo davanti, ed è la cosa che voglio mettere davanti a te. Il motivo per cui non è riuscita a ottenere una risposta chiara non è che la scienza sia debole. È che la vera scienza è scomoda. Non sta in un ricettario o in un titolo, e quindi viene appiattito in “le prove sono contrastanti”, il che è vero e anche inutile. Conosci già le guerre della terapia ormonale. Conosci il WHI, il contraccolpo, la lenta riabilitazione. Non ho intenzione di rievocare il 2002 con te. Sei più intelligente di quella conversazione. Voglio portarti sotto, nella parte che decide effettivamente la risposta. Inizio da qui, perché questa è la frase che ha riorganizzato il modo in cui penso al cervello femminile. In uno studio fondamentale, Roberta Brinton e i suoi colleghi sostengono che la perimenopausa non è affatto un evento riproduttivo. È neurologico. E gli estrogeni, scrivono, non sono un ormone sessuale che capita di visitare il cervello. È un regolatore principale del modo in cui il cervello produce e spende energia (Brinton et al., Nature Reviews Endocrinology, 2015). Siediti con quella parola. Regolatore principale. Di energia. Nell'organo più assetato di energia che possiedi. È solo il momento di festeggiare il mio incontro con la dottoressa Rhonda Patrick. Abbiamo parlato entrambi la settimana scorsa a Vancouver. L'organo che si surriscalda. Il tuo cervello è una fornace.", "category": "fitness"}, {"title": "Vox Media Should Be Ashamed of This Headline", "url": "https://neuroathletics.substack.com/p/vox-media-should-be-ashamed-of-this", "date": "2026-10-06T16:16:30+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Questa settimana ho visto un titolo che mi ha fatto davvero arrabbiare, e non lo dico alla leggera. Era uno di quei titoli grandi, pieni di speranza, di un angolo che è stato girato sull'Alzheimer. Del tipo che una donna la cui madre sta scappando legge sul suo telefono a mezzanotte e sente il suo petto aprirsi per un secondo. Del tipo che fa riflettere una famiglia, forse. Forse c'è qualcosa adesso. Così ho pagato i due dollari e ho letto tutto. Ed ecco la parte strana. L'articolo in sé è più attento del titolo. Il giornalista cita i rischi. Nota anche che l'hype ha già superato la scienza in passato. Ma quasi nessuno legge l’intero articolo. Leggono il titolo, ne sentono la luminosità e se ne vanno credendo che siamo più vicini a una cura di quanto lo siamo noi. Questo divario, tra ciò che implica un titolo scremato e ciò che dice effettivamente la scienza, è la cosa che ferisce le persone reali. Quindi lascia che ti spieghi cosa dice realmente la scienza. La storia parla in realtà di due farmaci. Lecanemab e donanemab. Potresti aver visto i nomi dei marchi, Leqembi e Kisunla. Sono, ad essere onesti, un vero progresso, e non glielo toglierò. Sono i primi farmaci che hanno chiaramente e definitivamente rallentato il declino cognitivo dell’Alzheimer in ampi studi. Per una malattia che ha umiliato ogni trattamento che le è stato somministrato per decenni, questo è importante. Ma ecco cosa non ti dice il titolo e cosa ogni famiglia merita di sapere prima che la loro speranza venga dirottata. Questi farmaci non migliorano nessuno. Vorrei essere preciso, perché qui il punto è la precisione. Negli studi, lecanemab ha rallentato il declino di circa il 27% e donanemab di circa il 35% in diciotto mesi (van Dyck et al., New England Journal of Medicine, 2023; Sims et al., JAMA, 2023). Leggi attentamente quei numeri.", "category": "fitness"}, {"title": "Are you happier if you get more sunlight?", "url": "https://neuroathletics.substack.com/p/are-you-happier-if-you-get-more-sunlight", "date": "2026-09-28T20:09:28+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, uno studio alla luce del mattino ha attirato la mia attenzione per ciò che è migliorato e cosa no. Trentatré studenti universitari si sono sentiti meno assonnati dopo una settimana di esposizione mattutina alla luce intensa. Ma le loro prestazioni nei test di attenzione e memoria non sono migliorate. Questo è un risultato interessante se, come me, passi la tua vita lavorativa a chiederti cosa aiuta effettivamente il cervello. Innanzitutto, cosa ha effettivamente mostrato lo studio? Nella prestampa di luglio 2026, i partecipanti hanno completato una settimana utilizzando un dispositivo luminoso da 10.000 lux per 30 minuti ogni mattina e un’altra settimana nelle loro consuete condizioni di illuminazione. L'ordine è stato randomizzato. Durante la settimana in piena luce, hanno riferito meno sonnolenza diurna, con la differenza maggiore a mezzogiorno. I ricercatori hanno anche segnalato una migliore efficienza del sonno stimata da Fitbit e una durata del sonno più coerente. Ma i test cognitivi non hanno mostrato miglioramenti. Si trattava di uno studio piccolo e breve, senza periodi di washout tra le condizioni, e non è stato certificato da una revisione paritaria. Non è possibile stabilire se la luce del mattino migliori la cognizione in modo più ampio. Ha anche testato un dispositivo, non pochi minuti all'aperto. La mia interpretazione: risultati incoraggianti sulla sonnolenza e sui ritmi del sonno, senza un beneficio dimostrato sulla memoria in questo esperimento. Mi prenderei volentieri un pomeriggio meno assonnato. Vorrei solo che lo descrivessimo accuratamente. Innanzitutto, perché la luce dovrebbe influenzare il tuo cervello? La tua retina fa molto più che aiutarti a vedere. Contiene cellule gangliari retiniche intrinsecamente fotosensibili o ipRGC. Queste cellule rilevano la luce attraverso un pigmento chiamato melanopsina, ricevendo anche input provenienti da bastoncelli e coni. Alcuni inviano segnali direttamente al nucleo soprachiasmatico, o SCN, nell'ipotalamo: il tuo orologio circadiano centrale.", "category": "fitness"}, {"title": "Canada pauses euthanasia expansion for mentally ill but rejects ban", "url": "https://www.lifesitenews.com/news/canada-pauses-euthanasia-expansion-for-mentally-ill-but-rejects-ban/", "date": "2026-10-07T23:52:22+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "OTTAWA (LifeSiteNews) – Il governo federale canadese ha detto che sospenderà l’espansione pianificata per consentire l’eutanasia a coloro che hanno malattie mentali come unica causa, ma non ha fornito dettagli. Allo stesso tempo, i membri del Parlamento hanno votato contro un disegno di legge che avrebbe vietato completamente la pratica. Mercoledì, il ministro liberale della Giustizia Sean Fraser ha detto ai giornalisti che nelle prossime settimane verrà presentata una legislazione per fermare la prevista espansione dell'Assistenza medica ai morenti (MAiD) a coloro che hanno solo malattie mentali come motivo. … Il governo liberale sotto l’ex primo ministro Justin Trudeau e ora Carney ha lavorato per espandere l’eutanasia di 13 volte da quando è stata legalizzata nel 2016. Il Canada ora ha il programma di suicidio assistito in più rapida crescita nel mondo. Nel frattempo, Health Canada ha pubblicato una serie di studi sulle richieste avanzate di suicidio assistito. Come riportato da LifeSiteNews, i vescovi cattolici canadesi hanno affermato di sostenere il disegno di legge C-218. L’eutanasia in Canada è diventata così diffusa che recenti statistiche mostrano che la nazione ha registrato più morti per eutanasia che omicidi per armi da fuoco negli Stati Uniti nel 2024.", "category": "teologia"}, {"title": "Alito calls same-sex ‘marriage’ ruling a ‘decisive’ blow to religious liberty", "url": "https://www.lifesitenews.com/news/alito-calls-same-sex-marriage-ruling-a-decisive-blow-to-religious-liberty/", "date": "2026-10-07T19:53:46+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) – Una nuova raccolta di osservazioni del giudice della Corte Suprema degli Stati Uniti Samuel Alito evidenzia la convinzione del giurista conservatore secondo cui la ridefinizione forzata del matrimonio per includere le coppie dello stesso sesso ha segnato “forse il punto decisivo nella svolta della nostra nazione contro la libertà religiosa”. Questo mese è stato pubblicato So Ordered, che articola la filosofia giudiziaria di Alito attraverso i vari discorsi tenuti nel corso della sua carriera, organizzati per argomenti. ABC News ha notato che tra i temi trattati c’è la fatidica sentenza Obergefell v. Hodges del 2015 in cui la più alta corte della nazione ha costretto tutti i 50 stati a riconoscere le unioni omosessuali come matrimoni. Alito era tra i dissenzienti. … Tre degli attuali giudici in carica – Alito, il presidente della Corte Suprema John Roberts e il giudice conservatore Clarence Thomas – dissentirono da Obergefell. Thomas e Alito sono considerati voti affidabili da ribaltare se si presentasse l'occasione, date le dichiarazioni rilasciate da entrambi negli anni successivi. Ma è meno certo come si pronuncerebbero Roberts e i tre più recenti nominati repubblicani della Corte, date le dichiarazioni passate sul rinvio ai precedenti e i loro precedenti contrastanti su casi importanti per i conservatori. In No Further, in pratica, anche se la Corte Suprema annullasse Obergefell, il riconoscimento del “matrimonio” tra persone dello stesso sesso sarebbe ancora obbligatorio a livello nazionale, grazie alla firma dell’ex presidente Joe Biden del cosiddetto Respect for Marriage Act, che ha codificato Obergefell, nel 2023. Trentadue stati hanno ancora debitamente emanato divieti di “matrimonio” tra persone dello stesso sesso, secondo la World Population Review, e tutti sono stati approvati. bloccato dall'esecuzione dal Obergefell .", "category": "teologia"}, {"title": "Leo XIV to join Assisi’s false-religion summit; Burke defends Co-Redemptrix", "url": "https://www.lifesitenews.com/episodes/leo-xiv-to-join-assisis-false-religion-summit-burke-defends-co-r
