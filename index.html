<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 11 Sep 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "On Grit and Fortitude", "url": "https://thomisticinstitute.substack.com/p/on-grit-and-fortitude", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Sant, &#8220;Courage, Anxiety, and Despair: Watching the Battle,&#8221; 1850, via Wikimedia Commons. An Introduction to Grit and Fortitude Stories valorizing perseverance through difficulty and trial&#8212;sometimes called grit&#8212;have existed as long as we have records, as far back as Homer&#8217;s Iliad and Odyssey . Grit continues to be celebrated in our culture in stories of those who have endured great hardship. Is grit alone enough? Should we seek something more? Grit emerged onto the scene in psychology roughly two decades ago. Popularized especially by the work of Angela Duckworth, founder of the Character Lab . Grit, understood as perseverance in long-term goal pursuit, relates to both energy and endurance. Those with grit tend to be more successful in school and career, and they tend to have better health outcomes. Interest in grit was especially high in the United States military in order to improve resilience among officers . These psychologists seem to believe that grit is good. Others agree and have taken to calling it a performance virtue. Given this modern virtue&#8217;s two main facets, energy and endurance, grit seems to align closely with Thomas Aquinas&#8217; views on fortitude. Aquinas considers fortitude to have two main facets as well, endurance and &#8216;attack&#8217;, understood as preparing for and engaging with difficult tasks . So far then, it seems that grit and fortitude are similar, with attack relating closely to maintaining energy. However, given Aquinas&#8217; views of virtue, fortitude is subject to reason and ideally to right reason. Grit has no such constraint. Does this matter? If so, why? Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts in your inbox every Monday.", "category": "teologia"}, {"title": "Boasting: The Big I and the Little You", "url": "https://thomisticinstitute.substack.com/p/boasting-the-big-i-and-the-little", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Woodville, &#8220;Politics in an Oyster House,&#8221; 1848, via Wikimedia Commons. What is boasting, according to St. Thomas Aquinas? In a job interview, you must sell yourself. While it would be counterproductive to overstate your abilities in an incredible way, you must promote yourself vigorously. In social situations, by contrast, such self-promotion could be disastrous. And yet, it can be sensible to recommend ourselves to others in a subtle manner. Discerning how to behave in such situations requires prudence. So, how much can we boast? Isn&#8217;t boasting a sin? If so, how grave a sin is it? In this article, we will turn to St. Thomas for guidance on these questions. In the question on boasting in the Summa Theologiae , St. Thomas offers this definition of boasting: Jactantia (boasting) seems properly to denote the uplifting of self by words: since if a man wishes to throw (jactare) a thing far away, he lifts it up high. And to uplift oneself, properly speaking, is to talk of oneself above oneself. This happens in two ways. For sometimes a man speaks of himself, not above what he is in himself, but above that which he is esteemed by men to be; and this the Apostle declines to do when he says (2 Corinthians 12:6): &#8216;I forbear lest any man should think of me above that which he sees in me, or anything he hears of me&#8217; ( ST II-II, q. 112, a. 1 ). Thus, Paul spoke well of himself on occasion, yet he spoke honestly. But &#8220;in another way a man uplifts himself in words, by speaking of himself above that which he is in reality.&#8221; Here then, there is a certain dishonesty in exaggerating one&#8217;s merits.", "category": "teologia"}, {"title": "The Emotions of Fortitude", "url": "https://thomisticinstitute.substack.com/p/the-emotions-of-fortitude", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Giordano, &#8220;Allegory of Prudence, 1682, via Wikimedia Commons. What is Fortitude? Fortitude, or courage, is a virtue that enables us to face significant threats and overcome significant obstacles to our good. A common supposed image of fortitude today might involve a fearless superhero in the face of a foe or a fearful but determined soldier in the face of the enemy. But we cannot tell simply from what a person does whether he or she acts with fortitude. In fact, the superhero may not have fortitude at all while the soldier may. The reason is that fortitude requires fear. This may surprise you given it is common today for fearlessness to be held up as the ideal in facing danger. But St. Thomas knows better. Fortitude, in its primary sense, involves facing threats that may result in our death or serious injury. Fear is a natural response when facing the greatest threats to our life or what we love most. Fortitude controls and harnesses fear, and other emotions as well, to face the threats. These other emotions are hope and daring . For Aquinas, fear and daring are contrary emotions. This means that we cannot have them at the same time regarding the same object. This raises a puzzle. How can a single virtue require two contrary emotions? Isn&#8217;t that impossible? Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts in your inbox every Monday. Fortitude and the Stages of a Prudent Human Act To answer this question, and to show the place of the emotion of hope as well, we&#8217;ve got to think about human action. In his discussion of prudence , St. Thomas writes, Prudence is right reason applied to action , as stated above (A. 2).", "category": "teologia"}, {"title": "Are You An Exercise Non-Responder?", "url": "https://staycuriousmetabolism.substack.com/p/why-your-workouts-arent-working-its", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Do you get the feeling that your workouts just aren&#8217;t working? You show up day after day, week after week, month after month. You put in the work. And yet, the results don&#8217;t match the effort. You start to wonder: Shouldn&#8217;t I be seeing more gains for my effort? Am I just unlucky? It feels almost conspiratorial to say out loud. And nobody wants to be a whiner. So, you keep going, and you keep quiet. But that phenomenon is real. It&#8217;s been recognized for years. In fact, the fitness world even has a name for it: &#8220; non-responders &#8221; or &#8220; low-responders &#8221; to exercise. The implication is that some unlucky people just don&#8217;t respond as well. And it&#8217;s usually chalked up to bad genetics. The good news is that when you actually dig into the data, the story is far more nuanced, and far more actionable! Today, we&#8217;re delving into a study that cracks open the mystery of exercise &#8220;non-responsiveness.&#8221; And the answer isn&#8217;t genetics. It&#8217;s something else entirely that is completely within your control. Premium subscribers get full access to my deep dives into cutting-edge metabolic research for less than $1/letter, 3 per week. You&#8217;ll always walk away with at least one new insight about metabolic health. In the rest of this letter for StayCurious Metabolism Premium members, we dive into: The real culprit behind exercise non-responsiveness A combination of animal and human data Actionable strategies you can use today to get more out of every workout. If you want to join a community of people who care deeply about metabolic health, and who aren&#8217;t satisfied with surface-level answers, now is as good a time as any! If you don&#8217;t think you&#8217;re getting value, cancel at any time.", "category": "fitness"}, {"title": "Lp(a) Masterclass: What It Is and What to Do About It", "url": "https://staycuriousmetabolism.substack.com/p/lpa-masterclass-what-it-is-and-what", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "*News note: The big news of the last few days was the negative result of the Lp(a) HORIZON trial, a large Phase 3 trial in which an Lp(a)-lowering drug failed to reduce cardiovascular events. The cardiology world is in a little bit of a free fall right now. Whether or not you&#8217;re aware of this trial, I&#8217;ll provide my commentary in a postscript at the end. All the teachings herein still apply. You just get a little extra nuance. When I was first diagnosed with elevated Lp(a), I was scared. I knew what the numbers meant. Statistically, my lifetime risk of a heart attack was dramatically higher&#8212;perhaps by as much as 230% . And because heart disease runs in my family, this wasn&#8217;t just an abstract statistic. I inherited high Lp(a) from my father, who almost died of a heart attack at just 44 years old. I had every reason to be frightened. I&#8217;m not anymore. What changed wasn&#8217;t my genetics. My Lp(a) is still high. What changed was my understanding. The Lp(a) Myth Over the past few years, Lp(a) has gone from obscurity to becoming the newest cardiovascular supervillain. Darth Vader. Thanos. Voldemort. Pick your franchise. And if you&#8217;re interested in heart health, you&#8217;ve almost certainly heard that elevated Lp(a) substantially increases cardiovascular risk. What you may also have heard is that &#8220; it&#8217;s almost entirely genetic .&#8221; And &#8220; there are no medications available shown to lower Lp(a) and reduce cardiovascular risk .&#8221; Those statements have truth to them. There&#8217;s also, &#8220; so there&#8217;s nothing you can do about it .&#8221; That one? That one is dead wrong. While your Lp(a) level is largely determined by your genes, the amount Lp(a) increases your cardiovascular risk is not. Point blank.", "category": "fitness"}, {"title": "GLP-1s Extend Lifespan in Mice. What About Humans?", "url": "https://staycuriousmetabolism.substack.com/p/glp-1s-extend-lifespan-in-mice-what", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "A drug just made old mice live 12% longer. Not a drug you&#8217;ve never heard of, but one that about 15 million Americans are already injecting into their bodies every week: a GLP-1. Now, the moment anyone tells you something extends lifespan, your skepticism should switch on like a hunger neuron at the sight of pecan pie. And I want you to hold on to that skepticism for this entire letter. It&#8217;s good because longevity claims are notoriously difficult to prove in humans. That&#8217;s why we often lean on animal studies. But animal longevity results have a long, humbling history of failing to translate to people. So, do the results of this new paper, published in Nature , mean you&#8217;ll live 12% longer if you start a GLP-1? Probably not. But I also think dismissing this as &#8220;just a mouse study&#8221; would cause you to miss the deeper point. The story here isn&#8217;t about just lifespan. It&#8217;s about seeing past the tip of the metabolic iceberg, to the far more fascinating belly beneath. So, let&#8217;s break down these new data and what they mean for you. And, at the end, we have a special treat, a StayCurious consultation with a double board-certified physician who has counseled hundreds of patients on peptides and longevity. But that will be your dessert. Finish your food first&#8230; The Mice That Lived 12% Longer The first experiment was the headline-grabber. Old mice (20 months, which is about 70-years-old in human years) were given semaglutide, a GLP-1 receptor agonist for three months. Treatment reduced food intake by 24%, drove weight loss, and significantly increased lifespan, with median lifespan increasing from 742 days in the control group to 834 days in the semaglutide group (12% increase in median lifespan).", "category": "fitness"}, {"title": "I’ll Say it... GLP1’s are a Longevity Drug and they Work Better in Women than Men", "url": "https://neuroathletics.substack.com/p/ill-say-it-glp1s-are-a-longevity", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I was on FaceTime with my sister-in-law yesterday. She&#8217;s 47, she&#8217;s been trying for months to get back to the strongest version of herself, and she&#8217;s doing everything right, or everything she&#8217;s been told is right, and it isn&#8217;t quite working. So I mentioned GLP-1s. Gently. Just as one thing worth understanding. And her face changed. &#8220;Aren&#8217;t those the ones that make your hair fall out and eat your muscle?&#8221; She&#8217;d read the posts. The muscle loss, the thinning hair, the gaunt &#8220;Ozempic face.&#8221; She was scared of them, and she couldn&#8217;t actually tell me what they did or how they worked. She just knew she was supposed to be afraid. And I sat there thinking, this is one of the most-studied drugs in modern medicine, and one of the smartest women I know is terrified of it based on captions. That conversation is why I&#8217;m writing to you today. Because my sister-in-law is not unusual. She&#8217;s the rule. Most people I talk to are frightened of these drugs and fascinated by them at the same time, and almost nobody has been given the honest version. So let me give it to you. Because two days ago, something landed that changes the conversation entirely. A team at UC Berkeley took a group of old female mice, the mouse equivalent of a woman in her late 60s, and gave half of them a GLP-1 drug. The same class of drug as Ozempic and Wegovy. Not from youth. From old age. And the mice that got the drug lived meaningfully longer than the ones that didn&#8217;t. Their median lifespan went from 742 days to 834 days. That&#8217;s about 12% more life, and it was published in Nature two days ago (Feng et al., 2026). From Feng et al., Nature (2026), used under CC BY 4.0.", "category": "fitness"}, {"title": "What Is Brain Span? The Midlife Window That Decides Alzheimer’s Risk in Women", "url": "https://neuroathletics.substack.com/p/what-is-brain-span-the-midlife-window", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, Lifespan is how long you live. Healthspan is how long you stay well. Brain span is how long your mind still works: memory, judgment, language, the ability to stay yourself. That is the number I care about as a clinical neurophysiologist. And it is not a 70-year-old number. Alzheimer&#8217;s pathology can start between 45 and 65, years to decades before anyone forgets a name. Average age at diagnosis is 72. By then the window where you could have changed the trajectory has been open, and mostly ignored, for twenty years. For women, that window has a name. It is midlife. It is the menopause transition. Lisa Mosconi&#8217;s March 2026 review in the Journal of Clinical Investigation calls it what it is: the front line of Alzheimer prevention . Nearly two-thirds of people with Alzheimer&#8217;s are women. A 45-year-old woman&#8217;s lifetime risk is about 1 in 5, twice that of a man the same age. Longevity does not fully explain that gap!! Alzheimer&#8217;s is a midlife disease that shows up late We keep treating Alzheimer&#8217;s as a disease of old age because that is when we diagnose it. The plaques, the tangles, the drop in the brain&#8217;s glucose metabolism: those are already moving in the years around menopause. Mosconi&#8217;s imaging synthesis is blunt. Postmenopausal women, and to a lesser extent perimenopausal women, carry a heavier Alzheimer&#8217;s biomarker load than premenopausal women and than men of the same age: more amyloid, more tau, lower brain glucose use, less gray matter in the regions Alzheimer&#8217;s hits first. Those differences survived age adjustment. Mosconi still flags that postmenopausal women are typically older, so residual aging cannot be ruled out. Endocrine change is the leading explanation, not a closed case.", "category": "fitness"}, {"title": "Jim Kwik: Your Brain Has a Savings Account. You're Probably Draining It.", "url": "https://neuroathletics.substack.com/p/jim-kwik-your-brain-has-a-savings", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, Jim Kwik was called &#8220;the boy with the broken brain&#8221; by a teacher, out loud, when he was nine. A brain injury at five left him years behind. He&#8217;s now the brain coach Hollywood actors and CEOs hire to think faster. So when he talks about what a brain can rebuild, I listen. We met to talk about AI. But the thing I keep coming back to is simpler, and it&#8217;s the most useful way to think about your brain I&#8217;ve heard in a long time. He calls cognitive reserve a savings account. It&#8217;s real neuroscience, and it&#8217;s why two people can have the same Alzheimer&#8217;s pathology in their brains while one loses their memory and the other stays sharp at 90. The reserve is the buffer. You spend a lifetime building the balance, and it&#8217;s what protects you when things start to go wrong underneath. Every day, you either make a deposit or take a withdrawal. The withdrawals are the ones you already suspect: bad sleep, chronic stress, sitting all day, processed food. But Jim named a new one. Every time you let a machine do your thinking, that&#8217;s a withdrawal. He pointed to an MIT study where people wrote essays with ChatGPT, with Google, or with just their heads. The AI group had the least brain engagement and barely remembered what they&#8217;d written. His line: you don&#8217;t go to the gym and have someone lift the weights for you. But that&#8217;s what we&#8217;re doing with our minds all day. The deposits are small, free, and completely in your hands. This is the part your evening is made of: Read the actual book, not the AI summary. Do the tip math in your head. Kill the calculator for small stuff. Sit in a boring moment instead of grabbing your phone.", "category": "fitness"}, {"title": "Natural Alternatives to Benzodiazepines", "url": "https://chrismasterjohnphd.substack.com/p/natural-alternatives-to-benzodiazepines", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Benzodiazepines are marketed (informally) as &#8220;psych meds&#8221; as if they primarily act on anxiety and stimulation circuits in the brain, but there is no such thing as a &#8220;psych med&#8221; because there are no targets that are only found in the brain and because there are no drugs that when taken orally primarily go to the brain. They have the highest relative uptake into the adrenal gland and they have the highest absolute uptake into muscle and fat. They probably act on GABA receptors found widely outside of the nervous system. While they are not active on the unique GABA receptors in the liver, they are probably active at GABA receptors on the lungs, kidneys, immune cells, reproductive organs, and pancreas. GABA itself regulates mitochondrial metabolism indirectly, but benzodiazepines have two independent mitochondrial targets that lie directly in the mitochondrial membrane and are unrelated to their actions on GABA receptors. There is no evidence that benzos are more powerful regulators of GABA metabolism than of mitochondrial metabolism. In fact, their solubility in fat and cell membranes might make them much more efficient at accessing their mitochondrial targets than at accessing GABA receptors. Like SSRIs , benzos are whole-body mitochondrial drugs. As with SSRIs, benzos are playing with mitochondrial fire. These claims are supported by the evidence and arguments found in the first installment of this series: People who use benzos have 60% greater mortality per unit time than people who don&#8217;t, but people who quit them have 60% greater mortality per unit time than people who stay on them. We cannot say whether these trends represent causation.", "category": "fitness"}, {"title": "Massie is a Real-Food Hero", "url": "https://chrismasterjohnphd.substack.com/p/massie-is-a-real-food-hero", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Some $15 million are being spent to oust Thomas Massie today , and no one in congress is more close to those of us in the real food movement than this man. Thomas Massie and me on October 26, 2024 at Wise Traditions, the annual conference of the Weston A. Price Foundation, where he gave the keynote. Massie himself is a grass-fed off-the-grid farmer. My friend John Moody profiled his farm here. The farm is powered by solar panels and Tesla batteries with a house the Massie family built themselves out of logs they cut from their own woods and with stone they quarried from their own land. The home is heated from the same wood, and water comes from a well that Massie dug by hand with his neighbor. They grow peaches and apple trees, raise pastured chickens with an automatic tractor, and raise grass-fed cattle. Massie once admitted to Moody he used Google Maps to spy on Joel Salatin to get new ideas for his farm. No one paid me to write this. Massie has never given me any money but I have donated to his campaign. Massie originated and championed the Processing Revival and Intrastate Meat Exemption &#8220;PRIME&#8221; Act. Crafted by the Farm-to-Consumer Legal Defense Fund, in turn founded by Sally Fallon Morell of the Weston A. Price Foundation and others, this act is meant to remove the USDA as an impediment to small farmers. Small, locally run custom slaughterhouses are all over the place in the United States. USDA slaughterhouses are vanishingly rare and often at great distances away from farmers. The custom slaughterhouses are used by homesteaders and hunters who eat their own meat.", "category": "fitness"}, {"title": "What's Wrong With Jordan Peterson's Health?", "url": "https://chrismasterjohnphd.substack.com/p/whats-wrong-with-jordan-petersons", "date": "2026-09-11T05:01:16.455845+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Jordan Peterson&#8217;s health has been suffering tremendously. Mikhaila, his daughter, saw that what was ailing him was affecting so many systems of his body that it had to all be connected and began to wonder if it was a form of mitochondrial dysfunction. In trying to research whether mitochondrial dysfunction could be driven by the turning points in his health problems like SSRI withdrawal, benzodiazepine withdrawal, and toxic mold, she found my work and reached out to me. This is the conversation that we had: My hypothesis is as follows. Mikhaila shares half of Jordan&#8217;s genes and has been more detailed about her own health journey going back to childhood, so we start with her. She had juvenile arthritis symptoms starting at 2 and a diagnosis at 7. She went on Enbrel, a &#8220;biologic&#8221; (a pseudoscientific regulatory term) that opposes the action of the inflammatory mediator tumor necrosis alpha (TNF-alpha); and on methotrexate, which inhibits folate and adenosine metabolism. Methotrexate raises adenosine, which inhibits T cell proliferation. Its inhibition of folate metabolism is thought to be more relevant to cancer but its adenosine-mediated inhibition of T cell proliferation is thought to be more relevant to autoimmune arthritis. The next year, at age 8, she was diagnosed with depression and put on SSRIs. My hypothesis is that she has an underlying block in mitochondrial metabolism leading to CoA sequestration, which occurs when CoA-requiring pathways fail to complete properly. This leads to secretion of TNF-alpha as part of a cellular stress response. TNF-alpha serves to increase carnitine transport into the cell.", "category": "fitness"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
