<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 31 Oct 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Introducing the Porphyrian Tree of Virtue", "url": "https://thomisticinstitute.substack.com/p/introducing-the-porphyrian-tree-of", "date": "2026-10-26T13:31:10+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Un nuovo modo di studiare la teoria della virtù di San Tommaso Benozzo Gozzoli, \"Il trionfo di San Tommaso su Averroè\", 1468-1484, tramite Wikimedia Commons. Siamo molto felici di annunciare qualcosa che è in lavorazione da anni: un progetto enorme. L'Istituto Tomistico, insieme al Progetto Quattro Pilastri dell'Università di St. Thomas (MN), ha finanziato uno Scientia Salon sulla Teoria e Pratica della Virtù. Questo gruppo di esperti si è assunto il compito di creare un albero porfiriano delle virtù, presentando la teoria di San Tommaso d'Aquino in tutta la sua gloria gerarchica. “Ma cos’è un albero di porfiro?” si chiede il tuo amico ad alta voce. Prende il nome dal filosofo del III secolo Porfirio, un seguace di Aristotele che aveva un debole per le rappresentazioni pittoriche. Per crearne uno, si inizia con un concetto, diciamo, la sostanza, quindi si forniscono distinzioni esaustive tra i tipi. Forse la sostanza si divide tra materiale e immateriale. Quindi si passa a quel passaggio, suddividendo ulteriormente le varietà. La materia si divide in vivente e non vivente; vivere tra il sensibile e l'insensibile; sensibile tra razionale e irrazionale. Se elabori tutti i tipi in tutti i rami, avrai un intero albero di distinzioni, il che è sufficiente a far battere il cuore di qualsiasi filosofo. Questo è ciò che abbiamo fatto con la visione della virtù di Tommaso d’Aquino. È davvero qualcosa da vedere. Dovresti andare a vederlo. Ma prima di partire, lasciami dire qualcosa su cosa c'è laggiù. Visualizza l’Albero della Virtù Gli studiosi del Scientia Salon Thomas hanno una portata così ampia, ma anche così dettagliata nella sua sofisticatezza, che a volte può essere difficile orientarsi.", "category": "teologia"}, {"title": "Why is Public Discourse so Hard?", "url": "https://thomisticinstitute.substack.com/p/why-is-public-discourse-so-hard", "date": "2026-10-19T13:30:43+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Quasi dieci anni fa, un mio caro amico mi convinse a unirmi a un importante comitato nella scuola che allora frequentavano i nostri figli. Ha detto che prevedeva discussioni difficili verso di noi e che voleva più persone nel comitato che fossero in grado di mantenere la calma nelle discussioni accese e condividere ragionamenti attenti e calmi. Chiamiamola Huldah, dal nome della profetessa dell'Antico Testamento che vide ciò che sarebbe accaduto. Sono un professore di filosofia che studia la virtù nella tradizione intellettuale cristiana. Ciò significa che il mio lavoro, come filosofo, mi porta a dissentire cordialmente tutto il giorno, e il contenuto della mia ricerca mi fa riflettere su come farlo bene. Quindi non ha fatto cilecca quando mi ha chiesto di unirmi al comitato. Eppure, non ero affatto preparato agli incontri affollati e acri che si sono verificati. Nicolas Andrre Monsiaux, “Il dibattito tra Socrate e Aspasia”, via Wikimedia Commons, 1801. Anche se su entrambi i lati del dibattito c’erano persone ragionevoli e comprensive, erano la minoranza. Una donna ha usato il pollice e l'indice per imitare di spararsi alla testa quando non le piaceva che venissero fatte delle osservazioni. Altri alzavano gli occhi al cielo con enfasi, sogghignavano, ridacchiavano o gemevano. Le persone userebbero il tempo a loro assegnato per esprimere con altezzosità luoghi comuni, come se una tautologia dimostrasse un punto politico sostanziale, o per gridare aggressivamente affermazioni, come se il disprezzo o la forza fossero i principali metodi di discussione. E, naturalmente, i peggiori attori di entrambe le parti agitavano i membri più moderati dell’altra. Quando si trattava di una discussione rispettosa e caritatevole, per girare la frase, il tutto era peggiore delle sue parti. L’intero processo è stato brutto e ha fatto a pezzi una comunità che altrimenti sarebbe stata sana e vivace. La cultura del luogo è cambiata drasticamente.", "category": "teologia"}, {"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Di p. Basil Cole, O.P., e p. John Baptist Ku, O.P. Caravaggio, “La vocazione dei santi Pietro e Andrea”, 1603, tramite Wikimedia Commons. La questione della giustificazione La domanda: \"che cosa devo fare per essere salvato?\" è stata posta dal giovane ricco in Matteo 19:16 (e Marco 10:17), così come dal carceriere suicida in Atti 16:30. In risposta, Gesù e Paolo rispettivamente non dicono “niente, Dio farà tutto”. Gesù dice: “Osserva i comandamenti” e “vai, vendi ciò che possiedi... e vieni e seguimi” (19:17, 21). E Paolo dice: “credi nel Signore Gesù”. Ma questo significa che mi salvo, o che almeno incontro Dio a metà strada? No. Guadagnare la vita eterna è infinitamente al di sopra dei poteri naturali dell’uomo. Ma allora non ho alcuna parte nella mia salvezza? Al Giudizio Finale, Dio giudicherà se stesso poiché le mie azioni sono completamente irrilevanti per la salvezza? Anche se in realtà faccio cose malvagie, se non ho il libero arbitrio per scegliere il bene contro il male, sarò come un animale irrazionale che segue semplicemente il mio istinto. E anche se potremmo essere arrabbiati con una volpe che uccide le nostre galline, non incolpiamo la volpe come se stesse commettendo un peccato. Quindi, come dovremmo comprendere il fatto che siamo salvati dal peccato e giustificati da Dio? Fortunatamente san Tommaso d'Aquino affronta questo tema nella domanda 113 della prima parte della seconda parte della Summa Theologiae. Tommaso d'Aquino divide la Summa Theologiae in tre parti: (1) su Dio così come è in se stesso, (2) sul movimento delle creature razionali verso Dio e (3) su Cristo, la via dell'uomo per tornare a Dio. La seconda parte è a sua volta divisa in due parti: (1) sull’antropologia (natura e fine dell’uomo e virtù in generale) e (2) sulle virtù specifiche. Alla fine della prima sezione della seconda parte, l'Aquinate tratta della grazia, che negli articoli precedenti era solo implicita.", "category": "teologia"}, {"title": "Does High HDL Cancel Out High ApoB?", "url": "https://staycuriousmetabolism.substack.com/p/are-you-immune-to-high-apob", "date": "2026-10-29T11:01:00+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Una buona salute metabolica potrebbe renderti immune ai pericoli di livelli elevati di LDL e ApoB? Ebbene, un nuovo studio pubblicato sull’European Journal of Preventive Cardiology ha appena gettato una chiave nella storia secondo cui alti livelli di LDL e ApoB sono sempre dannosi. Non mi credi? Ecco una citazione: “Quando l’HDL-C è alto, l’effetto della modifica dell’ApoB svanisce”. Non diminuisce. \"Svanisce.\" E questo studio su quasi 300.000 persone è in linea con il mio N=1. Non ho placca (0 mm 3 ) in nessuna delle mie arterie, molli o calcificate, con l'imaging cardiaco avanzato, nonostante abbia trascorso gran parte di un decennio con un LDL vicino a 600 mg/dL e un ApoB ben superiore a 300. Questi sono livelli che darebbero incubi al tuo cardiologo medio. Allora, cosa dà? Ho “immunità” ai pericoli di un alto livello di ApoB, una parola usata dagli stessi autori? E, cosa forse ancora più importante... e tu? Ora, questo potrebbe sembrare un semplice momento “woohoo” e un giro di vittoria per chi ha un HDL alto. Ma, come ogni buona storia scientifica, ci sono molte sfumature da svelare. Ma prima voglio presentarvi i nostri personaggi e raccontarvi cosa hanno fatto i ricercatori dietro questo studio. Il cattivo e l'eroe: ApoB e HDL I nostri due grandi personaggi oggi sono ApoB e il colesterolo HDL (HDL-C). ApoB si riferisce a una proteina che si trova su alcune particelle che fluttuano nel flusso sanguigno, chiamate collettivamente “lipoproteine ​​contenenti ApoB”. Le più famose sono le particelle LDL. Le particelle LDL sono il cattivo principale nella storia della cardiologia convenzionale. E se ottieni un pannello lipidico standard e vedi un valore di colesterolo LDL (LDL-C), cioè la massa totale di colesterolo trasportata all’interno delle particelle LDL. L’ApoB è considerato un indicatore di rischio migliore rispetto al colesterolo LDL, poiché la quantità di colesterolo in ciascuna particella può variare.", "category": "fitness"}, {"title": "We Have Heart Disease Backwards (New Science)", "url": "https://staycuriousmetabolism.substack.com/p/we-have-heart-disease-backwards-new", "date": "2026-10-27T11:04:05+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "“La nostra comprensione delle malattie cardiache è completamente al contrario”. Questo era un messaggio di testo inviatomi da un collega medico, che accompagnava il nuovissimo documento sulla salute del cuore che stiamo per esaminare. Ed è un’opinione che sento più spesso di quanto si possa pensare. Per darti un po’ di informazioni privilegiate, rimarrai sorpreso dal numero di medici e dottorandi accreditati che esprimono in privato frustrazione per il dogmatismo che circonda il modo in cui pensiamo e gestiamo le malattie cardiovascolari. Ma non è necessario che tu creda alla mia parola. Perché la questione centrale è nascosta in bella vista: siamo diventati così concentrati sulla riduzione del colesterolo LDL e dell’ApoB che abbiamo perso alcuni degli aspetti biologici più importanti che determinano se quei biomarcatori rappresentano un vero pericolo o sono più una distrazione. Ciò non significa che non ci sia nulla di vero nel modello convenzionale delle malattie cardiache. Ma se ti concentri su una zanzara mentre una tigre ti insegue, la zanzara è ancora lì. Ti stai solo perdendo la minaccia più grande. E dato che le malattie cardiovascolari rimangono una delle principali cause di morte, dovremmo probabilmente chiederci: cos’è la proverbiale tigre? Ebbene, un nuovo articolo pubblicato su un’importante rivista scientifica ci fornisce una seria ragione per riconsiderare se la nostra comprensione delle malattie cardiovascolari debba essere ribaltata. Questa indagine premium sul metabolismo di StayCurious non è per i deboli di cuore. Ci stiamo immergendo in una ricerca innovativa che rivela un “guardiano delle tue arterie” appena scoperto e cosa succede quando tale protezione fallisce. Gli abbonati Premium ricevono 3 nuove approfondimenti ogni settimana per meno del costo di una tazza di caffè (67 centesimi per lettera), oltre all'accesso a un archivio di> 350 lettere.", "category": "fitness"}, {"title": "You've Been Misled About Ultra-Processed Foods", "url": "https://staycuriousmetabolism.substack.com/p/youve-been-misled-about-ultra-processed", "date": "2026-10-25T11:02:09+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Uno studio straordinariamente rigoroso è stato recentemente pubblicato su Nature Metabolism confrontando le risposte metaboliche e cerebrali a pasti abbinati composti da alimenti ultra trasformati (UPF) e alimenti non UPF. Viene salutato come una vittoria per l’affermazione secondo cui “gli alimenti ultra-processati sono dannosi”. E chi ne discuterà? Beh, io... suppongo. In un certo senso. Perché per quanto dissuadessi le persone dal seguire la dieta di McDonald's o una dieta ricca di crostate e biscotti, lo scienziato dentro di me sta stringendo una palla antistress per la frustrazione. Ancora una volta, ci manca qualcosa di più importante che si nasconde dietro il dibattito sugli alimenti trasformati. Rivelerò esattamente cosa intendo, insieme ai suggerimenti pratici che seguono, sia che tu non mangi quasi nessun cibo trasformato (come me) o una dieta che ottiene il 54% delle calorie da cibo ultra-processato (come il partecipante medio in questo studio, e più o meno la media degli Stati Uniti). Ma prima, facciamo un backup e descriviamo cosa ha fatto lo studio. Cosa ha fatto lo studio Il design è stato, come ho detto sopra, straordinariamente rigoroso. I ricercatori hanno fatto completare uno studio crossover randomizzato a 32 giovani adulti di peso sano (età media 26 anni, indice di massa corporea medio 22,75 kg/m 2 ) in cui hanno mangiato pasti corrispondenti a calorie e macronutrienti in giorni separati. Ma non è tutto. Sono stati inoltre sottoposti a 4 ore di misurazione all'interno di una camera metabolica dell'intera stanza: 50 minuti prima del pasto, 10 minuti per mangiarlo e poi 3 ore dopo il pasto. Durante questo periodo i ricercatori hanno prelevato non uno, non due, ma 8 campioni di sangue per monitorare la risposta metabolica dei partecipanti. Ma non è tutto.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Abbiamo un nuovo studio di podcast!!! Team, sapete tutti che faccio il mio podcast dal 2016 - santo cielo, sono passati 10 anni!!!!!!! Sono passato dalla registrazione solo dell'audio alla registrazione su un microfono da 30 dollari nel mio primo appartamento a New York City. Ho viaggiato in tutto il mondo per intervistare gli ospiti e ora ho il mio bellissimo studio bianco! Vai a guardare questo. Voglio dire che. Mi sono seduto con il dottor Michael Breus, il dottore del sonno, e ho lasciato ripensando a cose che ero sicuro di aver già capito. Ha trascorso tutta la sua carriera come psicologo clinico facendo una cosa, aggiustando il modo in cui le persone dormono, ed è schietto in un modo che ho amato. La prima cosa che mi ha lasciato senza parole: lo stesso Sleep Doctor smette di respirare 26 volte all'ora nel sonno e non ne ha avuto idea per anni. Come lo scoprì: i suoi allenamenti stavano andando a rotoli e il suo chilometraggio continuava a salire Ha fatto analisi del sangue, ha anche provato il testosterone, inseguendo prima ogni altra spiegazione Niente si è mosso Alla fine qualcuno gli ha chiesto quando aveva fatto l'ultima volta uno studio del sonno È tornato 26. Era così sicuro che fosse rotto che l'ha ripreso. Stesso numero. Il Dottore del Sonno soffriva di apnea notturna e non lo sapeva. Ecco perché questo dovrebbe spaventare il resto di noi: può accadere da 5 a centinaia di volte in un'ora, e la maggior parte delle persone non sa mai che sta accadendo. Ogni volta che smetti di respirare, la frequenza cardiaca diminuisce e poi aumenta per riavviarti, caricando il tuo cuore per tutta la notte. Nel tempo ciò può trasformarsi in fibrillazione atriale. Stai anche affamando il tuo cervello di ossigeno, e non sprofondi mai nel sonno profondo in cui il cervello esegue la propria pulizia Il suo racconto per averlo individuato in una stanza: un collo di oltre 17,5 pollici ha una probabilità dell'83% di apnea (il suo numero) E una storia che non dimenticherò: un detective, in panchina perché continuava ad addormentarsi durante gli appostamenti, finalmente si è sottoposto a un CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Squadra!!!!! È arrivato un nuovissimo studio sulla creatina!!! E non solo uno studio qualsiasi sulla creatina. Questo ha preso donne in perimenopausa, ha dato a metà di loro creatina e metà un placebo identico, le ha sottoposte a sei settimane di allenamento pesante e ha osservato il loro cervello lavorare in tempo reale mentre lo facevano. Creatina, nelle donne di mezza età, con misurazioni cerebrali reali. Questo non viene quasi mai studiato e questa squadra ce l'ha fatta. Sai che la creatina è uno dei pochissimi integratori che sostengo. Quindi, quando arriva un processo come questo, leggo ogni singola riga. E quello che hanno scoperto mi ha infuocato. Perché questo è importante per te Se hai quarant'anni e il tuo cervello ha la sensazione di eseguire troppe schede contemporaneamente, questo studio riguarda te. La parola che svanisce a metà frase. La sveglia alle 3. La nebbia pomeridiana che non si solleva. Ti è stato detto che questa è solo la perimenopausa e di aspettare che finisca. Questi ricercatori sono andati alla ricerca di qualcosa di meglio. Cosa hanno fatto Cinquantuno donne in perimenopausa, età media 46 anni. Tre gruppi. La maggior parte di loro si è allenata duramente, due volte a settimana, per sei settimane. Un gruppo più piccolo non ha fatto nulla, come confronto. La metà delle donne che si allenavano hanno assunto creatina, l'altra metà ha assunto placebo. E per vedere all’interno del cervello, il team ha posizionato un sensore sulla fronte di ciascuna donna e ha misurato la quantità di sangue ricco di ossigeno assorbito dalla sua corteccia prefrontale mentre lavorava attraverso un duro test mentale. Una nota sulla luce solare, sugli UVB e sul perché sto usando Solius Questo è il mio ultimo trucco per interrompere il ritmo circadiano! La risposta ovvia è uscire di più, e continuo a pensare che questo dovrebbe venire prima. Ma la realtà è che l’esposizione costante ai raggi UVB non è sempre facile. La stagione, la latitudine, il tempo, gli orari di lavoro e il tempo che trascorriamo in casa cambiano tutti ciò che effettivamente otteniamo. Questo è uno dei motivi per cui utilizzo Solius.", "category": "fitness"}, {"title": "Belly Fat Is Shrinking Your Brain", "url": "https://neuroathletics.substack.com/p/belly-fat-is-shrinking-your-brain", "date": "2026-10-22T12:22:33+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, il grasso attorno alla tua vita parla al tuo cervello. Non come metafora. Chimicamente, costantemente, ogni singolo giorno. Una nuova importante recensione mi ha fatto sedere e mi ha guidato attraverso l'intera conversazione, da una cellula di grasso gonfia fino ai circuiti che contengono i tuoi ricordi. L'ho letto due volte e al secondo passaggio stavo scarabocchiando sui margini come un pazzo, perché la storia che racconta sul cervello di mezza età è una delle cose più importanti che ho letto in tutto l'anno. Ecco la portata di ciò di cui stiamo parlando. Quasi 900 milioni di persone convivono oggi con l’obesità e si prevede che i tassi di demenza quasi triplicheranno entro il 2050. Queste due linee stanno convergendo. Questa recensione riguarda il luogo esatto in cui si incontrano, ovvero il tuo cervello. È uscito su Nature Reviews Neurology. Invece di un singolo studio, riunisce l’intero campo in un unico posto, dagli studi su milioni di persone fino al danno preciso che si verifica all’interno delle singole cellule cerebrali. Lascia che ti accompagni nel modo in cui lei ha accompagnato me. Giusto avvertimento: diventa più strano man mano che va. Innanzitutto, un paradosso che ha sconvolto questo campo per un decennio. Per anni i dati non avevano senso. Uno studio dopo l’altro ha scoperto che l’obesità in età avanzata era associata a un minor rischio di demenza. Gli anziani più magri soffrivano di demenza più spesso. La gente cominciò a chiamarlo il “paradosso dell’obesità” e venne usato, ad alta voce, per sostenere che la preoccupazione per il peso e il cervello era eccessiva. Ecco il triste problema. Le persone spesso iniziano a perdere peso negli anni precedenti la diagnosi di demenza. La malattia sta già divorando silenziosamente il cervello, l'appetito e il comportamento cambiano e il numero sulla bilancia diminuisce. Quindi la magrezza in tarda età non ha mai protetto nessuno. È stato un sintomo precoce essere scambiato per uno scudo.", "category": "fitness"}, {"title": "EU rejects Canada as an ‘associate’ member, Carney says ‘alliance’ in the works", "url": "https://www.lifesitenews.com/news/eu-rejects-canada-as-an-associate-member-carney-says-alliance-in-the-works/", "date": "2026-10-31T00:05:01+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) — La maggior parte dei membri dell’Unione Europea (UE) ha respinto la proposta del primo ministro canadese Mark Carney di rendere il Canada un membro “associato”, ma sembra che una sorta di “alleanza” sia ancora in cantiere. Una bozza di accordo mostra che Germania, Italia, Grecia, Francia e altri hanno guidato l’opposizione all’ottenimento del Canada un nuovo tipo di status speciale nell’UE. Questa bozza è stata presentata prima del vertice UE-Canada che si è concluso il 30 ottobre a Montreal. … Per quanto riguarda i legami di Carney con l’UE, non sorprendono data la sua posizione pro-LGBT e i suoi legami personali, nonché i suoi legami globalisti. Una volta venne definito da Poilievre il “ragazzo d’oro” del World Economic Forum. Il primo ministro ha anche ammesso di essere un “elitario” e un “globalista”. Carney è pienamente d’accordo con la cosiddetta identità “multiculturale” del Paese, che in realtà spesso minimizza l’eredità cristiana europea di coloro che fondarono ospedali, scuole e infrastrutture. Ciò ha portato a un’immigrazione di massa a livelli insostenibili.", "category": "teologia"}, {"title": "Christian family accuses Vermont of discriminating against religious schools", "url": "https://www.lifesitenews.com/news/christian-family-accuses-vermont-of-discriminating-against-religious-schools/", "date": "2026-10-30T19:46:15+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) – Una famiglia cristiana rappresentata dall'Alleanza per la Difesa della Libertà (ADF) ha citato in giudizio i funzionari dell'istruzione del Vermont per aver discriminato le scuole religiose nell'assistenza statale alle tasse scolastiche. Il Town Tuition Program del Vermont offre aiuti per le tasse scolastiche alle scuole secolari private in città che non avevano scuole pubbliche, ma le scuole religiose erano inizialmente escluse. Diverse famiglie e la diocesi di Burlington hanno intentato due cause legali, con il risultato che il governo ha concordato che tale esclusione non era né costituzionale né applicabile, e la Corte Suprema del Vermont ha accettato nel 2022 di applicare un accordo che consenta alle scuole religiose di accedere al programma dopo la Corte d'Appello del 5° Circuito... \"Il messaggio del Vermont è chiaro: le scuole religiose e le loro famiglie sono trattate come di seconda classe in questo stato\", ha aggiunto Reed. \"Nessuna scuola religiosa è qualificata per il finanziamento delle tasse scolastiche, e nessuna famiglia che vuole mandare i propri figli a una scuola religiosa può raccogliere i benefici delle proprie tasse. Il Primo Emendamento non tollera tale trattamento.\" La Corte Suprema degli Stati Uniti ha stabilito 6-3 nel caso Carson v. Makin del 2022 che un programma statale di aiuti scolastici nel Maine non poteva impedire alle scuole “settarie” – scuole affiliate a livello religioso – di prendere parte a un programma simile. L'Alta Corte ha affermato nel caso che l'esclusione delle scuole religiose dall'assistenza scolastica violava il libero esercizio della religione garantito dal Primo Emendamento. Essendo uno degli stati più liberali dell'Unione, il Vermont è notoriamente ostile ai diritti dei residenti religiosi e tradizionalmente conservatori.", "category": "teologia"}, {"title": "Alberta bans ‘pride’ flags in schools", "url": "https://www.lifesitenews.com/news/alberta-bans-pride-flags-in-schools/", "date": "2026-10-30T19:35:53+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) – Il governo conservatore dell’Alberta sotto la premier Danielle Smith vieterà presto che tutte le bandiere che non siano canadesi o albertane vengano sventolate all’esterno o esposte all’interno delle scuole per “mantenere l’attenzione al posto giusto” in classe. \"A partire dal 4 gennaio, ogni scuola in Alberta sventolerà con orgoglio sia la bandiera canadese che quella dell'Alberta, e qualsiasi altra bandiera verrà esposta temporaneamente solo quando serve a un chiaro scopo educativo, commemorativo o comunitario\", ha annunciato Smith in un post X alla fine della scorsa settimana. … Nel 2024, il governo di Smith ha approvato il disegno di legge 27, una legge che vieta alle scuole di nascondere i cambiamenti di pronome di un bambino a scuola e che aiuterà a proteggere i bambini dagli aspetti estremi dell’agenda LGBT. Il governo Smith ha anche approvato una legge che vieta gli interventi chirurgici di mutilazione genitale e di altre mutilazioni corporee per i minori. Tuttavia, il governo dell’Alberta ha dovuto affrontare la reazione degli attivisti di sinistra che hanno cercato di impedire l’attuazione della legge. In tutto il Canada, è in corso anche un problema con le cosiddette bandiere “Pride” issate nelle scuole e negli edifici cittadini.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
