<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 26 Nov 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Growing in Virtue: One Psychological Perspective", "url": "https://thomisticinstitute.substack.com/p/growing-in-virtue-one-psychological", "date": "2026-11-23T13:48:28+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Nicolas-Henri Jacob, da \"Traité complet de l'anatomie de l'homme\" di Bourgery, 1831–1854, tramite Wikimedia Commons. In questo articolo voglio concentrarmi su un quadro psicologico sviluppato dagli psicologi per pensare al processo più generale di crescita nella virtù. Questo quadro incoraggia l’attenzione su (1) motivazione, (2) mentalità e (3) mezzi. Cosa ci orienta a crescere nella virtù? Pensiamo che una crescita del genere sia possibile? E se sì, come possiamo effettivamente crescere? Lo presento come un quadro generale che può essere applicato in molti casi particolari. Motivare la crescita La motivazione qui è, in superficie, abbastanza semplice. Se vogliamo crescere in virtù o carattere, dobbiamo desiderare di crescere in quel modo. La motivazione potrebbe derivare dal riconoscimento che ci si concentra più sull’evitare il vizio che sul perseguire la virtù. Ad esempio, pensare a se stessi di fronte a una sfida – non voglio commettere errori – piuttosto che pensare a quale sia la cosa migliore che si potrebbe fare. Potremmo pensare alla motivazione per crescere nella virtù ponendoci due domande: (1) Qual è il bene che voglio far crescere nella mia capacità di realizzazione? e (2) quali sono le paure e i desideri contrastanti che inibiscono tale crescita? Se riusciamo ad affrontare adeguatamente le paure e i desideri inibitori, saremo più liberi di perseguire la crescita. Questo è ciò che spesso è la crescita nella temperanza e nella fortezza. Ancor di più, il bene in cui vogliamo crescere è idealmente un’espressione del nostro desiderio di giustizia: riconosciamo che dovremmo essere migliori per Dio e per gli altri. Grazie per aver letto Le indagini dell'Istituto Tomistico! Iscriviti gratuitamente per ricevere nuovi post ogni lunedì. Mentalità La mentalità riguarda le nostre convinzioni, in particolare riguardo alla nostra psicologia e al modo in cui funziona il mondo.", "category": "teologia"}, {"title": "What is it to Seek and Speak the Truth in Love?", "url": "https://thomisticinstitute.substack.com/p/what-is-it-to-seek-and-speak-the", "date": "2026-11-16T13:51:22+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Benvenuti alla seconda parte della mia serie in cinque parti sulla carità intellettuale. La prima parte è qui, anche se non è necessario leggerla prima di leggere questa voce. In tutti gli ambiti della vita, il cristiano è chiamato alle altezze morali: porgere l'altra guancia; fare il possibile. Siamo chiamati a emulare Cristo, che ha dato la sua vita per noi mentre eravamo ancora in ostilità con lui. Ascoltiamo parabole che ci incoraggiano ad andare oltre il dovere. In effetti, il termine tecnico per un simile atto – un atto che va oltre il dovere, come quando uno sconosciuto salva un uomo morente trovato sul ciglio della strada, portandolo in una locanda e pagando con i propri soldi – è supererogazione, una parola che ci viene dalla traduzione vulgata di San Girolamo della parabola del Buon Samaritano. Come dice il Samaritano all'oste, qualunque cosa spenderai in più (supererogaveris), te la ripagherò. Non dovrebbe quindi sorprenderci il fatto che, nel cercare e dire la verità, noi cristiani siamo chiamati a mantenere uno standard elevato. Ma qual è esattamente la norma? Quanto è alto? Ricordi quando Peter gli chiese quante volte avrebbe dovuto perdonare suo fratello? Puoi sentirlo pensare di avere già un livello piuttosto alto quando dice \"sette\". E onestamente, è piuttosto alto, non è vero? Sette volte per lo stesso tipo di peccato?! Ma ricordate la risposta di nostro Signore settantasette, o anche settanta volte sette. L’asticella per cercare e dire la verità è altrettanto audacemente alta? Grazie per aver letto Le indagini dell'Istituto Tomistico! Iscriviti gratuitamente per ricevere nuovi post ogni lunedì.", "category": "teologia"}, {"title": "Time in Science and Philosophy", "url": "https://thomisticinstitute.substack.com/p/time-in-science-and-philosophy", "date": "2026-11-09T16:10:34+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Johannes Vermeer, \"The Astronomer\",: 1668, tramite Wikimedia Commons. I fisici che lavorano sulla relatività generale portano due definizioni di tempo molto diverse nelle loro ricerche. Una è il tempo \"proprio\", che è una misura della quantità di cambiamento fisico che un sistema sperimenta. Il tempo corretto è ciò che misura un orologio. Porta un orologio dall'evento A all'evento B e il numero che mostra è un'osservabile diretta che puoi scrivere. Una serie di eventi per un dato oggetto è chiamata sua Potrei svegliarmi, andare al lavoro, sedermi per quattro ore, guidare fino a un aeroporto, prendere un aereo per la costa orientale e fare il check-in in un hotel. La mia linea d'universo ha coinvolto una serie di eventi in cui sono alternativamente fermo, mi muovo a velocità costante, accelero e mi alzo a una certa distanza dal centro della Terra. Ma l'orologio che porto con me mostrerà un tempo trascorso su cui chiunque lo legga, anche se si è spostato su una linea d'universo diversa, sarà d'accordo. d'altra parte, è una delle quattro coordinate assegnate agli eventi nel continuum quadridimensionale chiamato spaziotempo. Lo spaziotempo è costituito da tre dimensioni simili allo spazio e una dimensione simile al tempo nel nostro universo. Il percorso di qualsiasi entità materiale attraverso lo spaziotempo può essere visualizzato come una serie di eventi, che sono collegati insieme per formare la sua linea d'universo Un osservatore a terra vuole sapere quanto tempo è durato il canto secondo i suoi calcoli, deve prima assegnare i tempi agli eventi di inizio e fine nel suo sistema di riferimento stazionario, correggendo il tempo di viaggio del segnale wireless dal mio aereo.", "category": "teologia"}, {"title": "Your Personal Fitness-Longevity Report Card", "url": "https://staycuriousmetabolism.substack.com/p/your-personal-fitness-longevity-report", "date": "2026-11-24T12:02:02+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Quanta parte della longevità umana è scolpita nella pietra? Ebbene, le stime del contributo genetico alla durata della vita variano dal 10% al 50% circa. Ma anche se prendiamo il limite superiore, ciò lascia ancora un enorme spazio affinché i fattori ambientali e di stile di vita influenzino la durata della nostra vita e, forse ancora più importante, quanto bene viviamo. La domanda quindi diventa: cosa muove veramente l’ago? Forse sorprendentemente, uno dei più potenti predittori della longevità è la tua forma fisica. Infatti, le persone con un’idoneità cardiorespiratoria di alto livello hanno un rischio di mortalità per tutte le cause (morte per qualsiasi causa) inferiore di circa l’80% rispetto a quelle con un’idoneità cardiorespiratoria bassa. Si tratta di una differenza di cinque volte nel rischio di mortalità. Questi sono dati di cui abbiamo già parlato in una lettera precedente. Ma la lettera di oggi riprenderà da dove si era interrotta. Perché in quella lettera abbiamo parlato di attività aerobica in relazione alla salute del cuore e alla longevità. Ma il fitness non è solo una cosa. Quindi, nella lettera di oggi, espanderemo la nostra discussione sul fitness oltre la semplice capacità aerobica. E ti consegnerò la tua pagella personale di fitness e longevità. Analizzeremo quattro dimensioni chiave del fitness ed esamineremo quattro test che puoi eseguire tu stesso questa settimana, senza bisogno di un laboratorio o di un personal trainer. Ti mostrerò come valutarti lungo ciascuna dimensione in modo da poter identificare i tuoi punti deboli, capire dove investire tempo e fatica e iniziare a migliorare la tua forma fisica per una migliore salute e longevità.", "category": "fitness"}, {"title": "Vitamin K2 MK7 Slows Artery Calcification (Phase 3 Trial)", "url": "https://staycuriousmetabolism.substack.com/p/vitamin-k2-mk7-slows-artery-calcification", "date": "2026-11-21T12:00:45+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Quando valuti la tua malattia cardiovascolare, la prima domanda che dovresti porti non è qual è il tuo colesterolo, ma quanta placca c'è nelle tue arterie. Una misurazione effettiva della placca batterà ogni volta il livello di colesterolo. E la misura più ampiamente disponibile e facilmente utilizzata è chiamata scansione del calcio dell’arteria coronaria (CAC). I dati suggeriscono che se hai un punteggio CAC pari a zero, indipendentemente dal colesterolo “cattivo” LDL, il rischio di un evento cardiovascolare è basso. Questo è diventato noto come il “potere dello zero”. A tal fine, c’è molto interesse nel trovare interventi che rallentino la progressione della calcificazione di un’arteria, poiché si ritiene che riducano il rischio cardiovascolare. E uno degli integratori più popolari e controversi che potenzialmente possono farlo è la vitamina K2 MK-7. Ora, un importante studio clinico randomizzato e controllato di fase 3 ha appena lanciato una bomba: l’integrazione di vitamina K2 MK-7 rallenta effettivamente la progressione della calcificazione delle arterie. La scoperta ha avuto ripercussioni nella comunità nutrizionale, con gli integratori di vitamina K2 che sono andati a ruba a un ritmo allarmante. Ma anche se questi dati sono impressionanti e promettenti, ci sono alcune sfumature cruciali che è necessario conoscere. Cos'è la vitamina K2 MK7? E come funziona? Per prima cosa, lasciatemi descrivere cos’è in realtà la vitamina K2 MK-7. È una forma di vitamina K2 che dirige il calcio nei punti in cui lo desideri, come le ossa e i denti, e lontano dai luoghi in cui non lo desideri, come le arterie. Ciò che rende la forma MK-7 unica e ritenuta superiore è la sua lunga emivita, il che significa che rimane nel tuo corpo per giorni anziché minuti o ore. E si pensa che fornisca un’attivazione più prolungata delle proteine ​​dipendenti dalla vitamina K rispetto alla forma della vitamina K1, che potresti ottenere da qualcosa come una verdura a foglia verde.", "category": "fitness"}, {"title": "How to Use Gravity to Build Better Mitochondria", "url": "https://staycuriousmetabolism.substack.com/p/how-your-mitochondria-can-feel-gravity", "date": "2026-11-19T12:02:01+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Ero appena tornato dalla giornata delle gambe quando mi sono seduto a leggere questo giornale. A metà del libro mi alzai, indossai un giubbotto zavorrato e continuai a leggere. E quando ho finito, mi sono reso conto che quello che avevo fatto in palestra quella mattina era una conversazione. Ogni squat aveva inviato un messaggio ai quadrilioni di minuscoli motori all'interno dei miei muscoli: costruisci di più. Non solo più fibre muscolari, ma più parti del motore vero e proprio all'interno dei mitocondri, le parti che producono energia. E quel messaggio viaggia attraverso un relè molecolare che inizia con la gravità stessa. La prima battuta finale, da non perdere: i tuoi mitocondri sentono la gravità. Come lo sappiamo? Ebbene, quando i ricercatori hanno inviato le cellule nello spazio, i meccanismi di produzione di energia dei mitocondri sono scomparsi come il volume degli spinaci quando li cucini. (I cuochi tra voi sanno esattamente cosa intendo.) Questo è più di un pezzo esoterico di biologia. È rilevante per te ogni singolo giorno. Ma lasciatemi esporre (o parlare) quello che impareremo oggi: come caricare il vostro scheletro può regolare il vostro appetito. Ciò che i lunghi periodi di seduta influiscono sul metabolismo e un'abitudine di 2 minuti che aiuta. Un modo nascosto per abbassare il glucosio e l'insulina aumenta dal 50 al 60% utilizzando solo l'1% della massa muscolare. Ma prima... nello spazio! Mitocondri nello spazio In un nuovo studio pubblicato su Nature Communications, i ricercatori hanno inviato cellule umane sulla Stazione Spaziale Internazionale e hanno eseguito una tecnica chiamata \"profilazione ribosomiale\", che consente di misurare la sintesi proteica in tempo reale nell'intero genoma. Hanno poi confrontato le cellule coltivate in condizioni di gravità normale con le cellule coltivate in condizioni di microgravità. La scoperta: la sintesi proteica mitocondriale è diminuita drasticamente in condizioni di microgravità. Ma c’è una sfumatura che non possiamo perdere.", "category": "fitness"}, {"title": "The Part of Stacy Sims You Don't See", "url": "https://neuroathletics.substack.com/p/the-part-of-stacy-sims-you-dont-see", "date": "2026-11-18T14:47:13+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, voglio dirvi qualcosa sulla dottoressa Stacy Sims che non ha nulla a che fare con il digiuno, o con le proteine, o con qualsiasi altra scienza che le ha dato un nome. La conosci come la donna che ha dimostrato che le donne non sono uomini piccoli. Il discorso del TED. I libri. Il movimento. Lo scienziato che ha trascorso vent'anni costringendo le donne a ritornare alla ricerca che le aveva cancellate. Quello che non vedi è quanto le è costato diventare quella persona. Durante la nostra conversazione, Stacy mi ha detto qualcosa che ha detto di non aver mai condiviso prima su un podcast. C'è stato un tempo in cui ha cercato di togliersi la vita e in seguito è stata ricoverata in ospedale. Lo ha portato avanti in silenzio per anni, sotto il marchio globale, le luci del palco e la certezza che vedi davanti alla telecamera. Ci è voluto un vero coraggio per dirlo ad alta voce, e lei lo ha detto per aiutare qualsiasi donna in ascolto che sia seduta nello stesso posto buio in cui si trovava una volta. E anche adesso è ancora un bersaglio. Per il semplice atto di dire che le donne meritano la propria scienza, viene attaccata online ogni singolo giorno, da persone che non l'hanno mai incontrata, che non hanno mai avuto una conversazione con lei, scappando da una clip clickbait. Mi ha detto che questo l'ha lasciata con un disturbo da stress post-traumatico. Il peggio è arrivato quando sua figlia ha preso il telefono, ha visto la crudeltà di uno sconosciuto nei confronti di sua madre e ha chiesto se fosse sicuro uscire. Siediti con quello per un secondo. Una donna che ha dedicato tutta la sua carriera ad aiutare altre donne a diventare più forti e a vivere più a lungo, vedendo suo figlio spaventarsi a causa di ciò che le persone scrivono. E lei continua ad andare avanti. Continua a pubblicare, continua a stare sui palchi, continua a dire quello che dicono i dati anche quando tacere sarebbe molto più facile. Non perché le piaccia combattere, ma perché ha deciso molto tempo fa che qualcuno avrebbe dovuto portarlo, e sarebbe stata lei. Questa è la donna dietro la scienza.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Abbiamo un nuovo studio di podcast!!! Team, sapete tutti che faccio il mio podcast dal 2016 - santo cielo, sono passati 10 anni!!!!!!! Sono passato dalla registrazione solo dell'audio alla registrazione su un microfono da 30 dollari nel mio primo appartamento a New York City. Ho viaggiato in tutto il mondo per intervistare gli ospiti e ora ho il mio bellissimo studio bianco! Vai a guardare questo. Voglio dire che. Mi sono seduto con il dottor Michael Breus, il dottore del sonno, e ho lasciato ripensando a cose che ero sicuro di aver già capito. Ha trascorso tutta la sua carriera come psicologo clinico facendo una cosa, aggiustando il modo in cui le persone dormono, ed è schietto in un modo che ho amato. La prima cosa che mi ha lasciato senza parole: lo stesso Sleep Doctor smette di respirare 26 volte all'ora nel sonno e non ne ha avuto idea per anni. Come lo scoprì: i suoi allenamenti stavano andando a rotoli e il suo chilometraggio continuava a salire Ha fatto analisi del sangue, ha anche provato il testosterone, inseguendo prima ogni altra spiegazione Niente si è mosso Alla fine qualcuno gli ha chiesto quando aveva fatto l'ultima volta uno studio del sonno È tornato 26. Era così sicuro che fosse rotto che l'ha ripreso. Stesso numero. Il Dottore del Sonno soffriva di apnea notturna e non lo sapeva. Ecco perché questo dovrebbe spaventare il resto di noi: può accadere da 5 a centinaia di volte in un'ora, e la maggior parte delle persone non sa mai che sta accadendo. Ogni volta che smetti di respirare, la frequenza cardiaca diminuisce e poi aumenta per riavviarti, caricando il tuo cuore per tutta la notte. Nel tempo ciò può trasformarsi in fibrillazione atriale. Stai anche affamando il tuo cervello di ossigeno, e non sprofondi mai nel sonno profondo in cui il cervello esegue la propria pulizia Il suo racconto per averlo individuato in una stanza: un collo di oltre 17,5 pollici ha una probabilità dell'83% di apnea (il suo numero) E una storia che non dimenticherò: un detective, in panchina perché continuava ad addormentarsi durante gli appostamenti, finalmente si è sottoposto a un CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Squadra!!!!! È arrivato un nuovissimo studio sulla creatina!!! E non solo uno studio qualsiasi sulla creatina. Questo ha preso donne in perimenopausa, ha dato a metà di loro creatina e metà un placebo identico, le ha sottoposte a sei settimane di allenamento pesante e ha osservato il loro cervello lavorare in tempo reale mentre lo facevano. Creatina, nelle donne di mezza età, con misurazioni cerebrali reali. Quello... Per saperne di più", "category": "fitness"}, {"title": "Carney gov’t slammed for refusing to investigate church arson attacks", "url": "https://www.lifesitenews.com/news/carney-govt-slammed-for-refusing-to-investigate-church-arson-attacks/", "date": "2026-11-26T00:32:02+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) – Un importante gruppo pro-democrazia ha criticato il governo liberale canadese per non aver voluto indagare sull’ondata di incendi dolosi e attacchi di vandalismo che si sono verificati negli ultimi anni in tutta la nazione. In una dichiarazione, il Fondo per la Democrazia (TDF) ha affermato di essere “preoccupato” per il fatto che il Comitato permanente sul patrimonio canadese della Camera dei comuni canadese abbia deciso alla fine del mese scorso “di non studiare incendi dolosi, atti di vandalismo e altri attacchi criminali contro luoghi di culto in Canada”. … Gli attacchi incendiari agli spazi religiosi sono aumentati vertiginosamente negli ultimi anni. I dati federali mostrano che tra il 2010 e il 2022 sono stati segnalati 592 incendi dolosi. Tuttavia, 423 di questi atti di violenza si sono verificati dal 2015 in poi. Solo nel 2021, ci sono stati 91 casi di incendio doloso, lo stesso anno in cui i media mainstream hanno diffuso affermazioni provocatorie e dubbie secondo cui centinaia di bambini sarebbero stati sepolti e ignorati da preti e suore cattolici che gestivano alcune scuole residenziali canadesi. La realtà è che, dopo quattro anni, non sono state scoperte fosse comuni nelle scuole residenziali.", "category": "teologia"}, {"title": "Biden judge forbids Trump official from speaking about Jesus in holiday emails", "url": "https://www.lifesitenews.com/news/biden-judge-forbids-trump-official-from-speaking-about-jesus-in-holiday-emails/", "date": "2026-11-26T00:21:52+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) – Un giudice federale con sede a San Francisco nominato dall’ex presidente Joe Biden ha stabilito che il segretario all’Agricoltura americano Brooke Rollins ha violato il Primo Emendamento inviando auguri di vacanza ai dipendenti con messaggi apertamente cristiani. All’inizio di quest’anno, gruppi di sinistra come la Freedom From Religion Foundation hanno attaccato Rollins per aver inviato allo staff del Dipartimento dell’Agricoltura degli Stati Uniti (USDA) messaggi esplicitamente legati alle festività religiose dal suo account di posta elettronica ufficiale, come un messaggio di Pasqua 2026 che dichiarava “È davvero risorto”, discutendo della risurrezione di Gesù Cristo come “il fondamento della nostra fede” e paragonando i lettori a “i primissimi discepoli che incontrarono il nostro Signore risorto nel Cenacolo quasi duemila anni fa”. … La frase “separazione tra Chiesa e Stato”, spesso invocata in opposizione al contenuto religioso per motivi pubblici, non è una clausola legale ufficiale in nessuna parte della Dichiarazione di Indipendenza o della Costituzione degli Stati Uniti, ma deriva da una lettera che Thomas Jefferson scrisse alla Danbury Baptist Association il 1° gennaio 1802, rassicurando il gruppo della sua convinzione che “la religione è una questione che spetta esclusivamente tra l’Uomo e il suo Dio, che non deve rendere conto a nessun altro della sua fede o del suo culto, che il legittimo “Contemplo con sovrana reverenza quell’atto dell’intero popolo americano che dichiarò che il suo corpo legislativo non avrebbe dovuto ‘fare alcuna legge che rispetti l’istituzione di una religione, o ne proibisca il libero esercizio’, costruendo così un muro di separazione tra Chiesa e Stato”, ha detto Jefferson nella corrispondenza.", "category": "teologia"}, {"title": "Prolife Alberta urges Danielle Smith to end late-term abortion", "url": "https://www.lifesitenews.com/news/prolife-alberta-urges-danielle-smith-to-end-late-term-abortion/", "date": "2026-11-25T20:59:33+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) – Prolife Alberta chiede al premier Danielle Smith di tenere fede alle sue passate dichiarazioni di condanna degli aborti tardivi e di fare qualcosa per “porre fine all’orrore” ora che è al comando. In un articolo del 23 novembre 2000, Smith scrisse per il Calgary Herald, entrò nei dettagli su come alcuni bambini venivano lasciati morire dopo aborti tardivi falliti a causa della negazione dei liquidi. … La questione degli aborti falliti in Alberta e in Canada è stata portata alla luce di recente dopo che Prolife Alberta ha richiamato l’attenzione sul fatto che i dati del Canadian Institute for Health Information (CIHI) “confermano che in Alberta, i bambini nascono ancora vivi a seguito di aborti tardivi indotti dal travaglio e lasciati morire”. Prolife Alberta, come riportato da LifeSiteNews, ha recentemente lanciato un duro avvertimento sulla realtà dell’aborto nella provincia, affermando che è necessaria una maggiore consapevolezza pubblica per denunciare “l’orrore reale” di questa pratica. Come riportato in precedenza da LifeSiteNews, molte delle opinioni del premier Smith, comprese quelle relative al “matrimonio” omosessuale e al finanziamento pubblico per l’aborto, rimangono in contrasto con i valori conservatori tradizionali, un fatto che l’ha resa un bersaglio della più grande organizzazione pro-vita della provincia. Tuttavia, l'anno scorso ha affermato di essere favorevole all'adozione rispetto all'aborto.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 1
