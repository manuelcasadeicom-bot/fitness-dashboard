<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 20 Nov 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "What is it to Seek and Speak the Truth in Love?", "url": "https://thomisticinstitute.substack.com/p/what-is-it-to-seek-and-speak-the", "date": "2026-11-16T13:51:22+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Welcome to part two of my five-part series on Intellectual Charity. The first part is here , though it isn’t necessary that you read it before you read this entry. In all areas of life, the Christian is called to the moral heights: turn the other cheek; go the extra mile. We are called to emulate Christ, who laid down his life for us while we were still at enmity with him. We hear parables that encourage us to go above and beyond the call of duty. Indeed, the technical term for such an act—an act that goes above and beyond the call of duty, like when a stranger saves a dying man found on the side of the road, taking him to an inn and paying for it with his own money—is supererogation , a word that comes to us from St. Jerome’s Vulgate translation of our Lord’s parable of the Good Samaritan. As the Samaritan says to the innkeeper, whatever more you spend ( supererogaveris ), I will repay you. So, it should be no surprise to us, then, that in seeking and speaking the truth, we Christians are called to a high standard. But what exactly is the standard? Just how high is it? Remember when Peter asked how many times he had to forgive his brother? You can hear him thinking he’s got a pretty high bar already when he says “seven.” And honestly, that is pretty high, isn’t it? Seven times for the same type of sin?! But recall our Lord’s answer of seventy -seven, or even seventy times seven. Is the bar for seeking and speaking the truth equally audaciously high? Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts every Monday.", "category": "teologia"}, {"title": "Time in Science and Philosophy", "url": "https://thomisticinstitute.substack.com/p/time-in-science-and-philosophy", "date": "2026-11-09T16:10:34+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Johannes Vermeer, “The Astronomer,: 1668, via Wikimedia Commons. Physicists who work in general relativity carry two very different definitions of time in their research. One is “proper” time, which is a measure of the amount of physical change that a system experiences. Proper time is what a clock measures. Carry a clock from event A to event B, and the number it displays is a direct observable that you can write down. A series of events for a given object is called its worldline. I might awake, drive into work, sit for four hours, drive to an airport, take a plane to the East Coast, and check into a hotel. My worldline has involved a series of events in which I am alternately stationary, moving at constant speed, accelerating, and rising a certain distance away from the center of the Earth. But the clock I take with me will display an elapsed time which anyone who reads it—even though they moved on a different worldline-- will agree upon. “Coordinate” time, on the other hand, is one of four coordinates assigned to events in the four-dimensional continuum called spacetime. Spacetime consists of three space-like dimensions and one time-like dimension in our universe. The path of any material entity through spacetime can be visualized as a series of events, which are linked together to form its world line. Coordinate time is a labeling of events that allows one to quantify the relationship between different worldlines. For example, if I play a three-minute song on my iPhone while on a plane, and an observer on the ground wants to know how long the song lasted by her reckoning, she must first assign times to the start and end events in her stationary reference frame, correcting for the travel time of the wireless signal from my airplane.", "category": "teologia"}, {"title": "Outsourcing Your Intellect", "url": "https://thomisticinstitute.substack.com/p/outsourcing-your-intellect", "date": "2026-11-02T13:42:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Alexander Rothaug , “The Three Fates,” 1910, via Wikimedia Commons. All the world’s a stage, And all the men and women merely players; They have their exits and their entrances; And one man in his time plays many parts.” (William Shakespeare, As You Like It) Duc, o parens celsique dominator poli, Quocumque placuit ; nulla parendi mora est. Adsum inpiger. Fac nolle, comitabor gemens Malusque patiar, facere quod licuit bono. Ducunt volentem fata, nolentem trahunt (Seneca, Moral Epistle 107 , n.11 Verses attributed to Cleanthes) The Problem of the Whispering Earring (or Bob’s Smart Glasses) Scott Alexander’s Whispering Earring imagines a magical earring that tells its wearer exactly what to do in every situation. He insists: the earring is always right . By “always right,” he does not mean that it makes the best possible decisions in every situation, but that it always makes a better decision than its wearer would have done, even after careful thought. I would like to introduce a modified version of the whispering earring for us to consider, but let’s change the earring into smart glasses to make it more true to the moment. Now let’s say the smart glasses interface with a perfect AGI model, so that their wearer, we shall call him Bob, can ask the model to supply him with answers to all questions relevant to daily life. Let’s say that one day Bob does not want to deliberate or think about his actions and decides that he will rely on his smart glasses for all of his decisions and tasks.", "category": "teologia"}, {"title": "How to Use Gravity to Build Better Mitochondria", "url": "https://staycuriousmetabolism.substack.com/p/how-your-mitochondria-can-feel-gravity", "date": "2026-11-19T12:02:01+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "I had just gotten back from leg day when I sat down to read this paper. Halfway through, I stood up, put on a weighted vest, and kept reading. And by the time I finished, I realized that what I’d done in the gym that morning was a conversation. Every squat had sent a message to the quadrillions of tiny engines inside my muscles: Build more. Not just more muscle fibers, but more of the actual engine parts inside the mitochondria, the parts that produce energy. And that message travels through a molecular relay that starts with gravity itself. The first punchline, not to be missed: Your mitochondria feel gravity. How do we know? Well, when researchers sent cells to space, the mitochondria’s energy-producing machinery disappeared like the volume of spinach when you cook it. (The cooks among you know exactly what I mean.) That’s more than an esoteric bit of biology. It’s relevant to you every single day. But let me lay out (or stand up) what we’re going to learn today: How loading your skeleton can regulate your appetite. What long stretches of sitting do to metabolism, and a 2-minute habit that helps. A hidden way to lower glucose and insulin rises by 50 to 60% by using just 1% of your muscle mass. But first… to space! Mitochondria in Outer Space In a new study published in Nature Communications , researchers sent human cells to the International Space Station and performed a technique called “ribosome profiling,” which lets you measure protein synthesis in real time across the entire genome. They then compared cells cultured under normal gravity to cells cultured under microgravity. The finding: mitochondrial protein synthesis dropped dramatically under microgravity. But there’s a nuance we can’t miss.", "category": "fitness"}, {"title": "My Plan to Never Get Alzheimer's Disease", "url": "https://staycuriousmetabolism.substack.com/p/how-to-build-a-brain-that-lasts-100", "date": "2026-11-17T12:01:49+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "When I was just 23 years old, I was handed a terrible verdict. I learned that I carried not just one copy but two copies of a genetic variant ( ApoE4/4 ) that dramatically increased my chances of developing Alzheimer’s disease, raising my risk by 12- to 15-fold. The great irony is that I received this news while I was pursuing my PhD studying neurodegenerative diseases like Alzheimer’s and Parkinson’s. I knew exactly what this diagnosis meant, and I had already seen firsthand the devastation these diseases cause. My initial reaction was more than anxiety; it was terror. But I used that as fuel to dig deeper into the research. Now, seven years later, after earning a PhD in metabolism, completing medical school, and spending nearly a decade obsessively studying the science of brain health, I have something I didn’t have back then. I have tools. And most importantly, I have hope. In this letter, I’ll show you where the science stands, the specific tools I use , and the exciting future that’s coming next… *Author’s Note: A branching ecosystem of information A lot of what I write is dense, so I’m trying something a little more accessible with this letter. It’s self-contained, but also serves as a branching ecosystem of information. Wherever you see an asterisk (*), you’ll find a link to a separate 3,000- to 7,000-word deep dive for those who want to explore further. Lifestyle: A Clone Thought Experiment I want to begin with lifestyle. But rather than present you with a dry list, let me start with a thought experiment. Imagine I cloned myself, right down to the two copies of ApoE4 that supposedly sealed my brain’s fate. Then imagine those two versions of me walked off in opposite directions and lived out the next fifty years. In 50 years, one of us has Alzheimer’s.", "category": "fitness"}, {"title": "I've Been Using Olive Oil Wrong for Years", "url": "https://staycuriousmetabolism.substack.com/p/ive-been-using-olive-oil-wrong-for", "date": "2026-11-14T12:03:19+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "I just learned I’ve been eating olives wrong for years. And my olive oil game needed a tune-up too. But let’s start with the whole olive. Here’s the deal: I’ve been an olive oil obsessive for the better part of a decade. I’ve also learned how to pick my olive oils. But I didn’t know olives themselves had a problem. Most olives in the United States are cured in a chemical called lye. Lye is sodium hydroxide, a very harsh chemical. Producers use it to de-bitter olives more quickly. But this strips the olives of many of their critical nutrients, such that they no longer retain the same health benefits as fresh or properly fermented olives. The natural curing process, which creates an organic olive, takes far longer. Rather than a few days, it can take 6 to 12 months. There are olives you can buy using this process, but it’s not necessarily obvious which are which. I’ll tell you precisely which olives I use later. And they’re not only healthier because of their wider range of nutrients and their probiotic properties, but they also taste phenomenally better. But first, let’s rewind. Because are olives and olive oil even worth the hype? In a word: Yes. But not because they’re healthy fats. Think of olive oil like a delicious soup. Technically, most of the soup might be water, but calling it healthy water would completely miss the point. The same is true of olive oil.", "category": "fitness"}, {"title": "The Part of Stacy Sims You Don't See", "url": "https://neuroathletics.substack.com/p/the-part-of-stacy-sims-you-dont-see", "date": "2026-11-18T14:47:13+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I want to tell you something about Dr. Stacy Sims that has nothing to do with fasting, or protein, or any of the science that made her name. You know her as the woman who proved that women are not small men. The TED talk. The books. The movement. The scientist who spent twenty years forcing women back into research that had erased them. What you do not see is what it cost her to become that person. In our conversation, Stacy told me something she said she has never shared on a podcast before. There was a time she tried to take her own life, and was hospitalized afterward. She has carried that quietly for years, underneath the global brand and the stage lights and the certainty you see on camera. It took real courage to say it out loud, and she said it to help any woman listening who is sitting in the same dark place she once was. And even now, she is still a target. For the simple act of saying that women deserve their own science, she gets attacked online every single day, by people who have never met her, never had one conversation with her, running off a clickbait clip. She told me it left her with PTSD. The worst of it came when her own daughter picked up a phone, saw a stranger’s cruelty aimed at her mother, and asked whether it was safe to go outside. Sit with that for a second. A woman who has given her entire career to helping other women get stronger and live longer, watching her child become frightened because of what people type. And she keeps going. She keeps publishing, keeps standing on stages, keeps saying the thing the data says even when going quiet would be so much easier. Not because she enjoys the fight, but because she decided a long time ago that someone had to carry this, and it would be her. That is the woman behind the science.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! Go watch this one. I mean it. I sat down with Dr. Michael Breus, the Sleep Doctor, and I left rethinking things I was sure I already understood. He has spent his whole career as a clinical psychologist doing one thing, fixing the way people sleep, and he is blunt in a way I loved. First thing that floored me: the Sleep Doctor himself stops breathing 26 times an hour in his sleep, and had no idea for years. How he found out: His workouts were falling apart and his mile time kept climbing He ran bloodwork, even tried testosterone, chasing every other explanation first Nothing moved Finally someone asked when he’d last done a sleep study It came back 26. He was so sure it was broken that he retook it. Same number. The Sleep Doctor had sleep apnea and didn’t know. Here’s why that should scare the rest of us: It can happen anywhere from 5 to hundreds of times an hour, and most people never know it’s happening Every time you stop breathing, your heart rate drops then spikes to restart you, loading your heart all night long. Over time that can tip into atrial fibrillation. You’re also starving your brain of oxygen, and you never sink into the deep sleep where the brain runs its own cleanup His tell for spotting it across a room: a neck over 17.5 inches carries an 83 percent chance of apnea (his number) And one story I won’t forget: a detective, benched because he kept falling asleep on stakeouts, finally got on a CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team!!!!! A brand new creatine study has arrived!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That almost never gets studied, and this team pulled it off. You know creatine is one of the very few supplements I actually stand behind. So when a trial like this lands, I read every single line. And what they found got me fired up. Why this matters to you If you are in your forties and your brain feels like it is running too many tabs at once, this study is about you. The word that vanishes mid-sentence. The 3 a.m. wake-up. The afternoon fog that will not lift. You have been told this is just perimenopause and to wait it out. These researchers went looking for something better. What they did Fifty-one women in perimenopause, average age 46. Three groups. Most of them trained hard, twice a week, for six weeks. A smaller group did nothing, as the comparison. Half of the training women got creatine, half got placebo. And to see inside the brain, the team placed a sensor on each woman’s forehead and measured how much oxygen-rich blood her prefrontal cortex pulled in while she worked through a tough mental test. A note on sunlight, UVB, and why I’ve been using Solius This is my latest hack for circadian rhythm disruption! The obvious answer is to get outside more—and I still think that should come first. But the reality is that consistent UVB exposure is not always easy. Season, latitude, weather, work schedules, and how much time we spend indoors all change what we actually get. That’s one reason I’ve been using Solius .", "category": "fitness"}, {"title": "Did you know that Fr. Altman saw Jesus three times?", "url": "https://www.lifesitenews.com/episodes/did-you-know-that-fr-altman-saw-jesus-three-times/", "date": "2026-11-20T01:00:50+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. John-Henry Westen welcomes Fr. James Altman to recount three extraordinary encounters with Jesus Christ that Altman says he experienced during an eight-day silent Ignatian retreat before entering the seminary. The story begins at a priestly ordination in Marquette, Michigan, where Altman heard the voice of divine love telling him, “You’re supposed to be up there.” The experience prompted him to reconsider his successful career as an attorney and discern a vocation to the priesthood. During the r … Opposing Communion in the hand 'extremist'? Church history disagrees Meet the priest who left the diocese to join the SSPX despite the excommunication This Catholic mother of 8 had 2 priests and 1 nun- here’s how she did it", "category": "teologia"}, {"title": "Cardinal Burke initiates 5-year spiritual journey for Guadalupe’s 500th anniversary", "url": "https://www.lifesitenews.com/news/cardinal-burke-initiates-5-year-spiritual-journey-for-guadalupes-500th-anniversary/", "date": "2026-11-19T23:54:06+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — Cardinal Raymond Burke, one of the most influential figures in the American hierarchy and a longtime proponent of traditional Catholic devotion, has invited the faithful to join him in a five-year spiritual journey of Marian formation leading to the 500th anniversary of the apparitions of Our Lady of Guadalupe. In a message shared on X, the cardinal from Wisconsin announced “ Semper Virgo ,” a daily email program of contemplations that will begin on December 12 — the feast of Our Lady of Guadalupe — and continue until the quincentennial on December 12, 2031. … The cardinal’s invitation comes as other initiatives prepare for the same anniversary. Archbishop Salvatore Cordileone of San Francisco has launched “Project Guadalupe 2031,” encouraging family consecrations and home enthronements of her image in response to a call for a nine-year novena. Burke’s own previous nine-month novena to Our Lady of Guadalupe drew nearly 190,000 registered participants worldwide. Registration for the free daily emails is available at the Semper Virgo website included in the cardinal’s message. “It is my fervent prayer that these five years of preparation will be a time of true conversion of heart, of renewed devotion to the Blessed Virgin Mary, and of ever closer union with her Divine Son, so that we may worthily celebrate this jubilee,” Burke concluded. “May the Ever-Perfect Virgin Mary, Our Lady of Guadalupe, Mother of God and Mother of the Church, lead us ever more faithfully to her Divine Son, Our Lord Jesus Christ, Who alone is our salvation.”", "category": "teologia"}, {"title": "New study shows just 29% of Catholics believe in Real Presence in Eucharist", "url": "https://www.lifesitenews.com/news/new-study-shows-just-29-of-catholics-believe-in-real-presence-in-eucharist/", "date": "2026-11-19T22:26:42+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — A recently published study that surveyed over 1,000 Catholics found only about 29%, less than a third, believe in the Church’s central dogma : Our Lord Jesus Christ is truly present in the Holy Eucharist, just years after U.S. bishops began a Eucharistic revival initiative. The alarming study , published in the academic journal Sociological Inquiry in September, shows that just 28.8% of the 1,049 faithful surveyed answered that they believe that “the bread and wine truly become the Body and Blood of Christ” during the Holy Sacrifice of the Mass. About 58.8% of self-identified Catholics said the bread and wine “are just symbols,” and approximately 12.4% said they were “not sure what happens.” … However, the U.S. bishops largely declined to even discuss the survey results with the RPC. “One would think that the ‘listening Church’ would be bending over backwards to ‘listen’ to the voices of thousands of lay Catholics on why they felt there had been a loss of faith in the Real Presence and their recommendations on how this problem could best be addressed,” a member of the Coalition, who preferred to remain anonymous, previously told LifeSite. “One would think that the leaders of the Eucharistic Revival would be beating down the doors of the RPC to understand the thoughts of those who had been surveyed,” they added. “But, alas, this was not the case. (In) fact, it seemed the bishops went out of their way to avoid hearing about the survey results.”", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
