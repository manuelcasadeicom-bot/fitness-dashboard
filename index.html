<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 25 Nov 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Growing in Virtue: One Psychological Perspective", "url": "https://thomisticinstitute.substack.com/p/growing-in-virtue-one-psychological", "date": "2026-11-23T13:48:28.808000+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Investigations by the Thomistic Institute Growing in Virtue: One Psychological Perspective Motivation, Mindset, and Means Tim Reilly Nov 23, 2026 11 5 1 Share Nicolas-Henri Jacob, from Bourgery’s “ Traité complet de l'anatomie de l'homme,” 1831–1854, via Wikimedia Commons . In this article, I want to focus on a psychological framework developed by psychologists for thinking about the more general process of growth in virtue. This framework encourages attention to (1) motivation, (2) mindset, and Motivation here is, on the surface, fairly straightforward. If we are to grow in virtue or character, we must desire to grow in that way. Motivation might arise from a recognition that one is focused on avoiding vice more than on pursuing virtue. For instance, thinking to oneself when faced with a challenge—I don’t want to make a mistake—rather than thinking about what the best thing one might do is. … 11 5 1 Share A guest post by Tim Reilly A developmental psychologist studying purpose, vocation, and virtue. He is the author of \"Moral and Intellectual Virtues in Practices: Through the Eyes of Scientists and Musicians\". Subscribe to Tim Discussion about this post Comments Restacks Liked by Tim Reilly Stephanie Marie 15h So well written! I especially love this quote: “If we can appropriately address the inhibitory fears and desires, we will be more free to pursue growth. This is what growth in temperance and fortitude often is. Even more, the good that we want to grow in is ideally an expression of our desire for justice—we recognize that we ought to be better for God and others.” When I look at my own desire for growth, it’s almost always related to how I relate to other people. Where I can listen better, understand better, show more empathy, love better, etc.", "category": "teologia"}, {"title": "What is it to Seek and Speak the Truth in Love?", "url": "https://thomisticinstitute.substack.com/p/what-is-it-to-seek-and-speak-the", "date": "2026-11-16T13:51:22.817000+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Investigations by the Thomistic Institute What is it to Seek and Speak the Truth in Love? Series on Intellectual Charity, Part II Tim Pawl Nov 16, 2026 13 2 10 Share Welcome to part two of my five-part series on Intellectual Charity. The first part is here , though it isn’t necessary that you read it before you read this entry. In all areas of life, the Christian is called to the moral heights: turn the other cheek; go the extra mile. We are called to emulate Christ, who laid down his life for us while we were still at enmity with him. … Hush, Tolkiendil, I know that Bilbo may have met Gandalf in his youth, when watching the fireworks, and that Gandalf had known of Bilbo previously. I mean first meet on the pages , the reader’s first encounter with the pair. 13 2 10 Share A guest post by Tim Pawl I am a Philosophy Professor, focusing on the intersections of metaphysics & theology and virtue theory & psychology. I am the husband of another philosopher and the proud father of one son and four daughters. We enjoy life in the Twin Cities. Subscribe to Tim Discussion about this post Comments Restacks Liked by Tim Pawl Cooperatores Veritatis 4d The asymmetry you draw from De veritate seems to me to carry the moral weight of the whole series: if reality me 1 Liked by Tim Pawl Paolo 6d Thanks for this succinct yet very clear and comprehensive summary. By the way, I think Prof. Stump is the epitome of someone seeking the truth in love. Her work is brilliant and I wish it was more known, so thank you for referencing her understanding of love. I found it very illuminating.", "category": "teologia"}, {"title": "Time in Science and Philosophy", "url": "https://thomisticinstitute.substack.com/p/time-in-science-and-philosophy", "date": "2026-11-09T16:10:34.358000+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Investigations by the Thomistic Institute Time in Science and Philosophy Where Physics and Philosophy Meet Jonathan I Lunine Nov 09, 2026 23 1 6 Share Johannes Vermeer, “The Astronomer,: 1668, via Wikimedia Commons. Physicists who work in general relativity carry two very different definitions of time in their research. One is “proper” time, which is a measure of the amount of physical change that a system experiences. Proper time is what a clock measures. Carry a clock from event A to event B, “Coordinate” time, on the other hand, is one of four coordinates assigned to events in the four-dimensional continuum called spacetime. Spacetime consists of three space-like dimensions and one time-like dimension in our universe. The path of any material entity through spacetime can be visualized as a series of events, which are linked together to form its world line. Coordinate time is a labeling of events that allows one to quantify the relationship between different worldlines. For example, … About the Author: Jonathan Lunine is the Chief Scientist at NASA’s Jet Propulsion Laboratory and Professor of Planetary Science at Caltech in Pasadena, California. Beforehand, he was the David C. Duncan Professor in the Physical Sciences and Chair of the Department of Astronomy at Cornell University. Lunine is interested in how planets form and evolve, what processes maintain and establish habitability, and what kinds of exotic environments (methane lakes, etc.) might host a kind of chemistry so The opinions expressed are those of the author alone and do not represent those of his employer. 23 1 6 Share A guest post by Jonathan I Lunine Inaugural VP of the Society of Catholic Scientists; co-founder of COLLIS and TI Faculty advisor at Cornell.", "category": "teologia"}, {"title": "Your Personal Fitness-Longevity Report Card", "url": "https://staycuriousmetabolism.substack.com/p/your-personal-fitness-longevity-report", "date": "2026-11-24T12:02:02+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "How much of human longevity is set in stone? Well, estimates of the genetic contribution to lifespan vary from around 10% to 50%. But even if we take the upper bound, that still leaves an enormous amount of room for environmental and lifestyle factors to influence how long we live and, perhaps more importantly, how well we live. The question then becomes: What truly moves the needle? Perhaps surprisingly, one of the most powerful predictors of longevity is your fitness. In fact, people with elite-level cardiorespiratory fitness have approximately an 80% lower risk of all-cause mortality (death from any cause) compared with those with low cardiorespiratory fitness. That’s a five-fold difference in mortality risk. These are data we’ve covered before in a previous letter . But today’s letter is going to pick up where that one left off. Because in that letter, we talked all about aerobic fitness as it relates to heart health and longevity. But fitness isn’t just one thing. So, in today’s letter, we’re going to expand our discussion of fitness beyond just aerobic capacity. And I’m going to hand you your very own Fitness & Longevity Report Card. We’ll break down four key dimensions of fitness and walk through four tests you can perform yourself this week, without needing a lab or a personal trainer. I’ll show you how to grade yourself along each dimension so you can identify your weak points, figure out where to invest your time and effort, and start leveling up your fitness for better healthspan and longevity.", "category": "fitness"}, {"title": "Vitamin K2 MK7 Slows Artery Calcification (Phase 3 Trial)", "url": "https://staycuriousmetabolism.substack.com/p/vitamin-k2-mk7-slows-artery-calcification", "date": "2026-11-21T12:00:45+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "When evaluating your of cardiovascular disease, the first question you should ask is not what your cholesterol is, but how much plaque is in your arteries. An actual measurement of plaque will beat a cholesterol level every time. And the most widely available and readily used measure is called the coronary artery calcium (CAC) scan. Data suggest that if you have a CAC score of zero, then irrespective of your LDL “bad” cholesterol, your risk of a cardiovascular event is low. This has come to be known as the “power of zero.” To that end, there’s a lot of interest in finding interventions that slow the progression of an artery calcification, since that’s thought to reduce cardiovascular risk. And one of the most popular and controversial supplements to potentially do so is vitamin K2 MK-7. Now, a major randomized, controlled phase 3 clinical trial just dropped a bombshell: Vitamin K2 MK-7 supplementation does indeed slow the progression of artery calcification. The finding sent ripples through the nutrition community, with vitamin K2 supplements flying off shelves at an alarming rate. But while these data are impressive and promising, there are critical nuances you need to know. What Is Vitamin K2 MK7? And How Does It work? First, let me describe what vitamin K2 MK-7 actually is. It’s a form of vitamin K2 that directs calcium into the places you want it, like your bones and your teeth, and away from the places that you don’t, such as your arteries. What makes the MK-7 form unique and thought to be superior is its long half-life, meaning it remains in your body for days rather than minutes or hours. And it’s thought to provide more sustained activation of vitamin K-dependent proteins than the vitamin K1 form, which you might get from something like a leafy green vegetable.", "category": "fitness"}, {"title": "How to Use Gravity to Build Better Mitochondria", "url": "https://staycuriousmetabolism.substack.com/p/how-your-mitochondria-can-feel-gravity", "date": "2026-11-19T12:02:01+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "I had just gotten back from leg day when I sat down to read this paper. Halfway through, I stood up, put on a weighted vest, and kept reading. And by the time I finished, I realized that what I’d done in the gym that morning was a conversation. Every squat had sent a message to the quadrillions of tiny engines inside my muscles: Build more. Not just more muscle fibers, but more of the actual engine parts inside the mitochondria, the parts that produce energy. And that message travels through a molecular relay that starts with gravity itself. The first punchline, not to be missed: Your mitochondria feel gravity. How do we know? Well, when researchers sent cells to space, the mitochondria’s energy-producing machinery disappeared like the volume of spinach when you cook it. (The cooks among you know exactly what I mean.) That’s more than an esoteric bit of biology. It’s relevant to you every single day. But let me lay out (or stand up) what we’re going to learn today: How loading your skeleton can regulate your appetite. What long stretches of sitting do to metabolism, and a 2-minute habit that helps. A hidden way to lower glucose and insulin rises by 50 to 60% by using just 1% of your muscle mass. But first… to space! Mitochondria in Outer Space In a new study published in Nature Communications , researchers sent human cells to the International Space Station and performed a technique called “ribosome profiling,” which lets you measure protein synthesis in real time across the entire genome. They then compared cells cultured under normal gravity to cells cultured under microgravity. The finding: mitochondrial protein synthesis dropped dramatically under microgravity. But there’s a nuance we can’t miss.", "category": "fitness"}, {"title": "The Part of Stacy Sims You Don't See", "url": "https://neuroathletics.substack.com/p/the-part-of-stacy-sims-you-dont-see", "date": "2026-11-18T14:47:13+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I want to tell you something about Dr. Stacy Sims that has nothing to do with fasting, or protein, or any of the science that made her name. You know her as the woman who proved that women are not small men. The TED talk. The books. The movement. The scientist who spent twenty years forcing women back into research that had erased them. What you do not see is what it cost her to become that person. In our conversation, Stacy told me something she said she has never shared on a podcast before. There was a time she tried to take her own life, and was hospitalized afterward. She has carried that quietly for years, underneath the global brand and the stage lights and the certainty you see on camera. It took real courage to say it out loud, and she said it to help any woman listening who is sitting in the same dark place she once was. And even now, she is still a target. For the simple act of saying that women deserve their own science, she gets attacked online every single day, by people who have never met her, never had one conversation with her, running off a clickbait clip. She told me it left her with PTSD. The worst of it came when her own daughter picked up a phone, saw a stranger’s cruelty aimed at her mother, and asked whether it was safe to go outside. Sit with that for a second. A woman who has given her entire career to helping other women get stronger and live longer, watching her child become frightened because of what people type. And she keeps going. She keeps publishing, keeps standing on stages, keeps saying the thing the data says even when going quiet would be so much easier. Not because she enjoys the fight, but because she decided a long time ago that someone had to carry this, and it would be her. That is the woman behind the science.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! Go watch this one. I mean it. I sat down with Dr. Michael Breus, the Sleep Doctor, and I left rethinking things I was sure I already understood. He has spent his whole career as a clinical psychologist doing one thing, fixing the way people sleep, and he is blunt in a way I loved. First thing that floored me: the Sleep Doctor himself stops breathing 26 times an hour in his sleep, and had no idea for years. How he found out: His workouts were falling apart and his mile time kept climbing He ran bloodwork, even tried testosterone, chasing every other explanation first Nothing moved Finally someone asked when he’d last done a sleep study It came back 26. He was so sure it was broken that he retook it. Same number. The Sleep Doctor had sleep apnea and didn’t know. Here’s why that should scare the rest of us: It can happen anywhere from 5 to hundreds of times an hour, and most people never know it’s happening Every time you stop breathing, your heart rate drops then spikes to restart you, loading your heart all night long. Over time that can tip into atrial fibrillation. You’re also starving your brain of oxygen, and you never sink into the deep sleep where the brain runs its own cleanup His tell for spotting it across a room: a neck over 17.5 inches carries an 83 percent chance of apnea (his number) And one story I won’t forget: a detective, benched because he kept falling asleep on stakeouts, finally got on a CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team!!!!! A brand new creatine study has arrived!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That … Read more", "category": "fitness"}, {"title": "Frank Wright Exposes the Dark Truth About Modern Liberalism", "url": "https://www.lifesitenews.com/episodes/frank-wright-exposes-the-dark-truth-about-modern-liberalism/", "date": "2026-11-25T01:00:37+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. Frank Wright spent years as an atheist, immersed in Enlightenment philosophy, secular rationalism, materialism, and the promise of human progress. He abandoned Catholicism after his early schooling. But his fascination with the origins of ideas led him to investigate the philosophical foundations of modern liberalism, democracy, and secular morality. Over time, he discovered contradictions between these ideological systems and his experience of the real world. Intellectual disillusionment, combi … 'He is a liar': Archbishop who CANCELED Fr. Ripperger called out Meet the priest who left the diocese to join the SSPX despite the excommunication This Catholic mother of 8 had 2 priests and 1 nun- here’s how she did it", "category": "teologia"}, {"title": "Canadian Supreme Court sets date for hearing on parental rights law", "url": "https://www.lifesitenews.com/news/canadian-supreme-court-sets-date-for-hearing-on-parental-rights-law/", "date": "2026-11-24T23:30:50+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "OTTAWA ( LifeSiteNews ) — In March 2027, Canada’s Supreme Court will hear appeals made by a pro-LGBT group over a Saskatchewan law requiring parental consent to be obtained before children use different pronouns at school. According to Eric Freeman, a lawyer for UR Pride, the hearing in the nation’s top court will begin on March 22, 2027. … As for Bill 137, it was passed and became law in 2023. Known as the “ Parental Inclusion and Consent Policies ,” it also includes provisions which allow parents to opt their kids out of sex-ed and third-party presentations from groups such as Planned Parenthood. After the bill became law, UR Pride challenged it in a provincial court. A judge ruled in favor of UR Pride, which led Saskatchewan Premier Scott Moe to announce that he would use the government’s notwithstanding clause to protect the legislation from the courts. A survey from 2023 shows that 86 percent of Saskatchewan participants want parental rights codified in law and support the premise of Bill 137.", "category": "teologia"}, {"title": "Abortion pill kills Canadian woman and her unborn baby", "url": "https://www.lifesitenews.com/news/abortion-pill-kills-canadian-woman-and-her-unborn-baby/", "date": "2026-11-24T23:15:23+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — A Canadian woman and her unborn child are dead after taking an abortion drug purchased overseas, court records show. The 31-year old woman, from Lethbridge, Alberta, died after taking the abortion drug in 2024. So did her child. She had ordered the drug from the Philippines, which was an unknown “medication,” and took the pill on June 10, 2024. … Health Canada’s adverse-reaction database contains more than 100 reports of serious harm to Canadian women since the drugs became available in 2017, but thousands more have gone unreported. The Campaign Life Coalition described the Lethbridge deaths as “a tragic story made possible because women have been lied to that abortion drugs are safe when they are not.” “It’s time to ban abortion drugs in Canada. Too many dead mothers and way too many dead preborn babies,” said Baklinski.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
