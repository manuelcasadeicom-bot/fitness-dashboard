<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 17 Oct 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Di p. Basil Cole, O.P., e p. John Baptist Ku, O.P. Caravaggio, “La vocazione dei santi Pietro e Andrea”, 1603, tramite Wikimedia Commons. La questione della giustificazione La domanda: \"che cosa devo fare per essere salvato?\" è stata posta dal giovane ricco in Matteo 19:16 (e Marco 10:17), così come dal carceriere suicida in Atti 16:30. In risposta, Gesù e Paolo rispettivamente non dicono “niente, Dio farà tutto”. Gesù dice: “Osserva i comandamenti” e “vai, vendi ciò che possiedi... e vieni e seguimi” (19:17, 21). E Paolo dice: “credi nel Signore Gesù”. Ma questo significa che mi salvo, o che almeno incontro Dio a metà strada? No. Guadagnare la vita eterna è infinitamente al di sopra dei poteri naturali dell’uomo. Ma allora non ho alcuna parte nella mia salvezza? Al Giudizio Finale, Dio giudicherà se stesso poiché le mie azioni sono completamente irrilevanti per la salvezza? Anche se in realtà faccio cose malvagie, se non ho il libero arbitrio per scegliere il bene contro il male, sarò come un animale irrazionale che segue semplicemente il mio istinto. E anche se potremmo essere arrabbiati con una volpe che uccide le nostre galline, non incolpiamo la volpe come se stesse commettendo un peccato. Quindi, come dovremmo comprendere il fatto che siamo salvati dal peccato e giustificati da Dio? Fortunatamente san Tommaso d'Aquino affronta questo tema nella domanda 113 della prima parte della seconda parte della Summa Theologiae. Tommaso d'Aquino divide la Summa Theologiae in tre parti: (1) su Dio così come è in se stesso, (2) sul movimento delle creature razionali verso Dio e (3) su Cristo, la via dell'uomo per tornare a Dio. La seconda parte è a sua volta divisa in due parti: (1) sull’antropologia (natura e fine dell’uomo e virtù in generale) e (2) sulle virtù specifiche. Alla fine della prima sezione della seconda parte, l'Aquinate tratta della grazia, che negli articoli precedenti era solo implicita.", "category": "teologia"}, {"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-05T15:43:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Cos'è l'umiltà? Ora, l'umiltà rende l'uomo un buon soggetto ad ogni specie e in ogni materia; mentre ogni altra virtù ha questo effetto in qualche materia speciale. Dunque dopo le virtù teologali, dopo le virtù intellettuali che riguardano la stessa ragione, e dopo la giustizia, soprattutto quella legale, viene prima di tutte le altre l'umiltà. (ST.II-II.Q161.A5.C (grassetto aggiunto). Per apprezzare la grandezza dell'umiltà, si consideri che l'umiltà sta prima delle virtù cardinali della temperanza e della fortezza. Il loro status di virtù cardinali non le rende forse più grandi dell'umiltà? L'umiltà sta prima della magnanimità e della magnificenza. Come può essere che l'umile umiltà superi queste virtù di grandezza, una delle quali è addirittura chiamata la corona delle virtù? Per rispondere perché L'umiltà è così significativa, risponderemo prima: cos'è l'umiltà? L'umiltà riguarda l'aspirazione a grandi cose e ha tre elementi principali: un elemento di controllo, un elemento di conoscenza e un elemento di motivazione. L'umiltà è la virtù con cui controlliamo le nostre aspirazioni per tutto ciò che pensiamo ci rende più grandi conoscenza di sé, soprattutto per quanto riguarda le nostre carenze e limitazioni. Controlliamo le nostre aspirazioni per riverenza divina. Siamo motivati dalla riverenza divina ad agire umilmente, e questa motivazione ci guida a cercare il nostro giusto posto nella provvidenza di Dio. Analizziamo la grandezza dell'umiltà e questi tre elementi e vediamo perché l'umiltà è così significativa.", "category": "teologia"}, {"title": "The Soul of Goodness", "url": "https://thomisticinstitute.substack.com/p/the-soul-of-goodness", "date": "2026-09-28T14:50:46+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Peter Vilhelm Ilsted, “Una madre e un bambino in un interno”, 1898, tramite Wikimedia Commons. La difficoltà della virtù Nell'Etica Nicomachea, in una frase ricca di intuizioni sia antropologiche che psicologiche, Aristotele osserva: \"Chiunque può adirarsi, questo è facile... ma esserlo con la persona giusta, nella giusta misura, al momento giusto, con il motivo giusto e nel modo giusto, questo non è da tutti, né è facile; perciò la bontà è rara, lodevole e nobile\". 1 In effetti, Aristotele sta dicendo che la natura umana è selvaggia e passionale, e che questa natura selvaggia è essenzialmente buona in quanto è un principio innato di azioni che sono di per sé buone, almeno nella misura in cui possono raggiungere il bene. Tuttavia, sta anche dicendo che la nostra natura selvaggia e appassionata richiede un’ulteriore formazione se vuole diventare del tutto buona – “lodevole e nobile” – ma che tale formazione nella bontà, per quanto estremamente necessaria, è tuttavia terribilmente rara. È così raro proprio per la difficoltà di portare a compimento questa formazione. Questa è infatti la principale difficoltà positiva della vita umana, la sfida del tutto naturale che ci viene affidata mentre procediamo verso il futuro. È la difficoltà di ricevere il dono della bontà della nostra natura e allo stesso tempo assumersi la responsabilità della corretta maturazione di questa natura, tutto affinché la nostra natura possa raggiungere il suo adeguato completamento nelle nostre vite individuali. Questa difficoltà ha un nome; il suo nome è virtù, poiché la virtù è la meta immediata di questo duro processo di formazione. Tuttavia, anche se difficile, questo compito vale sicuramente lo sforzo.", "category": "teologia"}, {"title": "This Saturated Fat Slows Heart Disease", "url": "https://staycuriousmetabolism.substack.com/p/this-saturated-fat-slows-heart-disease", "date": "2026-10-15T11:00:44+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Gli alimenti che mangio quasi ogni giorno contengono grassi saturi che secondo una nuova ricerca possono prevenire le malattie cardiache. Sì, hai sentito bene. Un grasso saturo. Quindi sì, tecnicamente parlando, è giusto dire che “questo grasso saturo rallenta le malattie cardiache”. Esamineremo i dati preclinici, nonché i dati sugli esseri umani che ne mostrano la rilevanza. Ma questo non è nemmeno vicino alla parte più strana di questa storia. Questo è un articolo che è stato quasi un esercizio da leggere, poiché dovevo continuare a sollevare la mascella dal pavimento. Ho imparato fatti folli sul microbioma, sulla caffeina e sulle statine. E nei prossimi minuti, voglio provare a trasmettervi questo stupore scientifico, insieme ad alcuni spunti pratici. Ma cominciamo da dove è iniziato questo studio, con un gruppo di individui sani e un gruppo di individui con malattie cardiache. Il batterio che combatte le malattie cardiache I ricercatori hanno deciso di studiare il ruolo del microbioma intestinale nelle malattie cardiovascolari. Quindi, hanno preso 223 persone sane e 189 con malattie cardiovascolari e hanno esaminato quali batteri differivano tra loro. Quattro delle specie dominanti appartenevano al genere Bacteroides, e la più importante era quella chiamata Bacteroides uniformis (B. uniformis), che era collegata alla salute cardiovascolare negli esseri umani. Questa è solo un'associazione, tuttavia. Quindi, hanno preso un gruppo di adolescenti sani, hanno spazzato via i loro microbiomi con potenti antibiotici, hanno fatto un trapianto di mezzo microbioma arricchito in Bacteroides uniformis e hanno fatto un trapianto di microbioma di controllo. Poi li hanno seguiti per 30 anni. Sto solo scherzando. Sì... non possiamo farlo, praticamente o eticamente. Ma la battuta ha uno scopo: sottolineare che quando abbiamo associazioni interessanti come questa dobbiamo rivolgerci a modelli animali per concretizzare meccanismi e relazioni causa-effetto.", "category": "fitness"}, {"title": "Could You Live to 200? (Lessons From a Whale)", "url": "https://staycuriousmetabolism.substack.com/p/the-biology-of-living-forever", "date": "2026-10-13T11:04:24+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "E se uno dei più grandi segreti che prolungano la vita umana si nascondesse negli animali più grandi della Terra? È la balena della Groenlandia. Queste creature possono vivere 250 anni, il che significa che oggi esistono teste d'arco nate prima dell'invenzione della lampadina. Possono pesare più di 200.000 libbre e avere bocche abbastanza grandi da contenere un intero SUV. Ma non vi parlo di questa creatura straordinaria semplicemente per le sue immense dimensioni o per la sua incredibile longevità. Ve ne parlo a causa di un paradosso biologico che potrebbe aiutare a spiegare come mai viva così a lungo. Qualcosa a cui probabilmente non hai mai pensato. Qualcosa che potremmo usare. Queste balene dovrebbero essere piene di tumori. Ma non lo sono. Pensaci. Ogni volta che una cellula si divide, deve copiare il suo DNA. E ogni volta che il DNA viene copiato, c’è la possibilità di commettere un errore che alla fine potrebbe portare al cancro. Consideriamo ora che questa balena ha circa 1000 volte più cellule di un essere umano, e alcune di queste cellule si dividono per secoli. Più celle. Più divisioni cellulari. Maggiori opportunità per mutazioni che causano il cancro. Queste balene dovrebbero nuotare come tumori! Eppure sembrano straordinariamente resistenti al cancro. Allora qual è il loro segreto? E, cosa ancora più importante, potremmo sfruttare questo segreto per proteggerci dal cancro e persino estendere la durata della vita umana ben oltre ciò che attualmente immaginiamo possibile? Gli scienziati stanno cominciando a pensare che potremmo farlo.", "category": "fitness"}, {"title": "How To Destroy Visceral Fat (Proven in 4 RCTs)", "url": "https://staycuriousmetabolism.substack.com/p/the-definitive-guide-to-destroy-visceral", "date": "2026-10-11T11:02:03+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Puoi demolire drasticamente il tuo grasso viscerale nel giro di poche settimane. E puoi farlo senza tagliare le calorie. Te lo dimostrerò, attingendo da più studi randomizzati controllati su esseri umani e condividendo strumenti che puoi iniziare a utilizzare immediatamente. Ma prima di arrivare al “come fare”, dobbiamo determinare il “perché”. Perché vorresti eviscerare il grasso viscerale? Perché non tutto il grasso è uguale. Il grasso sottocutaneo (il tipo che si trova sotto la pelle) ha importanti funzioni fisiologiche. Fornisce isolamento e il mantenimento di una quantità modesta aiuta a sostenere la salute ormonale. Ma il grasso viscerale è diverso... Grasso viscerale e salute del cuore Il grasso viscerale circonda gli organi interni, rilascia molecole infiammatorie e aumenta il rischio di malattie cardiovascolari. Ad esempio, nello studio INTERHEART, che ha coinvolto circa 27.000 partecipanti in 52 paesi, gli individui nel quintile più alto del rapporto vita-fianchi (un proxy per il grasso viscerale) avevano 2,5 volte la probabilità di avere un attacco cardiaco rispetto a quelli nel quintile più basso. È importante sottolineare che questa associazione era sostanzialmente più forte di quella osservata con il BMI, evidenziando che il luogo in cui si immagazzina il grasso è più importante per il rischio cardiovascolare rispetto a quanto si pesa. Grasso viscerale e salute del cervello Un elevato grasso viscerale è anche fortemente legato al declino cognitivo e alla demenza. Una recente ricerca di Harvard suggerisce che maggiore è l’esposizione cumulativa al grasso viscerale, più velocemente il cervello si restringe con l’età. Quindi, il grasso viscerale non si limita ad espandere il girovita. Ridimensiona anche il tuo cervello. Parliamo di un pessimo accordo commerciale. Tra un attimo ci immergeremo nell'affascinante scienza che sta dietro a questo. Ma prima, ecco un'anteprima video di 41 secondi di ciò che stiamo per esplorare.", "category": "fitness"}, {"title": "At 50, Your Brain Starts Replacing its Own Immune Cells", "url": "https://neuroathletics.substack.com/p/when-does-brain-aging-start", "date": "2026-10-13T12:17:43+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, questo mese è uscito su Science uno studio che avrei inserito tra le cose più importanti pubblicate quest'anno sull'invecchiamento cerebrale, e non ho visto quasi nessuno parlarne. Hanno raccolto 40 cervelli umani di persone morte tra i vent'anni e i novant'anni. Il gruppo è stato costruito apposta: uomini e donne, distribuiti equamente in quattro fasce di età dai 20 ai 100 anni, quindi nessun segmento della vita era sovrarappresentato. Poi sono entrati nell'ippocampo, il centro della memoria e la prima regione che l'Alzheimer distrugge, e hanno letto le cellule una alla volta. La maggior parte degli studi sul cervello non possono farlo. Macinano i tessuti e misurano la media su milioni di cellule contemporaneamente, il che confonde i giovani con gli anziani e i sani con i malati. Questa squadra ha letto singole celle, circa 295.000. E in ognuno di essi non hanno solo registrato quali geni erano attivati. Hanno usato due tecniche sullo stesso cervello. Il primo leggeva, cellula per cellula, quali geni erano attivi e quali tratti di DNA erano fisicamente aperti e quali erano bloccati. Il secondo leggeva i segni chimici presenti sul DNA e il modo in cui il DNA era piegato in tre dimensioni all'interno del nucleo. Quattro livelli di informazioni di cui la maggior parte degli studi ne ottiene uno, suddivisi in 18 diversi tipi di cellule, monitorati durante l'intera durata della vita umana. Per questa parte del cervello, ciò non era mai stato fatto prima. Come calmi il tuo sistema nervoso? Questa newsletter riguarda i due sistemi che invecchiano il tuo ippocampo: infiammazione ed energia. Le leve quotidiane che ho nominato per queste erano il sonno, i muscoli, la glicemia e il carico di stress. Quest'ultimo è dove si adatta.", "category": "fitness"}, {"title": "Men AND Women Need Estrogen.", "url": "https://neuroathletics.substack.com/p/estrogen-has-4-main-roles-in-the", "date": "2026-10-07T12:48:12+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, un mio amico, quarantasei anni, affilato come una lama, il mese scorso si è seduto nello studio di un medico e ha posto una semplice domanda. Dovrebbe iniziare la terapia ormonale, per il suo cervello. Ha alzato le spalle. Qualche vaga rassicurazione. Una riga su come le prove sono mescolate. Se n'è andata senza niente, che è ciò con cui se ne va la maggior parte delle donne, e mi ha chiamato frustrata, perché non lo chiede per vanità. Sua madre ha l'Alzheimer. Sta guardando l'orologio. Ecco quello che nessuno le ha messo davanti, ed è la cosa che voglio mettere davanti a te. Il motivo per cui non è riuscita a ottenere una risposta chiara non è che la scienza sia debole. È che la vera scienza è scomoda. Non sta in un ricettario o in un titolo, e quindi viene appiattito in “le prove sono contrastanti”, il che è vero e anche inutile. Conosci già le guerre della terapia ormonale. Conosci il WHI, il contraccolpo, la lenta riabilitazione. Non ho intenzione di rievocare il 2002 con te. Sei più intelligente di quella conversazione. Voglio portarti sotto, nella parte che decide effettivamente la risposta. Inizio da qui, perché questa è la frase che ha riorganizzato il modo in cui penso al cervello femminile. In uno studio fondamentale, Roberta Brinton e i suoi colleghi sostengono che la perimenopausa non è affatto un evento riproduttivo. È neurologico. E gli estrogeni, scrivono, non sono un ormone sessuale che capita di visitare il cervello. È un regolatore principale del modo in cui il cervello produce e spende energia (Brinton et al., Nature Reviews Endocrinology, 2015). Siediti con quella parola. Regolatore principale. Di energia. Nell'organo più assetato di energia che possiedi. È solo il momento di festeggiare il mio incontro con la dottoressa Rhonda Patrick. Abbiamo parlato entrambi la settimana scorsa a Vancouver. L'organo che si surriscalda. Il tuo cervello è una fornace.", "category": "fitness"}, {"title": "Vox Media Should Be Ashamed of This Headline", "url": "https://neuroathletics.substack.com/p/vox-media-should-be-ashamed-of-this", "date": "2026-10-06T16:16:30+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Questa settimana ho visto un titolo che mi ha fatto davvero arrabbiare, e non lo dico alla leggera. Era uno di quei titoli grandi, pieni di speranza, di un angolo che è stato girato sull'Alzheimer. Del tipo che una donna la cui madre sta scappando legge sul suo telefono a mezzanotte e sente il suo petto aprirsi per un secondo. Del tipo che fa riflettere una famiglia, forse. Forse c'è qualcosa adesso. Così ho pagato i due dollari e ho letto tutto. Ed ecco la parte strana. L'articolo in sé è più attento del titolo. Il giornalista cita i rischi. Nota anche che l'hype ha già superato la scienza in passato. Ma quasi nessuno legge l’intero articolo. Leggono il titolo, ne sentono la luminosità e se ne vanno credendo che siamo più vicini a una cura di quanto lo siamo noi. Questo divario, tra ciò che implica un titolo scremato e ciò che dice effettivamente la scienza, è la cosa che ferisce le persone reali. Quindi lascia che ti spieghi cosa dice realmente la scienza. La storia parla in realtà di due farmaci. Lecanemab e donanemab. Potresti aver visto i nomi dei marchi, Leqembi e Kisunla. Sono, ad essere onesti, un vero progresso, e non glielo toglierò. Sono i primi farmaci che hanno chiaramente e definitivamente rallentato il declino cognitivo dell’Alzheimer in ampi studi. Per una malattia che ha umiliato ogni trattamento che le è stato somministrato per decenni, questo è importante. Ma ecco cosa non ti dice il titolo e cosa ogni famiglia merita di sapere prima che la loro speranza venga dirottata. Questi farmaci non migliorano nessuno. Vorrei essere preciso, perché qui il punto è la precisione. Negli studi, lecanemab ha rallentato il declino di circa il 27% e donanemab di circa il 35% in diciotto mesi (van Dyck et al., New England Journal of Medicine, 2023; Sims et al., JAMA, 2023). Leggi attentamente quei numeri.", "category": "fitness"}, {"title": "Avengers star defends conservatives while promoting pro-family film", "url": "https://www.lifesitenews.com/news/avengers-star-defends-conservatives-while-promoting-pro-family-film/", "date": "2026-10-16T21:14:12+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) – L’attore dei Marvel Studios Sebastian Stan difende i conservatori mentre promuove il suo nuovo film su una famiglia cristiana tradizionale. Ora nelle sale, Fjord racconta la storia di una famiglia pentecostale romeno-norvegese che si trasferisce in un villaggio costiero e sopporta i sospetti \"sulla rigida educazione religiosa della famiglia\" quando la figlia si presenta a scuola con dei lividi in una storia che \"esplora visioni del mondo contrastanti, conformità, tolleranza e i confini della libertà e dell'intimità\", secondo la sinossi ufficiale. … “In America, sta andando dritto al cuore di questa questione di divisione che stiamo affrontando attualmente, e il motivo per cui le persone lo cancellano o lo sentono come un pezzo di propaganda è perché abbiamo normalizzato il puntamento del dito”, ha detto. \"Questo atteggiamento giudicante e sprezzante che si manifesta online è piuttosto pericoloso e ingenuo, ma sfortunatamente è prevedibile al giorno d'oggi.\" Il film sembra essere un rinfrescante contrasto con la spinta generale “svegliata” della moderna Hollywood. Il Marvel Cinematic Universe, di proprietà della Disney, è iniziato come intrattenimento unificante di evasione, ma intorno al 2019 la società ha iniziato a soddisfare le richieste di “rappresentazione” nei suoi film Marvel e Star Wars, in coincidenza con ciò che fan e critici considerano generalmente i punti bassi in entrambi i franchise. Negli ultimi due anni, ci sono state speculazioni sul fatto che la Disney avrebbe finalmente fatto marcia indietro rispetto alla sua svolta, tra la rimozione di una trama transgender pianificata dalla sua serie animata Pixar Win or Lose, l'intervento esecutivo per rimuovere il sottotesto \"queer-coded\" dal film d'animazione Pixar Elio; I Fantastici Quattro: i primi passi per affermare la maternità e persino raffigurare un bambino non ancora nato, e un accordo con la causa di licenziamento illegittimo dell'attrice conservatrice di Star Wars Gina Carano che ha aperto la porta a", "category": "teologia"}, {"title": "Christian mayoral candidate attacked by ‘trans,’ feminist rivals for pro-life views", "url": "https://www.lifesitenews.com/news/christian-mayoral-candidate-attacked-by-trans-feminist-rivals-for-pro-life-views/", "date": "2026-10-16T19:39:46+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "HAMILTON, Ontario (LifeSiteNews) – Un candidato pro-vita candidato a sindaco a Hamilton, Ontario, è stato “aggredito e attaccato” dal sindaco pro-aborto della città, da un candidato transgender e da altri durante un recente dibattito, dice un gruppo pro-vita. Il sindaco di Hamilton Andrea Horwath e altri hanno attaccato il candidato pro-vita Rob Cooper, che è anche consigliere comunale, chiedendogli di rispondere di quello che secondo lei era il suo \"stile Trump\" e le sue opinioni politiche e pro-vita \"piene di odio\". … Nei commenti a LifeSiteNews, Fonseca si è lamentato di come Cooper sia stato, nelle sue parole, “aggredito e attaccato dal sindaco socialista dell’NDP Andrea Horwath, un candidato transgender radicale e altri” durante il dibattito. Prima che Horwath diventasse sindaco di Hamilton, è stata la leader dell'Ontario New Democratic Party (NDP) dal 2009 al 2022. CLC ha notato che Cooper parteciperà a un evento venerdì e sabato a cui è possibile partecipare tramite un RSVP.", "category": "teologia"}, {"title": "EXCLUSIVE: Former mayor laments Canada ‘banishing God from the public square’", "url": "https://www.lifesitenews.com/news/exclusive-former-mayor-laments-canada-banishing-god-from-the-public-square/", "date": "2026-10-16T19:33:31+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "(LifeSiteNews) – Un ex sindaco canadese, la cui preghiera pubblica alla fine ha portato all’attuale posizione di “neutralità” religiosa del paese, sta ora denigrando quella politica volta a “bandire Dio dalla pubblica piazza”. Jean Tremblay, che è stato sindaco di Saguenay
