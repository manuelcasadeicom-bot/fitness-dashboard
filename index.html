<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 26 Aug 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "I Compared Every Popular Caffeine Source – Here's What I Learned", "url": "https://staycuriousmetabolism.substack.com/p/i-compared-every-popular-caffeine", "date": "2026-08-26T05:01:10.161828+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "If I gave you 100 mg of caffeine&#8230; and then I gave you another 100 mg of caffeine, and then another... you&#8217;d think they&#8217;d feel the same, right? But they don&#8217;t. Coffee can make some people laser-focused and productive. Green tea can feel calm and almost meditative. Yerba mate has developed a cult following among entrepreneurs who swear it gives them energy without the crash. And somehow, dark chocolate contains caffeine too&#8212;yet nobody eats a square of chocolate and feels like they just drank an espresso. So, what&#8217;s going on? It turns out that the source of your caffeine matters at much, or more, than amount of caffeine itself. So the question is: Why do different caffeinated drinks feel so different if they&#8217;re all delivering the same drug? The Caffeine Entourage Let&#8217;s start with the concept that ties it all together. In pharmacology, there&#8217;s a concept sometimes called the &#8220;entourage effect&#8221; &#8212; the idea that a bioactive compound doesn&#8217;t act in isolation. Its effects are shaped by the other molecules traveling alongside it. Think of caffeine as a lead singer. Talented, yes. But the final product depends entirely on the band behind them. The &#8220;band members&#8221; are molecules like L-theanine, theobromine, theophylline, chlorogenic acids, catechins, and tannins. Each caffeine source packages a unique combination of these compounds &#8212; the &#8220; entourage &#8221; &#8212; and that combination determines the whole experience. So, if I give you 100 mg of caffeine from different sources, you won&#8217;t have the same experience. And, once you understand the underlying biology, you can start matching your caffeine source to your goal.", "category": "fitness"}, {"title": "My Journey from Harvard Medical School to Social Media", "url": "https://staycuriousmetabolism.substack.com/p/my-journey-from-harvard-medical-school", "date": "2026-08-26T05:01:10.161828+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Just as my life was beginning to show promise on paper, I hit my lowest point. I was 22 years old, living in a new country for the first time, and sicker than I&#8217;d ever been. I spent days in the hospital, in intensive care and even palliative care, while my peers at Oxford were in the lab or at social gatherings. What put me in that hospital bed was a case of inflammatory bowel disease that a laundry list of medications had been unable to keep at bay. As a result, the promise my life seemed to hold on paper, including my scholarship to Oxford for my PhD and a position at Harvard Medical School thereafter, felt like empty promises. They were opportunities I wanted to pursue, but my health was standing in the way. It&#8217;s ironic, that tension. Maybe you see it. I was on a path to devote my life to the exact sort of academic medicine that&#8217;s supposed to generate solutions for patients like me. Solutions that were insufficient to solve my own problems. But now, looking back more than 8 years later, I see that chapter of my life as a tremendous gift. It&#8217;s the reason that after I eventually completed my PhD and then medical school, I pivoted off the standard path and went from Harvard straight to social media&#8230; Now, when you put it like that, it sounds like a cop-out, like I&#8217;m quitting or somehow selling out. But I frame it that way intentionally because, even as I was doing it, I was keenly aware that&#8217;s exactly how many people in my social circles, even my family, would see it. I&#8217;d invested my entire life in an education that was fiercely focused on a goal: becoming a respected physician-scientist, a practicing clinician, someone who secured major grants, ran a lab, and taught at top academic medical centers.", "category": "fitness"}, {"title": "How to Reverse Atherosclerosis in 1 Year (Proven in RCT)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-reverse-atherosclerosis-in", "date": "2026-08-26T05:01:10.161828+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "When I was 23 years old, I developed extraordinarily high cholesterol. I was told repeatedly that my cholesterol was so high that I would be developing cardiovascular plaque within years and probably have my first heart attack by age 30. I never did. My arteries are perfectly clean, even on the most sensitive imaging. The reason why has been a source of debate. Special genetics? I don&#8217;t think so. A fluke of fate? That&#8217;s not scientific. Just not enough time? Maybe, but it actually skirts around the question. I think the answer, at least in part, lies in something far more obvious on the surface, but far more interesting underneath. And it comes down to two things I do every single day, both of which reduce inflammation in my arteries, and one of which has been shown to cause plaque regression in a human randomized controlled trial published this year. And the best part is that both of them are free. They are sleep and exercise. Now, before you click off because you think I&#8217;ve revealed the secret, I haven&#8217;t. What appear to be banal, obvious, healthy lifestyle interventions act on your arteries in ways you couldn&#8217;t even imagine. In fact, when I read the first paper we&#8217;re going to discuss, it introduced me to an idea I&#8217;d never thought about when it comes to heart health. So come with me on this journey, because I&#8217;m about to open your eyes before you close them later tonight. The Clones in Your Bones Let&#8217;s begin somewhere unexpected. A new study in Nature reveals that sleep and exercise can tame mutant blood cells that drive heart disease.", "category": "fitness"}, {"title": "Jim Kwik: Your Brain Has a Savings Account. You're Probably Draining It.", "url": "https://neuroathletics.substack.com/p/jim-kwik-your-brain-has-a-savings", "date": "2026-08-26T05:01:10.161828+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, Jim Kwik was called &#8220;the boy with the broken brain&#8221; by a teacher, out loud, when he was nine. A brain injury at five left him years behind. He&#8217;s now the brain coach Hollywood actors and CEOs hire to think faster. So when he talks about what a brain can rebuild, I listen. We met to talk about AI. But the thing I keep coming back to is simpler, and it&#8217;s the most useful way to think about your brain I&#8217;ve heard in a long time. He calls cognitive reserve a savings account. It&#8217;s real neuroscience, and it&#8217;s why two people can have the same Alzheimer&#8217;s pathology in their brains while one loses their memory and the other stays sharp at 90. The reserve is the buffer. You spend a lifetime building the balance, and it&#8217;s what protects you when things start to go wrong underneath. Every day, you either make a deposit or take a withdrawal. The withdrawals are the ones you already suspect: bad sleep, chronic stress, sitting all day, processed food. But Jim named a new one. Every time you let a machine do your thinking, that&#8217;s a withdrawal. He pointed to an MIT study where people wrote essays with ChatGPT, with Google, or with just their heads. The AI group had the least brain engagement and barely remembered what they&#8217;d written. His line: you don&#8217;t go to the gym and have someone lift the weights for you. But that&#8217;s what we&#8217;re doing with our minds all day. The deposits are small, free, and completely in your hands. This is the part your evening is made of: Read the actual book, not the AI summary. Do the tip math in your head. Kill the calculator for small stuff. Sit in a boring moment instead of grabbing your phone.", "category": "fitness"}, {"title": "This Billionaire is Obsessed with his Health", "url": "https://neuroathletics.substack.com/p/this-billionaire-is-obsessed-with", "date": "2026-08-26T05:01:10.161828+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I just spent an hour with Keith Rabois , and I have not stopped thinking about how he lives. If you don&#8217;t know the name, he&#8217;s one of the most successful investors of the last twenty years, an early force behind PayPal, Square, and DoorDash. He has more money than he could spend in a lifetime. And he treats his own body with the seriousness of a professional athlete in season. He has not missed more than a handful of workouts in seven years, and the ones he did miss still visibly bother him. He tracks every session. He treats training like brushing his teeth, non-negotiable, not up for debate on any given morning, because he&#8217;s figured out that the moment it becomes optional once, it becomes optional forever. Here&#8217;s the thing I&#8217;ve noticed, and Keith is just the latest example. The most successful people I meet, the investors, the founders, the ones operating at the very top of brutally competitive fields, almost all treat their bodies like elite athletes treat theirs. It&#8217;s one of the most consistent patterns I&#8217;ve seen in this work, and I don&#8217;t think it&#8217;s a coincidence. I want to talk about why, because it changes how you might think about your own health. They stopped separating the body from the mind For most of us, health lives in one box and work lives in another. You go to the gym to look better or to feel less guilty, and then you go do your actual job, which happens in your head. The people at the top don&#8217;t think that way. They&#8217;ve collapsed the two. They train their bodies because it&#8217;s how they protect their minds, their focus, their decision-making, their stamina over a very long career.", "category": "fitness"}, {"title": "The 100-Year-Olds Whose Brains Were Full of Alzheimer's. And Who Kept Their Minds Anyway.", "url": "https://neuroathletics.substack.com/p/the-100-year-olds-whose-brains-were", "date": "2026-08-26T05:01:10.161828+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I want to tell you about a group of people who, by the rules we thought we understood, should not exist. They lived past 100. When they died and their brains were examined, they were full of amyloid plaques and tau tangles, the physical hallmarks of Alzheimer&#8217;s disease. The same wreckage found in the brains of people who lost everything to this disease at 70. And yet these centenarians died sharp. They knew their families. They finished their sentences. They carried the disease in their tissue and never once carried it in their minds. I read brain scans for a living. I am a neurophysiologist, and my entire career has been spent on this one disease, on why it takes so many women, and on the question of who escapes it. So for years I have been telling you, on the podcast and in these letters, probably more often than you want to hear it: having the pathology is not the same as having the disease. Plaques in your brain do not sentence you to dementia. I believed that because the data kept pointing there. But I could never tell you why it was true. There is a difference between a pattern you can see and a mechanism you can explain, and until this summer, this was only a pattern. Then a team in Belgium explained it Subscribe now They stopped looking at the plaques For forty years, the entire field has been transfixed by the plaques. Count them, clear them, attack them. The most expensive Alzheimer&#8217;s drugs on the market right now exist to scrub amyloid out of the brain, at great cost and real risk, for modest benefit. Researchers at VIB-KU Leuven, with the UK Dementia Research Institute and Muna Therapeutics, did something different.", "category": "fitness"}, {"title": "Natural Alternatives to Benzodiazepines", "url": "https://chrismasterjohnphd.substack.com/p/natural-alternatives-to-benzodiazepines", "date": "2026-08-26T05:01:10.161828+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Benzodiazepines are marketed (informally) as &#8220;psych meds&#8221; as if they primarily act on anxiety and stimulation circuits in the brain, but there is no such thing as a &#8220;psych med&#8221; because there are no targets that are only found in the brain and because there are no drugs that when taken orally primarily go to the brain. They have the highest relative uptake into the adrenal gland and they have the highest absolute uptake into muscle and fat. They probably act on GABA receptors found widely outside of the nervous system. While they are not active on the unique GABA receptors in the liver, they are probably active at GABA receptors on the lungs, kidneys, immune cells, reproductive organs, and pancreas. GABA itself regulates mitochondrial metabolism indirectly, but benzodiazepines have two independent mitochondrial targets that lie directly in the mitochondrial membrane and are unrelated to their actions on GABA receptors. There is no evidence that benzos are more powerful regulators of GABA metabolism than of mitochondrial metabolism. In fact, their solubility in fat and cell membranes might make them much more efficient at accessing their mitochondrial targets than at accessing GABA receptors. Like SSRIs , benzos are whole-body mitochondrial drugs. As with SSRIs, benzos are playing with mitochondrial fire. These claims are supported by the evidence and arguments found in the first installment of this series: People who use benzos have 60% greater mortality per unit time than people who don&#8217;t, but people who quit them have 60% greater mortality per unit time than people who stay on them. We cannot say whether these trends represent causation.", "category": "fitness"}, {"title": "Massie is a Real-Food Hero", "url": "https://chrismasterjohnphd.substack.com/p/massie-is-a-real-food-hero", "date": "2026-08-26T05:01:10.161828+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Some $15 million are being spent to oust Thomas Massie today , and no one in congress is more close to those of us in the real food movement than this man. Thomas Massie and me on October 26, 2024 at Wise Traditions, the annual conference of the Weston A. Price Foundation, where he gave the keynote. Massie himself is a grass-fed off-the-grid farmer. My friend John Moody profiled his farm here. The farm is powered by solar panels and Tesla batteries with a house the Massie family built themselves out of logs they cut from their own woods and with stone they quarried from their own land. The home is heated from the same wood, and water comes from a well that Massie dug by hand with his neighbor. They grow peaches and apple trees, raise pastured chickens with an automatic tractor, and raise grass-fed cattle. Massie once admitted to Moody he used Google Maps to spy on Joel Salatin to get new ideas for his farm. No one paid me to write this. Massie has never given me any money but I have donated to his campaign. Massie originated and championed the Processing Revival and Intrastate Meat Exemption &#8220;PRIME&#8221; Act. Crafted by the Farm-to-Consumer Legal Defense Fund, in turn founded by Sally Fallon Morell of the Weston A. Price Foundation and others, this act is meant to remove the USDA as an impediment to small farmers. Small, locally run custom slaughterhouses are all over the place in the United States. USDA slaughterhouses are vanishingly rare and often at great distances away from farmers. The custom slaughterhouses are used by homesteaders and hunters who eat their own meat.", "category": "fitness"}, {"title": "What's Wrong With Jordan Peterson's Health?", "url": "https://chrismasterjohnphd.substack.com/p/whats-wrong-with-jordan-petersons", "date": "2026-08-26T05:01:10.161828+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Jordan Peterson&#8217;s health has been suffering tremendously. Mikhaila, his daughter, saw that what was ailing him was affecting so many systems of his body that it had to all be connected and began to wonder if it was a form of mitochondrial dysfunction. In trying to research whether mitochondrial dysfunction could be driven by the turning points in his health problems like SSRI withdrawal, benzodiazepine withdrawal, and toxic mold, she found my work and reached out to me. This is the conversation that we had: My hypothesis is as follows. Mikhaila shares half of Jordan&#8217;s genes and has been more detailed about her own health journey going back to childhood, so we start with her. She had juvenile arthritis symptoms starting at 2 and a diagnosis at 7. She went on Enbrel, a &#8220;biologic&#8221; (a pseudoscientific regulatory term) that opposes the action of the inflammatory mediator tumor necrosis alpha (TNF-alpha); and on methotrexate, which inhibits folate and adenosine metabolism. Methotrexate raises adenosine, which inhibits T cell proliferation. Its inhibition of folate metabolism is thought to be more relevant to cancer but its adenosine-mediated inhibition of T cell proliferation is thought to be more relevant to autoimmune arthritis. The next year, at age 8, she was diagnosed with depression and put on SSRIs. My hypothesis is that she has an underlying block in mitochondrial metabolism leading to CoA sequestration, which occurs when CoA-requiring pathways fail to complete properly. This leads to secretion of TNF-alpha as part of a cellular stress response. TNF-alpha serves to increase carnitine transport into the cell.", "category": "fitness"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
