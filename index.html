<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 05 Nov 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Outsourcing Your Intellect", "url": "https://thomisticinstitute.substack.com/p/outsourcing-your-intellect", "date": "2026-11-02T13:42:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Alexander Rothaug , “The Three Fates,” 1910, via Wikimedia Commons. All the world’s a stage, And all the men and women merely players; They have their exits and their entrances; And one man in his time plays many parts.” (William Shakespeare, As You Like It) Duc, o parens celsique dominator poli, Quocumque placuit ; nulla parendi mora est. Adsum inpiger. Fac nolle, comitabor gemens Malusque patiar, facere quod licuit bono. Ducunt volentem fata, nolentem trahunt (Seneca, Moral Epistle 107 , n.11 Verses attributed to Cleanthes) The Problem of the Whispering Earring (or Bob’s Smart Glasses) Scott Alexander’s Whispering Earring imagines a magical earring that tells its wearer exactly what to do in every situation. He insists: the earring is always right . By “always right,” he does not mean that it makes the best possible decisions in every situation, but that it always makes a better decision than its wearer would have done, even after careful thought. I would like to introduce a modified version of the whispering earring for us to consider, but let’s change the earring into smart glasses to make it more true to the moment. Now let’s say the smart glasses interface with a perfect AGI model, so that their wearer, we shall call him Bob, can ask the model to supply him with answers to all questions relevant to daily life. Let’s say that one day Bob does not want to deliberate or think about his actions and decides that he will rely on his smart glasses for all of his decisions and tasks.", "category": "teologia"}, {"title": "Introducing the Porphyrian Tree of Virtue", "url": "https://thomisticinstitute.substack.com/p/introducing-the-porphyrian-tree-of", "date": "2026-10-26T13:31:10+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "A New Way to Study the Virtue Theory of St. Thomas Benozzo Gozzoli, “The Triumph of St. Thomas over Averroes,” 1468-1484, via Wikimedia Commons. We are very happy to announce something that’s been years in the making: an enormous project. The Thomistic Institute, along with the Four Pillars Project at the University of St. Thomas (MN), has funded a Scientia Salon on the Theory and Practice of Virtue. This group of experts took up the task of creating a Porphyrian tree of virtue, presenting the theory of St. Thomas Aquinas in all its hierarchical glory. “What, though, is a Porphyrian Tree?” your friend wonders aloud. It’s named after the 3rd-century philosopher Porphyry, a follower of Aristotle who had a penchant for pictorial representations. To make one, you start with a concept, say, substance, then provide exhaustive distinctions between types. Maybe substance is divided between material and immaterial. Then you move to that step, further subdividing the varieties. Material divides into living and non-living; living between the sensible and insensible; sensible between the rational and irrational. If you work out all the types in all the branches, you’ve got yourself a whole tree of distinctions, which is enough to make any philosopher’s heart pitter-patter. That’s what we did with Aquinas’s views of virtue. It is really something to behold. You should go behold it . But before you zip away, let me say a bit about what’s over there. View Virtue Tree The Scholars of the Scientia Salon Thomas’s thought is so broad in scope, yet also so detailed in its sophistication, that it can sometimes be hard to navigate.", "category": "teologia"}, {"title": "Why is Public Discourse so Hard?", "url": "https://thomisticinstitute.substack.com/p/why-is-public-discourse-so-hard", "date": "2026-10-19T13:30:43+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Close to a decade ago, a dear friend of mine talked me into joining an important committee at the school our kids then attended. She said she foresaw difficult discussions coming our way, and she wanted more people on the committee who were able to keep their heads in heated discussions and share careful, calm reasoning. Let’s call her Huldah , after the Old Testament prophetess who saw what was to come. I’m a Philosophy professor who studies virtue in the Christian intellectual tradition. That means that my job, as philosopher, has me disagreeing cordially all day long, and the content of my research has me thinking through how to do that well. So, she didn’t misfire when she asked me to join the committee. And yet, I was hardly prepared for the crowded, acrid meetings that came to pass. Nicolas Andrre Monsiaux, “The Debate of Socrates and Aspasia,” via Wikimedia Commons , 1801. While there were reasonable, understanding people on both sides of the debate, they were the minority. One woman used her thumb and pointer finger to mimic shooting herself in the head when she disliked points being made. Others emphatically rolled their eyes, sneered, chortled, or groaned. Folks would use their allotted time to snootily express platitudes, as if a tautology would prove a substantive policy point, or to aggressively shout assertions, as if disdain or force were the main methods of discussion. And, of course, the worst actors on either side agitated the more moderate members of the other. When it came to respectful and charitable discussion, to flip the phrase, the whole was worse than its parts. The whole process was ugly, and it tore apart a community that otherwise had been healthy and vibrant. The culture of the place changed drastically.", "category": "teologia"}, {"title": "How to Reduce Liver Fat by 68% in 6 Months (Proven in RCTs)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-eat-to-reverse-fatty-liver", "date": "2026-11-03T12:03:17+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Fatty liver affects roughly 1 in 3 adults. And it’s a serious, insidious health problem because your liver is the gatekeeper of your metabolism. When your liver accumulates excess fat, it can become insulin resistant, setting the stage for cardiovascular disease, diabetes, and dementia. And the issue is that most people are getting terrible nutrition advice for fatty liver. The result? Many people’s fatty liver progresses when it can, and should, regress. Yes, fatty liver can absolutely be reversed. And fast! In fact, one recent randomized controlled trial showed that a specific diet could reduce liver fat by 68% in just six months. We will get into it. But first, we need to understand why the liver gets fatty in the first place. (Hint: it’s not because you ate fat.) Why Does a Liver Get Fatty? A liver becomes fatty when the fat being produced outpaces the fat being burned. I do emphasize “being produced” because the primary culprit in fatty liver is not the butter you fried your eggs in that migrated into your liver and popped a squat. Rather, fatty liver arises when your liver makes its own new fat particularly from sugar and refined carbohydrate in the diet (a process called de novo lipogenesis ). As for the other side of the equation, fat is burned largely on demand. So, the high-level formula to reverse fatty liver is: Press the brake on de novo lipogenesis through reducing the driving dietary force. Pressing the gas on liver fat burning by creating the right metabolic conditions. Or, if you want to think about your liver like a bathtub. The fat stored in your liver is the water level. Eating more sugar and refined carbohydrates is like turning on the faucet, increasing the flow of fat into the liver.", "category": "fitness"}, {"title": "I Ate a Special Chocolate that Changed My Appetite", "url": "https://staycuriousmetabolism.substack.com/p/dont-eat-chocolate-again-until-you", "date": "2026-10-31T11:03:28+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "For three separate weeks, I started every lunch with a bar of chocolate. Same ritual, every single day. The bars looked identical. They tasted identical. I couldn’t tell them apart. But during one stretch of that experiment, I ended up eating about 500 extra Calories at lunch, day after day, without ever feeling like I was overeating. Same chocolate. Same taste. 500 more Calories. So, what was going on? Today I’m going to explain science that might change how you eat sweets forever. A Sweet Molecule Is Not Just a Sweet Molecule Now, I should reveal that these weren’t just chocolate bars I picked off the shelf. I made them from scratch, and the difference between them was the sweetener I used. Because the fact of the matter is that different sweet molecules have different chemical structures. And even if there isn’t much difference on your tongue, your nervous system beyond your mouth can detect the difference. Different structures. Different receptors. Different downstream effects. But all beneath your conscious awareness. As a result, one sweet molecule may lead you to subconsciously eat more than another sweet molecule. At least that’s the theory. But now I should back up and explain the impetus for the experiment. It came from a paper published in Cell Metabolism that asked a simple question: How is sugar sensed by the nervous system in the gut? The advantage of using animals in this type of experiment is that you can do something a little sinister. Not only can you control calories by giving sugar alone, fat alone, or a calorie-matched combination of sugar and fat, but you can also bypass taste entirely by implanting small tubes that infuse those nutrients directly into the stomach or intestines. Then you can monitor how much the animals eat.", "category": "fitness"}, {"title": "Does High HDL Cancel Out High ApoB?", "url": "https://staycuriousmetabolism.substack.com/p/are-you-immune-to-high-apob", "date": "2026-10-29T11:01:00+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Could good metabolic health make you immune to the dangers of high LDL and ApoB? Well, a new study published in the European Journal of Preventive Cardiology just threw a wrench into the story that high LDL and ApoB are always bad. Don’t believe me? Here’s a quote: “When HDL-C is high, the effect of changing ApoB vanishes.” Not diminishes. “Vanishes.” And this study of nearly 300,000 people aligns with my own N=1. I have zero plaque (0 mm 3 ) in any of my arteries, soft or calcified, on advanced cardiac imaging, despite spending the better part of a decade with an LDL near 600 mg/dL and ApoB well over 300. Those are levels that would give your average cardiologist nightmares. So, what gives? Do I have “immunity” to the dangers of high ApoB, a word the authors themselves use? And, perhaps more importantly… what about you? Now, this might seem like a simple “woohoo” moment and victory lap for those with high HDL. But, like any good scientific story, there are a lot of nuances to unpack. But first, I want to introduce our characters and tell you what the researchers behind this study did. The Villain and the Hero: ApoB and HDL Our two big characters today are ApoB and HDL cholesterol (HDL-C). ApoB refers to a protein that sits on certain particles floating around in the bloodstream, collectively called the “ApoB-containing lipoproteins.” The most famous are the LDL particles. LDL particles are the key villain in the conventional cardiology story. And if you get a standard lipid panel and see an LDL cholesterol (LDL-C) value, that is the total cholesterol mass carried within your LDL particles. ApoB is considered a better risk marker than LDL cholesterol, since the amount of cholesterol in each particle can vary.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! Go watch this one. I mean it. I sat down with Dr. Michael Breus, the Sleep Doctor, and I left rethinking things I was sure I already understood. He has spent his whole career as a clinical psychologist doing one thing, fixing the way people sleep, and he is blunt in a way I loved. First thing that floored me: the Sleep Doctor himself stops breathing 26 times an hour in his sleep, and had no idea for years. How he found out: His workouts were falling apart and his mile time kept climbing He ran bloodwork, even tried testosterone, chasing every other explanation first Nothing moved Finally someone asked when he’d last done a sleep study It came back 26. He was so sure it was broken that he retook it. Same number. The Sleep Doctor had sleep apnea and didn’t know. Here’s why that should scare the rest of us: It can happen anywhere from 5 to hundreds of times an hour, and most people never know it’s happening Every time you stop breathing, your heart rate drops then spikes to restart you, loading your heart all night long. Over time that can tip into atrial fibrillation. You’re also starving your brain of oxygen, and you never sink into the deep sleep where the brain runs its own cleanup His tell for spotting it across a room: a neck over 17.5 inches carries an 83 percent chance of apnea (his number) And one story I won’t forget: a detective, benched because he kept falling asleep on stakeouts, finally got on a CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team!!!!! A brand new creatine study has arrived!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That almost never gets studied, and this team pulled it off. You know creatine is one of the very few supplements I actually stand behind. So when a trial like this lands, I read every single line. And what they found got me fired up. Why this matters to you If you are in your forties and your brain feels like it is running too many tabs at once, this study is about you. The word that vanishes mid-sentence. The 3 a.m. wake-up. The afternoon fog that will not lift. You have been told this is just perimenopause and to wait it out. These researchers went looking for something better. What they did Fifty-one women in perimenopause, average age 46. Three groups. Most of them trained hard, twice a week, for six weeks. A smaller group did nothing, as the comparison. Half of the training women got creatine, half got placebo. And to see inside the brain, the team placed a sensor on each woman’s forehead and measured how much oxygen-rich blood her prefrontal cortex pulled in while she worked through a tough mental test. A note on sunlight, UVB, and why I’ve been using Solius This is my latest hack for circadian rhythm disruption! The obvious answer is to get outside more—and I still think that should come first. But the reality is that consistent UVB exposure is not always easy. Season, latitude, weather, work schedules, and how much time we spend indoors all change what we actually get. That’s one reason I’ve been using Solius .", "category": "fitness"}, {"title": "Belly Fat Is Shrinking Your Brain", "url": "https://neuroathletics.substack.com/p/belly-fat-is-shrinking-your-brain", "date": "2026-10-22T12:22:33+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, The fat around your waist is talking to your brain. Not as a metaphor. Chemically, constantly, every single day. A major new review just sat me down and walked me through the entire conversation, from one bloated fat cell all the way up to the circuits that hold your memories. I read it twice, and on the second pass I was scribbling in the margins like a lunatic, because the story it tells about the midlife brain is one of the most important things I have read all year. Here is the scale of what we are talking about. Almost 900 million people now live with obesity, and rates of dementia are projected to nearly triple by 2050. Those two lines are converging. This review is about the exact place they meet, which is your brain. It came out in Nature Reviews Neurology. Instead of a single study, it pulls the whole field into one place, from studies of millions of people down to the precise damage happening inside individual brain cells. Let me walk you through it the way it walked me through it. Fair warning: it gets stranger as it goes. First, a paradox that broke this field for a decade For years, the data made no sense. Study after study found that being obese in old age was associated with a lower risk of dementia. Thinner older adults got dementia more often. People started calling it the “obesity paradox,” and it got used, loudly, to argue that the worry about weight and the brain was overblown. Here is the grim problem. People often start losing weight in the years before dementia is ever diagnosed. The disease is already quietly eating through the brain, appetite and behavior shift, and the number on the scale falls. So late-life thinness was never protecting anyone. It was an early symptom being mistaken for a shield.", "category": "fitness"}, {"title": "Leslyn Lewis demands answers on ‘safeguards’ in new euthanasia bill", "url": "https://www.lifesitenews.com/news/leslyn-lewis-demands-answers-on-safeguards-in-new-euthanasia-bill/", "date": "2026-11-05T00:18:40+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "OTTAWA ( LifeSiteNews ) — Pro-life Conservative MP Leslyn Lewis demanded that the ruling Liberal government explain what safeguards will be put in place for its new euthanasia bill that allows people to be euthanized without their consent. “Who makes those decisions whether a person can live or die at that particular time when they do not have the capacity to do that?” she asked MPs during a recent House of Commons debate. … Liberal Justice Minister Sean Fraser, who introduced Bill C-41, says that it permanently blocks euthanasia, or so-called “medical assistance in dying” (MAiD), for those with mental illness. However, CLC warned that it allows euthanasia to continue, leaving only doctors and nurses as a purported check and balance. As LifeSiteNews reported , on October 7, the federal government paused a planned expansion of allowing euthanasia to those with mental illness as the sole cause. Still, it then said that it would allow assisted suicide by advance request. On the same day, it voted against Conservative Bill C-218, which would have banned the practice outright. Euthanasia in Canada has become prevalent . Recent statistics show that the nation recorded more deaths by euthanasia than murders by guns in the United States in 2024.", "category": "teologia"}, {"title": "Baby saved from abortion after dad drives by pro-life sign, priest says", "url": "https://www.lifesitenews.com/news/baby-saved-from-abortion-after-dad-drives-by-pro-life-sign-priest-says/", "date": "2026-11-04T17:33:22+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) – A Canadian Catholic priest has shared the positive news that an unborn child was saved from an abortion after the child’s father saw a Life Chain pro-life witness on the side of the road and had a change of heart. Campaign Life Coalition (CLC) shared the “good news” of the baby being saved, after recounting a story from Fr. Brenton Cordeiro, pastor of St. Timothy’s Catholic church in Toronto. … According to CLC, since abortion became legal in Canada in 1969, nearly five million preborn children have “been erased” by the deadly practice. The sad reality is that abortion has become more common in Canada. There were 368,928 babies born in Canada from 2024 to 2025, a number that would be much greater if not for abortion. In 2022, 97,211 Canadian babies were killed by abortion. Similarly, reports from 2018 indicated that 766 babies were born alive and presumably left to die after late-term abortions in Canada between 2013 and 2018.", "category": "teologia"}, {"title": "Liberal author claims Catholics don’t ‘seriously believe’ in Real Presence", "url": "https://www.lifesitenews.com/news/liberal-author-claims-catholics-dont-seriously-believe-in-real-presence/", "date": "2026-11-04T16:13:29+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. ( LifeSiteNews ) — Author Joyce Carol Oates has mocked the Catholic doctrine on transubstantiation and claimed that author Flannery O’Connor did not believe in the Real Presence. … Ulrich Lehner, a Catholic professor at Notre Dame University, told Oates, “I would be embarrassed if I spoke so uninformed.” Other users on X added a “community note,” used to correct false claims on the platform or offer additional context. The note states: “Flannery O’Connor did not believe the Eucharist was merely ‘symbolic’ or ‘metaphorical,’ contrary to Oates’ claim. O’Connor repeatedly stated the Catholic belief that although the wafer has the physical qualities (‘accidents’) of bread, its true substance is Jesus Christ.” O’Connor famously said: “Well, if it’s a symbol, to hell with it!” The novelist was an outspoken defender of Christ’s Real Presence in the Eucharist.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
