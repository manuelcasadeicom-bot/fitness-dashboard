<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 26 Sep 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "The Art of Being Good", "url": "https://thomisticinstitute.substack.com/p/the-art-of-being-good", "date": "2026-09-26T05:01:08.403600+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Winslow Homer, &#8220;Snap the Whip,&#8221; 1872, via Wikimedia Commons . The Need for Cultivation I spent the morning watching our seven-month-old as he attempted to conquer the world&#8212;his bright eyes surveying with rapt attention, wonder exuding from every pore, muscles taut in exploration and discovery&#8212;everything in him reaching for understanding and achievement, striving toward truth and goodness. Watching our little boy, I was again reminded that our greatest drive&#8212;one might even say our primal instinct&#8212;is this inner impulsion toward truth and goodness. This powerful drive is evidently a most important feature of human life, perhaps the most important, and everything in our little boy strains forward as a result of its powerful thrust. But this drive is also wild . Wild, not in the sense of chaotic and messy, and therefore problematic, but in the entirely natural sense of not-yet-gardened. It is the wild of nature before the activity of a gardener, bold and intense, fierce and powerful&#8212;yet also good, with a goodness that is in need only of our intervention to bring it home. In the same way as the wilds of nature need a gardener to flourish, so too this interior drive requires our cultivation if it is to take its proper shape. The reason for this is found in the fact that God does not create the human (or indeed, anything) &#8220;fully made,&#8221; but rather furnishes us with an aptitude to develop over the course of time&#8212;and thereby gradually attain our natural perfection. From this we see that from the outset of our lives we are established in the privileged position of being collaborators with God in our own creation, for, as St. Thomas notes, &#8220;the dignity of causality is imparted even to creatures&#8221; by God.", "category": "teologia"}, {"title": "Sobriety and Conceptual Shifts", "url": "https://thomisticinstitute.substack.com/p/sobriety-and-conceptual-shifts", "date": "2026-09-26T05:01:08.403600+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Caravaggio, &#8220;Bacchus,&#8221; 1596, via Wikimedia Commons. What Does it Mean to be &#8220;Sober&#8221;? Language shifts. Sometimes the change leaves a gaping void in our ability to understand the world and our place in it. Consider, for instance, the virtue term &#8216;sober.&#8217; When you hear that word, what do you envision? You might say someone is sober when you mean that he isn&#8217;t currently drunk. Or maybe you thought that someone is sober in the sense of having &#8216;sobered up,&#8217; having formed a stable disposition not to partake at all in the relevant intoxicant. Sometimes such people live in a &#8220;sober house.&#8221; Or, third, you might think of someone as sober when he is solemn, mature, not prone to frivolity. Gimli the dwarf of the Lord of the Rings books&#8212;but not the movies, where he is played for comic effect&#8212;is sober. The first usage&#8212; &#8216;sober&#8217; as not currently drunk&#8212;names a present state, not a stable trait. Habitual drunkards can be sober in that first sense. Of the latter two, it is only the middle that deals with intoxicants, and so only the middle that stands a chance to be the virtue of sobriety. But importantly, that second use of the term&#8212;having a stable disposition not to partake in the relevant intoxicant at all &#8212;does not express the traditional virtue of sobriety. Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts every Monday. Sobriety in the Traditional Sense To be sober , in the traditional sense, is to be a person stably disposed to partake of intoxicants in the right measure, for the right reasons, in the right occasions.", "category": "teologia"}, {"title": "On Grit and Fortitude", "url": "https://thomisticinstitute.substack.com/p/on-grit-and-fortitude", "date": "2026-09-26T05:01:08.403600+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Sant, &#8220;Courage, Anxiety, and Despair: Watching the Battle,&#8221; 1850, via Wikimedia Commons. An Introduction to Grit and Fortitude Stories valorizing perseverance through difficulty and trial&#8212;sometimes called grit&#8212;have existed as long as we have records, as far back as Homer&#8217;s Iliad and Odyssey . Grit continues to be celebrated in our culture in stories of those who have endured great hardship. Is grit alone enough? Should we seek something more? Grit emerged onto the scene in psychology roughly two decades ago. Popularized especially by the work of Angela Duckworth, founder of the Character Lab . Grit, understood as perseverance in long-term goal pursuit, relates to both energy and endurance. Those with grit tend to be more successful in school and career, and they tend to have better health outcomes. Interest in grit was especially high in the United States military in order to improve resilience among officers . These psychologists seem to believe that grit is good. Others agree and have taken to calling it a performance virtue. Given this modern virtue&#8217;s two main facets, energy and endurance, grit seems to align closely with Thomas Aquinas&#8217; views on fortitude. Aquinas considers fortitude to have two main facets as well, endurance and &#8216;attack&#8217;, understood as preparing for and engaging with difficult tasks . So far then, it seems that grit and fortitude are similar, with attack relating closely to maintaining energy. However, given Aquinas&#8217; views of virtue, fortitude is subject to reason and ideally to right reason. Grit has no such constraint. Does this matter? If so, why? Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts in your inbox every Monday.", "category": "teologia"}, {"title": "Do You Ever Feel Like Your Doctor Hates You?", "url": "https://staycuriousmetabolism.substack.com/p/do-you-ever-feel-like-your-doctor", "date": "2026-09-26T05:01:08.403600+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "There&#8217;s one phrase we learned in medical school that I absolutely hate: &#8220;If you hear hoofbeats, think horses, not zebras.&#8221; The idea is simple: the most common explanation is usually the correct diagnosis. That works great if you&#8217;re a horse. But if you&#8217;re a zebra, it sucks. Because when you don&#8217;t fit the usual pattern, you can get dismissed or misdiagnosed. And if you&#8217;re misdiagnosed, you can get mistreated. Unfortunately, I have a knack for being a zebra. But this thing is: I know some of you reading this are zebras, too. Maybe you&#8217;ve experienced symptoms your doctor couldn&#8217;t explain. Maybe you&#8217;ve received conflicting medical advice. Or maybe you&#8217;ve walked out of an appointment feeling confused, dismissed, or wondering whether there&#8217;s something important about your health that everyone is missing. I&#8217;ve been there. More than once. And through my own experiences navigating unusual medical conditions, I&#8217;ve learned something that I wish every patient understood: You have an enormous amount of power in solving your own health problems. And, there&#8217;s a way to do this without becoming your doctor&#8217;s worst nightmare. But first, let me tell you why I have a particular affinity for zebras. My First Zebra Experience When I was 18, for example, I developed osteoporosis . It wasn&#8217;t diagnosed until I was 20, and even then, I was given an explanation that didn&#8217;t make sense to me: relative energy deficiency in sport (RED-S). Effectively, I was told I wasn&#8217;t eating enough energy to support my activity. Even to my incompletely formed brain, that seemed like an unlikely explanation.", "category": "fitness"}, {"title": "A Masterclass on Building Stronger Bones", "url": "https://staycuriousmetabolism.substack.com/p/a-masterclass-on-building-stronger", "date": "2026-09-26T05:01:08.403600+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Here&#8217;s a not-so-fun fact: I used to have osteoporosis. Now, if you know even a little medicine, you might be skeptical. I&#8217;m a 30-year-old man who generally reports being healthy. So, the idea that I had osteoporosis sounds extreme. I was diagnosed around age 20 after an unusual series of events. What made the situation so strange is that I had never had any bone problems as a child. My first fracture occurred when I was 18 years old while training for the Boston Marathon. In fact, I was the youngest qualifier for the 2014 Boston Marathon. A short time before the race, however, my tibia broke. (I still ended up crutching the marathon , but that&#8217;s a different story.) What was peculiar is what happened afterward. I couldn&#8217;t recover. Over the next several years, I developed more and more fractures&#8212;first in my legs, then my pelvis, and eventually even my vertebrae. When I finally underwent a bone density scan, the results were shocking: my bone density was in the bottom 1% or less for my age. This was particularly startling because just a few years earlier I had run more than 3,000 miles in a year without so much as a bone twinge. What&#8217;s more, there was no obvious explanation. I had a healthy BMI. My testosterone levels were normal. I ate well. I consumed plenty of protein. My vitamin D levels were normal. There was essentially nothing in my bloodwork to suggest I should have the bones of an 80-year-old woman. But I did. *Nick note: The rabbit hole this sent me down ultimately became my first first-author paper : it turns out I have an extraordinarily rare genetic mutation affecting how my bones respond to mechanical loading. In my case, excessive high-impact loading from marathon training was probably breaking down my bones.", "category": "fitness"}, {"title": "Rejuvenate Your Body's Anti-Cancer Defenses", "url": "https://staycuriousmetabolism.substack.com/p/could-peptides-restore-our-natural", "date": "2026-09-26T05:01:08.403600+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Somewhere in your body right now, a cell has started down the path toward cancer, and your immune system is finding it and shutting it down before it can ever become a tumor. The problem is that defense system declines as you age. This is, in fact, one of the primary reasons cancer rates increase with age. Not just because you accumulate genetic mutations, but because precancerous cells can escape your body&#8217;s natural defenses. But where does this process start to go wrong? One of the immune system&#8217;s key command centers is the thymus. It&#8217;s a small organ you probably never think about and sits behind your breastbone. And the thymus slowly decays with age, but at different rates in different people. And here&#8217;s where things start to get interesting. According to new research published in one of the world&#8217;s top science journals, Nature : Humans with faster thymus aging get cancer at higher rates. Conversely, people with unusually young thymuses appear protected from cancer. In one study of over 23,000 adults, those with the healthiest thymuses had a 36% lower rate of lung cancer than those with the more deteriorated thymuses. So here&#8217;s the question: If your anti-cancer defenses erode as you age, can you rejuvenate them? In this letter, I&#8217;ll show you: How your anti-cancer defenses actually work Why they fade with age Specific peptides I&#8217;d actually consider Where caution is warranted. I&#8217;m not going to hand you a cure for cancer.", "category": "fitness"}, {"title": "You have health insurance. Why are you still fighting for care?", "url": "https://neuroathletics.substack.com/p/you-have-health-insurance-why-are", "date": "2026-09-26T05:01:08.403600+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A woman with breast cancer is under anesthesia. Her mastectomy has already begun. In another operating room, her reconstructive surgeon, Dr. Elisabeth Potter, is finishing a case when a nurse comes in with an unusual message: UnitedHealthcare is on the phone, and they need to speak to her right now . The call is about the woman currently undergoing surgery. The insurance company wants Potter to explain the patient&#8217;s diagnosis and justify why she needs to remain in the hospital overnight. The patient has breast cancer. She is already unconscious. Her surgery was authorized. Her physicians have determined the care she needs. And yet, in the middle of the operation, her surgeon is being asked to step away and defend it. Potter told me that in that moment she felt like she was having to &#8220;protect my patient from her insurance company.&#8221; The overnight stay was ultimately denied anyway, and the patient received a bill for $100,000 . After Potter spoke publicly about what happened and the story exploded online, she says the bill was erased. But that immediately raises a much more disturbing question: what happens to the patient whose doctor doesn&#8217;t have a viral video? Your nervous system needs inputs, too Taking an active role in your health also means paying attention to the stress you carry every day&#8212;and making room for recovery before you&#8217;re completely depleted. Between work, training, travel and caring for the people around you, &#8220;just relax&#8221; can feel like one more thing on an already unreasonable to-do list. That&#8217;s one of the reasons I&#8217;ve been using Nuropod .", "category": "fitness"}, {"title": "A study of 854 women found one hormone linked to lower levels of Alzheimer’s-related tau", "url": "https://neuroathletics.substack.com/p/a-study-of-854-women-found-one-hormone", "date": "2026-09-26T05:01:08.403600+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, For decades, we have spoken about menopause as though it happens below the neck: hot flashes, poor sleep and weaker bones. But estrogen loss reaches the brain&#8212;and ignoring that may be one of the greatest blind spots in women&#8217;s health. A new peer-reviewed study published in Alzheimer&#8217;s &amp; Dementia adds to the evidence that estrogen biology may be connected to one of the central processes underlying Alzheimer&#8217;s disease: the accumulation of tau. Researchers studied 854 female participants aged 50 and older from the European Prevention of Alzheimer&#8217;s Dementia Longitudinal Cohort. Their average age was approximately 65, and the group included cognitively healthy participants as well as people with mild cognitive impairment. Using a highly sensitive method called liquid chromatography-tandem mass spectrometry, the researchers measured two estrogens circulating in the blood: estradiol and estrone. They then compared those concentrations with three Alzheimer&#8217;s-related biomarkers measured in cerebrospinal fluid: Amyloid-beta 42, Phosphorylated tau 181 and Total tau. The clearest finding was this: higher circulating estradiol was associated with lower phosphorylated tau at baseline. The relationship was stronger in women who carried APOE4, the most important common genetic risk factor for late-onset Alzheimer&#8217;s disease. This matters because abnormal phosphorylation changes how tau behaves inside the brain. Tau can detach from the internal structure of neurons and eventually accumulate into the tangles associated with Alzheimer&#8217;s disease and neurodegeneration.", "category": "fitness"}, {"title": "I’ll Say it... GLP1’s are a Longevity Drug and they Work Better in Women than Men", "url": "https://neuroathletics.substack.com/p/ill-say-it-glp1s-are-a-longevity", "date": "2026-09-26T05:01:08.403600+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I was on FaceTime with my sister-in-law yesterday. She&#8217;s 47, she&#8217;s been trying for months to get back to the strongest version of herself, and she&#8217;s doing everything right, or everything she&#8217;s been told is right, and it isn&#8217;t quite working. So I mentioned GLP-1s. Gently. Just as one thing worth understanding. And her face changed. &#8220;Aren&#8217;t those the ones that make your hair fall out and eat your muscle?&#8221; She&#8217;d read the posts. The muscle loss, the thinning hair, the gaunt &#8220;Ozempic face.&#8221; She was scared of them, and she couldn&#8217;t actually tell me what they did or how they worked. She just knew she was supposed to be afraid. And I sat there thinking, this is one of the most-studied drugs in modern medicine, and one of the smartest women I know is terrified of it based on captions. That conversation is why I&#8217;m writing to you today. Because my sister-in-law is not unusual. She&#8217;s the rule. Most people I talk to are frightened of these drugs and fascinated by them at the same time, and almost nobody has been given the honest version. So let me give it to you. Because two days ago, something landed that changes the conversation entirely. A team at UC Berkeley took a group of old female mice, the mouse equivalent of a woman in her late 60s, and gave half of them a GLP-1 drug. The same class of drug as Ozempic and Wegovy. Not from youth. From old age. And the mice that got the drug lived meaningfully longer than the ones that didn&#8217;t. Their median lifespan went from 742 days to 834 days. That&#8217;s about 12% more life, and it was published in Nature two days ago (Feng et al., 2026). From Feng et al., Nature (2026), used under CC BY 4.0.", "category": "fitness"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
