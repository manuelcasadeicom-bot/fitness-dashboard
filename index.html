<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 22 Aug 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "The Hidden Link Between Insulin Resistance and IBS", "url": "https://staycuriousmetabolism.substack.com/p/the-missing-ingredient-linking-insulin", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "In un nuovo studio pubblicato su Cell Host & Microbe, i ricercatori hanno esaminato l’intestino di persone con sindrome dell’intestino irritabile (IBS) e persone con resistenza all’insulina. Hanno scoperto che a entrambi i gruppi mancava lo stesso ingrediente. Non una vitamina. Non un minerale. Una molecola derivata dall'intestino che può essere prodotta da un comune grasso alimentare. Prometto che entreremo nei dettagli e nelle soluzioni. Ma prima di farlo, devo fornire un quadro un po’ più ampio. IBS e resistenza all'insulina sono collegati L'IBS, e in questo caso, in particolare l'IBS con diarrea (IBS-D), è un disturbo gastrointestinale che colpisce milioni di persone in tutto il mondo. Inoltre, l’IBS e le più gravi malattie infiammatorie intestinali (IBD) sono strettamente associate a una dieta occidentalizzata. *A parte l'autore: a livello personale, se la mia dieta infantile a base di Subway, Twizzlers e quantità industriali di cereali per la colazione abbia causato la mia diagnosi di malattia infiammatoria intestinale... beh, suppongo, un po' come il centro di un Tootsie Pop... il mondo forse non lo saprà mai. Comunque, nostalgia a parte, so anche che non ti sorprenderà che un’altra patologia legata alle diete occidentalizzate sia l’insulino-resistenza. Ma queste sono semplicemente due condizioni (IBS e resistenza all’insulina) che sono associate allo stesso modello dietetico? Oppure esiste un legame più profondo? Penso che tu sia abbastanza intelligente da sapere dove andrà a finire. Secondo questi nuovi dati, esiste un collegamento. E inizia nel microbioma. Forse questa non è una sorpresa. Il microbioma è uno dei principali guardiani tra il mondo esterno e la nostra biologia interna. Ciò che mangiamo, il modo in cui viviamo e gli ambienti in cui viviamo possono rimodellare profondamente il microbioma, influenzando tutto, dalla salute dell’intestino ai sintomi come il gonfiore.", "category": "fitness"}, {"title": "The Strange Blue Vial That Got Me Running Again", "url": "https://staycuriousmetabolism.substack.com/p/i-injected-this-strange-blue-peptide", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Un paio di mesi fa, ho iniziato a iniettarmi una strana formulazione peptidica blu chiamata KLOW Stack. Tecnicamente non si tratta di un peptide ma di quattro, ciascuno dei quali mira a diversi aspetti della guarigione e del recupero. Insieme, sono progettati per funzionare in sinergia e, almeno in teoria, accelerare la capacità del corpo di autoripararsi. Ho già notato alcuni cambiamenti incoraggianti. In particolare, uno riguarda un infortunio con cui mi occupo da più di un decennio: un danno al ginocchio destro riportato dopo una serie di fratture e interventi chirurgici. Da allora, correre è stato difficile. Anche le corse brevi spesso lasciano il ginocchio gonfio e il tessuto cicatriziale circostante infiammato. Ma recentemente, per la prima volta dopo anni, ho potuto correre senza le solite conseguenze. Ora, questo è un aneddoto. Ma l’assenza di prove definitive non è la stessa cosa dell’assenza di promesse. Quindi oggi voglio illustrare: Che cos'è lo stack KLOW Perché le persone ne sono entusiaste Cosa sappiamo di ciascuno dei suoi componenti Come potrebbe essere il futuro della guarigione e del recupero Dedicherò anche un po' di tempo a discutere questioni più ampie: Perché sono disposto a sperimentare composti che non hanno l'approvazione della FDA? E come possiamo bilanciare i rischi di adottare un trattamento troppo presto con i rischi di ignorare qualcosa di potenzialmente prezioso per decenni in attesa di prove perfette? Perché alla fine la conversazione non riguarda solo i peptidi. Riguarda il modo in cui affrontiamo l’incertezza nella medicina stessa. Gli abbonati Premium hanno pieno accesso ai miei approfondimenti sulla ricerca metabolica all'avanguardia per meno di $ 1/lettera, 3 a settimana. Te ne andrai sempre con almeno una nuova intuizione sulla salute metabolica. Nel resto di questa lettera per StayCur", "category": "fitness"}, {"title": "Scientists Searched 1 Million People—and Found the Lean Gene", "url": "https://staycuriousmetabolism.substack.com/p/scientists-searched-1-million-peopleand", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Un nuovo studio su oltre 1 milione di persone, appena pubblicato su Nature, ha scoperto una rara variante genetica legata a: minor grasso corporeo, maggiore massa magra, migliore controllo della glicemia, trigliceridi più sani e un notevole rischio inferiore del 60% di malattie cardiometaboliche. Ma questo non è solo un interessante colpo di fortuna genetico – o un motivo per invidiare i pochi fortunati che hanno vinto la lotteria del DNA. La verità è che scoperte come questa stanno diventando modelli per i farmaci di domani. Grazie ai progressi nel campo della genetica e della biotecnologia, siamo sempre più in grado di trasformare gli esperimenti della natura in terapie a beneficio di tutti. In effetti, i ricercatori hanno scoperto che delle decine di geni individuati, quasi il 40% codifica già per bersagli farmacologici approvati o in fase clinica. Questo non è un gabinetto di curiosità. È un gasdotto. Quindi, analizziamo cosa hanno scoperto gli scienziati, cosa significa, cosa non significa e cosa puoi effettivamente fare al riguardo a partire da oggi. L'approccio I ricercatori si sono proposti di comprendere la genetica del metabolismo energetico umano. Per fare ciò, hanno sequenziato i genomi codificanti le proteine ​​di 1.032.116 persone, provenienti da undici coorti in Nord America, Europa e Asia. Hanno iniziato con un numero apparentemente semplice: il rapporto trigliceridi/HDL, un calcolo che puoi fare tu stesso dal tuo pannello lipidico dividendo i tuoi trigliceridi per il tuo colesterolo HDL. Torneremo sul motivo per cui questo indicatore è così utile, perché risulta essere la parte più fruibile dell'intera storia. Prima di toccare un singolo gene, hanno studiato il rapporto stesso. Nell'analisi di un'ampia popolazione, un rapporto TG:HDL più basso (migliore) è stato rilevato con: Meno grasso totale e viscerale Insulina a digiuno e HbA1c più bassi Pressione arteriosa più bassa", "category": "fitness"}, {"title": "Jim Kwik: Your Brain Has a Savings Account. You're Probably Draining It.", "url": "https://neuroathletics.substack.com/p/jim-kwik-your-brain-has-a-savings", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, Jim Kwik fu chiamato “il ragazzo con il cervello rotto” da un insegnante, ad alta voce, quando aveva nove anni. Una lesione cerebrale a cinque anni lo ha lasciato indietro di anni. Ora è il brain coach che gli attori e gli amministratori delegati di Hollywood assumono per pensare più velocemente. Quindi, quando parla di ciò che un cervello può ricostruire, lo ascolto. Ci siamo incontrati per parlare di IA. Ma la cosa a cui continuo a tornare è più semplice, ed è il modo più utile di pensare al tuo cervello che ho sentito da molto tempo. Chiama la riserva cognitiva un conto di risparmio. È vera neuroscienza, ed è il motivo per cui due persone possono avere la stessa patologia di Alzheimer nel cervello mentre uno perde la memoria e l'altro rimane sveglio a 90 anni. La riserva è il cuscinetto. Trascorri una vita a costruire l’equilibrio, ed è ciò che ti protegge quando le cose iniziano ad andare male. Ogni giorno effettui un deposito o effettui un prelievo. Le astinenze sono quelle che già sospetti: cattivo sonno, stress cronico, stare seduti tutto il giorno, cibi trasformati. Ma Jim ne ha nominato uno nuovo. Ogni volta che lasci che una macchina pensi, quello è un ritiro. Ha indicato uno studio del MIT in cui le persone scrivevano saggi con ChatGPT, con Google o semplicemente con la testa. Il gruppo dell’intelligenza artificiale ha avuto il minor impegno cerebrale e ricordava a malapena ciò che avevano scritto. La sua battuta: non vai in palestra e chiedi a qualcuno di sollevare i pesi per te. Ma è quello che facciamo con la mente tutto il giorno. I depositi sono piccoli, gratuiti e completamente nelle tue mani. Questa è la parte di cui è composta la tua serata: leggi il libro vero e proprio, non il riepilogo dell'intelligenza artificiale. Fai i calcoli nella tua testa. Uccidi la calcolatrice per piccole cose. Siediti in un momento noioso invece di prendere il telefono. Il punto di Jim: la noia è il luogo in cui nascono i tuoi pensieri migliori, e abbiamo capito", "category": "fitness"}, {"title": "This Billionaire is Obsessed with his Health", "url": "https://neuroathletics.substack.com/p/this-billionaire-is-obsessed-with", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, ho appena trascorso un'ora con Keith Rabois e non ho smesso di pensare a come vive. Se non conosci il nome, è uno degli investitori di maggior successo degli ultimi vent'anni, una delle prime forze dietro PayPal, Square e DoorDash. Ha più soldi di quanti ne potrebbe spendere in una vita. E tratta il proprio corpo con la serietà di un atleta professionista in stagione. Non ha saltato più di una manciata di allenamenti in sette anni, e quelli che ha mancato lo infastidiscono ancora visibilmente. Tiene traccia di ogni sessione. Considera l'allenamento come lavarsi i denti, non negoziabile, non discutibile ogni mattina, perché ha capito che nel momento in cui diventa facoltativo una volta, diventa facoltativo per sempre. Ecco la cosa che ho notato, e Keith è solo l’ultimo esempio. Le persone di maggior successo che incontro, gli investitori, i fondatori, quelli che operano ai vertici di settori brutalmente competitivi, quasi tutti trattano il proprio corpo come gli atleti d'élite trattano il proprio. È uno dei modelli più coerenti che ho visto in questo lavoro e non penso che sia una coincidenza. Voglio parlare del perché, perché cambia il modo in cui potresti pensare alla tua salute. Hanno smesso di separare il corpo dalla mente. Per la maggior parte di noi, la salute vive in una scatola e il lavoro vive in un'altra. Vai in palestra per avere un aspetto migliore o per sentirti meno in colpa, e poi vai a fare il tuo lavoro vero e proprio, che avviene nella tua testa. Le persone al vertice non la pensano in questo modo. Hanno fatto crollare i due. Allenano i loro corpi perché è così che proteggono le loro menti, la loro concentrazione, il loro processo decisionale, la loro resistenza nel corso di una carriera molto lunga. Keith ha detto una cosa che mi è rimasta impressa: rimanere rilevanti come VC con il passare dei decenni è davvero difficile", "category": "fitness"}, {"title": "The 100-Year-Olds Whose Brains Were Full of Alzheimer's. And Who Kept Their Minds Anyway.", "url": "https://neuroathletics.substack.com/p/the-100-year-olds-whose-brains-were", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, voglio parlarvi di un gruppo di persone che, secondo le regole che credevamo di conoscere, non dovrebbero esistere. Vivevano oltre i 100 anni. Quando morirono e i loro cervelli furono esaminati, erano pieni di placche amiloidi e grovigli tau, i tratti distintivi fisici del morbo di Alzheimer. Le stesse macerie trovate nel cervello di persone che a 70 anni hanno perso tutto a causa di questa malattia. Eppure questi centenari sono morti all'improvviso. Conoscevano le loro famiglie. Finirono le loro frasi. Portavano la malattia nei loro tessuti e non l'hanno mai portata nella loro mente. Leggo scansioni cerebrali per vivere. Sono un neurofisiologo e tutta la mia carriera è stata dedicata a questa malattia, al motivo per cui ci vogliono così tante donne e alla questione di chi sfugge ad essa. Quindi da anni te lo dico, nel podcast e in queste lettere, probabilmente più spesso di quanto vorresti sentirlo: avere la patologia non è la stessa cosa che avere la malattia. Le placche nel cervello non ti condannano alla demenza. Ci credevo perché i dati continuavano a puntare lì. Ma non potrei mai dirti perché fosse vero. C’è una differenza tra uno schema che puoi vedere e un meccanismo che puoi spiegare, e fino a quest’estate questo era solo uno schema. Poi lo spiegò una squadra in Belgio Iscriviti adesso Hanno smesso di guardare le targhe Per quarant'anni tutto il campo è stato trafitto dalle targhe. Contali, eliminali, attaccali. I farmaci per l’Alzheimer più costosi attualmente sul mercato esistono per eliminare l’amiloide dal cervello, con costi elevati e rischi reali, con benefici modesti. I ricercatori del VIB-KU Leuven, insieme al Dementia Research Institute del Regno Unito e alla Muna Therapeutics, hanno fatto qualcosa di diverso. Hanno studiato il tessuto cerebrale umano donato da tre gruppi: persone che hanno sviluppato demenza, persone che non l'hanno sviluppata e quelle extra", "category": "fitness"}, {"title": "Natural Alternatives to Benzodiazepines", "url": "https://chrismasterjohnphd.substack.com/p/natural-alternatives-to-benzodiazepines", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Le benzodiazepine sono commercializzate (informalmente) come “farmaci psicologici”, come se agissero principalmente sui circuiti di ansia e stimolazione nel cervello, ma non esiste un “medicinale psicologico” perché non esistono bersagli che si trovano solo nel cervello e perché non esistono farmaci che, se assunti per via orale, vanno principalmente al cervello. Hanno il più alto assorbimento relativo nella ghiandola surrenale e il più alto assorbimento assoluto nei muscoli e nel grasso. Probabilmente agiscono sui recettori GABA che si trovano ampiamente al di fuori del sistema nervoso. Sebbene non siano attivi sui recettori GABA unici nel fegato, sono probabilmente attivi sui recettori GABA sui polmoni, sui reni, sulle cellule immunitarie, sugli organi riproduttivi e sul pancreas. Il GABA stesso regola indirettamente il metabolismo mitocondriale, ma le benzodiazepine hanno due bersagli mitocondriali indipendenti che si trovano direttamente nella membrana mitocondriale e non sono correlati alla loro azione sui recettori GABA. Non ci sono prove che i benzo siano regolatori più potenti del metabolismo GABA che del metabolismo mitocondriale. Infatti, la loro solubilità nel grasso e nelle membrane cellulari potrebbe renderli molto più efficienti nell’accesso ai loro obiettivi mitocondriali che nell’accesso ai recettori GABA. Come gli SSRI, i benzo sono farmaci mitocondriali per tutto il corpo. Come con gli SSRI, i benzo stanno giocando con il fuoco mitocondriale. Queste affermazioni sono supportate dalle prove e dalle argomentazioni trovate nella prima puntata di questa serie: le persone che usano benzodiazepine hanno una mortalità per unità di tempo maggiore del 60% rispetto a chi non le usa, ma le persone che le smettono hanno una mortalità per unità di tempo maggiore del 60% rispetto a chi continua a prenderle. Non possiamo dire se queste tendenze rappresentino una causalità. Tuttavia, sollevano la possibilità che l’uso del benzo metta una persona tra l’incudine e il martello e sottolineano", "category": "fitness"}, {"title": "Massie is a Real-Food Hero", "url": "https://chrismasterjohnphd.substack.com/p/massie-is-a-real-food-hero", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "Oggi vengono spesi circa 15 milioni di dollari per estromettere Thomas Massie, e nessuno al Congresso è più vicino a noi che facciamo parte del vero movimento alimentare di quest’uomo. Thomas Massie e io il 26 ottobre 2024 a Wise Traditions, la conferenza annuale della Weston A. Price Foundation, dove ha tenuto il discorso di apertura. Lo stesso Massie è un agricoltore indipendente nutrito con erba. Il mio amico John Moody ha descritto qui il profilo della sua fattoria. La fattoria è alimentata da pannelli solari e batterie Tesla e la famiglia Massie ha costruito una casa con tronchi tagliati dai propri boschi e con la pietra estratta dalla propria terra. La casa è riscaldata dallo stesso legno e l'acqua proviene da un pozzo che Massie ha scavato a mano con il suo vicino. Coltivano pesche e meli, allevano polli al pascolo con un trattore automatico e allevano bovini nutriti con erba. Massie una volta ha ammesso a Moody di aver utilizzato Google Maps per spiare Joel Salatin e ottenere nuove idee per la sua fattoria. Nessuno mi ha pagato per scrivere questo. Massie non mi ha mai dato soldi ma ho donato alla sua campagna. Massie ha ideato e sostenuto la legge \"PRIME\" sulla trasformazione della carne e sull'esenzione intrastatale della carne. Realizzato dal Farm-to-Consumer Legal Defense Fund, a sua volta fondato da Sally Fallon Morell della Weston A. Price Foundation e altri, questo atto ha lo scopo di rimuovere l’USDA come ostacolo per i piccoli agricoltori. Piccoli macelli personalizzati gestiti localmente sono ovunque negli Stati Uniti. I macelli dell’USDA sono estremamente rari e spesso si trovano a grandi distanze dagli allevatori. I macelli personalizzati sono utilizzati dai contadini e dai cacciatori che mangiano la propria carne. Il PRIME Act ne consentirebbe l’utilizzo ai piccoli allevatori che vendono la loro carne al pubblico, a condizione che rispettino le norme sanitarie locali e non vendano la loro carne attraverso il personale.", "category": "fitness"}, {"title": "What's Wrong With Jordan Peterson's Health?", "url": "https://chrismasterjohnphd.substack.com/p/whats-wrong-with-jordan-petersons", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Chris Masterjohn PhD", "source_type": "substack", "description": "La salute di Jordan Peterson sta soffrendo tremendamente. Mikhaila, sua figlia, vide che ciò che lo affliggeva influenzava così tanti sistemi del suo corpo che dovevano essere tutti collegati e cominciò a chiedersi se si trattasse di una forma di disfunzione mitocondriale. Nel tentativo di ricercare se la disfunzione mitocondriale potesse essere causata dai punti di svolta nei suoi problemi di salute come l'astinenza da SSRI, l'astinenza da benzodiazepine e muffe tossiche, ha trovato il mio lavoro e mi ha contattato. Questa è la conversazione che abbiamo avuto: La mia ipotesi è la seguente. Mikhaila condivide metà dei geni di Jordan ed è stata più dettagliata sul suo percorso di salute fin dall'infanzia, quindi iniziamo con lei. Ha avuto sintomi di artrite giovanile a partire da 2 anni e una diagnosi a 7. Ha continuato con Enbrel, un “biologico” (termine normativo pseudoscientifico) che si oppone all'azione del mediatore infiammatorio della necrosi tumorale alfa (TNF-alfa); e sul metotrexato, che inibisce il metabolismo dei folati e dell'adenosina. Il metotrexato aumenta l’adenosina, che inibisce la proliferazione delle cellule T. Si ritiene che la sua inibizione del metabolismo dei folati sia più rilevante per il cancro, ma si ritiene che la sua inibizione della proliferazione delle cellule T mediata dall'adenosina sia più rilevante per l'artrite autoimmune. L'anno successivo, all'età di 8 anni, le fu diagnosticata la depressione e le furono prescritti degli SSRI. La mia ipotesi è che abbia un blocco sottostante nel metabolismo mitocondriale che porta al sequestro del CoA, che si verifica quando i percorsi che richiedono CoA non riescono a completarsi correttamente. Ciò porta alla secrezione di TNF-alfa come parte di una risposta allo stress cellulare. Il TNF-alfa serve ad aumentare il trasporto della carnitina nella cellula. La carnitina scambia quindi il posto con il CoA, disintossicando gli intermedi metabolici e trasportandoli nelle urine, consentendo la meta", "category": "fitness"}, {"title": "Anger: A Good or an Evil?", "url": "https://thomisticinstitute.substack.com/p/anger-a-good-or-an-evil", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Di p. Basil Cole, O.P., e p. Giovanni Battista Ku, O.P. Bernardino Mei, “Cristo purifica il tempio”, 1655, tramite WikiMedia Commons. Cos'è la rabbia? La Scrittura sembra suggerire che la rabbia sia un male. Leggiamo, ad esempio,: «Chi si adira contro suo fratello sarà sottoposto a giudizio» (Mt 5,22), e «Ora mettete via tutto: ira, sdegno, malizia, calunnia e parolacce dalla vostra bocca» (Col 3,8). Ma san Tommaso d’Aquino chiarisce che «l’ira non è sempre un male». Per spiegarlo, Tommaso prende in prestito le parole di san Giovanni Crisostomo: Un uomo che è arrabbiato senza causa è colpevole, ma non chi è arrabbiato con una causa, perché senza l’ira la sana dottrina non potrebbe essere avanzata, né mantenuto il buon giudizio, né represso il delitto. “Rabbia” nomina una passione e un vizio. La passione della rabbia è buona di per sé, ma può essere eccessiva o carente. Quando viene consumato con la giusta intensità per il giusto periodo di tempo, è virtuoso. Altrimenti è disordinato. Il vizio dell'ira è una disposizione stabile ad avere in eccesso la passione dell'ira. Tutti i vizi sono difetti di carattere morale da cui derivano azioni peccaminose. Le passioni collaborano con la volontà, la quale collabora con l'intelletto. Puoi pensare all’intelletto come a uno zoppo, alla volontà come a un cieco che trasporta lo zoppo e alle passioni come a cani legati alla cintura del cieco. L'intelletto vede ma non può muoversi; si basa sulla volontà di muoversi. La volontà si muove, ma non può vedere; si basa sull'intelletto per vedere. E le passioni rendono il movimento più facile o più difficile. Quando le passioni sono ben addestrate, sono come cani ben addestrati che riescono a camminare su una ripida collina senza sforzo. Al contrario, quando disobbediscono, possono buttarti a terra. Seguendo Aristo", "category": "teologia"}, {"title": "Thomas Aquinas on Meekness", "url": "https://thomisticinstitute.substack.com/p/thomas-aquinas-on-meekness", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Tommaso d'Aquino sulla mitezza Al giorno d'oggi, il concetto di mitezza gode di una cattiva reputazione. Come ho sostenuto altrove, però, la mitezza, lungi dall’essere una debolezza, è un punto di forza del carattere. In questo post spiegherò perché ciò accade e come San Tommaso d’Aquino comprendeva la virtù nascosta della mitezza. Vorrei iniziare con alcune illustrazioni, adescando la pompa. Senza dubbio conosci persone la cui rabbia è un ostacolo. Magari hai allenato un giocatore che, se allettato, commetterebbe un rigore tecnico o antisportivo. Forse ricordi come potresti cambiare le sorti di una discussione con un fratello inducendolo a reazioni eccessive e avventate. Potresti avere un amico dalla testa calda con cui hai paura di uscire, per paura che possa sfidare l'intero bar a combattere. O forse hai visto uno studente far infuriare un insegnante agitato al punto da urlare, per la gioia di un co-cospiratore delle riprese. In ciascuno di questi quattro casi, esiste una responsabilità condivisa: la rabbia ha la meglio sul giocatore, sul fratello, sull’amico e sull’insegnante. Una disposizione radicata a lasciarsi sopraffare dalla rabbia è una caratteristica sconveniente. L'altra squadra, se conosce le sue predilezioni, cercherà di sfruttare quelle passività. Anche se è il migliore nella sua posizione, il suo allenatore potrebbe comunque metterlo in panchina, per paura che la sua ira gli costerà la partita. E anche se non riesci a mettere in panchina un amico, potresti dimenticarti di invitarlo a uscire se vuoi passare una notte tranquilla. Nessuno vuole un jolly. È senza dubbio a causa delle passività morali che derivano dalla rabbia incontrollata che le Scritture dicono: “Chi è lento all’ira è migliore di un potente, e chi governa il suo spirito è migliore di chi conquista una città” (Proverbi 16:32). Una propensione alla rabbia eccessiva è un pericolo, non qualcosa che vogliamo in noi stessi o in coloro che siamo", "category": "teologia"}, {"title": "Is Being an Expert a Virtue?", "url": "https://thomisticinstitute.substack.com/p/is-being-an-expert-a-virtue", "date": "2026-08-22T05:01:07.167579+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Maes, \"La merlettaia\", 1656 tramite Wikimedia Commons. Gregory House, il protagonista della serie drammatica medica House, è un medico eccezionalmente competente. Questa competenza deriva dalla sua impareggiabile esperienza in anatomia, fisiologia, patologia e psicologia. Eppure, nel corso di più stagioni, il dottor House mostra anche profondi difetti: abusare di farmaci, manipolare pazienti e colleghi e fare altrimenti abitualmente scelte discutibili. La nostra cultura spesso celebra figure così controverse e idolatra gli “esperti”, ma è così che dovremmo valutare tali personaggi, reali o immaginari? Questa eccellenza è la stessa cosa che classicamente è stata chiamata saggezza pratica? Per molti studiosi delle virtù, la saggezza pratica, a volte chiamata prudenza o phronesis, è centrale ed essenziale. Aristotele e Tommaso d'Aquino sostengono che la saggezza pratica è la giusta ragione (e capacità) rispetto ai mezzi. In parole povere, coloro che possiedono saggezza pratica hanno il know-how per portare a termine le cose, come fa il dottor House nella pratica della medicina. Più in generale, tuttavia, la vera prudenza, o phronesis, facilita il vivere una buona vita umana. Cos'è la competenza? Molti psicologi – me compreso – pensano a tale giusta ragione e capacità in termini di “competenza”. In effetti, la prudenza e la competenza sono così strettamente intrecciate che alcuni filosofi, in particolare Matt Stichter, prendono la competenza come modello per comprendere la virtù. Gli esperti sono in grado di applicare le loro particolari competenze a vari compiti, dimostrando una sorta di prudenza nel gestire le sfide all’interno del loro ambito. La competenza, come la intendono gli psicologi, ha una serie di sfaccettature. Una distinzione fondamentale è tra competenze di routine (completare facilmente compiti ripetitivi) e competenze adattive (rispondere in modo innovativo a varie situazioni). Fi", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:13px;color:#374151;margin-top:8px;line-height:1.75;border-left:3px solid #e5e7eb;padding-left:10px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div class="flex items-start justify-between gap-2"><div class="flex-1 min-w-0"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><h3 class="font-semibold text-gray-900 text-sm leading-snug mt-2">${item.title}</h3><p class="text-xs text-gray-400 mt-1">${new Date(item.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div><a href="${item.url}" target="_blank" rel="noopener" class="shrink-0 text-xs bg-gray-900 text-white px-3 py-1.5 rounded-lg font-medium hover:bg-gray-700 mt-0.5 ml-2">Read →</a></div></div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
