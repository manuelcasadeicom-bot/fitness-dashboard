<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 23 Oct 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Why is Public Discourse so Hard?", "url": "https://thomisticinstitute.substack.com/p/why-is-public-discourse-so-hard", "date": "2026-10-19T13:30:43+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Close to a decade ago, a dear friend of mine talked me into joining an important committee at the school our kids then attended. She said she foresaw difficult discussions coming our way, and she wanted more people on the committee who were able to keep their heads in heated discussions and share careful, calm reasoning. Let’s call her Huldah , after the Old Testament prophetess who saw what was to come. I’m a Philosophy professor who studies virtue in the Christian intellectual tradition. That means that my job, as philosopher, has me disagreeing cordially all day long, and the content of my research has me thinking through how to do that well. So, she didn’t misfire when she asked me to join the committee. And yet, I was hardly prepared for the crowded, acrid meetings that came to pass. Nicolas Andrre Monsiaux, “The Debate of Socrates and Aspasia,” via Wikimedia Commons , 1801. While there were reasonable, understanding people on both sides of the debate, they were the minority. One woman used her thumb and pointer finger to mimic shooting herself in the head when she disliked points being made. Others emphatically rolled their eyes, sneered, chortled, or groaned. Folks would use their allotted time to snootily express platitudes, as if a tautology would prove a substantive policy point, or to aggressively shout assertions, as if disdain or force were the main methods of discussion. And, of course, the worst actors on either side agitated the more moderate members of the other. When it came to respectful and charitable discussion, to flip the phrase, the whole was worse than its parts. The whole process was ugly, and it tore apart a community that otherwise had been healthy and vibrant. The culture of the place changed drastically.", "category": "teologia"}, {"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Caravaggio, “The Calling of Saints Peter and Andrew,” 1603, via Wikimedia Commons. The Question of Justification The question, “what must I do to be saved,” was posed by the rich young man in Matthew 19:16 (and Mark 10:17), as well as by the suicidal jailer in Acts 16:30. In reply, Jesus and Paul, respectively, do not say, “nothing, God will do it all.” Jesus says, “keep the commandments” and “go, sell what you possess . . . and come, follow me” (19:17, 21). And Paul says, “believe in the Lord Jesus.” But does that mean that I save myself, or that I at least meet God halfway? No. Earning eternal life is infinitely above the natural powers of man. But then, have I no part in my own salvation? At the Final Judgment, will God be judging himself since my actions are completely irrelevant to salvation? Even if I actually do evil things, if I have no free will to choose good versus evil, I will be like an irrational animal just following my instincts. And although we might be enraged at a fox that kills our chickens, we don’t blame the fox as if he were committing a sin. So, how should we understand our being rescued from sin and justified by God? Fortunately, St. Thomas Aquinas addresses this issue in question 113 of the first part of the second part of the Summa Theologiae. Aquinas divides the Summa Theologiae into three parts: (1) on God as he is in himself, (2) on rational creatures’ movement toward God, and (3) on Christ, man’s way back to God. The second part is itself divided into two parts: (1) on anthropology (man’s nature and end, and virtue in general) and (2) on specific virtues. At the end of the first section of the second part, Aquinas treats of grace, which was only implicit in the previous articles.", "category": "teologia"}, {"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-05T15:43:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "What is humility? Now humility makes a man a good subject to ordinance of all kinds and in all matters; while every other virtue has this effect in some special matter. Therefore after the theological virtues, after the intellectual virtues which regard the reason itself, and after justice, especially legal justice, humility stands before all others. ( ST.II-II.Q161.A5.C (emphasis added). To appreciate the greatness of humility, consider that humility stands before the cardinal virtues of temperance and fortitude . Does not their status as cardinal virtues make them greater than humility? Humility stands before magnanimity and magnificence . How can it be that lowly humility surpasses these virtues of greatness, one of which is even called the crown of the virtues? To answer why humility is so significant , we will first answer: what is humility? Humility is about aspiration for great things, and it has three main elements: a control element, knowledge element, and motivation element. Humility is the virtue by which we control our aspirations for anything we think makes us greater. Aquinas refers to these aspirations with the term hope. Sometimes we need to strengthen these aspirations, but we typically need to restrain them. This act of control is called moderation. We control aspirations in light of self-knowledge, in regards to especially our deficiencies and limitations. We control our aspirations out of divine reverence. We are motivated by divine reverence to act humbly, and this motivation guides us to seek our proper place in God’s providence. Let’s unpack humility’s greatness and these three elements and see why humility is so significant. Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive a new post every Monday.", "category": "teologia"}, {"title": "The Side of Me You Don’t See", "url": "https://staycuriousmetabolism.substack.com/p/the-side-of-me-you-dont-see", "date": "2026-10-21T11:03:43+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "*I wrote what follows at 5:11 a.m., sitting on my bathroom floor. I decided not to publish it immediately. I’ve had over a good deal of time to sit with it since, and I’ve decided I want you to read it exactly as I wrote it that morning, as it shows a part of me you don’t normally see. I’ve written millions of words that have been distributed to the public. But the thousand that follow may be the hardest I’ve ever had to write. And I’m going to tell you exactly how I’m writing them: undignified, in the bathroom, alternating between being curled over on the toilet, my laptop perched on a stool, and lying on the floor, specifically on my right side, because lying on my left is too painful. I’m writing this in fits and starts, embarrassed, a bit ashamed, and writing it out of an obligation to a promise that I made to myself that maybe I haven’t been good enough at holding up. It’s a promise I also made to you: to be authentic. Sorry for the dramatic opener. It is sincere, but now let me rewind a little bit. Many of you who follow me know my backstory. Around when I was graduating college and starting graduate school, I was very sick with inflammatory bowel disease, ulcerative colitis. I shit blood twelve to twenty times per day. I spent a lot of time in excruciating physical pain, which was not even the half of it. I know I’m not the only human to have some form of psychological torture, and a lot of us don’t talk about it. But it stripped everything from me: my physical health, my social life, my romantic prospects, and threatened my career trajectory. The story I tell, which is sincere, is that I found something that effectively put my disease into remission, and allowed me to regain life. None of that’s changed.", "category": "fitness"}, {"title": "This Gut Health Breakthrough Is a GLP-1 Gamechanger", "url": "https://staycuriousmetabolism.substack.com/p/this-living-drug-could-change-medicine", "date": "2026-10-20T11:03:45+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Scientists have just developed a first-of-its-kind living drug: a probiotic engineered to make GLP-1 inside your gut. And it could change how we think about GLP-1 drugs, and much more. Now, to be clear, when I say “living drug,” I mean that literally. Imagine swallowing a pill containing microscopic living cells engineered to sit in your gut, sense the sugar in what you eat, and release GLP-1 precisely when your body needs it. It’s basically a tiny pharmacy working inside you. And that raises some big questions. Could something like this eventually make GLP-1 injections obsolete? And how could this technology evolve from here? We’ll get into all of that. But first, what were the headline results? *Premium members have been telling me how much they enjoy these little video inserts. And as long as you keep enjoying them, I’ll keep making them! So much fun to level up together. In a new paper just published in Nature , researchers tested the living drug in mice and monkeys. The living drug: Lowered blood sugar Improved insulin sensitivity Increased fat burning Improved body composition And reduced inflammation So, let’s unpack what they built, what the data show, and why I think this strange little living pill offers a glimpse into the future of medicine. How Do You Build a Living Drug? Let me walk you through what the researchers actually engineered. The team started with a well-known probiotic bacterium called E. coli Nissle 1917 , a strain that’s been used safely in humans for over a century.", "category": "fitness"}, {"title": "How to Hack Your Brown Fat for Better Health", "url": "https://staycuriousmetabolism.substack.com/p/how-to-hack-your-brown-fat-for-better", "date": "2026-10-17T11:01:10+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "There’s a special type of fat in your body that burns calories like a literal furnace. A major new study , published just a few days ago, now links it to better cardiovascular health, metabolic health, and even mental health. It’s called brown fat. And there are at least 4 different ways to turn it on. In fact, I’ve used one of these myself to burn over 600 more Calories per day without any change in activity, drawing on insights from another randomized controlled trial I’m going to tell you about later. But first, let’s review these new data and what they really mean. Oh, wait! One more teaser before we begin. In case you’ve already seen the headlines around this paper, I promise I have some extra nuances for you, including a paradox buried in the paper itself that hasn’t been discussed. Once I show it to you, I think you’ll understand why I find it particularly interesting. But I’m getting ahead of myself. Let’s understand what makes brown fat special, and the describe the headline findings. What Makes Brown Fat Special? Most of the fat on your body is white fat. White fat is like your lazy friend who walks 2,000 steps a day and hates exercise, whereas you, my brown bestie (okay, that didn’t come out right), are a ball of endless energy! But in all seriousness, brown fat is built differently. Brown fat cells are crammed with mitochondria, which give the tissue its brownish tint because mitochondria are packed with iron. And those mitochondria are the literal engines of your cells. However, they don’t just generate energy for your muscles to use; they also generate heat energy through a different pathway that runs through something called uncoupling proteins (UCP), in particular UCP1.", "category": "fitness"}, {"title": "Belly Fat Is Shrinking Your Brain", "url": "https://neuroathletics.substack.com/p/belly-fat-is-shrinking-your-brain", "date": "2026-10-22T12:22:33+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, The fat around your waist is talking to your brain. Not as a metaphor. Chemically, constantly, every single day. A major new review just sat me down and walked me through the entire conversation, from one bloated fat cell all the way up to the circuits that hold your memories. I read it twice, and on the second pass I was scribbling in the margins like a lunatic, because the story it tells about the midlife brain is one of the most important things I have read all year. Here is the scale of what we are talking about. Almost 900 million people now live with obesity, and rates of dementia are projected to nearly triple by 2050. Those two lines are converging. This review is about the exact place they meet, which is your brain. It came out in Nature Reviews Neurology. Instead of a single study, it pulls the whole field into one place, from studies of millions of people down to the precise damage happening inside individual brain cells. Let me walk you through it the way it walked me through it. Fair warning: it gets stranger as it goes. First, a paradox that broke this field for a decade For years, the data made no sense. Study after study found that being obese in old age was associated with a lower risk of dementia. Thinner older adults got dementia more often. People started calling it the “obesity paradox,” and it got used, loudly, to argue that the worry about weight and the brain was overblown. Here is the grim problem. People often start losing weight in the years before dementia is ever diagnosed. The disease is already quietly eating through the brain, appetite and behavior shift, and the number on the scale falls. So late-life thinness was never protecting anyone. It was an early symptom being mistaken for a shield.", "category": "fitness"}, {"title": "At 50, Your Brain Starts Replacing its Own Immune Cells", "url": "https://neuroathletics.substack.com/p/when-does-brain-aging-start", "date": "2026-10-13T12:17:43+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A study came out in Science this month that I’d put among the most important things published on brain aging this year, and I’ve barely seen anyone talk about it. They collected 40 human brains from people who had died between their twenties and their nineties. The group was built on purpose: men and women, spread evenly across four age brackets from 20 to 100, so no stretch of life was over-represented. Then they went into the hippocampus, your memory center and the first region Alzheimer’s takes apart, and they read the cells one at a time. Most brain studies can’t do that. They grind up tissue and measure the average across millions of cells at once, which blurs young in with old and healthy in with failing. This team read individual cells, about 295,000 of them. And in each one they didn’t just record which genes were switched on. They used two techniques across the same brains. The first read, cell by cell, which genes were active and which stretches of DNA were physically open versus locked shut. The second read the chemical marks sitting on the DNA and the way the DNA was folded in three dimensions inside the nucleus. Four layers of information where most studies get one, sorted into 18 different cell types, tracked across a whole human lifespan. For this part of the brain, that had not really been done before. How do you calm down your nervous system? This newsletter is about the two systems that age your hippocampus: inflammation and energy. The daily levers I named for those were your sleep, your muscle, your blood sugar, and your stress load. That last one is where this fits.", "category": "fitness"}, {"title": "Men AND Women Need Estrogen.", "url": "https://neuroathletics.substack.com/p/estrogen-has-4-main-roles-in-the", "date": "2026-10-07T12:48:12+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A friend of mine, forty-six, sharp as a blade, sat in a doctor’s office last month and asked a simple question. Should she start hormone therapy, for her brain. She got a shrug. Some vague reassurance. A line about how the evidence is mixed. She left with nothing, which is what most women leave with, and she called me frustrated, because she’s not asking out of vanity. Her mother has Alzheimer’s. She’s watching the clock. Here’s what nobody put in front of her, and it’s the thing I want to put in front of you. The reason she couldn’t get a clean answer is not that the science is thin. It’s that the real science is inconvenient . It doesn’t fit on a prescription pad or in a headline, and so it gets flattened into “the evidence is mixed,” which is true and also useless. You already know the hormone-therapy wars. You know the WHI, the backlash, the slow rehabilitation. I’m not going to relitigate 2002 with you. You’re smarter than that conversation. I want to take you underneath it, to the part that actually decides the answer. Start here, because this is the sentence that reorganized how I think about the female brain. In a landmark review, Roberta Brinton and her colleagues argue that perimenopause is not a reproductive event at all. It’s a neurological one. And estrogen, they write, is not a sex hormone that happens to visit the brain. It is a master regulator of how the brain makes and spends energy (Brinton et al., Nature Reviews Endocrinology, 2015). Sit with that word. Master regulator. Of energy. In the most energy-hungry organ you own. Just moment to celebrate me finally meeting Dr Rhonda Patrick. We both spoke last week in Vancouver. The organ that runs hot Your brain is a furnace.", "category": "fitness"}, {"title": "Join the faithful for national men’s march, Rosary rally to end abortion", "url": "https://www.lifesitenews.com/news/join-the-faithful-for-national-mens-march-rosary-rally-to-end-abortion/", "date": "2026-10-23T00:42:30+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — There’s still time to join hundreds of faithful in Boston to publicly witness to the unborn at the fifth annual National Men’s March to Abolish Abortion & Rally for Personhood on the solemnity of All Saints. On Sunday, November 1, Catholic men will march three miles from a local Planned Parenthood-Greater Boston Health Center to Boston Common, where a special Rosary Rally that is open to women and children will take place. … Under the new law, an “abortion may be performed by a physician based upon the professional judgment of the physician” and “No medical review process shall override the professional judgment of a treating physician (i.e., abortionist) and a patient or the patient’s health care proxy to provide an abortion consistent with” the new section, effectively empowering abortionists to label any abortion up to birth as “medically necessary.” Faithful who cannot travel to Boston for the march and/or Rosary rally can view the event via the official livestream from Catholics for Catholics, one of the event’s sponsors. Those who are not available to watch the livestream are encouraged to take time to pray for the end of all abortion that day. To register for the event and for more information, click here .", "category": "teologia"}, {"title": "Pastor who protested drag queen story time found guilty in retrial", "url": "https://www.lifesitenews.com/news/pastor-who-protested-drag-queen-story-time-found-guilty-in-retrial/", "date": "2026-10-23T00:08:41+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — More than two years after being acquitted of charges relating to protesting a “drag queen story hour” event marketed to children at a public library, Canadian pastor Derek Reimer was found guilty of mischief and causing a disturbance after a retrial that came from an appeal, but he has vowed to continue the “Lord’s” work. Last Friday in a Calgary, Alberta, courthouse, Reimer was handed the news of his new verdict, which relates to a 2023 incident at the Seton Library. As reported by LifeSiteNews, a judge in 2024 acquitted him of criminal charges for protesting a “drag queen story time” event for children at a public library. … Reimer is now looking at a sentence on both charges as a result of the acquittal. The Democracy Fund has provided assistance, with defense lawyer Alain Hepner noting that another appeal may in the works. In 2025, Reimer was released from jail after earlier in the month being arrested for refusing to comply with a court order mandating he write a formal apology to the Calgary Public Library manager after criticizing him for promoting the “drag queen story hour” for children. Reimer has been in trouble many times for speaking out against the LGBT agenda targeting kids in public spaces.", "category": "teologia"}, {"title": "Pakistani court orders reopening of investigation into Christian girl’s abduction", "url": "https://www.lifesitenews.com/news/pakistani-court-orders-reopening-of-investigation-into-christian-girls-abduction/", "date": "2026-10-22T21:52:11+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "ISLAMABAD ( ADF International ) – A high court in Pakistan has ordered that a police investigation be reopened in the case of Maria Shahbaz, a 13-year-old Christian girl who was kidnapped, forced to convert to Islam, and “married” to her 30-year-old abductor, Shehryar Ahmad. A district court had previously accepted an investigation closure report in March. The petition, filed by the family before the High Court, noted that the police allegedly withheld material evidence that Shahbaz’s age was falsified on forged marriage and conversion documents. … ADF has supported dozens of girls who have suffered these abuses. Reeha Saleem was 16 years old when she was abducted by her neighbour while on her way home from school in the Gujrat district. She was taken to an unknown location by four men, subjected to violence and forcibly “married” to one of her captors. After two months of abuse, she was able to flee — yet, since she remained formally “married” to her abuser, the police refused to protect her. Her “marriage” was ultimately annulled by a co In another case, 14-year-old Maira was forcibly “married” and converted from her Christian faith. She escaped her captor, but not before he brutalised, blackmailed, and attempted to forcibly convert her — and when she sought justice, a high court initially ordered that she be returned to her abductor. With legal support from Alliance Defending Freedom, she was ultimately freed from the coerced “marriage” and returned safely to her family. Recently, Pakistan has begun to take notable steps to address this crisis. This year, Punjab — Pakistan’s largest province — passed the Punjab Child Marriage Restraint Act, setting the minimum age for marriage at 18 years.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
