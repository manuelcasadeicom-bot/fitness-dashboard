<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 22 Oct 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Why is Public Discourse so Hard?", "url": "https://thomisticinstitute.substack.com/p/why-is-public-discourse-so-hard", "date": "2026-10-19T13:30:43+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Quasi dieci anni fa, un mio caro amico mi convinse a unirmi a un importante comitato nella scuola che allora frequentavano i nostri figli. Ha detto che prevedeva discussioni difficili verso di noi e che voleva più persone nel comitato che fossero in grado di mantenere la calma nelle discussioni accese e condividere ragionamenti attenti e calmi. Chiamiamola Huldah, dal nome della profetessa dell'Antico Testamento che vide ciò che sarebbe accaduto. Sono un professore di filosofia che studia la virtù nella tradizione intellettuale cristiana. Ciò significa che il mio lavoro, come filosofo, mi porta a dissentire cordialmente tutto il giorno, e il contenuto della mia ricerca mi fa riflettere su come farlo bene. Quindi non ha fatto cilecca quando mi ha chiesto di unirmi al comitato. Eppure, non ero affatto preparato agli incontri affollati e acri che si sono verificati. Nicolas Andrre Monsiaux, “Il dibattito tra Socrate e Aspasia”, via Wikimedia Commons, 1801. Anche se su entrambi i lati del dibattito c’erano persone ragionevoli e comprensive, erano la minoranza. Una donna ha usato il pollice e l'indice per imitare di spararsi alla testa quando non le piaceva che venissero fatte delle osservazioni. Altri alzavano gli occhi al cielo con enfasi, sogghignavano, ridacchiavano o gemevano. Le persone userebbero il tempo a loro assegnato per esprimere con altezzosità luoghi comuni, come se una tautologia dimostrasse un punto politico sostanziale, o per gridare aggressivamente affermazioni, come se il disprezzo o la forza fossero i principali metodi di discussione. E, naturalmente, i peggiori attori di entrambe le parti agitavano i membri più moderati dell’altra. Quando si trattava di una discussione rispettosa e caritatevole, per girare la frase, il tutto era peggiore delle sue parti. L’intero processo è stato brutto e ha fatto a pezzi una comunità che altrimenti sarebbe stata sana e vivace. La cultura del luogo è cambiata drasticamente.", "category": "teologia"}, {"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Di p. Basil Cole, O.P., e p. John Baptist Ku, O.P. Caravaggio, “La vocazione dei santi Pietro e Andrea”, 1603, tramite Wikimedia Commons. La questione della giustificazione La domanda: \"che cosa devo fare per essere salvato?\" è stata posta dal giovane ricco in Matteo 19:16 (e Marco 10:17), così come dal carceriere suicida in Atti 16:30. In risposta, Gesù e Paolo rispettivamente non dicono “niente, Dio farà tutto”. Gesù dice: “Osserva i comandamenti” e “vai, vendi ciò che possiedi... e vieni e seguimi” (19:17, 21). E Paolo dice: “credi nel Signore Gesù”. Ma questo significa che mi salvo, o che almeno incontro Dio a metà strada? No. Guadagnare la vita eterna è infinitamente al di sopra dei poteri naturali dell’uomo. Ma allora non ho alcuna parte nella mia salvezza? Al Giudizio Finale, Dio giudicherà se stesso poiché le mie azioni sono completamente irrilevanti per la salvezza? Anche se in realtà faccio cose malvagie, se non ho il libero arbitrio per scegliere il bene contro il male, sarò come un animale irrazionale che segue semplicemente il mio istinto. E anche se potremmo essere arrabbiati con una volpe che uccide le nostre galline, non incolpiamo la volpe come se stesse commettendo un peccato. Quindi, come dovremmo comprendere il fatto che siamo salvati dal peccato e giustificati da Dio? Fortunatamente san Tommaso d'Aquino affronta questo tema nella domanda 113 della prima parte della seconda parte della Summa Theologiae. Tommaso d'Aquino divide la Summa Theologiae in tre parti: (1) su Dio così come è in se stesso, (2) sul movimento delle creature razionali verso Dio e (3) su Cristo, la via dell'uomo per tornare a Dio. La seconda parte è a sua volta divisa in due parti: (1) sull’antropologia (natura e fine dell’uomo e virtù in generale) e (2) sulle virtù specifiche. Alla fine della prima sezione della seconda parte, l'Aquinate tratta della grazia, che negli articoli precedenti era solo implicita.", "category": "teologia"}, {"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-05T15:43:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Cos'è l'umiltà? Ora, l'umiltà rende l'uomo un buon soggetto ad ogni specie e in ogni materia; mentre ogni altra virtù ha questo effetto in qualche materia speciale. Dunque dopo le virtù teologali, dopo le virtù intellettuali che riguardano la stessa ragione, e dopo la giustizia, soprattutto quella legale, viene prima di tutte le altre l'umiltà. (ST.II-II.Q161.A5.C (grassetto aggiunto). Per apprezzare la grandezza dell'umiltà, si consideri che l'umiltà sta prima delle virtù cardinali della temperanza e della fortezza. Il loro status di virtù cardinali non le rende forse più grandi dell'umiltà? L'umiltà sta prima della magnanimità e della magnificenza. Come può essere che l'umile umiltà superi queste virtù di grandezza, una delle quali è chiamata addirittura la corona delle virtù? Per rispondere perché L'umiltà è così significativa, risponderemo prima: cos'è l'umiltà? L'umiltà riguarda l'aspirazione a grandi cose e ha tre elementi principali: un elemento di controllo, un elemento di conoscenza e un elemento di motivazione. L'umiltà è la virtù con cui controlliamo le nostre aspirazioni per tutto ciò che pensiamo ci rende più grandi conoscenza di sé, soprattutto per quanto riguarda le nostre carenze e limitazioni. Controlliamo le nostre aspirazioni per riverenza divina. Siamo motivati dalla riverenza divina ad agire umilmente, e questa motivazione ci guida a cercare il nostro giusto posto nella provvidenza di Dio. Analizziamo la grandezza dell'umiltà e questi tre elementi e vediamo perché l'umiltà è così significativa.", "category": "teologia"}, {"title": "The Side of Me You Don’t See", "url": "https://staycuriousmetabolism.substack.com/p/the-side-of-me-you-dont-see", "date": "2026-10-21T11:03:43+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "*Ho scritto quello che segue alle 5:11, seduto sul pavimento del mio bagno. Ho deciso di non pubblicarlo subito. Da allora ho avuto molto tempo per riflettere e ho deciso che voglio che tu lo legga esattamente come l'ho scritto quella mattina, poiché mostra una parte di me che normalmente non vedi. Ho scritto milioni di parole che sono state distribuite al pubblico. Ma i mille che seguono potrebbero essere i più difficili che abbia mai dovuto scrivere. E ti dirò esattamente come li scrivo: in modo poco dignitoso, in bagno, alternando lo stare rannicchiato sul water, con il portatile appoggiato su uno sgabello, e sdraiato sul pavimento, in particolare sul lato destro, perché sdraiarsi sulla mia sinistra è troppo doloroso. Lo scrivo a singhiozzo, imbarazzato, con un po' di vergogna, e lo scrivo per obbligo di una promessa che ho fatto a me stessa e che forse non sono stata abbastanza brava a mantenere. È una promessa che ho fatto anche a te: essere autentici. Ci scusiamo per l'apertura drammatica. È sincero, ma ora lasciatemi riavvolgere un po'. Molti di voi che mi seguono conoscono la mia storia passata. Più o meno quando mi stavo laureando e iniziavo la scuola di specializzazione, ero molto malato di malattia infiammatoria intestinale, colite ulcerosa. Cago sangue dalle dodici alle venti volte al giorno. Ho trascorso molto tempo soffrendo di un dolore fisico lancinante, che non era nemmeno la metà. So di non essere l'unico essere umano a subire una qualche forma di tortura psicologica, e molti di noi non ne parlano. Ma mi ha privato di tutto: la mia salute fisica, la mia vita sociale, le mie prospettive romantiche e ha minacciato la mia carriera. La storia che racconto, che è sincera, è che ho trovato qualcosa che ha effettivamente messo in remissione la mia malattia e mi ha permesso di riprendere la vita. Niente di tutto ciò è cambiato.", "category": "fitness"}, {"title": "This Gut Health Breakthrough Is a GLP-1 Gamechanger", "url": "https://staycuriousmetabolism.substack.com/p/this-living-drug-could-change-medicine", "date": "2026-10-20T11:03:45+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Gli scienziati hanno appena sviluppato un farmaco vivente unico nel suo genere: un probiotico progettato per produrre GLP-1 nell’intestino. E potrebbe cambiare il modo in cui pensiamo ai farmaci GLP-1 e molto altro ancora. Ora, per essere chiari, quando dico “droga vivente”, lo intendo letteralmente. Immagina di ingoiare una pillola contenente cellule viventi microscopiche progettate per risiedere nel tuo intestino, percepire lo zucchero in ciò che mangi e rilasciare GLP-1 proprio quando il tuo corpo ne ha bisogno. Fondamentalmente è una piccola farmacia che lavora dentro di te. E questo solleva alcune grandi domande. Qualcosa di simile potrebbe eventualmente rendere obsolete le iniezioni di GLP-1? E come potrebbe evolversi questa tecnologia da qui? Approfondiremo tutto questo. Ma innanzitutto, quali sono stati i risultati principali? *I membri Premium mi hanno detto quanto apprezzano questi piccoli inserti video. E finché continuerai a goderteli, continuerò a farli! È così divertente salire di livello insieme. In un nuovo articolo appena pubblicato su Nature, i ricercatori hanno testato il farmaco vivente su topi e scimmie. Il farmaco vivente: riduzione dello zucchero nel sangue, miglioramento della sensibilità all’insulina, aumento della combustione dei grassi, miglioramento della composizione corporea e riduzione dell’infiammazione. Quindi, analizziamo cosa hanno costruito, cosa mostrano i dati e perché penso che questa strana piccola pillola vivente offra uno sguardo al futuro della medicina. Come si costruisce un farmaco vivente? Lascia che ti spieghi cosa hanno effettivamente progettato i ricercatori. Il team ha iniziato con un noto batterio probiotico chiamato E. coli Nissle 1917, un ceppo utilizzato in modo sicuro negli esseri umani da oltre un secolo.", "category": "fitness"}, {"title": "How to Hack Your Brown Fat for Better Health", "url": "https://staycuriousmetabolism.substack.com/p/how-to-hack-your-brown-fat-for-better", "date": "2026-10-17T11:01:10+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "C'è un tipo speciale di grasso nel tuo corpo che brucia calorie come una fornace letterale. Un nuovo importante studio, pubblicato solo pochi giorni fa, ora lo collega a una migliore salute cardiovascolare, salute metabolica e persino salute mentale. Si chiama grasso bruno. E ci sono almeno 4 modi diversi per accenderlo. In effetti, ne ho usato uno io stesso per bruciare oltre 600 calorie in più al giorno senza alcun cambiamento nell'attività, attingendo alle informazioni di un altro studio randomizzato e controllato di cui ti parlerò più tardi. Ma prima, esaminiamo questi nuovi dati e cosa significano realmente. Oh, aspetta! Un altro teaser prima di iniziare. Nel caso in cui tu abbia già visto i titoli di questo giornale, ti prometto che ho alcune sfumature extra per te, incluso un paradosso sepolto nel giornale stesso che non è stato discusso. Una volta che ve lo mostrerò, credo che capirete perché lo trovo particolarmente interessante. Ma sto andando troppo avanti. Comprendiamo cosa rende speciale il grasso bruno e descriviamo i risultati principali. Cosa rende speciale il grasso bruno? La maggior parte del grasso corporeo è grasso bianco. Il grasso bianco è come il tuo amico pigro che fa 2.000 passi al giorno e odia l'esercizio fisico, mentre tu, la mia migliore amica marrone (ok, non è venuta bene), sei una palla di energia infinita! Ma parlando seriamente, il grasso bruno è costruito in modo diverso. Le cellule di grasso bruno sono piene di mitocondri, che conferiscono al tessuto la sua tinta brunastra perché i mitocondri sono ricchi di ferro. E quei mitocondri sono letteralmente i motori delle tue cellule. Tuttavia, non generano solo energia da utilizzare per i muscoli; generano anche energia termica attraverso un percorso diverso che attraversa qualcosa chiamato proteine ​​di disaccoppiamento (UCP), in particolare UCP1.", "category": "fitness"}, {"title": "At 50, Your Brain Starts Replacing its Own Immune Cells", "url": "https://neuroathletics.substack.com/p/when-does-brain-aging-start", "date": "2026-10-13T12:17:43+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, questo mese è uscito su Science uno studio che avrei inserito tra le cose più importanti pubblicate quest'anno sull'invecchiamento cerebrale, e non ho visto quasi nessuno parlarne. Hanno raccolto 40 cervelli umani di persone morte tra i vent'anni e i novant'anni. Il gruppo è stato costruito apposta: uomini e donne, distribuiti equamente in quattro fasce di età dai 20 ai 100 anni, quindi nessun segmento della vita era sovrarappresentato. Poi sono entrati nell'ippocampo, il centro della memoria e la prima regione che l'Alzheimer distrugge, e hanno letto le cellule una alla volta. La maggior parte degli studi sul cervello non possono farlo. Macinano i tessuti e misurano la media su milioni di cellule contemporaneamente, il che confonde i giovani con gli anziani e i sani con i malati. Questa squadra ha letto singole celle, circa 295.000. E in ognuno di essi non hanno solo registrato quali geni erano attivati. Hanno usato due tecniche sullo stesso cervello. Il primo leggeva, cellula per cellula, quali geni erano attivi e quali tratti di DNA erano fisicamente aperti e quali erano bloccati. Il secondo leggeva i segni chimici presenti sul DNA e il modo in cui il DNA era piegato in tre dimensioni all'interno del nucleo. Quattro livelli di informazioni di cui la maggior parte degli studi ne ottiene uno, suddivisi in 18 diversi tipi di cellule, monitorati durante l'intera durata della vita umana. Per questa parte del cervello, ciò non era mai stato fatto prima. Come calmi il tuo sistema nervoso? Questa newsletter riguarda i due sistemi che invecchiano il tuo ippocampo: infiammazione ed energia. Le leve quotidiane che ho nominato per queste erano il sonno, i muscoli, la glicemia e il carico di stress. Quest'ultimo è dove si adatta.", "category": "fitness"}, {"title": "Men AND Women Need Estrogen.", "url": "https://neuroathletics.substack.com/p/estrogen-has-4-main-roles-in-the", "date": "2026-10-07T12:48:12+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, un mio amico, quarantasei anni, affilato come una lama, il mese scorso si è seduto nello studio di un medico e ha posto una semplice domanda. Dovrebbe iniziare la terapia ormonale, per il suo cervello. Ha alzato le spalle. Qualche vaga rassicurazione. Una riga su come le prove sono mescolate. Se n'è andata senza niente, che è ciò con cui se ne va la maggior parte delle donne, e mi ha chiamato frustrata, perché non lo chiede per vanità. Sua madre ha l'Alzheimer. Sta guardando l'orologio. Ecco quello che nessuno le ha messo davanti, ed è la cosa che voglio mettere davanti a te. Il motivo per cui non è riuscita a ottenere una risposta chiara non è che la scienza sia debole. È che la vera scienza è scomoda. Non sta in un ricettario o in un titolo, e quindi viene appiattito in “le prove sono contrastanti”, il che è vero e anche inutile. Conosci già le guerre della terapia ormonale. Conosci il WHI, il contraccolpo, la lenta riabilitazione. Non ho intenzione di rievocare il 2002 con te. Sei più intelligente di quella conversazione. Voglio portarti sotto, nella parte che decide effettivamente la risposta. Inizio da qui, perché questa è la frase che ha riorganizzato il modo in cui penso al cervello femminile. In uno studio fondamentale, Roberta Brinton e i suoi colleghi sostengono che la perimenopausa non è affatto un evento riproduttivo. È neurologico. E gli estrogeni, scrivono, non sono un ormone sessuale che capita di visitare il cervello. È un regolatore principale del modo in cui il cervello produce e spende energia (Brinton et al., Nature Reviews Endocrinology, 2015). Siediti con quella parola. Regolatore principale. Di energia. Nell'organo più assetato di energia che possiedi. È solo il momento di festeggiare il mio incontro con la dottoressa Rhonda Patrick. Abbiamo parlato entrambi la settimana scorsa a Vancouver. L'organo che si surriscalda. Il tuo cervello è una fornace.", "category": "fitness"}, {"title": "Vox Media Should Be Ashamed of This Headline", "url": "https://neuroathletics.substack.com/p/vox-media-should-be-ashamed-of-this", "date": "2026-10-06T16:16:30+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Questa settimana ho visto un titolo che mi ha fatto davvero arrabbiare, e non lo dico alla leggera. Era uno di quei titoli grandi, pieni di speranza, di un angolo che è stato girato sull'Alzheimer. Del tipo che una donna la cui madre sta scappando legge sul suo telefono a mezzanotte e sente il suo petto aprirsi per un secondo. Del tipo che fa riflettere una famiglia, forse. Forse c'è qualcosa adesso. Così ho pagato i due dollari e ho letto tutto. Ed ecco la parte strana. L'articolo in sé è più attento del titolo. Il giornalista cita i rischi. Nota anche che l'hype ha già superato la scienza in passato. Ma quasi nessuno legge l’intero articolo. Leggono il titolo, ne sentono la luminosità e se ne vanno credendo che siamo più vicini a una cura di quanto lo siamo noi. Questo divario, tra ciò che implica un titolo scremato e ciò che dice effettivamente la scienza, è la cosa che ferisce le persone reali. Quindi lascia che ti spieghi cosa dice realmente la scienza. La storia parla in realtà di due farmaci. Lecanemab e donanemab. Potresti aver visto i nomi dei marchi, Leqembi e Kisunla. Sono, ad essere onesti, un vero progresso, e non glielo toglierò. Sono i primi farmaci che hanno chiaramente e definitivamente rallentato il declino cognitivo dell’Alzheimer in ampi studi. Per una malattia che ha umiliato ogni trattamento che le è stato somministrato per decenni, questo è importante. Ma ecco cosa non ti dice il titolo e cosa ogni famiglia merita di sapere prima che la loro speranza venga dirottata. Questi farmaci non migliorano nessuno. Vorrei essere preciso, perché qui il punto è la precisione. Negli studi, lecanemab ha rallentato il declino di circa il 27% e donanemab di circa il 35% in diciotto mesi (van Dyck et al., New England Journal of Medicine, 2023; Sims et al., JAMA, 2023). Leggi attentamente quei numeri.", "category": "fitness"}, {"title": "Ripperger & St. Michael silenced while James Martin & Bernardin get celebrated", "url": "https://www.lifesitenews.com/episodes/ripperger-st-michael-silenced-while-james-martin-bernardin-get-celebrated/", "date": "2026-10-22T00:00:42+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Portandovi le notizie da una prospettiva cattolica tradizionale. Fr. Chad Ripperger, uno degli esorcisti più importanti della Chiesa, è stato messo a tacere. L’ordine dell’arcivescovo di Denver James Golka gli vieta di apparizioni pubbliche, scrittura e omelie online per un anno e ha concluso il suo intervento programmato al gala di aprile di LifeSite. … Una figlia cattolica rubata, Leone eleva l’eresia LGBT e la sinodalità come parola in codice Leone XIV vieta il TLM in San Pietro; Burke e Schneider respingono Il cardinale Francesco elogia la comunità LGBT mentre il vescovo Leone annulla la messa in latino", "category": "teologia"}, {"title": "Archeologist believes his team has confirmed site of Jesus’ baptism", "url": "https://www.lifesitenews.com/news/archeologist-believes-his-team-has-confirmed-site-of-jesus-baptism/", "date": "2026-10-21T23:27:41+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Portandovi le notizie da una prospettiva cattolica tradizionale. (LifeSiteNews) – Un archeologo dell’Università Hashemita della Giordania ha pubblicato uno studio sostenendo che gli scavi ad Al-Maghtas, storicamente conosciuta come Betania oltre il Giordano, hanno identificato il luogo preciso in cui Giovanni Battista battezzò il Signore Gesù Cristo. … Al-Maghtas è stata iscritta come patrimonio mondiale dell’UNESCO nel 2015 ed è stata a lungo accettata da varie denominazioni cristiane come luogo tradizionale del battesimo, anche se il dibattito sul luogo preciso è continuato. Lo studio di Waheeb presenta gli scavi del 1996-2002 e il loro allineamento con le prime fonti come nuovo supporto decisivo per questa identificazione orientale. Al termine del suo articolo, conclude l'archeologo, “i risultati ottenuti” dallo studio “sono coerenti con i resoconti degli antichi pellegrini, con la mappa di Madaba e con le Sacre Scritture”. Si raccomanda quindi “di preservare i monumenti scoperti e di continuare gli studi in quest’area”.", "category": "teologia"}, {"title": "Liberals accused of leaking bills to dictate favorable media coverage", "url": "https://www.lifesitenews.com/news/liberals-accused-of-leaking-bills-to-dictate-favorable-media-coverage/", "date": "2026-10-21T22:54:46+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "OTTAWA (LifeSiteNews) – I parlamentari conservatori canadesi e l’NDP hanno accusato direttamente il governo liberale guidato dal primo ministro Mark Carney di aver fornito ai media mainstream importanti dettagli sulla prossima legislazione prima della sua pubblicazione ufficiale, al fine di ottenere una copertura mediatica positiva e controllare la narrazione. La settimana scorsa, il leader conservatore della Camera Andrew Scheer ha affermato che ci sono state fughe di notizie riguardanti il ​​disegno di legge C-40, affermando: \"Ciò che stiamo osservando qui è una fuga di notizie delle disposizioni del disegno di legge C-40\". … La realtà è che i media tradizionali in Canada non esisterebbero se non fosse per i sussidi governativi, il che crea un problema quando si tratta di riportare notizie contrarie alla narrativa federale. La Canadian Broadcasting Corporation (CBC) riceve 1,6 miliardi di dollari all’anno a spese dei contribuenti. Come riportato da LifeSiteNews, per anni la CBC ha promosso l’agenda LGBT, spinto i colpi di COVID e altre questioni di attualità di cui molti canadesi non vogliono far parte. I finanziamenti della CBC, oltre ai resoconti parziali, hanno portato molti canadesi a considerare che essa non sia altro che un portavoce liberale.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};co
