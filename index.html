elf when faced with a challenge—I don’t want to make a mistake—rather than thinking about what the best thing one might do is. … 11 5 1 Share A guest post by Tim Reilly A developmental psychologist studying purpose, vocation, and virtue. He is the author of \"Moral and Intellectual Virtues in Practices: Through the Eyes of Scientists and Musicians\". Subscribe to Tim Discussion about this post Comments Restacks Liked by Tim Reilly Stephanie Marie 15h So well written! I especially love this quote: “If we can appropriately address the inhibitory fears and desires, we will be more free to pursue growth. This is what growth in temperance and fortitude often is. Even more, the good that we want to grow in is ideally an expression of our desire for justice—we recognize that we ought to be better for God and others.” When I look at my own desire for growth, it’s almost always related to how I relate to other people. Where I can listen better, understand better, show more empathy, love better, etc.", "category": "teologia"}, {"title": "What is it to Seek and Speak the Truth in Love?", "url": "https://thomisticinstitute.substack.com/p/what-is-it-to-seek-and-speak-the", "date": "2026-11-16T13:51:22.817000+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Investigations by the Thomistic Institute What is it to Seek and Speak the Truth in Love? Series on Intellectual Charity, Part II Tim Pawl Nov 16, 2026 13 2 10 Share Welcome to part two of my five-part series on Intellectual Charity. The first part is here , though it isn’t necessary that you read it before you read this entry. In all areas of life, the Christian is called to the moral heights: turn the other cheek; go the extra mile. We are called to emulate Christ, who laid down his life for us while we were still at enmity with him. … Hush, Tolkiendil, I know that Bilbo may have met Gandalf in his youth, when watching the fireworks, and that Gandalf had known of Bilbo previously. I mean first meet on the pages , the reader’s first encounter with the pair. 13 2 10 Share A guest post by Tim Pawl I am a Philosophy Professor, focusing on the intersections of metaphysics & theology and virtue theory & psychology. I am the husband of another philosopher and the proud father of one son and four daughters. We enjoy life in the Twin Cities. Subscribe to Tim Discussion about this post Comments Restacks Liked by Tim Pawl Cooperatores Veritatis 4d The asymmetry you draw from De veritate seems to me to carry the moral weight of the whole series: if reality me 1 Liked by Tim Pawl Paolo 6d Thanks for this succinct yet very clear and comprehensive summary. By the way, I think Prof. Stump is the epitome of someone seeking the truth in love. Her work is brilliant and I wish it was more known, so thank you for referencing her understanding of love. I found it very illuminating.", "category": "teologia"}, {"title": "Time in Science and Philosophy", "url": "https://thomisticinstitute.substack.com/p/time-in-science-and-philosophy", "date": "2026-11-09T16:10:34.358000+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Investigations by the Thomistic Institute Time in Science and Philosophy Where Physics and Philosophy Meet Jonathan I Lunine Nov 09, 2026 23 1 6 Share Johannes Vermeer, “The Astronomer,: 1668, via Wikimedia Commons. Physicists who work in general relativity carry two very different definitions of time in their research. One is “proper” time, which is a measure of the amount of physical change that a system experiences. Proper time is what a clock measures. Carry a clock from event A to event B, “Coordinate” time, on the other hand, is one of four coordinates assigned to events in the four-dimensional continuum called spacetime. Spacetime consists of three space-like dimensions and one time-like dimension in our universe. The path of any material entity through spacetime can be visualized as a series of events, which are linked together to form its world line. Coordinate time is a labeling of events that allows one to quantify the relationship between different worldlines. For example, … About the Author: Jonathan Lunine is the Chief Scientist at NASA’s Jet Propulsion Laboratory and Professor of Planetary Science at Caltech in Pasadena, California. Beforehand, he was the David C. Duncan Professor in the Physical Sciences and Chair of the Department of Astronomy at Cornell University. Lunine is interested in how planets form and evolve, what processes maintain and establish habitability, and what kinds of exotic environments (methane lakes, etc.) might host a kind of chemistry so The opinions expressed are those of the author alone and do not represent those of his employer. 23 1 6 Share A guest post by Jonathan I Lunine Inaugural VP of the Society of Catholic Scientists; co-founder of COLLIS and TI Faculty advisor at Cornell.", "category": "teologia"}, {"title": "Vitamin K2 MK7 Slows Artery Calcification (Phase 3 Trial)", "url": "https://staycuriousmetabolism.substack.com/p/vitamin-k2-mk7-slows-artery-calcification", "date": "2026-11-21T12:00:45.001000+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Upgrade Upgrade to founding Vitamin K2 MK7 Slows Artery Calcification (Phase 3 Trial) A major phase 3 trial found that vitamin K2 MK-7 slowed the progression of coronary artery calcification. Here's what the study found, how K2 works, and the critical nuance everyone is missing. Nick Norwitz MD PhD Nov 21, 2026 ∙ Paid 110 33 14 Share Article voiceover 0:00 -19:40 Audio playback is not supported on your browser. Please upgrade. When evaluating your of cardiovascular disease, the first question yo An actual measurement of plaque will beat a cholesterol level every time. And the most widely available and readily used measure is called the coronary artery calcium (CAC) scan. … 110 33 14 Share Previous Discussion about this post Comments Restacks Liked by Nick Norwitz MD PhD Barbara 3d Thanks for sharing that study and explaining how the K2MK7 works. I've been taking it for years, along with some vitamin D3, for bone health. Nice to know it's also slowing down artery calcification. I take it in the evening, some days I change it up a bit and take some Nattokinase. Variety is the spice of life! ;) Just got back from my lab testing adventure, boy that was easy and uncomplicated. Nice lady, we had a little chat about doctors who don't want to run labs on things we think are important, like fasting insulin. I am so looking forward to getting these results! 6 1 1 reply by Nick Norwitz MD PhD Ann Jenkins 3d Are there studies that show K2-MK7 builds bone? Because then for all the older people out there worried about their LDL and their osteoporosis, they would be getting two better outcomes for the price of one.", "category": "fitness"}, {"title": "How to Use Gravity to Build Better Mitochondria", "url": "https://staycuriousmetabolism.substack.com/p/how-your-mitochondria-can-feel-gravity", "date": "2026-11-19T12:02:01.923000+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Upgrade Upgrade to founding How to Use Gravity to Build Better Mitochondria Your mitochondria can feel gravity. Here’s how to put that biology to work, from breaking up sitting to using a weighted vest, to protect your muscles and metabolism. Nick Norwitz MD PhD Nov 19, 2026 ∙ Paid 93 59 7 Share Article voiceover 0:00 -13:29 Audio playback is not supported on your browser. Please upgrade. I had just gotten back from leg day when I sat down to read this paper. Halfway through, I stood up, put on a weighted vest, and kept reading. … Do you think that even sitting in bed watching TV, the \"foot and toe flexing and pointing\" I do also help? I have done that since I was in rehab after my bilateral knee replacement surgery. They put this contraption on your leg, a sleeve that points and flexes the toes and moves your leg muscle, insuring blood flow to avoid clots. I decided when I came home to keep it up on my own, without contraption. It's such a habit now, I automatically just do it, and it definitely moves the entire lower le I always learn something valuable from each of your letters, Nick. So glad you decided to do this substack for the good of us all, and glad you have the patience and wisdom to ignore the trolls out there, - just know they are merely envious of your intelligence and ability to make a career out of what you love: sharing your research and keen knowledge with those of us who desperately need it! 8 1 2 replies by Nick Norwitz MD PhD and others Liked by Nick Norwitz MD PhD Cheryl 5d My daughter gave me a weighted vest two weeks ago. Your letter gave me the push to get it out of the closet and wear it when I walk the dog this morning. Thank you. (And your concluding sentence caused me to laugh out loud.) Have a great day, Nick!", "category": "fitness"}, {"title": "My Plan to Never Get Alzheimer's Disease", "url": "https://staycuriousmetabolism.substack.com/p/how-to-build-a-brain-that-lasts-100", "date": "2026-11-17T12:01:49.995000+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Upgrade Upgrade to founding My Plan to Never Get Alzheimer's Disease We'll explore groundbreaking science and explain why the idea of building a near-immortal brain is quickly moving from science fiction toward science fact. Nick Norwitz MD PhD Nov 17, 2026 ∙ Paid 113 86 8 Share Article voiceover 0:00 -27:49 Audio playback is not supported on your browser. Please upgrade. When I was just 23 years old, I was handed a terrible verdict. I learned that I carried not just one copy but two copies of a genetic variant ( ApoE4/4 ) that dramatically increased my chances of developing Alzheimer’s disease, raising my risk by 12- to 15-fold. … *Medical Disclaimer: This content is provided for educational and informational purposes only and does not constitute medical advice. It is not intended to diagnose, treat, cure, or prevent any disease, nor is it a substitute for individualized medical advice from a qualified healthcare professional. Always consult your healthcare provider before making changes to medications, supplements, diet, or other aspects of your healthcare. 113 86 8 Share Previous Next Discussion about this post Comments Restacks Liked by Nick Norwitz MD PhD Sarah McNary 7d Wow! Great article and so helpful to have all you’re doing currently, listed in one spot. Thank you for sharing! 4 1 1 reply by Nick Norwitz MD PhD Liked by Nick Norwitz MD PhD Allison of VA 6d My plan is your plan! APOE 3/4 here. I'm following you in hopes that neither of us succumb to this horrible tragic disease.", "category": "fitness"}, {"title": "The Part of Stacy Sims You Don't See", "url": "https://neuroathletics.substack.com/p/the-part-of-stacy-sims-you-dont-see", "date": "2026-11-18T14:47:13.857000+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Give gift Gift a subscription Playback speed × Share post Share post at current time Share from 0:00 0:00 / 5 The Part of Stacy Sims You Don't See There is a version of Dr. Stacy Sims the world knows. This is the one it doesn't. Louisa Nicola Nov 18, 2026 5 Share Team, I want to tell you something about Dr. Stacy Sims that has nothing to do with fasting, or protein, or any of the science that made her name. … Nuropod is a non-invasive vagus nerve stimulation device. The vagus nerve is the main line of your parasympathetic nervous system, the side that runs rest and recovery, and stimulating it gently nudges your body in that direction. I use it as one more input for recovery, not a cure for anything. It is an add-on to the fundamentals from the letter, not a replacement for them. If you want to go deeper into the stress and recovery side of what I wrote about today, this is what I’ve been using. My readers get 20% off Nuropod FOR NOVEMBER and a 30-day money-back guarantee .", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14.075000+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Give gift Gift a subscription Playback speed × Share post Share post at current time Share from 0:00 0:00 / 21 3 4 This Is Why You Wake Up at 3am Almost every human wakes up at the same time every night. A sleep doctor showed me the three-step fix that decides whether you drift back off or lie there until dawn. Louisa Nicola Oct 27, 2026 21 3 4 Share We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! … The piece I care about most is the brain. Your deepest sleep is when the brain washes itself out, and part of what it clears is the amyloid and tau that build up in Alzheimer’s. A glass of wine before bed shreds that stage. So does too much coffee. He also took me through a disorder where people physically act out their dreams, and how it can turn up a full decade before Parkinson’s, which sounds terrifying until he explains why catching it early is the luckiest thing that can happen to you. I record a lot of episodes. This is one of the few I am sending to my own family. If anyone has ever brushed off your exhaustion as stress, or hormones, or just your age, forward them this before you do another thing.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27.782000+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Give gift Gift a subscription New Creatine and Peri Menopause Study!!!! A new randomized trial finally put all three in one room, and I have not been this excited about a study in a while. Louisa Nicola Oct 26, 2026 38 4 4 Share Team!!!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That almost never gets studied, and this team pulled it off. … And if you are new here, subscribe so the next one finds you. Every week I take a study like this apart and tell you what it actually says, not what someone is trying to sell you with it. 38 4 4 Share Previous Next Discussion about this post Comments Restacks Lizzie Nov 6 What’s more important? NAD or creatine? I have BIND from benzo damage. I was seeing a clinic that does NAD IV infusion for benzo WD. I was too sensitive to the IV and considering switching to oral. Any thoughts? Jenni Majumdar, PhD, CRNA Oct 28 Faster Stroop times after just six weeks of lifting twice a week is so encouraging, Louisa!!", "category": "fitness"}, {"title": "Canadian veteran wants to die by euthanasia because of how VA treats him", "url": "https://www.lifesitenews.com/news/canadian-veteran-wants-to-die-by-euthanasia-because-of-how-va-treats-him/", "date": "2026-11-24T00:03:56+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — A Canadian military veteran has become so despondent and unsatisfied with how he is being treated by the nation’s Veterans Affairs (VA) that he now wants to die by euthanasia. The veteran said that he has asked to die by Medical Assistance in Dying (MAID) because he can no longer handle the “nightmare” of dealing with Canada’s VA. … Canada’s liberal euthanasia laws have made the practice so commonplace that a Canadian Armed Forces (CAF) veteran said she has “proof” that no fewer than 20 of her colleagues were offered unsolicited state-sponsored euthanasia. As reported by LifeSiteNews, this is not the first report of CAF veterans saying they were offered MAID. It was revealed last year that the VA appears to have purposefully stopped the publication of a paper after scandalous allegations surfaced of caseworkers recommending euthanasia to suffering service members.", "category": "teologia"}, {"title": "Leo XIV Distorts Last Judgement as ‘Salvation’; Priest Performs Gay ‘Wedding’", "url": "https://www.lifesitenews.com/episodes/leo-xiv-distorts-last-judgement-as-salvation-priest-performs-gay-wedding/", "date": "2026-11-23T22:44:05+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. John-Henry Westen examines Pope Leo XIV’s November 22 Angelus address in light of Pope Pius XI’s Quas Primas , exploring divine mercy, the Last Judgment, and Christ’s kingship over nations. … Leo XIV PR machine in overdrive with nonstop A-list celebrity photo-ops 'Our Father' Learjet crash & Tucker: Trump nuking Iran ‘within days’ Bishop Barron hits cardinal: 'Church exists to convert' — Shawn Ryan on demonic attacks", "category": "teologia"}, {"title": "Viral video: Native British woman spreads Islam on Christmas-lit London street", "url": "https://www.lifesitenews.com/news/viral-video-native-british-woman-spreads-islam-on-christmas-lit-london-street/", "date": "2026-11-23T22:01:14+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — A video circulating widely on social media shows a Muslim woman operating a dawah stall on London’s Oxford Street amid Christmas lights and decorations, with Islamic chants audible over a loudspeaker as shoppers pass by. The clip , shared by accounts including Daily Loud, depicts the scene on a busy shopping thoroughfare in late November and has drawn millions of views, prompting intense online debate about public religious expression in the historically Christian United Kingdom as the commercial sector ramps up its Christmas promotions. … She added that interventions such as the Iraq war, which killed large numbers of civilians, have driven people from Muslim-majority countries into the West, where they then establish parallel communities. “Israel creates various refugee crises across the Middle East with our money and weapons,” she tweeted last year. “In exchange, we get to keep our borders wide open so we can receive those refugees and keep Israel ethnocentric.” Europe and America, of course! Israel creates various refugee crises across the Middle East with our money and weapons. In exchange, we get to keep our borders wide open so we can receive those refugees and keep Israel ethnocentric. Remember: God will bless us if we don’t ask questions about why blessing Israel means cursing America. It’s right there in the Bible!", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shado
