<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 28 Nov 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Growing in Virtue: One Psychological Perspective", "url": "https://thomisticinstitute.substack.com/p/growing-in-virtue-one-psychological", "date": "2026-11-23T13:48:28+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Nicolas-Henri Jacob, from Bourgery’s “ Traité complet de l'anatomie de l'homme,” 1831–1854, via Wikimedia Commons . In this article, I want to focus on a psychological framework developed by psychologists for thinking about the more general process of growth in virtue. This framework encourages attention to (1) motivation, (2) mindset, and (3) means. What orients us to grow in virtue? Do we think such growth is possible? And if so, how can we actually grow? I present this as a general framework that can apply in many particular cases. Motivating Growth Motivation here is, on the surface, fairly straightforward. If we are to grow in virtue or character, we must desire to grow in that way. Motivation might arise from a recognition that one is focused on avoiding vice more than on pursuing virtue. For instance, thinking to oneself when faced with a challenge—I don’t want to make a mistake—rather than thinking about what the best thing one might do is. We might think about motivation to grow in virtue by asking ourselves two questions: (1) What is the good that I want to grow in my capacity to realize? and (2) What are the fears and competing desires that inhibit that growth? If we can appropriately address the inhibitory fears and desires, we will be more free to pursue growth. This is what growth in temperance and fortitude often is. Even more, the good that we want to grow in is ideally an expression of our desire for justice—we recognize that we ought to be better for God and others. Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts every Monday. Mindset Mindset is about our beliefs, especially regarding our psychology and the way the world works.", "category": "teologia"}, {"title": "What is it to Seek and Speak the Truth in Love?", "url": "https://thomisticinstitute.substack.com/p/what-is-it-to-seek-and-speak-the", "date": "2026-11-16T13:51:22+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Welcome to part two of my five-part series on Intellectual Charity. The first part is here , though it isn’t necessary that you read it before you read this entry. In all areas of life, the Christian is called to the moral heights: turn the other cheek; go the extra mile. We are called to emulate Christ, who laid down his life for us while we were still at enmity with him. We hear parables that encourage us to go above and beyond the call of duty. Indeed, the technical term for such an act—an act that goes above and beyond the call of duty, like when a stranger saves a dying man found on the side of the road, taking him to an inn and paying for it with his own money—is supererogation , a word that comes to us from St. Jerome’s Vulgate translation of our Lord’s parable of the Good Samaritan. As the Samaritan says to the innkeeper, whatever more you spend ( supererogaveris ), I will repay you. So, it should be no surprise to us, then, that in seeking and speaking the truth, we Christians are called to a high standard. But what exactly is the standard? Just how high is it? Remember when Peter asked how many times he had to forgive his brother? You can hear him thinking he’s got a pretty high bar already when he says “seven.” And honestly, that is pretty high, isn’t it? Seven times for the same type of sin?! But recall our Lord’s answer of seventy -seven, or even seventy times seven. Is the bar for seeking and speaking the truth equally audaciously high? Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive new posts every Monday.", "category": "teologia"}, {"title": "Time in Science and Philosophy", "url": "https://thomisticinstitute.substack.com/p/time-in-science-and-philosophy", "date": "2026-11-09T16:10:34+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Johannes Vermeer, “The Astronomer,: 1668, via Wikimedia Commons. Physicists who work in general relativity carry two very different definitions of time in their research. One is “proper” time, which is a measure of the amount of physical change that a system experiences. Proper time is what a clock measures. Carry a clock from event A to event B, and the number it displays is a direct observable that you can write down. A series of events for a given object is called its worldline. I might awake, drive into work, sit for four hours, drive to an airport, take a plane to the East Coast, and check into a hotel. My worldline has involved a series of events in which I am alternately stationary, moving at constant speed, accelerating, and rising a certain distance away from the center of the Earth. But the clock I take with me will display an elapsed time which anyone who reads it—even though they moved on a different worldline-- will agree upon. “Coordinate” time, on the other hand, is one of four coordinates assigned to events in the four-dimensional continuum called spacetime. Spacetime consists of three space-like dimensions and one time-like dimension in our universe. The path of any material entity through spacetime can be visualized as a series of events, which are linked together to form its world line. Coordinate time is a labeling of events that allows one to quantify the relationship between different worldlines. For example, if I play a three-minute song on my iPhone while on a plane, and an observer on the ground wants to know how long the song lasted by her reckoning, she must first assign times to the start and end events in her stationary reference frame, correcting for the travel time of the wireless signal from my airplane.", "category": "teologia"}, {"title": "How to Get STRONGER on GLP-1s (New RCT)", "url": "https://staycuriousmetabolism.substack.com/p/how-to-get-stronger-on-a-glp-1-new", "date": "2026-11-26T12:00:57+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Most people think that when you go on a GLP-1 for weight loss, you’ll inevitably lose strength. They’re wrong. And I’m going to prove it. But first, let me address the turkey in the room. Is it a sick joke that I’m releasing a letter about fitness and GLP-1s, of all topics, on Thanksgiving, the most gluttonous holiday of the year? Well, yes. And I, for one, love Thanksgiving! But I also love learning. And hopefully, if you’ve been around the StayCurious block enough, you’ve come to realize that learning can be pure pleasure in and of itself. So that’s what I challenge you to do with this 5,000+ word Stregnthsgiving Special! Even if you don’t implement the fitness tips until after you’re done digesting your mashed potatoes and gravy, you can still enjoy learning something new today. But let’s get into the data. *Before and after photos curtesy of my friend Matt. More from him later. There was a recent, randomized controlled trial published in Nature Medicine in which 120 adults taking the dual GLP-1/GIP receptor agonist tirzepatide (Mounjaro or Zepbound) for weight loss were randomized to resistance training 3 times per week (1 hour per session) or usual activity for 40 weeks. As an aside, the tirzepatide + resistance training group was abbreviated “T-REx,” which amused me. (I’ll pay off that joke later.) The medication was dosed up to 15 mg, which is a monster dose. Introducing: Clinical Insights If you’ll indulge me in a quick sidebar: Given the clinical nature of this study, and the fact that while I’m an MD-PhD, I’m not an experienced clinician, I thought I’d seek insight from someone who is. So, throughout this letter, I’m going to punctuate the discussion with “Clinical Insights” from a friend and colleague, Dr.", "category": "fitness"}, {"title": "Your Personal Fitness-Longevity Report Card", "url": "https://staycuriousmetabolism.substack.com/p/your-personal-fitness-longevity-report", "date": "2026-11-24T12:02:02+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "How much of human longevity is set in stone? Well, estimates of the genetic contribution to lifespan vary from around 10% to 50%. But even if we take the upper bound, that still leaves an enormous amount of room for environmental and lifestyle factors to influence how long we live and, perhaps more importantly, how well we live. The question then becomes: What truly moves the needle? Perhaps surprisingly, one of the most powerful predictors of longevity is your fitness. In fact, people with elite-level cardiorespiratory fitness have approximately an 80% lower risk of all-cause mortality (death from any cause) compared with those with low cardiorespiratory fitness. That’s a five-fold difference in mortality risk. These are data we’ve covered before in a previous letter . But today’s letter is going to pick up where that one left off. Because in that letter, we talked all about aerobic fitness as it relates to heart health and longevity. But fitness isn’t just one thing. So, in today’s letter, we’re going to expand our discussion of fitness beyond just aerobic capacity. And I’m going to hand you your very own Fitness & Longevity Report Card. We’ll break down four key dimensions of fitness and walk through four tests you can perform yourself this week, without needing a lab or a personal trainer. I’ll show you how to grade yourself along each dimension so you can identify your weak points, figure out where to invest your time and effort, and start leveling up your fitness for better healthspan and longevity.", "category": "fitness"}, {"title": "Vitamin K2 MK7 Slows Artery Calcification (Phase 3 Trial)", "url": "https://staycuriousmetabolism.substack.com/p/vitamin-k2-mk7-slows-artery-calcification", "date": "2026-11-21T12:00:45+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "When evaluating your of cardiovascular disease, the first question you should ask is not what your cholesterol is, but how much plaque is in your arteries. An actual measurement of plaque will beat a cholesterol level every time. And the most widely available and readily used measure is called the coronary artery calcium (CAC) scan. Data suggest that if you have a CAC score of zero, then irrespective of your LDL “bad” cholesterol, your risk of a cardiovascular event is low. This has come to be known as the “power of zero.” To that end, there’s a lot of interest in finding interventions that slow the progression of an artery calcification, since that’s thought to reduce cardiovascular risk. And one of the most popular and controversial supplements to potentially do so is vitamin K2 MK-7. Now, a major randomized, controlled phase 3 clinical trial just dropped a bombshell: Vitamin K2 MK-7 supplementation does indeed slow the progression of artery calcification. The finding sent ripples through the nutrition community, with vitamin K2 supplements flying off shelves at an alarming rate. But while these data are impressive and promising, there are critical nuances you need to know. What Is Vitamin K2 MK7? And How Does It work? First, let me describe what vitamin K2 MK-7 actually is. It’s a form of vitamin K2 that directs calcium into the places you want it, like your bones and your teeth, and away from the places that you don’t, such as your arteries. What makes the MK-7 form unique and thought to be superior is its long half-life, meaning it remains in your body for days rather than minutes or hours. And it’s thought to provide more sustained activation of vitamin K-dependent proteins than the vitamin K1 form, which you might get from something like a leafy green vegetable.", "category": "fitness"}, {"title": "The Part of Stacy Sims You Don't See", "url": "https://neuroathletics.substack.com/p/the-part-of-stacy-sims-you-dont-see", "date": "2026-11-18T14:47:13+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, I want to tell you something about Dr. Stacy Sims that has nothing to do with fasting, or protein, or any of the science that made her name. You know her as the woman who proved that women are not small men. The TED talk. The books. The movement. The scientist who spent twenty years forcing women back into research that had erased them. What you do not see is what it cost her to become that person. In our conversation, Stacy told me something she said she has never shared on a podcast before. There was a time she tried to take her own life, and was hospitalized afterward. She has carried that quietly for years, underneath the global brand and the stage lights and the certainty you see on camera. It took real courage to say it out loud, and she said it to help any woman listening who is sitting in the same dark place she once was. And even now, she is still a target. For the simple act of saying that women deserve their own science, she gets attacked online every single day, by people who have never met her, never had one conversation with her, running off a clickbait clip. She told me it left her with PTSD. The worst of it came when her own daughter picked up a phone, saw a stranger’s cruelty aimed at her mother, and asked whether it was safe to go outside. Sit with that for a second. A woman who has given her entire career to helping other women get stronger and live longer, watching her child become frightened because of what people type. And she keeps going. She keeps publishing, keeps standing on stages, keeps saying the thing the data says even when going quiet would be so much easier. Not because she enjoys the fight, but because she decided a long time ago that someone had to carry this, and it would be her. That is the woman behind the science.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! Go watch this one. I mean it. I sat down with Dr. Michael Breus, the Sleep Doctor, and I left rethinking things I was sure I already understood. He has spent his whole career as a clinical psychologist doing one thing, fixing the way people sleep, and he is blunt in a way I loved. First thing that floored me: the Sleep Doctor himself stops breathing 26 times an hour in his sleep, and had no idea for years. How he found out: His workouts were falling apart and his mile time kept climbing He ran bloodwork, even tried testosterone, chasing every other explanation first Nothing moved Finally someone asked when he’d last done a sleep study It came back 26. He was so sure it was broken that he retook it. Same number. The Sleep Doctor had sleep apnea and didn’t know. Here’s why that should scare the rest of us: It can happen anywhere from 5 to hundreds of times an hour, and most people never know it’s happening Every time you stop breathing, your heart rate drops then spikes to restart you, loading your heart all night long. Over time that can tip into atrial fibrillation. You’re also starving your brain of oxygen, and you never sink into the deep sleep where the brain runs its own cleanup His tell for spotting it across a room: a neck over 17.5 inches carries an 83 percent chance of apnea (his number) And one story I won’t forget: a detective, benched because he kept falling asleep on stakeouts, finally got on a CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team!!!!! A brand new creatine study has arrived!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That … Read more", "category": "fitness"}, {"title": "Pact with Demons at Historic Church & Did Francis Refuse Last Rites?", "url": "https://www.lifesitenews.com/episodes/pact-with-demons-at-historic-church-did-francis-refuse-last-rites/", "date": "2026-11-27T21:24:47+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "A controversial electronic music event featuring alleged demonic imagery and mock Catholic rituals is set to take place inside a historic Carmelite chapel in France. Plus, conflicting reports emerge over whether Pope Francis received the Last Rites before his death, Archbishop Shawn McKnight criticizes traditional Catholic practices, and Pope Leo XIV appoints a controversial bishop to oversee the Heralds of the Gospel. HELP SUPPORT WORK LIKE THIS: https://give.lifesitenews.com/?utm_source=SOCIAL U.S. residents! … Wisdom from the Western Isles Ep. 2 - David Torkington (Audiobook) Wisdom from the Western Isles Ep.1 - David Torkington (Audiobook) Leo’s Vatican forbids bishops from insisting on ad orientem Mass", "category": "teologia"}, {"title": "Christians alarmed as Pakistan’s largest province urges tougher ‘blasphemy’ penalties", "url": "https://www.lifesitenews.com/news/christians-alarmed-as-pakistans-largest-province-urges-tougher-blasphemy-penalties/", "date": "2026-11-27T17:50:25+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. ( LifeSiteNews ) — Religious freedom advocates in Pakistan warn that a legislative push in Punjab province to toughen penalties for religious speech offenses will hand extremists a stronger weapon against vulnerable Christians and other minorities. … Accusations involving remarks about Islamic figures have long carried grave consequences for Pakistani Christians. In 2009, Christian farmworker Asia Bibi was accused of insulting Prophet Muhammad during an argument with Muslim coworkers over a cup of water, spending eight years on death row before Pakistan’s Supreme Court acquitted her in 2018 amid violent nationwide protests. Unverified blasphemy allegations in Punjab also triggered the August 2023 riots in Jaranwala, in Faisalabad district, t The global volatility around perceived insults to early Islamic figures surfaced in 1988 with British novelist Salman Rushdie’s The Satanic Verses . Though Rushdie is not Christian, his controversial references to Muhammad and his wives ignited global protests, deadly riots in Pakistan, and a 1989 religious edict calling for the author’s death, demonstrating how accusations tied to Islamic sacred figures can rapidly escalate into transnational unrest. Pakistan ranked eighth on Open Doors’ 2026 World Watch List of countries where Christians face the most severe persecution. Rights defenders warn that elevating penalties under Section 298-A will deepen fear among Christian families across Pakistan and further embolden vigilante groups.", "category": "teologia"}, {"title": "Leo XIV promotes bishop who rejects Catholicism as ‘the best’ religion", "url": "https://www.lifesitenews.com/news/leo-xiv-promotes-bishop-who-rejects-catholicism-as-the-best-religion/", "date": "2026-11-27T17:17:10+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. VATICAN CITY ( LifeSiteNews ) — Pope Leo XIV has approved the elevation of a bishop who has openly repudiated Catholic evangelization and participated in pagan rituals to govern the conservative clerical society known as the Heralds of the Gospel. … In particular, Casaldáliga criticized the “limited space” the Catholic Church gave women. He also said the Church was “afraid” to discuss optional celibacy, lay ministries, and women’s ordination, and declared that “capitalism is a capital sin, socialism a cardinal virtue.” Furthermore, in a May 2024 interview with Il Regno , Nicoletto openly endorsed pagan pantheism over Christian stewardship. Criticizing Western Christian civilization for supposedly exploiting creation, Nicoletto stated that he preferred the pagan worldview which considers nature “not as a thing, but as Mother, as a person to be loved and valued.” On June 1, 2024, Nicoletto was consecrated a bishop in Padua, Italy. The appointment of Nicoletto to govern “Virgo Flos Carmeli” represents the continuation of a multi-year Vatican intervention against the Heralds of the Gospel. Known for their strict defense of Catholic orthodoxy, traditional Marian devotion, solemn liturgy, and distinctive habit, the Heralds of the Gospel were placed under a papal commissioner in September 2019.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
