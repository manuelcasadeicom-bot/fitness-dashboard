<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 20 Oct 2026 — 05:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Why is Public Discourse so Hard?", "url": "https://thomisticinstitute.substack.com/p/why-is-public-discourse-so-hard", "date": "2026-10-19T13:30:43+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Close to a decade ago, a dear friend of mine talked me into joining an important committee at the school our kids then attended. She said she foresaw difficult discussions coming our way, and she wanted more people on the committee who were able to keep their heads in heated discussions and share careful, calm reasoning. Let’s call her Huldah , after the Old Testament prophetess who saw what was to come. I’m a Philosophy professor who studies virtue in the Christian intellectual tradition. That means that my job, as philosopher, has me disagreeing cordially all day long, and the content of my research has me thinking through how to do that well. So, she didn’t misfire when she asked me to join the committee. And yet, I was hardly prepared for the crowded, acrid meetings that came to pass. Nicolas Andrre Monsiaux, “The Debate of Socrates and Aspasia,” via Wikimedia Commons , 1801. While there were reasonable, understanding people on both sides of the debate, they were the minority. One woman used her thumb and pointer finger to mimic shooting herself in the head when she disliked points being made. Others emphatically rolled their eyes, sneered, chortled, or groaned. Folks would use their allotted time to snootily express platitudes, as if a tautology would prove a substantive policy point, or to aggressively shout assertions, as if disdain or force were the main methods of discussion. And, of course, the worst actors on either side agitated the more moderate members of the other. When it came to respectful and charitable discussion, to flip the phrase, the whole was worse than its parts. The whole process was ugly, and it tore apart a community that otherwise had been healthy and vibrant. The culture of the place changed drastically.", "category": "teologia"}, {"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Caravaggio, “The Calling of Saints Peter and Andrew,” 1603, via Wikimedia Commons. The Question of Justification The question, “what must I do to be saved,” was posed by the rich young man in Matthew 19:16 (and Mark 10:17), as well as by the suicidal jailer in Acts 16:30. In reply, Jesus and Paul, respectively, do not say, “nothing, God will do it all.” Jesus says, “keep the commandments” and “go, sell what you possess . . . and come, follow me” (19:17, 21). And Paul says, “believe in the Lord Jesus.” But does that mean that I save myself, or that I at least meet God halfway? No. Earning eternal life is infinitely above the natural powers of man. But then, have I no part in my own salvation? At the Final Judgment, will God be judging himself since my actions are completely irrelevant to salvation? Even if I actually do evil things, if I have no free will to choose good versus evil, I will be like an irrational animal just following my instincts. And although we might be enraged at a fox that kills our chickens, we don’t blame the fox as if he were committing a sin. So, how should we understand our being rescued from sin and justified by God? Fortunately, St. Thomas Aquinas addresses this issue in question 113 of the first part of the second part of the Summa Theologiae. Aquinas divides the Summa Theologiae into three parts: (1) on God as he is in himself, (2) on rational creatures’ movement toward God, and (3) on Christ, man’s way back to God. The second part is itself divided into two parts: (1) on anthropology (man’s nature and end, and virtue in general) and (2) on specific virtues. At the end of the first section of the second part, Aquinas treats of grace, which was only implicit in the previous articles.", "category": "teologia"}, {"title": "The Greatness of Humility", "url": "https://thomisticinstitute.substack.com/p/the-greatness-of-humility", "date": "2026-10-05T15:43:23+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "What is humility? Now humility makes a man a good subject to ordinance of all kinds and in all matters; while every other virtue has this effect in some special matter. Therefore after the theological virtues, after the intellectual virtues which regard the reason itself, and after justice, especially legal justice, humility stands before all others. ( ST.II-II.Q161.A5.C (emphasis added). To appreciate the greatness of humility, consider that humility stands before the cardinal virtues of temperance and fortitude . Does not their status as cardinal virtues make them greater than humility? Humility stands before magnanimity and magnificence . How can it be that lowly humility surpasses these virtues of greatness, one of which is even called the crown of the virtues? To answer why humility is so significant , we will first answer: what is humility? Humility is about aspiration for great things, and it has three main elements: a control element, knowledge element, and motivation element. Humility is the virtue by which we control our aspirations for anything we think makes us greater. Aquinas refers to these aspirations with the term hope. Sometimes we need to strengthen these aspirations, but we typically need to restrain them. This act of control is called moderation. We control aspirations in light of self-knowledge, in regards to especially our deficiencies and limitations. We control our aspirations out of divine reverence. We are motivated by divine reverence to act humbly, and this motivation guides us to seek our proper place in God’s providence. Let’s unpack humility’s greatness and these three elements and see why humility is so significant. Thanks for reading Investigations by the Thomistic Institute! Subscribe for free to receive a new post every Monday.", "category": "teologia"}, {"title": "How to Hack Your Brown Fat for Better Health", "url": "https://staycuriousmetabolism.substack.com/p/how-to-hack-your-brown-fat-for-better", "date": "2026-10-17T11:01:10+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "There’s a special type of fat in your body that burns calories like a literal furnace. A major new study , published just a few days ago, now links it to better cardiovascular health, metabolic health, and even mental health. It’s called brown fat. And there are at least 4 different ways to turn it on. In fact, I’ve used one of these myself to burn over 600 more Calories per day without any change in activity, drawing on insights from another randomized controlled trial I’m going to tell you about later. But first, let’s review these new data and what they really mean. Oh, wait! One more teaser before we begin. In case you’ve already seen the headlines around this paper, I promise I have some extra nuances for you, including a paradox buried in the paper itself that hasn’t been discussed. Once I show it to you, I think you’ll understand why I find it particularly interesting. But I’m getting ahead of myself. Let’s understand what makes brown fat special, and the describe the headline findings. What Makes Brown Fat Special? Most of the fat on your body is white fat. White fat is like your lazy friend who walks 2,000 steps a day and hates exercise, whereas you, my brown bestie (okay, that didn’t come out right), are a ball of endless energy! But in all seriousness, brown fat is built differently. Brown fat cells are crammed with mitochondria, which give the tissue its brownish tint because mitochondria are packed with iron. And those mitochondria are the literal engines of your cells. However, they don’t just generate energy for your muscles to use; they also generate heat energy through a different pathway that runs through something called uncoupling proteins (UCP), in particular UCP1.", "category": "fitness"}, {"title": "This Saturated Fat Slows Heart Disease", "url": "https://staycuriousmetabolism.substack.com/p/this-saturated-fat-slows-heart-disease", "date": "2026-10-15T11:00:44+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Foods I eat almost every day contain a saturated fat that new research suggests can prevent heart disease. Yes, you heard that right. A saturated fat. So yes, technically speaking, it is very fair to say that “This saturated fat slows heart disease.” We will review the preclinical data, as well as data in humans showing its relevance. But that’s not even close to the weirdest part of this story. This is a paper that was almost an exercise to read, as I had to keep lifting my jaw up off the floor. I learned crazy facts about the microbiome, caffeine, and statins. And over the next few minutes, I want to try to confer that scientific awe to you, along with some practical insights. But let’s begin where this study began, with a group of healthy individuals and a group of individuals with heart disease. The Bacterium That Fights Heart Disease The researchers set out to investigate the role of the gut microbiome in cardiovascular disease. So, they took 223 healthy people and 189 with cardiovascular disease and looked at which bacteria differed among them. Four of the dominant species belonged to the genus Bacteroides , and the standout was one called Bacteroides uniformis (B. uniformis) , which was linked to cardiovascular health in humans. That’s just an association, however. So, they took a group of healthy teenagers, wiped out their microbiomes with powerful antibiotics, and gave half a microbiome transplant enriched in Bacteroides uniformis , and have a control microbiome transplant. Then, they followed them for 30 years. Just joking. Ya… we can’t do that, practically or ethically. But the joke has a purpose: to make the point that when we have interesting associations like this we need to turn to animal models to flesh out mechanisms and cause-effect relationships.", "category": "fitness"}, {"title": "Could You Live to 200? (Lessons From a Whale)", "url": "https://staycuriousmetabolism.substack.com/p/the-biology-of-living-forever", "date": "2026-10-13T11:04:24+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "What if one of the greatest secrets extending human life has been hiding inside the largest animals on Earth? It’s the bowhead whale. These creatures can live 250 years, which means there are bowheads around today that were born before the light bulb was invented. They can weigh more than 200,000 pounds, and have mouths large enough to fit an entire SUV. But I’m not telling you about this extraordinary creature simply because of its immense size or incredible longevity. I’m telling you about it because of a biological paradox that may help explain how it lives so long. Something you’ve probably never thought about. Something we could use. These whales should be riddled with tumors. But they aren’t. Think about it. Every time a cell divides, it has to copy its DNA. And every time DNA is copied, there’s a chance of making a mistake that could ultimately lead to cancer. Now consider that this whale has roughly a 1000-times more cells than a human, and some those cells divide for centuries. More cells. More cell divisions. More opportunities for cancer-causing mutations. These whales should be swimming tumors! And yet, they appear remarkably resistant to cancer. So what’s their secret? And more importantly, could we harness that secret to protect ourselves from cancer, and even extend human lifespans far beyond what we currently imagine possible? Scientists are beginning to think we might.", "category": "fitness"}, {"title": "At 50, Your Brain Starts Replacing its Own Immune Cells", "url": "https://neuroathletics.substack.com/p/when-does-brain-aging-start", "date": "2026-10-13T12:17:43+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A study came out in Science this month that I’d put among the most important things published on brain aging this year, and I’ve barely seen anyone talk about it. They collected 40 human brains from people who had died between their twenties and their nineties. The group was built on purpose: men and women, spread evenly across four age brackets from 20 to 100, so no stretch of life was over-represented. Then they went into the hippocampus, your memory center and the first region Alzheimer’s takes apart, and they read the cells one at a time. Most brain studies can’t do that. They grind up tissue and measure the average across millions of cells at once, which blurs young in with old and healthy in with failing. This team read individual cells, about 295,000 of them. And in each one they didn’t just record which genes were switched on. They used two techniques across the same brains. The first read, cell by cell, which genes were active and which stretches of DNA were physically open versus locked shut. The second read the chemical marks sitting on the DNA and the way the DNA was folded in three dimensions inside the nucleus. Four layers of information where most studies get one, sorted into 18 different cell types, tracked across a whole human lifespan. For this part of the brain, that had not really been done before. How do you calm down your nervous system? This newsletter is about the two systems that age your hippocampus: inflammation and energy. The daily levers I named for those were your sleep, your muscle, your blood sugar, and your stress load. That last one is where this fits.", "category": "fitness"}, {"title": "Men AND Women Need Estrogen.", "url": "https://neuroathletics.substack.com/p/estrogen-has-4-main-roles-in-the", "date": "2026-10-07T12:48:12+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, A friend of mine, forty-six, sharp as a blade, sat in a doctor’s office last month and asked a simple question. Should she start hormone therapy, for her brain. She got a shrug. Some vague reassurance. A line about how the evidence is mixed. She left with nothing, which is what most women leave with, and she called me frustrated, because she’s not asking out of vanity. Her mother has Alzheimer’s. She’s watching the clock. Here’s what nobody put in front of her, and it’s the thing I want to put in front of you. The reason she couldn’t get a clean answer is not that the science is thin. It’s that the real science is inconvenient . It doesn’t fit on a prescription pad or in a headline, and so it gets flattened into “the evidence is mixed,” which is true and also useless. You already know the hormone-therapy wars. You know the WHI, the backlash, the slow rehabilitation. I’m not going to relitigate 2002 with you. You’re smarter than that conversation. I want to take you underneath it, to the part that actually decides the answer. Start here, because this is the sentence that reorganized how I think about the female brain. In a landmark review, Roberta Brinton and her colleagues argue that perimenopause is not a reproductive event at all. It’s a neurological one. And estrogen, they write, is not a sex hormone that happens to visit the brain. It is a master regulator of how the brain makes and spends energy (Brinton et al., Nature Reviews Endocrinology, 2015). Sit with that word. Master regulator. Of energy. In the most energy-hungry organ you own. Just moment to celebrate me finally meeting Dr Rhonda Patrick. We both spoke last week in Vancouver. The organ that runs hot Your brain is a furnace.", "category": "fitness"}, {"title": "Vox Media Should Be Ashamed of This Headline", "url": "https://neuroathletics.substack.com/p/vox-media-should-be-ashamed-of-this", "date": "2026-10-06T16:16:30+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "I saw a headline this week that made me genuinely angry, and I don’t say that lightly. It was one of those big, hopeful, a-corner-has-been-turned Alzheimer’s headlines. The kind that a woman whose mother is slipping away reads on her phone at midnight and feels her chest unclench for a second. The kind that makes a family think, maybe. Maybe there’s something now. So I paid the two dollars and I read the whole thing. And here’s the strange part. The article itself is more careful than the headline. The reporter quotes the risks. He even notes that hype has outpaced the science before. But almost nobody reads the whole article. They read the headline, they feel the glow of it, and they walk away believing we are closer to a cure than we are. That gap, between what a skimmed headline implies and what the science actually says, is the thing that hurts real people. So let me walk you through what the science actually says. The story is really about two drugs. Lecanemab and donanemab. You may have seen the brand names, Leqembi and Kisunla. They are, to be fair, real progress, and I won’t take that from them. They are the first drugs that have clearly, definitively slowed the cognitive decline of Alzheimer’s in large trials. For a disease that has humiliated every treatment thrown at it for decades, that matters. But here is what the headline does not tell you, and what every family deserves to know before their hope gets hijacked. These drugs do not make anyone better. Let me be precise, because precision is the whole point here. In the trials, lecanemab slowed decline by about 27% and donanemab by around 35% over eighteen months (van Dyck et al., New England Journal of Medicine, 2023; Sims et al., JAMA, 2023). Read those numbers carefully.", "category": "fitness"}, {"title": "Liberal justice system slammed after repeat sex offender is released", "url": "https://www.lifesitenews.com/news/liberal-justice-system-slammed-after-repeat-sex-offender-is-released/", "date": "2026-10-20T01:07:27+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — An Ontario Conservative MP blasted years of the lax approach to crime the Liberal government has taken after police warned about the release into the general public of a high-risk sex offender and pedophile. “Our children’s safety is NOT negotiable,” Ontario Conservative MP Rhonda Kirkland said in an X post. … However, the current federal Liberal government under Prime Minister Mark Carney has been soft on those charged with child pornography. Indeed, a recent Supreme Court ruling found that a mandatory one-year sentence for possessing or accessing child pornography is “unconstitutional.” The ruling was blasted by both Conservative and non-Conservative politicians, with Manitoba Premier Wab Kinew saying that anyone caught with child pornography should be “buried under the prison.” Despite the outrage from left and right provincial leaders, the Canadian federal government under Carney said it would not be looking to overturn the ruling.", "category": "teologia"}, {"title": "Priest Killed by Crucifix at Mass was Preaching on Death Moments Before", "url": "https://www.lifesitenews.com/episodes/priest-killed-by-crucifix-at-mass-was-preaching-on-death-moments-before/", "date": "2026-10-19T20:50:45+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. A Catholic priest tragically dies during a livestreamed Mass in Ecuador, just moments after preaching about death. … Influencer mom offered to abort her twins for $200k; celebrity Dad agreed Leo XIV to join Assisi’s false-religion summit; Burke defends Co-Redemptrix LifeSiteNews Puts Christ on Broadway | \"We're Here to Remind New York Christ Is King\"", "category": "teologia"}, {"title": "Alberta holds historic vote today on whether to leave Canada", "url": "https://www.lifesitenews.com/news/alberta-holds-historic-vote-today-on-whether-to-leave-canada/", "date": "2026-10-19T18:45:29+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — Canadians in the province of Alberta are taking part in a historic vote today, which allows people to decide whether or not the province should, in the future, hold a referendum to separate from Canada. Elections Alberta estimates turnout is extremely high, beating the last general election turnout. Current Premier of Alberta Danielle Smith, while allowing the vote due to many in her United Conservative Party (UCP) wanting independence, has urged people to vote to stay in Canada. … Recently, as reported by LifeSiteNews, Elon Musk weighed in on the debate around some Canadian provinces potentially becoming independent, saying that Alberta, Saskatchewan, and Quebec should leave Canada. Calls for Alberta’s independence have grown since Liberal Prime Minister Mark Carney defeated Poilievre in the 2025 federal election. In Alberta, all but two seats went to the Conservatives. Carney, like former Prime Minister Justin Trudeau before him, said that he is opposed to new pipeline projects that would allow Alberta oil and gas to be extracted, although he appears to be softening his stance due to high oil prices as a result of the U.S.-Iran war.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
