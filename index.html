<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fitness &amp; Longevity Intelligence</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}.card{transition:box-shadow .15s;}.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);}</style></head><body class="bg-gray-50 min-h-screen"><div class="bg-white border-b border-gray-200 sticky top-0 z-10"><div class="max-w-2xl mx-auto px-4 py-3"><h1 class="text-lg font-bold text-gray-900">📊 Fitness &amp; Longevity Intelligence</h1><p class="text-xs text-gray-500">Last updated: 30 Oct 2026 — 06:01 UTC</p></div></div><div class="max-w-2xl mx-auto px-4 py-4" id="cc"></div><div class="max-w-2xl mx-auto px-4 pb-8 text-center"><p class="text-xs text-gray-400">Updated daily at 7:00 AM · WellBeingSm Intelligence</p></div><script>const D=[{"title": "Introducing the Porphyrian Tree of Virtue", "url": "https://thomisticinstitute.substack.com/p/introducing-the-porphyrian-tree-of", "date": "2026-10-26T13:31:10+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "A New Way to Study the Virtue Theory of St. Thomas Benozzo Gozzoli, “The Triumph of St. Thomas over Averroes,” 1468-1484, via Wikimedia Commons. We are very happy to announce something that’s been years in the making: an enormous project. The Thomistic Institute, along with the Four Pillars Project at the University of St. Thomas (MN), has funded a Scientia Salon on the Theory and Practice of Virtue. This group of experts took up the task of creating a Porphyrian tree of virtue, presenting the theory of St. Thomas Aquinas in all its hierarchical glory. “What, though, is a Porphyrian Tree?” your friend wonders aloud. It’s named after the 3rd-century philosopher Porphyry, a follower of Aristotle who had a penchant for pictorial representations. To make one, you start with a concept, say, substance, then provide exhaustive distinctions between types. Maybe substance is divided between material and immaterial. Then you move to that step, further subdividing the varieties. Material divides into living and non-living; living between the sensible and insensible; sensible between the rational and irrational. If you work out all the types in all the branches, you’ve got yourself a whole tree of distinctions, which is enough to make any philosopher’s heart pitter-patter. That’s what we did with Aquinas’s views of virtue. It is really something to behold. You should go behold it . But before you zip away, let me say a bit about what’s over there. View Virtue Tree The Scholars of the Scientia Salon Thomas’s thought is so broad in scope, yet also so detailed in its sophistication, that it can sometimes be hard to navigate.", "category": "teologia"}, {"title": "Why is Public Discourse so Hard?", "url": "https://thomisticinstitute.substack.com/p/why-is-public-discourse-so-hard", "date": "2026-10-19T13:30:43+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "Close to a decade ago, a dear friend of mine talked me into joining an important committee at the school our kids then attended. She said she foresaw difficult discussions coming our way, and she wanted more people on the committee who were able to keep their heads in heated discussions and share careful, calm reasoning. Let’s call her Huldah , after the Old Testament prophetess who saw what was to come. I’m a Philosophy professor who studies virtue in the Christian intellectual tradition. That means that my job, as philosopher, has me disagreeing cordially all day long, and the content of my research has me thinking through how to do that well. So, she didn’t misfire when she asked me to join the committee. And yet, I was hardly prepared for the crowded, acrid meetings that came to pass. Nicolas Andrre Monsiaux, “The Debate of Socrates and Aspasia,” via Wikimedia Commons , 1801. While there were reasonable, understanding people on both sides of the debate, they were the minority. One woman used her thumb and pointer finger to mimic shooting herself in the head when she disliked points being made. Others emphatically rolled their eyes, sneered, chortled, or groaned. Folks would use their allotted time to snootily express platitudes, as if a tautology would prove a substantive policy point, or to aggressively shout assertions, as if disdain or force were the main methods of discussion. And, of course, the worst actors on either side agitated the more moderate members of the other. When it came to respectful and charitable discussion, to flip the phrase, the whole was worse than its parts. The whole process was ugly, and it tore apart a community that otherwise had been healthy and vibrant. The culture of the place changed drastically.", "category": "teologia"}, {"title": "Justification: What Must I Do To Be Saved?", "url": "https://thomisticinstitute.substack.com/p/justification-what-must-i-do-to-be", "date": "2026-10-12T14:29:11+00:00", "source_label": "Thomistic Institute", "source_type": "substack", "description": "By Fr. Basil Cole, O.P., and Fr. John Baptist Ku, O.P. Caravaggio, “The Calling of Saints Peter and Andrew,” 1603, via Wikimedia Commons. The Question of Justification The question, “what must I do to be saved,” was posed by the rich young man in Matthew 19:16 (and Mark 10:17), as well as by the suicidal jailer in Acts 16:30. In reply, Jesus and Paul, respectively, do not say, “nothing, God will do it all.” Jesus says, “keep the commandments” and “go, sell what you possess . . . and come, follow me” (19:17, 21). And Paul says, “believe in the Lord Jesus.” But does that mean that I save myself, or that I at least meet God halfway? No. Earning eternal life is infinitely above the natural powers of man. But then, have I no part in my own salvation? At the Final Judgment, will God be judging himself since my actions are completely irrelevant to salvation? Even if I actually do evil things, if I have no free will to choose good versus evil, I will be like an irrational animal just following my instincts. And although we might be enraged at a fox that kills our chickens, we don’t blame the fox as if he were committing a sin. So, how should we understand our being rescued from sin and justified by God? Fortunately, St. Thomas Aquinas addresses this issue in question 113 of the first part of the second part of the Summa Theologiae. Aquinas divides the Summa Theologiae into three parts: (1) on God as he is in himself, (2) on rational creatures’ movement toward God, and (3) on Christ, man’s way back to God. The second part is itself divided into two parts: (1) on anthropology (man’s nature and end, and virtue in general) and (2) on specific virtues. At the end of the first section of the second part, Aquinas treats of grace, which was only implicit in the previous articles.", "category": "teologia"}, {"title": "We Have Heart Disease Backwards (New Science)", "url": "https://staycuriousmetabolism.substack.com/p/we-have-heart-disease-backwards-new", "date": "2026-10-27T11:04:05+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "“Our understanding of heart disease is completely backwards.” That was a text message sent to me by a physician colleague, accompanying the brand-new heart health paper we’re about to review. And it’s an opinion I hear more often than you might think. To give you a little insider knowledge, you’d be surprised how many credentialed MDs and PhDs privately express frustration with the dogmatism surrounding how we think about and manage cardiovascular disease. But you don’t need to take my word for it. Because the central issue is hiding in plain sight: we’ve become so narrowly focused on lowering LDL cholesterol and ApoB that we have missed some of the most important biology determining whether those biomarkers represent a true danger, or are more of a distraction. That doesn’t mean there’s zero truth to the conventional model of heart disease. But if you’re focused on a mosquito while a tiger is chasing you, the mosquito is still there. You’re just missing the bigger threat. And given that cardiovascular disease remains a leading killer, we should probably ask: What’s the proverbial tiger? Well, a new paper in a top science journal gives us a serious reason to reconsider whether our understanding of cardiovascular disease needs to be flipped on its head. This StayCurious Metabolism premium investigation is not for the faint of heart. We’re diving into groundbreaking research revealing a newly discovered “guardian of your arteries” and what happens when that protection fails. Premium subscribers get 3 new deep dives each week for less than the cost of a cup of coffee (67 cents per letter), plus access to an archive of >350 letters.", "category": "fitness"}, {"title": "You've Been Misled About Ultra-Processed Foods", "url": "https://staycuriousmetabolism.substack.com/p/youve-been-misled-about-ultra-processed", "date": "2026-10-25T11:02:09+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "An impressively rigorous trial was recently published in Nature Metabolism comparing the metabolic and brain responses to matched meals composed of ultra-processed food (UPF) and non-UPF food. It’s being hailed as a victory for the claim that “ultra-processed foods are bad.” And who’s going to argue with that? Well, me… I suppose. In a sense. Because as much as I’d dissuade people from eating the McDonald’s diet or one rich in Pop-Tarts and cookies, the scientist within me is squeezing a stress ball in some frustration. Once again, we’re missing something more important hiding beneath the processed food debate. I’m going to reveal exactly what I mean, along with the practical takeaways that follow, whether you eat almost no processed food (like me) or a diet that gets 54% of its calories from ultra-processed food (like the average participant in this study, and roughly the U.S. average). But first, let’s back up and describe what the study did. What the Study Did The design was, as I said above, impressively rigorous. The researchers had 32 healthy-weight young adults (mean age 26 years, mean BMI 22.75 kg/m 2 ) complete a randomized crossover study in which they ate calorie- and macronutrient-matched meals on separate days. But that’s not all. They also underwent 4 hours of measurement inside a whole-room metabolic chamber : 50 minutes before the meal 10 minutes to eat it And then 3 hours after the meal During this time the researchers took not one, not two, but 8 blood samples to track the participants’ metabolic response. But that’s still not all.", "category": "fitness"}, {"title": "How to Boost Nitric Oxide Naturally", "url": "https://staycuriousmetabolism.substack.com/p/how-to-boost-nitric-oxide-naturally", "date": "2026-10-23T11:03:16+00:00", "source_label": "Stay Curious Metabolism", "source_type": "substack", "description": "Your body already makes a molecule that can: Lower your blood pressure Improve blood flow Enhance exercise performance Reduce inflammation And prevent blood clotting It’s one of the essential molecules helping keep the 60,000 miles of blood vessels in your body functioning. That’s enough to wrap around the Earth more than twice! Its discovery as a cardiovascular signaling molecule earned researchers the 1998 Nobel Prize in Physiology or Medicine. It’s nitric oxide, or NO for short. As far as vascular health is concerned, it’s the molecule of life. And most importantly, you can increase it for free, using a range of tools we will review today, many of which can be found in your kitchen. Today, I’m going to show you how. But first, I want to review what NO actually does and how it works. So, let’s start with the basics. The Heart Health Functions of Nitric Oxide Improve Blood Flow Here’s how the mechanism works at a high level: Blood flow creates stress on the endothelium (blood vessel lining) This activates nitric oxide synthase (NOS) , which makes NO NO diffuses into vascular smooth muscle Then, NO activates a protein, soluble guanylate cyclase (sGC), which makes cGMP cGMP directly relaxes smooth muscles Smooth muscle relaxation causes vasodilation and improved blood flow And if that didn’t make sense. Don’t fret! Here’s a 20 second explainer clip! Helpful? Lower Blood Pressure What’s more, the same mechanism that relaxes smooth muscles to improve blood flow also lowers blood pressure, which is why many of the NO-boosting techniques we will review have also been shown to lower blood pressure. That said, I should quickly orient you to healthy blood pressure ranges, as it will become relevant as we move on.", "category": "fitness"}, {"title": "This Is Why You Wake Up at 3am", "url": "https://neuroathletics.substack.com/p/this-is-why-you-wake-up-at-3am", "date": "2026-10-27T14:38:14+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "We have a new podcast studio!!! Team, you all know that I have been doing my podcast since 2016 - holy moly, it’s been 10 years!!!!!!! I have gone from recording audio only to recording on a $30 microphone in my first New York City apartment. I have gone all over the world to interview guests, and now I have my very own beautiful white studio! Go watch this one. I mean it. I sat down with Dr. Michael Breus, the Sleep Doctor, and I left rethinking things I was sure I already understood. He has spent his whole career as a clinical psychologist doing one thing, fixing the way people sleep, and he is blunt in a way I loved. First thing that floored me: the Sleep Doctor himself stops breathing 26 times an hour in his sleep, and had no idea for years. How he found out: His workouts were falling apart and his mile time kept climbing He ran bloodwork, even tried testosterone, chasing every other explanation first Nothing moved Finally someone asked when he’d last done a sleep study It came back 26. He was so sure it was broken that he retook it. Same number. The Sleep Doctor had sleep apnea and didn’t know. Here’s why that should scare the rest of us: It can happen anywhere from 5 to hundreds of times an hour, and most people never know it’s happening Every time you stop breathing, your heart rate drops then spikes to restart you, loading your heart all night long. Over time that can tip into atrial fibrillation. You’re also starving your brain of oxygen, and you never sink into the deep sleep where the brain runs its own cleanup His tell for spotting it across a room: a neck over 17.5 inches carries an 83 percent chance of apnea (his number) And one story I won’t forget: a detective, benched because he kept falling asleep on stakeouts, finally got on a CPAP.", "category": "fitness"}, {"title": "New Creatine and Peri Menopause Study!!!!", "url": "https://neuroathletics.substack.com/p/new-creatine-and-peri-menopause-study", "date": "2026-10-26T14:14:27+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team!!!!! A brand new creatine study has arrived!!! And not just any creatine study. This one took perimenopausal women, gave half of them creatine and half an identical placebo, put all of them through six weeks of heavy training, and watched their brains work in real time while they did it. Creatine, in midlife women, with real brain measurements. That almost never gets studied, and this team pulled it off. You know creatine is one of the very few supplements I actually stand behind. So when a trial like this lands, I read every single line. And what they found got me fired up. Why this matters to you If you are in your forties and your brain feels like it is running too many tabs at once, this study is about you. The word that vanishes mid-sentence. The 3 a.m. wake-up. The afternoon fog that will not lift. You have been told this is just perimenopause and to wait it out. These researchers went looking for something better. What they did Fifty-one women in perimenopause, average age 46. Three groups. Most of them trained hard, twice a week, for six weeks. A smaller group did nothing, as the comparison. Half of the training women got creatine, half got placebo. And to see inside the brain, the team placed a sensor on each woman’s forehead and measured how much oxygen-rich blood her prefrontal cortex pulled in while she worked through a tough mental test. A note on sunlight, UVB, and why I’ve been using Solius This is my latest hack for circadian rhythm disruption! The obvious answer is to get outside more—and I still think that should come first. But the reality is that consistent UVB exposure is not always easy. Season, latitude, weather, work schedules, and how much time we spend indoors all change what we actually get. That’s one reason I’ve been using Solius .", "category": "fitness"}, {"title": "Belly Fat Is Shrinking Your Brain", "url": "https://neuroathletics.substack.com/p/belly-fat-is-shrinking-your-brain", "date": "2026-10-22T12:22:33+00:00", "source_label": "Neuro Athletics", "source_type": "substack", "description": "Team, The fat around your waist is talking to your brain. Not as a metaphor. Chemically, constantly, every single day. A major new review just sat me down and walked me through the entire conversation, from one bloated fat cell all the way up to the circuits that hold your memories. I read it twice, and on the second pass I was scribbling in the margins like a lunatic, because the story it tells about the midlife brain is one of the most important things I have read all year. Here is the scale of what we are talking about. Almost 900 million people now live with obesity, and rates of dementia are projected to nearly triple by 2050. Those two lines are converging. This review is about the exact place they meet, which is your brain. It came out in Nature Reviews Neurology. Instead of a single study, it pulls the whole field into one place, from studies of millions of people down to the precise damage happening inside individual brain cells. Let me walk you through it the way it walked me through it. Fair warning: it gets stranger as it goes. First, a paradox that broke this field for a decade For years, the data made no sense. Study after study found that being obese in old age was associated with a lower risk of dementia. Thinner older adults got dementia more often. People started calling it the “obesity paradox,” and it got used, loudly, to argue that the worry about weight and the brain was overblown. Here is the grim problem. People often start losing weight in the years before dementia is ever diagnosed. The disease is already quietly eating through the brain, appetite and behavior shift, and the number on the scale falls. So late-life thinness was never protecting anyone. It was an early symptom being mistaken for a shield.", "category": "fitness"}, {"title": "The miracles that happened to Fr. James Altman", "url": "https://www.lifesitenews.com/episodes/the-miracles-that-happened-to-fr-james-altman/", "date": "2026-10-30T00:00:08+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "Bringing you the news from a traditional Catholic perspective. John-Henry Westen welcomes Fr. James Altman for a personal conversation about miracles, divine providence, and the Blessed Virgin Mary’s intercession. Moving beyond the controversies for which Fr. Altman is widely known, the interview explores his devotion to Our Lady of Fatima and the Miracle of the Sun, which he describes as his favorite miracle. … Priest: Leo won’t do Pachamama in Peru. He’ll let others do it Here is What the Triumph of the Immaculate Heart will Look Like The miracle that paved the way for Fulton Sheen’s beatification", "category": "teologia"}, {"title": "Bishop Schneider: SSPX’s work ‘providential,’ sedevacantism ‘completely wrong’", "url": "https://www.lifesitenews.com/news/bishop-schneider-sspxs-work-providential-sedevacantism-completely-wrong/", "date": "2026-10-29T23:38:47+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — Bishop Athanasius Schneider has described the Society of St. Pius X (SSPX) as “a providential work for the Church” whose gradual integration would benefit the entire Body of Christ while declaring sedevacantism “completely wrong” and rejecting claims that the 1986 Assisi interreligious gathering belongs to the ordinary magisterium. In an exclusive interview with AdVaticanum recorded in connection with the 2026 Summorum Pontificum pilgrimage — during which Schneider celebrated Mass at the high altar of the Basilica of St. Mary Major after Vatican restrictions barred a pontifical liturgy in St. Peter’s — the auxiliary bishop of Astana addressed the ongoing canonical status of the SSPX after its July 1 episcopal consecrations, the 40th anniversary of the Assisi World Day of Prayer for Peace, and the theological errors of sede … Church history supplies examples of popes who erred in doctrine (Honorius, Liberius, John XXII), yet Christ continues to guide His Church even through unworthy pontiffs. The crisis remains “only a temporal situation.” Schneider distinguished legitimate resistance from disobedience. “Absolute obedience” is due to God alone; proclaiming absolute obedience to any human being, including the pope, “would be an error even a heresy.” He recalled St. Paul’s public resistance to St. Peter at Antioch (Galatians 2), noting that Saints Augustine and Thomas Aquinas taught the Holy Spirit permitted the incident to be recorded so that “when the clarity of faith is in danger … those who are subject in the Church have the right and even the duty to admonish the superiors … even the highest superior … out of love for the Church (and) for the dignity of the papal ministry.”", "category": "teologia"}, {"title": "Ontario pushes for ‘optional’ digital ID", "url": "https://www.lifesitenews.com/news/ontario-pushes-for-optional-digital-id/", "date": "2026-10-29T22:50:45+00:00", "source_label": "LifeSiteNews", "source_type": "substack", "description": "( LifeSiteNews ) — The province of Ontario is moving one step closer to a digital identification system after announcing it plans to gradually phase in what it says are “optional” health cards and driver’s licenses for those who want them. The provincial government under Premier Doug Ford announced the plan a couple of days ago and says it will start with the Ontario Photo Card, an ID for people who do not have a driver’s license. … Canadians do not want digital IDs, as noted by Canada’s Privy Council research from 2023 , which indicated that there is strong public resistance to the use of digital IDs to access government services. Despite this, digital IDs and similar systems have long been pushed by globalist groups like the World Economic Forum, an organization with which Carney has extensive ties, under the guise of ease of access and security. Alberta and British Columbia already have forms of digital IDs.", "category": "teologia"}];const CO={fitness:0,teologia:1};const CL={fitness:'🏋️ FITNESS & LONGEVITY',teologia:'✝️ TEOLOGIA'};const CC={fitness:'#f97316',teologia:'#7c3aed'};D.sort((a,b)=>{const d=(CO[a.category]??99)-(CO[b.category]??99);return d||new Date(b.date)-new Date(a.date);});let html='',cur=null;for(const item of D){if(item.category!==cur){cur=item.category;html+=`<div style="margin:20px 0 8px;padding-bottom:8px;border-bottom:2px solid #e5e7eb"><h2 style="font-size:14px;font-weight:700;color:#374151">${CL[cur]??cur}</h2></div>`;}const desc=item.description?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:#9ca3af;list-style:none;outline:none">&#9656; Di cosa parla</summary><p style="font-size:15px;color:#374151;margin-top:10px;line-height:1.7;border-left:3px solid #e5e7eb;padding-left:12px">${item.description}</p></details>`:'';html+=`<div class="card bg-white rounded-xl p-4 mb-3 border border-gray-100 shadow-sm"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:${CC[item.category]??'#6b7280'};color:white">${item.source_label}</span><a href="${item.url}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;background:#111;color:white;padding:4px 12px;border-radius:8px;text-decoration:none;white-space:nowrap">Leggi →</a></div><h3 style="font-size:16px;font-weight:600;color:#111;line-height:1.4;margin:0 0 4px 0">${item.title}</h3><p style="font-size:12px;color:#9ca3af;margin:0 0 0 0">${new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}</p>${desc}</div>`;}document.getElementById('cc').innerHTML=html;</script></body></html>
